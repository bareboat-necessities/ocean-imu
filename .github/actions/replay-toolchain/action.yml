name: Replay toolchain
description: Select the exact GCC build used by the fixed-draw host regression baseline
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Supply host headers/runtime dependencies without selecting Ubuntu's
        # differently patched compiler as the regression compiler.
        sudo apt-get install -y --no-install-recommends g++-14
        replay_bin="${RUNNER_TEMP}/ocean-imu-replay-toolchain"
        python3 "${{ github.action_path }}/install.py" "${replay_bin}"
        echo "${replay_bin}/bin" >> "${GITHUB_PATH}"
        "${replay_bin}/bin/g++" --version
