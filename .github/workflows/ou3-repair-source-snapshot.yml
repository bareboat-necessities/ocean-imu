name: ou3-repair-source-snapshot
on:
  push:
    branches: ["proof/ou3-moving-compatibility-audit"]
    paths: [".github/workflows/ou3-repair-source-snapshot.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cdf585654f148021185e3d91a614b7f76f8549b9
          fetch-depth: 100
          persist-credentials: false
      - name: Preserve pinned proof and main histories
        run: |
          git fetch --no-tags origin 04145c053a6452afd0664de72993f3c9029fa69d
          git update-ref refs/heads/repair-main 04145c053a6452afd0664de72993f3c9029fa69d
          git update-ref refs/heads/repair-proof cdf585654f148021185e3d91a614b7f76f8549b9
          git archive --format=tar HEAD | gzip > /tmp/ou3-current-source.tar.gz
          git bundle create /tmp/ou3-current-source.bundle --all
          git rev-parse HEAD > /tmp/ou3-current-source-commit.txt
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-current-source-repair
          path: |
            /tmp/ou3-current-source.tar.gz
            /tmp/ou3-current-source.bundle
            /tmp/ou3-current-source-commit.txt
          retention-days: 1
          if-no-files-found: error
