name: ou3-p4-new-clamps-proof

on:
  push:
    branches:
      - codex/ou3-p3-source-clock-recurrence
    paths:
      - ".github/workflows/ou3-p4-new-clamps-proof.yml"
      - "tools/ou3_p3_*.py"
      - "tools/ou3_p4_*.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "src/tuner/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-proof-route:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build canonical P3 and same-history P4 metric
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import ou3_p3_p2_v1_history_frontier as H
          import ou3_p3_p2_v1_stage_phase_translation as T
          import ou3_p3_p2_v1_full_state_join as J
          import ou3_p3_canonical_gate as G
          import ou3_p4_p3_metric_attachment as M

          out = Path('/tmp/ou3-proof-new-clamps'); out.mkdir(exist_ok=True)
          h=H.build(); hf=H.validate(h); h['validation_pass']=not hf; h['validation_failures']=hf
          if hf: raise SystemExit(f'history: {hf}')
          t=T.build(); tf=T.validate(t); t['validation_pass']=not tf; t['validation_failures']=tf
          if tf: raise SystemExit(f'translation: {tf}')
          j=J.build(translation_candidate=t); jf=J.validate(j); j['validation_pass']=not jf; j['validation_failures']=jf
          if jf: raise SystemExit(f'join: {jf}')
          p3=G.build(p3_candidate=j); pf=G.validate(p3); p3['validation_pass']=not pf; p3['validation_failures']=pf
          if pf: raise SystemExit(f'P3 gate: {pf}')
          m=M.build(translation_candidate=t, full_state_candidate=j); mf=M.validate(m); m['validation_pass']=not mf; m['validation_failures']=mf
          if mf: raise SystemExit(f'metric: {mf}')
          for name,d in [('history',h),('translation',t),('join',j),('p3',p3),('metric',m)]:
              (out/f'{name}.json').write_text(json.dumps(d,indent=2,sort_keys=True))
          print(json.dumps({
            'P3_CANONICAL_PASS':p3['P3_CANONICAL_PASS'],
            'P3_worst_H_A_margin':p3['worst_H_A_margin'],
            'H_margin':j['modes']['H']['relative_Riccati_injection_margin_lower'],
            'A_margin':j['modes']['A']['relative_Riccati_injection_margin_lower'],
            'translation_margin':t['worst_translation_margin_lower'],
            'P4_metric_information_upper':m['global_source_phase_information_metric_upper_group_diagonal'],
          },indent=2,sort_keys=True))
          PY

      - name: Build retained nonlinear/source prerequisites
        run: |
          O=/tmp/ou3-proof-new-clamps
          python3 tools/ou3_p4_cayley_sector_certificate.py --output $O/cayley.json
          python3 tools/ou3_p4_accelerometer_corotated_aw.py --output $O/corotated-aw.json
          python3 tools/ou3_p4_vector_remainder_sector.py --output $O/remainder.json
          python3 tools/ou3_p4_source_word_timing.py --output $O/timing.json
          python3 tools/ou3_p4_source_path_reachability.py --output $O/path.json
          python3 tools/ou3_p4_source_node_cells.py --output $O/nodes.json
          python3 tools/ou3_p4_sample_clock_source_refinement.py --output $O/clock.json
          python3 tools/ou3_p4_exact_reset_transport.py --output $O/exact-reset.json
          python3 tools/ou3_p4_magnetometer_radial_joseph.py --output $O/mag-radial.json

      - name: Evaluate signed Joseph, directional coefficients, and source-correlated reset budget
        run: |
          O=/tmp/ou3-proof-new-clamps
          python3 tools/ou3_p4_signed_joseph_feasibility.py \
            --metric $O/metric.json --output $O/signed-joseph.json
          python3 tools/ou3_p4_signed_vector_directional_coefficients.py \
            --signed-audit $O/signed-joseph.json --output $O/directional.json
          python3 tools/ou3_p4_source_correlated_reset_budget.py \
            --metric $O/metric.json --output $O/reset-budget.json

      - name: Report exact retained-route P4 status
        run: |
          O=/tmp/ou3-proof-new-clamps
          python3 tools/ou3_p4_canonical_gate.py \
            --p3 $O/p3.json \
            --cayley $O/cayley.json \
            --remainder $O/remainder.json \
            --timing $O/timing.json \
            --path $O/path.json \
            --nodes $O/nodes.json \
            --clock $O/clock.json \
            --output $O/p4-gate-no-candidate.json
          python3 - <<'PY'
          import json
          O='/tmp/ou3-proof-new-clamps/'
          p3=json.load(open(O+'p3.json'))
          d=json.load(open(O+'directional.json'))
          r=json.load(open(O+'reset-budget.json'))
          g=json.load(open(O+'p4-gate-no-candidate.json'))
          print('=== NEW-CLAMP PROOF SUMMARY ===')
          print(json.dumps({
            'P3_CANONICAL_PASS':p3['P3_CANONICAL_PASS'],
            'P3_worst_H_A_margin':p3['worst_H_A_margin'],
            'directional_H':d['worst_by_mode']['H'],
            'directional_A':d['worst_by_mode']['A'],
            'local_vector_coefficients_positive_everywhere':d['local_vector_tangent_signed_coefficients_positive_everywhere'],
            'word_level_directional_accumulation_required':d['word_level_directional_accumulation_required'],
            'reset_candidates':[
              {'angle_deg':x['attitude_angle_deg'],
               'H_W':x['modes']['H']['source_complete_metric_energy_funnel_upper'],
               'H_reset_amp':x['modes']['H']['worst_reset_metric_amplitude_fraction_upper'],
               'A_W':x['modes']['A']['source_complete_metric_energy_funnel_upper'],
               'A_reset_amp':x['modes']['A']['worst_reset_metric_amplitude_fraction_upper']}
              for x in r['certificate_search_candidates']
            ],
            'P4_CANONICAL_PASS_without_complete_word_candidate':g['P4_CANONICAL_PASS'],
            'P4_fail_reasons':g['P4_CANONICAL_FAIL_REASONS'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload new-clamp proof artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-new-clamps-proof
          path: /tmp/ou3-proof-new-clamps/*.json
          retention-days: 7
