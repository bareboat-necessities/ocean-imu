name: ou3-planar-service-audit
on:
  workflow_dispatch:
  push:
    branches: ["proof/ou3-planar-service-phase"]
    paths:
      - ".github/workflows/ou3-planar-service-audit.yml"
      - "tools/stability/ou3_theorem/planar_service_*.py"
      - "tests/validation/test_ou3_planar_service_*.py"
permissions:
  contents: read
concurrency:
  group: ou3-planar-service-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve exact source for independent reproduction
        run: |
          git rev-parse HEAD > /tmp/ou3-planar-source-commit.txt
          git archive --format=tar.gz HEAD > /tmp/ou3-planar-source.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-planar-source
          path: |
            /tmp/ou3-planar-source-commit.txt
            /tmp/ou3-planar-source.tar.gz
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install proof dependencies
        run: |
          python3 -m pip install numpy scipy mpmath
          sudo apt-get update -qq
          sudo apt-get install -y g++ libeigen3-dev
      - name: Archive native header dependency
        run: tar -C /usr/include -czf /tmp/ou3-planar-eigen.tar.gz eigen3
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-planar-eigen
          path: /tmp/ou3-planar-eigen.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Run planar service proof contracts
        run: |
          python3 -m unittest discover -s tests/validation -p 'test_ou3_planar_service_*.py' -v
