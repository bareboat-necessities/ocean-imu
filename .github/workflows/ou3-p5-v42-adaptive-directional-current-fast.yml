name: ou3-p5-v42-adaptive-directional-current-fast

on:
  push:
    paths:
      - "tools/ou3_p5_sample1_v41_adaptive_directional_current_v42.py"
      - "tools/ou3_p5_sample1_v40_full_source_cell0_q8_lift_v41.py"
      - "tools/ou3_p5_sample1_first_psd_exact_joseph_components_v40.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v18b.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v18.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v16.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_v41_adaptive_directional_current_v42.py"
      - ".github/workflows/ou3-p5-v42-adaptive-directional-current-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_p5_sample1_v41_adaptive_directional_current_v42.py"
      - "tools/ou3_p5_sample1_v40_full_source_cell0_q8_lift_v41.py"
      - "tools/ou3_p5_sample1_first_psd_exact_joseph_components_v40.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v18b.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v18.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v16.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_v41_adaptive_directional_current_v42.py"
      - ".github/workflows/ou3-p5-v42-adaptive-directional-current-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v42-adaptive-directional-current-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-v41-adaptive-directional-current-v42:
    name: P5 V41 adaptive directional current V42
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Compile V42 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_v41_adaptive_directional_current_v42.py \
            tests/validation/test_ou3_p5_sample1_v41_adaptive_directional_current_v42.py
      - name: Test V42 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_v41_adaptive_directional_current_v42
      - name: Emit V42 adaptive source-cell0 q8 cover
        id: audit
        shell: bash
        run: |
          python3 tools/ou3_p5_sample1_v41_adaptive_directional_current_v42.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --adaptive-depth 1 \
            --output /tmp/p5_sample1_v42_adaptive_current.json
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import math
          import sys

          with open("/tmp/p5_sample1_v42_adaptive_current.json", encoding="utf-8") as fh:
              d = json.load(fh)
          cells = int(d.get("evaluated_signed_cayley_cells", -1))
          unclosed = int(d.get("unclosed_q8_cells", -1))
          closed = cells - unclosed if cells >= 0 and unclosed >= 0 else -1
          first = d.get("first_unclosed_q8_cell") or {}
          worst = d.get("worst_q8_cell") or {}

          def fmt(x):
              try:
                  y = float(x)
              except (TypeError, ValueError):
                  return "na"
              return f"{y:.12g}" if math.isfinite(y) else str(y)

          with open(sys.argv[1], "a", encoding="utf-8") as gh:
              print(f"status={d.get('P5_SAMPLE1_V41_ADAPTIVE_DIRECTIONAL_CURRENT_V42', 'UNKNOWN')}", file=gh)
              print(f"cells={cells}", file=gh)
              print(f"closed={closed}", file=gh)
              print(f"unclosed={unclosed}", file=gh)
              print(f"eligible={d.get('adaptive_eligible_open_support_calls', 'na')}", file=gh)
              print(f"refined={d.get('adaptive_refined_support_calls', 'na')}", file=gh)
              print(f"newly_closed={d.get('adaptive_newly_closed_support_calls', 'na')}", file=gh)
              print(f"leaf_evals={d.get('adaptive_leaf_evaluations', 'na')}", file=gh)
              print(f"first_q={fmt(first.get('post_sample1_cayley_norm_upper'))}", file=gh)
              print(f"first_p={first.get('p_cell', 'na')}", file=gh)
              print(f"first_t={first.get('tangent_residual_cell', 'na')}", file=gh)
              print(f"first_a={first.get('axial_residual_cell', 'na')}", file=gh)
              print(f"worst_q={fmt(worst.get('post_sample1_cayley_norm_upper'))}", file=gh)
              print(f"next={d.get('next_obligation', 'UNKNOWN')}", file=gh)
      - name: "V42 status=${{ steps.audit.outputs.status }} cells=${{ steps.audit.outputs.cells }} closed=${{ steps.audit.outputs.closed }} open=${{ steps.audit.outputs.unclosed }} firstq=${{ steps.audit.outputs.first_q }} worstq=${{ steps.audit.outputs.worst_q }}"
        run: |
          echo "eligible/refined/newly-closed=${{ steps.audit.outputs.eligible }}/${{ steps.audit.outputs.refined }}/${{ steps.audit.outputs.newly_closed }}"
          echo "adaptive leaf evaluations=${{ steps.audit.outputs.leaf_evals }}"
          echo "first open cell p/t/a=${{ steps.audit.outputs.first_p }}/${{ steps.audit.outputs.first_t }}/${{ steps.audit.outputs.first_a }}"
          echo "next=${{ steps.audit.outputs.next }}"
