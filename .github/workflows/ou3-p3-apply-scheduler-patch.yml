name: ou3-p3-apply-scheduler-patch

on:
  push:
    branches:
      - codex/ou3-p3-source-clock-recurrence
    paths:
      - ".github/workflows/ou3-p3-apply-scheduler-patch.yml"
      - "tools/ou3_apply_scheduler_progress_patch.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ou3-p3-source-clock-recurrence
          fetch-depth: 0

      - name: Install Eigen
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      - name: Apply exact scheduler progress patch
        run: python3 tools/ou3_apply_scheduler_progress_patch.py

      - name: Compile focused common scheduler test
        working-directory: tests/kalman_ou_iii
        run: make kalman_ou_common-test

      - name: Run focused common scheduler test
        working-directory: tests/kalman_ou_iii
        run: ./kalman_ou_common-test

      - name: Commit source and regression changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kalman_ou_common/KalmanOUCoreMath.h \
                  src/kalman_ou_iii/Kalman3D_Wave_OU_III.h \
                  tests/kalman_ou_iii/kalman_ou_common-test.cpp
          git commit -m "fix: preserve pseudo scheduler progress on retarget"
          git push origin HEAD:codex/ou3-p3-source-clock-recurrence
