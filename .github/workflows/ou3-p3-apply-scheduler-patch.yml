name: ou3-p3-apply-scheduler-patch

on:
  push:
    branches:
      - codex/ou3-p3-source-clock-recurrence
    paths:
      - ".github/workflows/ou3-p3-apply-scheduler-patch.yml"
      - "tools/ou3_apply_scheduler_progress_proof_patch.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ou3-p3-source-clock-recurrence
          fetch-depth: 0

      - name: Apply canonical P3 scheduler binding
        run: python3 tools/ou3_apply_scheduler_progress_proof_patch.py

      - name: Compile scheduler proof producers
        run: |
          python3 -m py_compile \
            tools/ou3_source_reachable_matrix_p3.py \
            tools/ou3_p3_pseudo_scheduler_progress_certificate.py \
            tests/validation/test_ou3_p3_pseudo_scheduler_progress_certificate.py

      - name: Run scheduler progress certificate tests
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p3_pseudo_scheduler_progress_certificate

      - name: Run scheduler progress certificate
        run: |
          python3 tools/ou3_p3_pseudo_scheduler_progress_certificate.py \
            --output /tmp/ou3_p3_pseudo_scheduler_progress_certificate.json

      - name: Commit canonical proof binding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ou3_source_reachable_matrix_p3.py
          git commit -m "proof: bind P3 gap to progress-preserving scheduler"
          git push origin HEAD:codex/ou3-p3-source-clock-recurrence
