name: ou3-pr495-fix-normalizer-push
on:
  push:
    branches: [codex/ou3-complete-sea3-shipping-feasibility]
    paths: [.github/workflows/ou3-pr495-fix-normalizer-push.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Disambiguate branch push and remove this helper
        env:
          BRANCH: codex/ou3-complete-sea3-shipping-feasibility
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH" "origin/$BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ou3-pr495-normalize-point-diagnostic.yml')
          s=p.read_text()
          old='git push origin HEAD:"$BRANCH"'
          new='git push origin HEAD:refs/heads/"$BRANCH"'
          if s.count(old) != 1:
              raise SystemExit('normalizer push anchor changed')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/ou3-pr495-fix-normalizer-push.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'Disambiguate SEA3 normalizer branch push'
          git push origin HEAD:refs/heads/"$BRANCH"
