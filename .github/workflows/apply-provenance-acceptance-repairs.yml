name: apply-provenance-acceptance-repairs

on:
  push:
    branches: [agent/harden-ou-evidence-provenance]
    paths:
      - .provenance-acceptance-repair-trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/harden-ou-evidence-provenance
          fetch-depth: 0
      - name: Apply focused acceptance repairs
        run: |
          python3 tools/apply_provenance_acceptance_repairs.py
          python3 -m py_compile \
            tools/ou_evidence_provenance.py \
            tests/validation/test_ou_validation.py \
            tests/validation/test_ou_robustness.py \
            tests/validation/test_zz_publication_contract.py
      - name: Commit permanent non-workflow changes
        run: |
          set -euo pipefail
          rm tools/apply_provenance_acceptance_repairs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ou_evidence_provenance.py \
                  tests/validation/test_ou_validation.py \
                  tests/validation/test_ou_robustness.py \
                  tests/validation/test_zz_publication_contract.py \
                  tools/apply_provenance_acceptance_repairs.py
          git commit -m "Align validation tests with immutable replay provenance"
          git push origin HEAD:refs/heads/agent/harden-ou-evidence-provenance
