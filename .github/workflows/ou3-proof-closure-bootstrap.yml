name: ou3-proof-closure-bootstrap

on:
  push:
    branches:
      - codex/ou3-proof-certificate-closure

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Apply retained-proof cleanup fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # The source-domain builder was deliberately made explicit about the
          # shipping header.  The flattened word-language producer must pass it.
          replace_once(
              "tools/ou3_implementation_word_language.py",
              "    source = SOURCE.build()\n",
              "    source = SOURCE.build(SOURCE.DEFAULT_HEADER.resolve())\n",
          )

          # Keep the interval-AD proof primitive self-contained after deleting
          # the old P5 quaternion and P4 group-algebra diagnostic modules.  Only
          # the deployed branch threshold, validated correction radius, and
          # homogeneous axis-angle value enclosure were actually consumed here.
          replace_once(
              "tools/ou3_interval_ad.py",
              "from ou3_interval import Interval, hull\nimport ou3_p5_deployed_quaternion_cayley_cell as QCOMP\nimport ou3_p4_group_algebra as GROUP\n",
              "from ou3_interval import Interval, hull\nimport ou3_validated_transcendentals as VT\n\nSERIES_BRANCH_NORM = 1.0e-2\nMAX_CORRECTION_NORM = 6.0\n",
          )

          p = Path("tools/ou3_interval_ad.py")
          text = p.read_text(encoding="utf-8")
          start = text.index("def _axis_quaternion_ad(")
          end = text.index("\ndef deployed_quaternion_ad(", start)
          new_axis = '''def _axis_quaternion_ad(d: Sequence[AD], norm_upper: float) -> tuple[AD, list[AD]]:
              """Axis-angle quaternion AD using rigorous radial derivative bounds."""
              hi = float(norm_upper)
              if hi < SERIES_BRANCH_NORM:
                  raise RuntimeError("axis quaternion requested outside axis branch")
              if not (math.isfinite(hi) and hi <= MAX_CORRECTION_NORM):
                  raise ValueError(
                      f"deployed correction norm upper outside validated range [0,{MAX_CORRECTION_NORM:g}]"
                  )
              half_lo = 0.5 * SERIES_BRANCH_NORM
              half_hi = 0.5 * hi
              clo = VT.cos_point(half_hi)
              chi = VT.cos_point(half_lo)
              wv = Interval(clo.lo, chi.hi)
              k_val = I(0.5) * VT.sinc_interval(Interval(half_lo, half_hi))
              vv = [k_val * x.val for x in d]
              n = d[0].n
              # w_u and k_u are non-positive on r/2 in [0,3].  The interval
              # integral bounds are global on the promoted correction range and
              # include r->0, avoiding differentiation of sqrt at the origin.
              w_u = Interval(-1.0 / 8.0, 0.0)
              k_u = Interval(-1.0 / 48.0, 0.0)

              du = []
              for j in range(n):
                  y = I(0.0)
                  for x in d:
                      y = y + I(2.0) * x.val * x.der[j]
                  du.append(y)
              w = AD(wv, tuple(w_u * qj for qj in du))
              out = []
              for i in range(3):
                  der = []
                  for j in range(n):
                      der.append(k_val * d[i].der[j] + d[i].val * k_u * du[j])
                  out.append(AD(vv[i], tuple(der)))
              return w, out
          '''
          # Dedent the source literal without importing another helper.
          new_axis = "\n".join(line[12:] if line.startswith("            ") else line for line in new_axis.splitlines()) + "\n"
          text = text[:start] + new_axis + text[end + 1:]
          text = text.replace("QCOMP.MAX_CORRECTION_NORM", "MAX_CORRECTION_NORM")
          text = text.replace("GROUP.SERIES_BRANCH_NORM", "SERIES_BRANCH_NORM")
          if "QCOMP" in text or "GROUP." in text:
              raise SystemExit("ou3_interval_ad.py still contains retired quaternion/group aliases")
          p.write_text(text, encoding="utf-8")

          # Remove the three remaining P5-named compatibility aliases by wiring
          # their active P4 consumers directly to the retained covariance module.
          replace_once(
              "tools/ou3_p4_augmented_complete_word_design.py",
              "import ou3_p5_full_h_prefix_cells as H\n",
              "import ou3_p4_golive_covariance as COV\n",
          )
          p = Path("tools/ou3_p4_augmented_complete_word_design.py")
          text = p.read_text(encoding="utf-8").replace("H.", "COV.")
          p.write_text(text, encoding="utf-8")

          replace_once(
              "tools/ou3_p4_joint_word_gauge_design.py",
              "import ou3_p5_go_live_covariance_stage as GOLIVE\n",
              "import ou3_p4_golive_covariance as COV\n",
          )
          replace_once(
              "tools/ou3_p4_joint_word_gauge_design.py",
              "GOLIVE.build_p5_primary()",
              "COV.build_p4_covariance()",
          )

          retired = (
              "ou3_p5_full_h_prefix_cells",
              "ou3_p5_full_h_prefix_cells_v2",
              "ou3_p5_go_live_covariance_stage",
              "ou3_p5_deployed_quaternion_cayley_cell",
              "ou3_p4_group_algebra",
          )
          ignored = {
              "ou3_p5_full_h_prefix_cells.py",
              "ou3_p5_full_h_prefix_cells_v2.py",
              "ou3_p5_go_live_covariance_stage.py",
          }
          stale = []
          for root in (Path("tools"), Path("tests/validation")):
              for q in root.glob("*.py"):
                  if q.name in ignored:
                      continue
                  body = q.read_text(encoding="utf-8")
                  for name in retired:
                      if name in body:
                          stale.append(f"{q}:{name}")
          if stale:
              raise SystemExit("stale retired imports remain:\n" + "\n".join(stale))
          PY

          git rm \
            tools/ou3_p5_full_h_prefix_cells.py \
            tools/ou3_p5_full_h_prefix_cells_v2.py \
            tools/ou3_p5_go_live_covariance_stage.py

          PYTHONPATH=tools python3 -m py_compile \
            tools/ou3_implementation_word_language.py \
            tools/ou3_interval_ad.py \
            tools/ou3_p4_augmented_complete_word_design.py \
            tools/ou3_p4_joint_word_gauge_design.py

          (cd tests/validation && python3 -m unittest -v \
            test_ou3_implementation_word_language \
            test_ou3_interval_ad)

          PYTHONPATH=tools python3 - <<'PY'
          import ou3_p4_augmented_complete_word_design
          import ou3_p4_joint_word_gauge_design
          print("retained P4 design imports: OK")
          PY

      - name: Commit cleanup continuation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ou3-proof-closure-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix retained OU-III proof route after cleanup"
          git push origin HEAD:codex/ou3-proof-certificate-closure
