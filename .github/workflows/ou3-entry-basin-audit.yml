name: ou3-entry-basin-audit
on:
  push:
    paths: &paths
      - '.github/workflows/ou3-entry-basin-audit.yml'
      - 'src/kalman_ou_iii/**'
      - 'src/kalman_common/SeaStateFusionFilterCommon.h'
      - 'src/wave_spectrum/**'
      - 'tools/stability/ou3_p4_live_entry_graph.py'
      - 'tools/stability/ou3_p4_brmm_same_signal_statistics.py'
      - 'tools/stability/ou3_p4_joint_brmm_frontend_transition.py'
      - 'tools/stability/ou3_brmm_wpe_state_step.py'
      - 'tools/stability/ou3_brmm_wave_period_frontend.py'
      - 'tools/stability/ou3_p4_hard_entry_set.py'
      - 'tools/stability/ou3_p4_final_closure_gate.py'
      - 'tools/stability/ou3_p4_closure_domain.json'
      - 'tools/stability/ou3_proof_operating_domain.json'
      - 'tests/kalman_ou_iii/live_entry_audit-test.cpp'
      - 'tests/validation/test_ou3_p4_live_entry_graph.py'
      - 'tests/validation/test_ou3_brmm_wave_period_frontend.py'
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entry-source-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Install native dependency
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libeigen3-dev
      - name: Exercise unchanged shipping startup, reset, and release code
        run: |
          g++ -O1 -g0 -std=c++20 -fno-finite-math-only -I src -isystem /usr/include/eigen3 tests/kalman_ou_iii/live_entry_audit-test.cpp -o /tmp/live-entry-audit
          /tmp/live-entry-audit | tee /tmp/live-entry-audit.txt
          grep -qx 'LIVE_ENTRY_AUDIT_PASS=true' /tmp/live-entry-audit.txt
      - name: Exact origin cancellation and branch-cover regressions
        run: |
          python3 -m unittest discover -s tests/validation -p 'test_ou3_p4_live_entry_graph.py' -v
          python3 -m unittest discover -s tests/validation -p '*frontend*.py' -v
          python3 -m unittest discover -s tests/validation -p 'test_ou3_brmm_wpe_state_step.py' -v
          python3 -m unittest discover -s tests/validation -p 'test_ou3_p4_bias_family_driver_recurrences.py' -v
          python3 -m unittest discover -s tests/validation -p 'test_wave_period_live_entry_parity.py' -v
      - name: Produce source-bound evidence without promoting P4
        run: |
          python3 tools/stability/ou3_p4_live_entry_graph.py --native-log /tmp/live-entry-audit.txt --output /tmp/live-entry-graph.json
          python3 tools/stability/ou3_p4_brmm_same_signal_statistics.py --output /tmp/central-statistics.json
          python3 tools/stability/ou3_p4_joint_brmm_frontend_transition.py --output /tmp/joint-frontend.json
          python3 tools/stability/ou3_p4_final_closure_gate.py --output /tmp/p4-final-gate.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p4-final-gate.json'))
          assert d['validation_pass'],d['validation_failures']
          assert d['fresh_live_entry_graph']['cancellation']['coefficient_residuals_exactly_zero']
          assert d['fresh_live_entry_graph']['cancellation']['formal_gain_coefficients_checked']==117
          assert not d['legacy_independent_entry_box_can_promote_fresh_startup']
          assert all(d['bias_family_source_uniform_same_history_closed'].values())
          assert not d['BIAS2_separation_required_for_bounded_bias_objective']
          if d['remaining_mathematical_P4_blockers']:
              assert not d['P4_PASS'] and not d['P4_MOTION_PASS'] and not d['P5_MAY_START']
          print('P4_PASS',d['P4_PASS'],'P5_MAY_START',d['P5_MAY_START'])
          PY
      - name: Retain declaration ancestry for the entry-domain audit
        if: always()
        run: git log --follow --format=fuller -p -S 'integral_displacement_error_norm_upper_m_s' -- tools/stability/ou3_proof_operating_domain.json > /tmp/entry-radius-history.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ou3-live-entry-source-graph
          path: |
            /tmp/live-entry-audit.txt
            /tmp/live-entry-graph.json
            /tmp/central-statistics.json
            /tmp/joint-frontend.json
            /tmp/p4-final-gate.json
            /tmp/entry-radius-history.txt
          if-no-files-found: error
          retention-days: 14
