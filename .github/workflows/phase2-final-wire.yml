name: phase2-final-wire

on:
  pull_request:
    paths:
      - ".github/workflows/phase2-final-wire.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase2-constructive-live-basin
          fetch-depth: 0

      - name: Install Eigen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev

      - name: Wire final Riccati-metric certificate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cert_path = Path('doc/kalman_ou_iii/w3d-live-basin-certificate.tex-part')
          cert = cert_path.read_text(encoding='utf-8')
          start = cert.index(r'\subsubsection{Exact finite-horizon contraction certificate}')
          end = cert.index(r'\subsubsection{Constructive nonlinear remainder}')

          metric = r'''\subsubsection{Riccati-metric finite-horizon certificate}

At a normal Live sample, every matrix needed by the homogeneous linearized
error map is available to the estimator.  If $u$ indexes accepted corrections
in their executed order, define
\begin{equation}
\mat J_{u,k}=\mat G_{{\rm reset},u,k}
             (\mat I-\mat K_{u,k}\mat C_{u,k}),
\end{equation}
where $\mat G_{{\rm reset},u,k}$ is the MEKF reset Jacobian evaluated at the
injected correction.  With prediction transition $\mat\Phi_k$, their product in
execution order is the one-sample homogeneous transition
$\mat A_k^{\rm cl}$.  In the fixed dimensionless coordinates,
\begin{equation}
\widetilde{\mat A}_k
=\mat D\mat A_k^{\rm cl}\mat D^{-1}.
\label{eq:iss-cert-one-step}
\end{equation}
Thus the certificate uses estimator matrices only; no truth state is required.

The fixed physical scaling remains useful for interpreting a basin, but it is
unnecessarily strong to demand short-horizon contraction in that one Euclidean
norm.  The residual accelerometer-bias state has the deliberately slow default
correlation time $\tau_b=\SI{5000}{s}$, and non-normal coupling can therefore
produce a long Euclidean transient even when the homogeneous Kalman error
dynamics are UES.  We instead use the Lyapunov metric generated by the Riccati
recursion.

Let $\mat P_k$ be the covariance at the same indexed phase and define
\begin{equation}
\mat P_{z,k}=\mat D\mat P_k\mat D^\top .
\label{eq:iss-cert-Pz}
\end{equation}
On a certified Live interval require
\begin{equation}
0<\underline p\,\mat I
\preceq \mat P_{z,k}
\preceq \overline p\,\mat I<\infty .
\label{eq:iss-cert-Pz-bounds}
\end{equation}
Write $\mat P_{z,k}=\mat L_k\mat L_k^\top$ and define
\begin{equation}
\|\vct z\|_{V_k}:=\|\mat L_k^{-1}\vct z\|_2 .
\label{eq:iss-cert-Vnorm}
\end{equation}

In exact arithmetic, normal prediction, Joseph-form accepted updates, MEKF
reset, and the proof-compatible positive-semidefinite $a_w$ covariance
inflation compose as
\begin{equation}
\mat P_{z,k+1}
=\widetilde{\mat A}_k\mat P_{z,k}\widetilde{\mat A}_k^\top
 +\mat\Omega_{z,k},
\qquad \mat\Omega_{z,k}\succeq0.
\label{eq:iss-cert-cov-recursion}
\end{equation}
Hard reinitializations remain Live-interval boundaries.  Equation
\eqref{eq:iss-cert-cov-recursion} implies
\begin{equation}
\left\|
\mat L_{k+1}^{-1}\widetilde{\mat A}_k\mat L_k
\right\|_2\le1,
\label{eq:iss-cert-one-step-nonexpansive}
\end{equation}
so every prefix is nonexpansive in the Riccati metric.

For an integer horizon $H\ge1$, define
\begin{equation}
\chi_{V,H}:=
\sup_k\left\|
\mat L_{k+H}^{-1}\widetilde\Psi(k+H,k)\mat L_k
\right\|_2 .
\label{eq:iss-cert-chi}
\end{equation}

\begin{theorem}[Constructive Riccati-metric UES certificate]
\label{thm:iss-cert-finite-horizon}
Suppose an uninterrupted Live interval satisfies
Eqs.~\eqref{eq:iss-cert-Pz-bounds} and
\eqref{eq:iss-cert-one-step-nonexpansive}, and for one fixed $H$,
\begin{equation}
\chi_{V,H}\le\overline\chi<1 .
\label{eq:iss-cert-contract}
\end{equation}
Then the scaled homogeneous transition is UES in the fixed Euclidean norm with
explicit constants
\begin{equation}
\boxed{
\rho_H=\overline\chi^{1/H},
\qquad
M_H=\sqrt{\frac{\overline p}{\underline p}}\,
     \rho_H^{-(H-1)} .}
\label{eq:iss-cert-M-rho}
\end{equation}
In particular,
\begin{equation}
\|\widetilde\Psi(k,j)\|_2
\le M_H\rho_H^{k-j},\qquad k\ge j,
\label{eq:iss-cert-ues}
\end{equation}
and the projected constants in
Eq.~\eqref{eq:iss-block-projected-gains} may conservatively be chosen as
\begin{equation}
M_{\xi\xi}=M_{\xi\ell}=M_\xi=M_H.
\label{eq:iss-cert-projected-M}
\end{equation}
\end{theorem}

\begin{proof}
Write $k-j=qH+r$ with $0\le r<H$.  The nonexpansive one-step metric bound
controls the $r$-sample prefix, while each complete $H$-sample block contributes
at most $\overline\chi$.  Hence
\begin{equation}
\|\vct z_k\|_{V_k}
\le\overline\chi^q\|\vct z_j\|_{V_j}.
\end{equation}
Equation~\eqref{eq:iss-cert-Pz-bounds} gives
$\|\vct z\|_2\le\sqrt{\overline p}\|\vct z\|_V$ and
$\|\vct z\|_V\le\|\vct z\|_2/\sqrt{\underline p}$.  Therefore
\begin{equation}
\|\vct z_k\|_2
\le\sqrt{\frac{\overline p}{\underline p}}
   \overline\chi^q\|\vct z_j\|_2.
\end{equation}
Since $qH\ge k-j-(H-1)$, substitution of
$\rho_H=\overline\chi^{1/H}$ gives
Eq.~\eqref{eq:iss-cert-ues} with Eq.~\eqref{eq:iss-cert-M-rho}.  Coordinate
selectors have unit Euclidean norm, proving
Eq.~\eqref{eq:iss-cert-projected-M}.
\end{proof}

The theorem is an interval certificate, not a grid theorem.  A trajectory
called certified must satisfy its own covariance bounds and lifted contraction
inequality.  Reference replay is used only to establish that those conditions
are numerically plausible for deployed operating points.

'''
          cert = cert[:start] + metric + cert[end:]

          diag_start = cert.index(r'\subsubsection{Deployed-point margin diagnostic}')
          diag = r'''\subsubsection{Deployed-point margin diagnostic}
\label{sec:iss-cert-diagnostic}

The host-side program \texttt{live\_basin\_diagnostic.cpp} reconstructs the
homogeneous transition from the filter's prediction matrices, accepted
measurement Jacobians, and Kalman gains at the eight committed SpectralMSE
reference operating points.  The reference equilibrium has zero innovations,
so the MEKF reset Jacobian is the identity there; on a general certified Live
trajectory Eq.~\eqref{eq:iss-cert-one-step} retains the nontrivial reset
Jacobian.  After a \SI{120}{s} covariance warm-up the program evaluates a
\SI{30}{s} lifted transition in both the fixed physical scaling and the Riccati
metric.

The fixed scaled Euclidean norm is deliberately not used as the contraction
gate: its worst \SI{30}{s} norm is $6.03$, with largest prefix norm $12.05$.
The slow $\tau_b=\SI{5000}{s}$ residual-bias mode and non-normal coupling make
that short-horizon norm conservative.  In the Riccati metric all eight reference
points contract,
\begin{equation}
0.9354\le\chi_{V,30}\le0.9443 .
\label{eq:iss-cert-reference-chi}
\end{equation}
Across the same trajectories,
\begin{equation}
2.009\times10^{-8}\le
\lambda_{\min}(\mat P_z),\qquad
\lambda_{\max}(\mat P_z)\le6.458\times10^{-3},
\label{eq:iss-cert-reference-Pz}
\end{equation}
so the pooled conversion factor is
$\sqrt{\overline p/\underline p}=566.9$.  Combining the worst reference
contraction and this pooled covariance envelope gives
$\rho_H=0.99999045$ per IMU sample ($0.998091$ per second) and the deliberately
conservative $M_H\approx600.35$.

These values are a reproducible margin report, not substituted hypotheses of
Theorem~\ref{thm:iss-cert-finite-horizon}.  An unexamined Live trajectory must
establish its own $\chi_{V,H}$ and covariance envelope before its basin
inequality is called certified.  The eight-point replay is therefore evidence
of feasibility rather than a finite-grid proof of UES.
'''
          cert = cert[:diag_start] + diag
          cert_path.write_text(cert, encoding='utf-8')

          sem_path = Path('doc/kalman_ou_iii/w3d-semiglobal-stability.tex-part')
          sem = sem_path.read_text(encoding='utf-8')
          block = r'\input{w3d-block-local-iss.tex-part}'
          inc = r'\input{w3d-live-basin-certificate.tex-part}'
          if inc not in sem:
              sem = sem.replace(block, block + '\n' + inc, 1)
          sem_path.write_text(sem, encoding='utf-8')

          Path('.github/workflows/phase2-final-wire.yml').unlink()
          PY

      - name: Verify final Phase 2
        run: |
          make -C tests/kalman_ou_iii live_basin_diagnostic
          tests/kalman_ou_iii/live_basin_diagnostic
          python3 tests/validation/test_ou_live_basin_certificate.py
          python3 tests/validation/test_ou_semiglobal_stability.py

      - name: Commit final Phase 2
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize Riccati-metric Live-basin certificate"
          git push origin HEAD:agent/phase2-constructive-live-basin
