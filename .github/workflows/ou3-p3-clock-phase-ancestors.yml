name: ou3-p3-clock-phase-ancestors

on:
  push:
    paths:
      - "tools/ou3_p3_clock_phase_ancestor_envelope.py"
      - "tools/ou3_p2_clock_phase_tuner_graph.py"
      - "tools/ou3_p4_sample_clock_source_refinement.py"
      - "tools/ou3_p4_source_node_cells.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p3_clock_phase_ancestor_envelope.py"
      - ".github/workflows/ou3-p3-clock-phase-ancestors.yml"
  pull_request:
    paths:
      - "tools/ou3_p3_clock_phase_ancestor_envelope.py"
      - "tools/ou3_p2_clock_phase_tuner_graph.py"
      - "tools/ou3_p4_sample_clock_source_refinement.py"
      - "tools/ou3_p4_source_node_cells.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p3_clock_phase_ancestor_envelope.py"
      - ".github/workflows/ou3-p3-clock-phase-ancestors.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ancestors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile endpoint ancestor producer
        run: |
          python3 -m py_compile \
            tools/ou3_p3_clock_phase_ancestor_envelope.py \
            tests/validation/test_ou3_p3_clock_phase_ancestor_envelope.py

      - name: Run endpoint ancestor regression tests
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p3_clock_phase_ancestor_envelope

      - name: Emit endpoint-conditioned source envelopes
        run: |
          python3 tools/ou3_p3_clock_phase_ancestor_envelope.py \
            --output /tmp/ou3_p3_clock_phase_ancestors.json

      - name: Print endpoint envelope diagnostics
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_p3_clock_phase_ancestors.json'))
          assert d['validation_pass'], d['validation_failures']
          print('word horizon upper s', d['P3_word_horizon_upper_s'])
          print('reverse stage transitions', d['reverse_stage_transitions_admitted'])
          print('ancestor count min/max/mean',
                d['endpoint_ancestor_count_min'],
                d['endpoint_ancestor_count_max'],
                d['endpoint_ancestor_count_mean'])
          for node in ('0','729'):
              r=d['diagnostic_endpoints'][node]
              print('node', node, 'ancestors', r['ancestor_count'], 'envelope', r['envelope'])
          PY

      - name: Upload P3 endpoint ancestor envelopes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p3-clock-phase-ancestors
          path: /tmp/ou3_p3_clock_phase_ancestors.json
          if-no-files-found: warn
          retention-days: 7
