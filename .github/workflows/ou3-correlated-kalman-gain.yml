name: ou3-correlated-kalman-gain

on:
  push:
    paths:
      - "tools/ou3_interval.py"
      - "tools/ou3_interval_linear_algebra.py"
      - "tools/ou3_correlated_kalman_gain.py"
      - "tests/validation/test_ou3_correlated_kalman_gain.py"
      - ".github/workflows/ou3-correlated-kalman-gain.yml"
  pull_request:
    paths:
      - "tools/ou3_interval.py"
      - "tools/ou3_interval_linear_algebra.py"
      - "tools/ou3_correlated_kalman_gain.py"
      - "tests/validation/test_ou3_correlated_kalman_gain.py"
      - ".github/workflows/ou3-correlated-kalman-gain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-correlated-kalman-gain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gain:
    name: Correlation-preserving Kalman gain enclosure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile primitive and tests
        run: |
          python3 -m py_compile \
            tools/ou3_correlated_kalman_gain.py \
            tests/validation/test_ou3_correlated_kalman_gain.py
      - name: Run focused tests
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_correlated_kalman_gain
