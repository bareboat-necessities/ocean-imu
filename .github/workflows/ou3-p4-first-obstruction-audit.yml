name: ou3-p4-first-obstruction-audit

on:
  push:
    paths:
      - "tools/ou3_p4_candidate_first_failure_audit.py"
      - "tools/ou3_p4_candidate_full_word.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-first-obstruction-audit.yml"
  pull_request:
    paths:
      - "tools/ou3_p4_candidate_first_failure_audit.py"
      - "tools/ou3_p4_candidate_full_word.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-first-obstruction-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-first-obstruction-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: 30deg first H accelerometer obstruction
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Compile audit
        run: python3 -m py_compile tools/ou3_p4_candidate_first_failure_audit.py
      - name: Emit obstruction audit
        run: |
          python3 tools/ou3_p4_candidate_first_failure_audit.py \
            --output /tmp/ou3_p4_first_obstruction.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_p4_first_obstruction.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['P4_30DEG_FIRST_OBSTRUCTION_AUDIT']=='PASS'
          a=d['accelerometer_obstruction']
          print('P4_FIRST_OBSTRUCTION',
                'residual',a['residual_norm_upper'],
                'Ktheta',a['attitude_gain_operator_norm_upper'],
                'correction',a['attitude_correction_norm_upper_rad'],
                'Jaw_box',a['J_aw_entrywise_box_operator_norm_upper'],
                'Jaw_exact',a['J_aw_shipping_exact_operator_norm'],
                'inverse',a['inverse_backend'])
          print('next',d['next_obligation'])
          PY
