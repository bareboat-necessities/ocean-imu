name: ou-full-evidence-branch

on:
  workflow_dispatch:
  # Temporary pre-merge trigger for PR #478.  Restrict it to this branch and
  # to the workflow file itself so the evidence commit cannot recursively
  # launch another ~1,150-replay regeneration.
  push:
    branches:
      - codex/ou3-p3-source-clock-recurrence
    paths:
      - ".github/workflows/ou-full-evidence-branch.yml"

# Full branch evidence is intentionally opt-in. Main is the authoritative
# automatic full-study path through build.yml. Keeping branch replays manual
# prevents ordinary development pushes from duplicating the same ~1,150
# simulator replays while still allowing an explicit pre-merge regeneration
# when one is useful.
# PR #478 full-evidence rerun requested after absorbing PR #479.
concurrency:
  group: ou-full-evidence-branch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    permissions:
      contents: write
    uses: ./.github/workflows/ou-validation.yml
    with:
      validation_mode: full
