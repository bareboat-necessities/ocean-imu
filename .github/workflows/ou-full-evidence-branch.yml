name: ou-full-evidence-branch

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "tools/sim_dataset.py"
      - "Makefile"
      - ".github/workflows/ou-validation.yml"
      - ".github/workflows/ou-full-evidence-branch.yml"

# Dataset changes require full branch regeneration; other changes remain opt-in.
concurrency:
  group: ou-full-evidence-branch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    permissions:
      contents: write
    uses: ./.github/workflows/ou-validation.yml
    with:
      validation_mode: full