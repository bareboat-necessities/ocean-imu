name: ou-full-evidence-branch

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - ".github/actions/replay-toolchain/**"
      - "tools/**"
      - "docs/tfg-comparison.md"
      # Every tracked test/build file belongs to the conservative fingerprint.
      - "tests/**"
      # The publisher validates and fingerprints the proof records too.
      # A source-bound proof refresh must supersede an older in-flight run.
      - "reports/results/ou3_stability/**"
      # The final fingerprint also protects the published two-case results.
      # A newer result bundle cannot be rebased under an older fingerprint.
      - "reports/results/sim_v1.4.0/**"
      # Startup qualification changes the same scientific-results fingerprint.
      - "reports/results/startup_learning/**"
      - "docs/ou3-proof-research-state.md"
      - "Makefile"
      - "tools/startup_ablation.py"
      - "tools/ou3_lever_arm_study.py"
      - "src/**"
      - ".github/workflows/ou-validation.yml"
      - ".github/workflows/ou-full-evidence-branch.yml"
      - ".github/workflows/render-stability-study-review.yml"

# Dataset and deployed-filter changes require full branch regeneration.
concurrency:
  group: ou-full-evidence-branch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    permissions:
      contents: write
    uses: ./.github/workflows/ou-validation.yml
    with:
      validation_mode: full

  check-published-evidence:
    needs: evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      # The publisher pushes with GITHUB_TOKEN. That push does not trigger
      # the PR gate, whose earlier run checked the pre-replay source commit.
      - name: Run the evidence contract on the published branch tip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          message=$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits" \
            -f sha="$GITHUB_REF_NAME" -F per_page=1 --jq '.[0].commit.message')
          if [[ "$message" == *"Produced by ou-validation run $GITHUB_RUN_ID from $GITHUB_SHA."* ]]; then
            gh workflow run evidence-contract.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          fi
