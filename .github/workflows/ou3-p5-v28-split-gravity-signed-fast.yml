name: ou3-p5-v28-split-gravity-signed-fast

on:
  push:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_split_gravity_signed_components_v28.py"
      - ".github/workflows/ou3-p5-v28-split-gravity-signed-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_split_gravity_signed_components_v28.py"
      - ".github/workflows/ou3-p5-v28-split-gravity-signed-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v28-split-gravity-signed-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-split-gravity-signed-v28:
    name: P5 sample-1 split-gravity signed components V28
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Compile V28 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_split_gravity_signed_components_v28.py \
            tests/validation/test_ou3_p5_sample1_split_gravity_signed_components_v28.py
      - name: Test V28 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_split_gravity_signed_components_v28
      - name: Emit V28 first-open split-gravity signed audit
        run: |
          python3 tools/ou3_p5_sample1_split_gravity_signed_components_v28.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --current-component-pieces 4 \
            --output /tmp/p5_sample1_v28_split_gravity_signed.json
