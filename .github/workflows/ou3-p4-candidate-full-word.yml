name: ou3-p4-candidate-full-word

on:
  push:
    paths:
      - "tools/ou3_p4_candidate_full_word.py"
      - "tools/ou3_p4_p5_entrance_search_domain.py"
      - "tools/ou3_p4_operation_matched_sector_certificate.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-candidate-full-word.yml"
  pull_request:
    paths:
      - "tools/ou3_p4_candidate_full_word.py"
      - "tools/ou3_p4_p5_entrance_search_domain.py"
      - "tools/ou3_p4_operation_matched_sector_certificate.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-candidate-full-word.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-candidate-full-word-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-30deg-full-word:
    name: 30deg complete H/A candidate word
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Compile complete-word producer
        run: |
          python3 -m py_compile \
            tools/ou3_p4_candidate_full_word.py \
            tools/ou3_p4_p5_entrance_search_domain.py \
            tools/ou3_p4_operation_matched_sector_certificate.py

      - name: Run complete 30deg H/A word
        run: |
          python3 tools/ou3_p4_candidate_full_word.py \
            --candidate-index 0 \
            --cover-factor 1.55 \
            --output /tmp/ou3_p4_candidate_30deg_full_word.json

      - name: Report fail-closed numerical result
        if: always()
        run: |
          python3 - <<'PY'
          import json, math, pathlib
          p=pathlib.Path('/tmp/ou3_p4_candidate_30deg_full_word.json')
          if not p.exists():
              raise SystemExit('complete-word producer did not emit its result')
          d=json.load(p.open())
          assert d['validation_pass'], d['validation_failures']
          assert d['full_word_requested'] is True
          assert d['max_samples_override'] is None
          assert d['old_q8_chart_used'] is False
          assert d['H_dimension']==18 and d['A_dimension']==21
          assert d['position_entrance_uses_half_Hs'] is True
          assert d['Hs_upper_m']==8.5
          assert d['cover_factor']==1.55
          assert d['P4_COMPLETE_WORD_DISSIPATION_ESTABLISHED_HERE'] is False
          assert d['P4_NORMALIZED_CROSS_BLOCK_ESTABLISHED_HERE'] is False
          assert d['P4_USABLE_CERTIFICATE_PROMOTED'] is False
          rows=d['candidate_rows']
          assert len(rows)==1 and float(rows[0]['angle_deg'])==30.0
          r=rows[0]
          print('P4_30DEG_FULL_WORD_STATUS', d['P4_CANDIDATE_FULL_HA_PREFIX_CERTIFICATE'])
          print('cover_cells',r['cover_cells'],'cover_q',r['cover_q_upper'])
          for mode in ('H','A'):
              m=r.get(mode)
              print(mode,'result',m)
          print('first_unclosed_cell',r.get('first_unclosed_cell'))
          print('next',d['next_obligation'])
          PY
