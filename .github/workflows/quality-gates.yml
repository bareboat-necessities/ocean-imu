name: quality-gates

# Sanitizer, static-analysis and coverage layer.
#
# Each gate is reproducible through tools/quality_gates.sh. CI shards the
# complete warnings and clang-tidy translation-unit lists only to fit hosted-runner lifetimes;
# the local command still audits that same list in one invocation. See
# docs/quality-gates.md for coverage and deliberate exclusions.
#
# These gates are about defects. They do not enforce formatting, and they do not
# touch the OU evidence tree — the replay dependency closure is frozen, and
# tests/validation owns it.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "plots/**"
      - ".clang-tidy"
      - "ruff.toml"
      - ".github/workflows/quality-gates.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  warnings-shards:
    name: warnings shard ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - name: Install audit dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev
      - name: Run warnings shard
        env:
          SHARD_NUMBER: ${{ matrix.shard }}
          SHARD_COUNT: 8
          JOBS: 2
        run: tools/quality_gates.sh warnings

  warnings:
    name: warnings (-Wall -Wextra -Wpedantic -Werror)
    needs: warnings-shards
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every warnings shard
        env:
          RESULT: ${{ needs.warnings-shards.result }}
        run: test "$RESULT" = success

  static-analysis:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate: [cppcheck, python]
    steps:
      - uses: actions/checkout@v6
      - name: Install Eigen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev
      - name: Install cppcheck
        if: matrix.gate == 'cppcheck'
        run: sudo apt-get install -y -qq cppcheck
      - name: Install ruff
        if: matrix.gate == 'python'
        run: pipx install ruff
      - name: Run ${{ matrix.gate }}
        run: tools/quality_gates.sh ${{ matrix.gate }}

  clang-tidy-shards:
    name: clang-tidy shard ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - name: Install audit dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev clang-tidy
      - name: Run clang-tidy shard
        env:
          SHARD_NUMBER: ${{ matrix.shard }}
          SHARD_COUNT: 8
          JOBS: 2
        run: tools/quality_gates.sh clang-tidy

  clang-tidy:
    name: clang-tidy
    needs: clang-tidy-shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every clang-tidy shard
        env:
          SHARD_RESULT: ${{ needs.clang-tidy-shards.result }}
        run: test "$SHARD_RESULT" = success

  sanitizer-suites:
    name: ASan + UBSan (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, ou2, ou3, tfg, carma, tfg_carma, shared, tfg_shared, tangent, observers]
    steps:
      - uses: actions/checkout@v6
      - name: Install Eigen and Clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev clang
      - name: Fetch simulation data
        if: matrix.suite == 'unit'
        run: make ensure-sim-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and run instrumented tests
        run: tools/quality_gates.sh sanitizers "${{ matrix.suite }}"

  sanitizers:
    name: sanitizers (ASan + UBSan)
    if: always()
    needs: sanitizer-suites
    runs-on: ubuntu-24.04
    steps:
      - name: Require every sanitizer suite
        env:
          RESULT: ${{ needs.sanitizer-suites.result }}
        run: test "$RESULT" = success

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Eigen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev
      - name: Install gcovr
        run: pipx install gcovr
      - name: Fetch simulation data
        run: make ensure-sim-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate coverage report
        run: tools/quality_gates.sh coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: reports/coverage/**
          if-no-files-found: warn
