name: agent-abstract-stats-fix

on:
  push:
    branches:
      - agent/fix-regenerated-abstract-stats
    paths:
      - .github/workflows/agent-abstract-stats-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-regenerated-abstract-stats
      - name: Sync abstract with regenerated evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('doc/kalman_ou_iii/kalman_ou-w3d.tex')
          s = p.read_text()
          replacements = {
              r'$4.97\pm0.24\%$': r'$5.02\pm0.21\%$',
              r'$6.66\pm0.29\%$': r'$6.73\pm0.26\%$',
              r'$-1.696$ percentage point': r'$-1.708$ percentage point',
              r'$[-1.774,-1.625]$': r'$[-1.782,-1.641]$',
              r'$[-1.787,-1.605]$': r'$[-1.794,-1.622]$',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {old!r}, found {count}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          rm .github/workflows/agent-abstract-stats-fix.yml
          git config user.name "Mikhail Grushinskiy"
          git config user.email "mgrouch@users.noreply.github.com"
          git add doc/kalman_ou_iii/kalman_ou-w3d.tex .github/workflows/agent-abstract-stats-fix.yml
          git commit -m "Sync abstract with regenerated OU evidence"
          git push origin HEAD:agent/fix-regenerated-abstract-stats
