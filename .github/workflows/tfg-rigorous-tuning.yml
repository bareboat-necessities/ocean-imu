name: TFG rigorous tuning
on:
  pull_request:
    paths:
      - 'src/kalman_tfg/**'
      - 'tests/kalman_tfg/**'
      - 'tools/tfg_rigorous_tuning.py'
      - 'tools/tfg_attitude_bias_tuning.py'
      - 'tools/rao_parameter_tuning.py'
      - '.github/workflows/tfg-rigorous-tuning.yml'
permissions:
  contents: read
jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev python3-numpy
      - name: Fetch pinned RAO data
        run: make ensure-sim-data
      - name: Build TFG and OU-III simulators
        run: |
          make -C tests/kalman_tfg kalman_tfg-sim
          make -C tests/kalman_ou_iii kalman_ou_iii-sim
      - name: Run sealed staged campaign
        run: python3 tools/tfg_rigorous_tuning.py --jobs 4
      - name: Run targeted attitude-bias campaign
        run: python3 tools/tfg_attitude_bias_tuning.py --jobs 4
      - name: Upload complete campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfg-rigorous-tuning
          path: |
            reports/results/tfg_rigorous_tuning
            reports/results/tfg_attitude_bias_tuning
          retention-days: 14
