name: TFG rigorous tuning
on:
  push:
    branches: [tfg-rigorous-tuning]
    paths:
      - '.github/workflows/tfg-rigorous-tuning.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tfg-rao-core-refit-571
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/tfg-rigorous-tuning'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tfg-rigorous-tuning
          fetch-depth: 0
      - name: Incorporate current shipping baseline without replacing PR 571
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          # Main owns the newer generated evidence and tighter regression bars.
          # The PR's study scripts and disjoint simulation overrides are retained.
          git merge --no-edit -X theirs origin/main
          git diff --exit-code origin/main -- src/kalman_ou_iii
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          path='tests/kalman_tfg/kalman_tfg-sim.cpp'
          main=subprocess.check_output(['git','show','origin/main:'+path],text=True)
          local=Path(path).read_text()
          pattern=r'static constexpr W3dFailureLimits kRegressionBars\{.*?\n    \};'
          assert re.search(pattern,main,re.S).group()==re.search(pattern,local,re.S).group(), 'Regression bars differ from main'
          assert 'TFG_TAU_COEFF' in local and 'TFG_R_S_Y_FACTOR' in local
          PY
          git push origin HEAD:tfg-rigorous-tuning
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  screen:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev python3-numpy
      - name: Fetch pinned RAO data
        run: make ensure-sim-data
      - name: Build TFG simulator
        run: make -C tests/kalman_tfg kalman_tfg-sim
      - name: Execute tools/tfg_rao_core_refit.py on all eight RAO records
        run: >-
          python3 tools/tfg_rao_core_refit.py --phase screen --jobs 4
          --shard-index ${{ matrix.shard }} --shard-count 8
          --output-dir reports/results/tfg_rao_core_refit/shard-${{ matrix.shard }}
      - name: Upload all successful and failed candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfg-rao-screen-${{ github.run_id }}-${{ matrix.shard }}
          path: reports/results/tfg_rao_core_refit/shard-${{ matrix.shard }}
          retention-days: 14
  aggregate-screen:
    needs: [prepare, screen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: tfg-rao-screen-${{ github.run_id }}-*
          path: artifacts
      - name: Retain the full broad response surface without opening holdout
        run: |
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from tfg_rao_core_refit import rank,screen
          directories=sorted(Path('artifacts').glob('tfg-rao-screen-*/screen'))
          assert len(directories)==8, len(directories)
          merged={name:[] for name in ('summary','runs','configs','manifests')}
          for directory in directories:
              for name in ('summary','runs','configs'):
                  merged[name].extend(json.loads((directory/(name+'.json')).read_text()))
              merged['manifests'].append(json.loads((directory/'manifest.json').read_text()))
          assert len(merged['configs'])==len(screen())==87
          assert len(merged['runs'])==87*8*3
          assert len({(r['config'],r['input'],r['seed']) for r in merged['runs']})==87*8*3
          out=Path('reports/results/tfg_rao_core_refit/broad');out.mkdir(parents=True)
          for name,rows in merged.items():
              (out/(name+'.json')).write_text(json.dumps(rows,indent=2)+'\n')
          ranking=rank(merged['summary'])
          (out/'ranking.json').write_text(json.dumps(ranking,indent=2)+'\n')
          (out/'protocol.json').write_text(json.dumps({'phase':'broad screen only','holdout_evaluated':False,'records':8,'seeds':['default','11','23'],'shipping_gyro_bias_rw_var':3.75e-10},indent=2)+'\n')
          print(json.dumps(ranking[:10],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tfg-rao-broad-${{ github.run_id }}
          path: reports/results/tfg_rao_core_refit/broad
          retention-days: 14
