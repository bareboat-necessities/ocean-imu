name: TFG anisotropic split sweep
on:
  push:
    branches: [tfg-rigorous-tuning]
    paths: ['.github/workflows/tfg-rigorous-tuning.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tfg-rao-split-571
  cancel-in-progress: false
jobs:
  split:
    if: github.ref == 'refs/heads/tfg-rigorous-tuning'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tfg-rigorous-tuning
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev python3-numpy
      - name: Fetch pinned RAO data
        run: make ensure-sim-data
      - name: Build TFG simulator
        run: make -C tests/kalman_tfg kalman_tfg-sim 'CXXFLAGS=$(BASEFLAGS) -march=x86-64'
      - name: Execute X/Y anisotropic split sweep on all eight RAO records
        run: >
          python3 tools/tfg_rao_core_refit.py --phase split --jobs 4
          --shard-index ${{ matrix.shard }} --shard-count 6
          --output-dir reports/results/tfg_rao_split/shard-${{ matrix.shard }}
      - name: Upload split evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfg-rao-split-${{ github.run_id }}-${{ matrix.shard }}
          path: reports/results/tfg_rao_split/shard-${{ matrix.shard }}
          retention-days: 14
