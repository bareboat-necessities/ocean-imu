name: TFG rigorous tuning
on:
  push:
    branches: [tfg-rigorous-tuning]
    paths: ['.github/workflows/tfg-rigorous-tuning.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tfg-rao-core-refit-571
  cancel-in-progress: false
jobs:
  fine:
    if: github.ref == 'refs/heads/tfg-rigorous-tuning'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the identical completed-refinement executable
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35672004933
          name: tfg-refit-binary-35672004933
          path: tests/kalman_tfg
      - name: Reuse checksum-verified baseline cases instead of rerunning them
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35672004933
          name: tfg-refine-35672004933-0
          path: previous-control
      - name: Prepare pinned RAO records and verify binary identity
        run: |
          sudo apt-get update && sudo apt-get install -y python3-numpy
          echo '214b746ed8eb89ff1c5b9713a834e6cb243eae0f6a261e35b876224db989b8e9  tests/kalman_tfg/kalman_tfg-sim' | sha256sum -c -
          chmod +x tests/kalman_tfg/kalman_tfg-sim
          make ensure-sim-data
      - name: Execute tools/tfg_rao_core_refit.py in the extended asymmetric basin
        run: >-
          python3 tools/tfg_rao_core_refit.py --phase refine --jobs 4
          --plan tools/tfg_rao_refit_fine_plan.json
          --shard-index ${{ matrix.shard }} --shard-count 8
          --cache-dir previous-control/cache
          --output-dir reports/results/tfg_rao_core_refit/fine-${{ matrix.shard }}
      - name: Retain every fine-search case, failed gates and reusable cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfg-fine-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            reports/results/tfg_rao_core_refit/fine-${{ matrix.shard }}
            previous-control/cache
          retention-days: 14
  aggregate:
    needs: fine
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: tfg-fine-${{ github.run_id }}-*
          path: artifacts
      - name: Verify and analyze the full extended four-dimensional surface
        run: |
          python3 - <<'PY'
          import json,sys,os
          from pathlib import Path
          sys.path.insert(0,'tools')
          from tfg_rao_refit_analysis import analyse
          from tfg_rao_refit_replay import write_json
          directories=sorted(Path('artifacts').glob('*/reports/results/tfg_rao_core_refit/fine-*/refine'))
          assert len(directories)==8, (len(directories),list(Path('artifacts').glob('**/manifest.json')))
          merged={k:[] for k in ('runs','configs','summary','manifests')}
          for d in directories:
              for key in ('runs','configs','summary'):
                  merged[key].extend(json.loads((d/(key+'.json')).read_text()))
              merged['manifests'].append(json.loads((d/'manifest.json').read_text()))
          assert len(merged['configs'])==55
          assert len(merged['runs'])==55*8*3
          assert len({(r['config'],r['input'],r['seed']) for r in merged['runs']})==55*8*3
          baseline=[r for r in merged['runs'] if r['config']=='baseline']
          assert len(baseline)==24 and all(r['reused'] for r in baseline), 'Baseline must be reused'
          out=Path('reports/results/tfg_rao_core_refit/fine');out.mkdir(parents=True,exist_ok=True)
          for key,value in merged.items():write_json(out/(key+'.json'),value)
          result=analyse(merged['runs']);write_json(out/'analysis.json',result)
          write_json(out/'execution.json',{'workflow_run':int(os.environ['GITHUB_RUN_ID']),
              'source_commit':os.environ['GITHUB_SHA'],'binary_source_run':35672004933,
              'cases':len(merged['runs']),'reused_baseline_cases':24,'new_replays':1296,
              'holdout_evaluated':False})
          print([(r['config'],r['score']) for r in result['ranking'][:12]])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tfg-rao-fine-evidence-${{ github.run_id }}
          path: reports/results/tfg_rao_core_refit/fine
          retention-days: 14
      - name: Carry generated evidence into existing PR 571 without changing source
        run: |
          set -euo pipefail
          cp -a reports/results/tfg_rao_core_refit/fine /tmp/fine-evidence
          git fetch origin tfg-rigorous-tuning
          git checkout -B tfg-rigorous-tuning origin/tfg-rigorous-tuning
          mkdir -p reports/results/tfg_rao_core_refit/fine
          cp /tmp/fine-evidence/*.json reports/results/tfg_rao_core_refit/fine/
          git add -f reports/results/tfg_rao_core_refit/fine/*.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Retain executed finer asymmetric RAO surface with untouched holdout'
          git push origin HEAD:tfg-rigorous-tuning
