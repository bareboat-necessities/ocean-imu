name: agent-fix-ou-robustness

on:
  push:
    branches:
      - agent/ou3-jonswap-sigma-band

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ou3-jonswap-sigma-band

      - name: Apply bounded sensitivity fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/ou_robustness.py")
          text = path.read_text(encoding="utf-8")
          old = '''def scaled_tuning_point(
              baseline: core.TuningPoint,
              parameter: str,
              scale: float,
          ) -> core.TuningPoint:
              if parameter not in SENSITIVITY_PARAMETERS:
                  raise ValueError(f"unknown sensitivity parameter: {parameter}")
              if not (math.isfinite(scale) and scale > 0.0):
                  raise ValueError("sensitivity scale must be positive and finite")
              if baseline.RS_ms is None:
                  raise ValueError("OU-III sensitivity requires an r_S tuning value")
              if parameter == "tau":
                  return replace(baseline, tau_s=baseline.tau_s * scale)
              if parameter == "sigma_aw":
                  return replace(baseline, sigma_a_mps2=baseline.sigma_a_mps2 * scale)
              if parameter == "r_s":
                  return replace(baseline, RS_ms=baseline.RS_ms * scale)
              if parameter == "sigma_aw_rs":
                  # r_S is linear in sigma_aw under the deployed law.
                  return replace(
                      baseline,
                      sigma_a_mps2=baseline.sigma_a_mps2 * scale,
                      RS_ms=baseline.RS_ms * scale,
                  )
              # tau_rs: r_S is cubic in tau under the deployed law.
              return replace(
                  baseline,
                  tau_s=baseline.tau_s * scale,
                  RS_ms=baseline.RS_ms * scale**3,
              )
          '''
          new = '''def _bound_tuning_point(point: core.TuningPoint) -> core.TuningPoint:
              """Apply the same hard parameter bounds as the deployed OU-III tuner."""
              if point.RS_ms is None:
                  raise ValueError("OU-III tuning point lacks r_S")
              return replace(
                  point,
                  tau_s=min(max(point.tau_s, TAU_BOUNDS_S[0]), TAU_BOUNDS_S[1]),
                  sigma_a_mps2=min(
                      max(point.sigma_a_mps2, SIGMA_AW_BOUNDS_MPS2[0]),
                      SIGMA_AW_BOUNDS_MPS2[1],
                  ),
                  RS_ms=min(max(point.RS_ms, R_S_BOUNDS_MS[0]), R_S_BOUNDS_MS[1]),
              )


          def scaled_tuning_point(
              baseline: core.TuningPoint,
              parameter: str,
              scale: float,
          ) -> core.TuningPoint:
              if parameter not in SENSITIVITY_PARAMETERS:
                  raise ValueError(f"unknown sensitivity parameter: {parameter}")
              if not (math.isfinite(scale) and scale > 0.0):
                  raise ValueError("sensitivity scale must be positive and finite")
              if baseline.RS_ms is None:
                  raise ValueError("OU-III sensitivity requires an r_S tuning value")
              if parameter == "tau":
                  point = replace(baseline, tau_s=baseline.tau_s * scale)
              elif parameter == "sigma_aw":
                  point = replace(baseline, sigma_a_mps2=baseline.sigma_a_mps2 * scale)
              elif parameter == "r_s":
                  point = replace(baseline, RS_ms=baseline.RS_ms * scale)
              elif parameter == "sigma_aw_rs":
                  # r_S is linear in sigma_aw under the deployed law.
                  point = replace(
                      baseline,
                      sigma_a_mps2=baseline.sigma_a_mps2 * scale,
                      RS_ms=baseline.RS_ms * scale,
                  )
              else:
                  # tau_rs: r_S is cubic in tau under the deployed law.
                  point = replace(
                      baseline,
                      tau_s=baseline.tau_s * scale,
                      RS_ms=baseline.RS_ms * scale**3,
                  )

              # Sensitivity multipliers are requests.  The deployed tuner applies
              # hard parameter bounds after the law, so a requested perturbation at
              # a boundary must be evaluated at the realized (clamped) point rather
              # than rejected before the replay starts.
              return _bound_tuning_point(point)
          '''
          if old not in text:
              raise SystemExit("scaled_tuning_point source block did not match")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("tests/validation/test_ou_robustness_bounds.py")
          test.write_text('''import sys\nimport unittest\nfrom pathlib import Path\n\nREPO_ROOT = Path(__file__).resolve().parents[2]\nsys.path.insert(0, str(REPO_ROOT / "tools"))\n\nimport ou_robustness as robustness  # noqa: E402\nimport ou_validation as validation  # noqa: E402\n\n\nclass RobustnessBoundTests(unittest.TestCase):\n    def test_requested_half_scale_realizes_r_s_floor(self):\n        baseline = validation.TuningPoint(\n            tau_s=1.2,\n            sigma_a_mps2=0.8,\n            RS_ms=0.65543,\n        )\n        point = robustness.scaled_tuning_point(\n            baseline, "sigma_aw_rs", 0.5\n        )\n        self.assertAlmostEqual(point.RS_ms, 0.4)\n        self.assertAlmostEqual(point.sigma_a_mps2, 0.4)\n        robustness.validate_tuning_point(point)\n\n    def test_tau_coupled_half_scale_also_respects_floor(self):\n        baseline = validation.TuningPoint(\n            tau_s=1.2,\n            sigma_a_mps2=0.8,\n            RS_ms=0.65543,\n        )\n        point = robustness.scaled_tuning_point(baseline, "tau_rs", 0.5)\n        self.assertAlmostEqual(point.tau_s, 0.6)\n        self.assertAlmostEqual(point.RS_ms, 0.4)\n        robustness.validate_tuning_point(point)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")

          Path(".github/workflows/agent-fix-ou-robustness.yml").unlink()
          PY

      - name: Verify focused validation tests
        run: |
          python3 -m py_compile tools/ou_robustness.py tests/validation/test_ou_robustness_bounds.py
          python3 -m unittest -v tests.validation.test_ou_robustness_bounds

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ou_robustness.py tests/validation/test_ou_robustness_bounds.py .github/workflows/agent-fix-ou-robustness.yml
          git commit -m "Respect OU robustness parameter bounds"
          git push origin HEAD:refs/heads/agent/ou3-jonswap-sigma-band
