name: finalize-provenance-migration-once

on:
  push:
    branches: [agent/harden-ou-evidence-provenance]

concurrency:
  group: finalize-provenance-migration-once
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/harden-ou-evidence-provenance
          fetch-depth: 0

      - name: Update documentation and provenance safety code
        run: |
          python3 tools/apply_provenance_docs_patch.py
          python3 tools/apply_provenance_safety_patch.py
          python3 -m py_compile \
            tools/ou_evidence_provenance.py \
            tools/ou_evidence_contract.py \
            tools/ou_validation.py \
            tools/ou_robustness.py

      - name: Record numerical evidence hashes before migration
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            reports/results/ou_validation/ou_validation_raw.csv \
            reports/results/ou_validation/ou_validation_summary.csv \
            reports/results/ou_validation/ou_validation_paired_effects.csv \
            reports/results/ou_robustness/ou_robustness_raw.csv \
            reports/results/ou_robustness/ou_robustness_summary.csv \
            reports/results/ou_robustness/ou_robustness_paired_effects.csv \
            > /tmp/ou-evidence-before.sha256
          cat /tmp/ou-evidence-before.sha256

      - name: Verify and migrate immutable historical replay provenance
        run: |
          python3 tools/ou_evidence_contract.py \
            --migrate-legacy \
            --study all \
            --replay-commit 5df1f3b42d3eb456961d12e598257b5859470451

      - name: Prove numerical evidence did not change
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/ou-evidence-before.sha256
          git diff --exit-code -- \
            reports/results/ou_validation/ou_validation_raw.csv \
            reports/results/ou_validation/ou_validation_summary.csv \
            reports/results/ou_validation/ou_validation_paired_effects.csv \
            reports/results/ou_robustness/ou_robustness_raw.csv \
            reports/results/ou_robustness/ou_robustness_summary.csv \
            reports/results/ou_robustness/ou_robustness_paired_effects.csv

      - name: Check migrated contract and title constraint
        run: |
          python3 tools/ou_evidence_contract.py --check --study validation
          python3 tools/ou_evidence_contract.py --check --study robustness
          grep -Ei '\\title\{.*navigation' doc/kalman_ou_iii/kalman_ou-w3d.tex

      - name: Commit permanent migration and remove one-shot helpers
        run: |
          set -euo pipefail
          rm tools/apply_provenance_docs_patch.py
          rm tools/apply_provenance_safety_patch.py
          rm .github/workflows/apply-provenance-docs-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ou-validation.md docs/ou-robustness.md \
                  doc/kalman_ou_iii/w3d-sim-charts.tex-part \
                  reports/results/ou_validation/PROVENANCE.md \
                  reports/results/ou_validation/ou_validation_manifest.json \
                  reports/results/ou_robustness/ou_robustness_manifest.json \
                  .github/workflows/ou-validation.yml \
                  tools/ou_evidence_provenance.py tools/ou_validation.py tools/ou_robustness.py \
                  tools/apply_provenance_docs_patch.py tools/apply_provenance_safety_patch.py \
                  .github/workflows/apply-provenance-docs-patch.yml
          git commit -m "Migrate OU evidence to immutable replay provenance"
          git push origin HEAD:refs/heads/agent/harden-ou-evidence-provenance
