name: ou3-p5-full-matrix-source-subdivision

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/ou3_p5_full_h_prefix_source_subdivision.py'
      - 'tools/ou3_p5_full_h_prefix_cells.py'
      - 'tools/ou3_p5_full_h_prefix_cells_v2.py'
      - 'tools/ou3_p5_full_h_prefix_cells_v3.py'
      - 'tests/validation/test_ou3_p5_full_h_prefix_source_subdivision.py'
      - '.github/workflows/ou3-p5-full-matrix-source-subdivision.yml'

jobs:
  semantics:
    name: P5 source subdivision semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile subdivision producer
        run: python3 -m py_compile tools/ou3_p5_full_h_prefix_source_subdivision.py
      - name: Test subdivision semantics
        run: python3 -m unittest discover -v -s tests/validation -p 'test_ou3_p5_full_h_prefix_source_subdivision.py'

  source-cell:
    name: P5 full-matrix source cell ${{ matrix.cell }}
    needs: semantics
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cell: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Emit full-matrix source child
        run: >-
          python3 tools/ou3_p5_full_h_prefix_source_subdivision.py
          --source-pieces 2
          --source-cell-index ${{ matrix.cell }}
          --output p5-source-cell-${{ matrix.cell }}.json
      - name: Upload source child
        uses: actions/upload-artifact@v6
        with:
          name: p5-source-cell-${{ matrix.cell }}
          path: p5-source-cell-${{ matrix.cell }}.json
          if-no-files-found: error

  aggregate:
    name: P5 source-complete aggregate
    needs: source-cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download source children
        uses: actions/download-artifact@v6
        with:
          pattern: p5-source-cell-*
          path: p5-source-cells
          merge-multiple: true
      - name: Aggregate source-complete certificate
        run: >-
          python3 tools/ou3_p5_full_h_prefix_source_subdivision.py
          --source-pieces 2
          --aggregate-dir p5-source-cells
          --output p5-full-h-source-subdivision.json
      - name: Upload aggregate
        uses: actions/upload-artifact@v6
        with:
          name: p5-full-h-source-subdivision
          path: p5-full-h-source-subdivision.json
          if-no-files-found: error
