name: ou3-p4-joint-estimator-relation

on:
  push:
    branches: [main, 'codex/ou3-p4-joint-estimator-transition']
    paths: &paths
      - 'src/**'
      - 'tools/stability/**'
      - '.github/workflows/ou3-p4-joint-estimator-relation.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-joint-estimator-relation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check proof source syntax
        run: python -m compileall -q tools/stability
      - name: Execute same-signal estimator, event master, and lineage relation
        run: |
          set -euo pipefail
          mkdir -p /tmp/ou3-p4-relation-evidence
          python tools/stability/ou3_validated_positive_transcendentals.py
          python tools/stability/ou3_p4_joint_estimator_transition.py --output /tmp/ou3-p4-relation-evidence/joint-estimator.json
          python tools/stability/ou3_p4_brmm_same_signal_statistics.py --output /tmp/ou3-p4-relation-evidence/same-signal-statistics.json
          python tools/stability/ou3_brmm_sigma_stillness_step.py --output /tmp/ou3-p4-relation-evidence/sigma-stillness.json
          python tools/stability/ou3_p4_brmm_tuner_stillness_transition.py --output /tmp/ou3-p4-relation-evidence/tuner-stillness.json
          python tools/stability/ou3_p4_joint_brmm_frontend_transition.py --output /tmp/ou3-p4-relation-evidence/joint-brmm-frontend.json
          python tools/stability/ou3_p4_complete_brmm_universal_target_relation.py --output /tmp/ou3-p4-relation-evidence/target-relation.json
          python tools/stability/ou3_p4_complete_brmm_source_cover_contract.py --output /tmp/ou3-p4-relation-evidence/source-cover-contract.json
          python tools/stability/ou3_p4_brmm_reduced_event_master.py --output /tmp/ou3-p4-relation-evidence/reduced-event-master.json
          python tools/stability/ou3_p4_brmm_event_lineage_cover.py --output /tmp/ou3-p4-relation-evidence/event-lineage-cover.json
          python - <<'PY'
          import json
          root='/tmp/ou3-p4-relation-evidence/'
          j=json.load(open(root+'joint-estimator.json'))
          q=json.load(open(root+'same-signal-statistics.json'))
          s=json.load(open(root+'sigma-stillness.json'))
          t=json.load(open(root+'tuner-stillness.json'))
          b=json.load(open(root+'joint-brmm-frontend.json'))
          u=json.load(open(root+'target-relation.json'))
          c=json.load(open(root+'source-cover-contract.json'))
          m=json.load(open(root+'reduced-event-master.json'))
          l=json.load(open(root+'event-lineage-cover.json'))
          for name,obj in [('joint',j),('stats',q),('stillness',s),('tuner',t),('brmm',b),('target',u),('cover',c),('event-master',m),('lineage',l)]:
              assert obj['validation_pass'], (name,obj.get('validation_failures'))

          # Period and sigma are generated by the same physical signal history.
          assert j['same_signal_wave_period_and_band_state_materialized']
          assert j['exact_same_history_central_moment_ghost_recurrence_materialized']
          assert j['period_variance_uses_central_ghost_not_detached_subtraction']
          assert j['sigma_variance_uses_central_ghost_not_detached_subtraction']
          assert j['central_moment_nonnegative_by_construction']
          assert j['raw_period_and_canonical_log_period_relation_materialized']
          assert j['frequency_derived_as_exp_minus_canonical_log_period']
          assert j['adaptive_band_previous_tuner_frequency_lag_materialized']
          assert j['band_noise_p11_subtraction_materialized']
          assert j['joint_f_tau_sigma_TS_RS_image_materialized']
          assert not j['independent_f_sigma_rectangle_accepted_by_transition']

          assert q['same_signal_central_WPE_velocity_variance_materialized']
          assert q['same_signal_central_WPE_elevation_variance_materialized']
          assert q['same_signal_central_tuner_band_variance_materialized']
          assert q['previous_estimated_WPE_frequency_drives_current_tuner_target']
          assert q['sigma_uses_same_band_signal_and_p11_noise_subtraction']
          assert q['tau_TS_RS_are_dependent_images_of_estimated_f_sigma']
          assert q['independent_period_sigma_parameters_forbidden']

          assert s['same_vertical_sample_drives_lpf_energy_and_sigma_attenuation']
          assert t['same_history_still_attenuation_enters_before_variance_floor']
          assert b['same_private_Mahony_vertical_drives_stillness_tuner_and_WPE']
          assert b['period_and_sigma_generated_by_same_signal_statistics']
          assert b['central_variance_companion_consumed']
          assert b['central_numerators_retained_nonnegative']
          assert not b['detached_first_second_variance_may_drive_theorem_target']
          assert b['current_Riccati_active_schedule_precedes_current_measurement']
          assert b['actual_applied_RS_xyz_retained_from_same_active_schedule']

          assert u['same_BRMM_sample_joint_frontend_transition_materialized']
          assert u['same_BRMM_current_applied_schedule_retained']
          assert not u['coefficient_target_inclusion_closed']
          assert c['theorem_cell_coefficients_must_come_from_joint_estimator_image']
          assert c['estimator_ancestry_distinct_from_literal_event_ancestry']
          assert c['multiple_literal_events_may_share_one_estimator_image']
          assert c['free_tau_sigma_constructor_for_theorem_forbidden']
          assert c['S_zero_R_derived_from_same_active_schedule']

          # The real event base master uses same-cell P/H/R/K. q=He+eta and
          # d=Kq are substituted algebraically, so independent K/q/d boxes
          # cannot re-enter the prefix proof.
          assert m['same_cell_P_H_R_K_consumed']
          assert m['prior_precision_derived_from_same_P']
          assert m['R_inverse_derived_from_same_R']
          assert m['q_equals_H_e_plus_eta_substituted_exactly']
          assert m['d_equals_same_cell_K_q_substituted_exactly']
          assert m['real_reduced_event_master_materialized']
          assert not m['independent_K_coordinate_or_box_used']
          assert not m['independent_q_port_used']
          assert not m['independent_d_port_used']
          assert not m['reset_b_independent_norm_port_used']

          # Continuous hard-entry radial scale is covered by intervals, not a grid.
          assert l['continuous_radial_coordinate_retained']
          assert l['radial_root_is_closed_unit_interval']
          assert l['binary_refinement_children_union_exact_parent']
          assert l['recursive_partition_exactly_covers_unit_interval']
          assert l['radial_point_sampling_forbidden']
          assert l['estimator_owned_event_lineage_smoke_pass']
          assert l['reachable_covariance_event_continuity_smoke_pass']
          assert l['real_exact_chord_signed_master_prerequisite_consumed']
          assert l['real_joint_sector_master_builder_consumed']
          assert l['physical_BIAS1_ISS_supply_consumed']
          assert l['binary32_Kalman_reset_ISS_consumed']
          assert not l['synthetic_identity_master_may_promote']
          assert not l['production_same_history_event_master_maps_materialized_here']

          for obj in (j,q,b,m,l):
              assert not obj['P4_MOTION_PASS'] and not obj['P4_PASS'] and not obj['P5_MAY_START']
          assert not c['P4_promoted_here']
          print('SAME_SIGNAL_ESTIMATOR_REAL_EVENT_MASTER_AND_LINEAGE_PASS')
          PY
      - name: Retain exact PR source and relation evidence
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/ou3-p4-relation-evidence/source-commit.txt
          git archive --format=tar.gz HEAD > /tmp/ou3-p4-relation-evidence/proof-sources.tar.gz
          sha256sum /tmp/ou3-p4-relation-evidence/proof-sources.tar.gz > /tmp/ou3-p4-relation-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ou3-p4-relation-evidence
          path: /tmp/ou3-p4-relation-evidence/
          if-no-files-found: error
