name: calibration validation
on:
  push:
    branches: [fix/calibration-thermal-magnetic-safety]
permissions:
  contents: write
concurrency:
  group: calibration-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preserve transfer for checksum diagnostics
        run: tar -czf /tmp/calibration-transfer.tar.gz .calibration-transfer.*
      - name: Apply checksum-verified calibration patch and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          text = ''.join(Path(f'.calibration-transfer.{i}').read_text().strip() for i in range(3))
          # Correct a transcription insertion; the SHA below remains authoritative.
          text = text.replace('7Xrx6eUsGL5NF', '7Xrx6UsGL5NF')
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'dc04fb41039f058e1fd306202211b7cd52cdc505aab0c688f956201beef8bf42'
          Path('/tmp/calibration.patch').write_bytes(patch)
          PY
          git diff --quiet dd59cf822f879c6e1769a28c87c72cd7346c826f HEAD -- src sensors tests docs
          git apply --check /tmp/calibration.patch
          git apply /tmp/calibration.patch
          git rm .calibration-transfer.0 .calibration-transfer.1 .calibration-transfer.2 .github/workflows/calibration-validation.yml
          git add src sensors tests docs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix gyro thermal qualification, registered-frame magnetometer calibration and capture safety'
          git push origin HEAD:fix/calibration-thermal-magnetic-safety
          git rev-parse HEAD | tee /tmp/calibration-tested-commit.txt
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libeigen3-dev python3-numpy python3-scipy python3-pandas python3-matplotlib
      - name: Focused calibration suite
        shell: bash
        run: |
          set -euo pipefail
          { make -C tests/imu_calibrate build; (cd tests/imu_calibrate && bash -e run_tests.sh); } 2>&1 | tee /tmp/calibration-focused.log
      - name: Repository-required make all
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          make all 2>&1 | tee /tmp/calibration-make-all.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-validation-evidence
          path: |
            /tmp/calibration-transfer.tar.gz
            /tmp/calibration-tested-commit.txt
            /tmp/calibration-focused.log
            /tmp/calibration-make-all.log
          retention-days: 14
