name: ou3-p4-30deg-signed-first-accel

on:
  push:
    paths:
      - "tools/ou3_p4_30deg_signed_first_accel_sector.py"
      - "tools/ou3_p4_candidate_aw_capture_budget.py"
      - "tools/ou3_p4_candidate_first_accel_range_v3.py"
      - "tools/ou3_p4_operation_matched_sector_certificate.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-30deg-signed-first-accel.yml"
  pull_request:
    paths:
      - "tools/ou3_p4_30deg_signed_first_accel_sector.py"
      - "tools/ou3_p4_candidate_aw_capture_budget.py"
      - "tools/ou3_p4_candidate_first_accel_range_v3.py"
      - "tools/ou3_p4_operation_matched_sector_certificate.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-30deg-signed-first-accel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-30deg-signed-first-accel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-first-accel:
    name: signed 30deg first accelerometer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Compile signed sector producer
        run: python3 -m py_compile tools/ou3_p4_30deg_signed_first_accel_sector.py
      - name: Evaluate signed source-complete 30deg family
        run: |
          rc=0
          python3 tools/ou3_p4_30deg_signed_first_accel_sector.py \
            --source-pieces 2 --alignment-pieces 16 --force-magnitude-pieces 4 --tangent-pieces 32 \
            --output /tmp/ou3_p4_30deg_signed_first_accel.json || rc=$?
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_p4_30deg_signed_first_accel.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['candidate_angle_deg']==30.0
          assert d['declared_startup_aw_error_fraction_g']==0.3
          assert d['accelerometer_yaw_contraction_assumed'] is False
          assert d['axial_yaw_cross_gain_retained'] is True
          assert d['JOSEPH_RESET_COVARIANCE_PROPAGATED_HERE'] is False
          assert d['P4_COMPLETE_WORD_DISSIPATION_ESTABLISHED_HERE'] is False
          assert d['P4_USABLE_CERTIFICATE_PROMOTED'] is False
          print('P4_30DEG_SIGNED_FIRST_ACCEL',
                'status',d['P4_30DEG_SIGNED_FIRST_ACCEL_SECTOR_CERTIFICATE'],
                'qpre',d['post_prediction_q_upper'],
                'qplus',d['max_accepted_or_rejected_post_update_q_upper'],
                'outer',d['operation_matched_outer_q_upper'],
                'dmax',d['max_correction_norm_upper_rad'],
                'min_den',d['minimum_signed_composition_denominator_lower'],
                'evaluated',d['evaluated_children'],
                'first_failure',d['first_failure'])
          print('next',d['next_obligation'])
          PY
          echo "producer_exit=$rc"
