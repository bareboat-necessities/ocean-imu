name: ou3-alt-contraction

on:
  push:
    paths:
      - "tools/stability/ou3_alt_contraction/**"
      - "tests/ou3_alt_contraction/**"
      - "docs/ou3-alt-contraction.md"
      - "docs/ou3-alt-contraction-handover.md"
      - "docs/ou3-alt-finite-core-composition.md"
      - "docs/ou3-alt-finite-measurement-proof.md"
      - "docs/ou3-alt-runtime-primitives.md"
      - "docs/ou3-alt-proof-plan.md"
      - "docs/ou3-proof-research-state.md"
      - ".github/workflows/ou3-alt-contraction.yml"
  pull_request:
    paths:
      - "tools/stability/ou3_alt_contraction/**"
      - "tests/ou3_alt_contraction/**"
      - "docs/ou3-alt-contraction.md"
      - "docs/ou3-alt-contraction-handover.md"
      - "docs/ou3-alt-finite-core-composition.md"
      - "docs/ou3-alt-finite-measurement-proof.md"
      - "docs/ou3-alt-runtime-primitives.md"
      - "docs/ou3-alt-proof-plan.md"
      - "docs/ou3-proof-research-state.md"
      - ".github/workflows/ou3-alt-contraction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-alt-contraction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  algebra-regressions:
    name: Full inherited ALT regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install proof-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-scipy python3-mpmath
      - name: Run the full ALT suite without weakening shared prerequisites
        run: |
          set -o pipefail
          export PYTHONPATH="$PWD:$PWD/tools/stability:$PWD/tests/ou3_alt_contraction"
          python3 -m unittest discover -s tests/ou3_alt_contraction -v 2>&1 | tee /tmp/ou3-alt-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ou3-alt-tests-${{ github.run_id }}
          path: /tmp/ou3-alt-tests.log
          if-no-files-found: warn
          retention-days: 14

  finite-physical-identities:
    name: Finite physical identities (not stability qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install correspondence-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libeigen3-dev python3-numpy time
      - name: Prove finite algebra and test anti-promotion guards
        run: |
          export PYTHONPATH="$PWD:$PWD/tools/stability:$PWD/tests/ou3_alt_contraction"
          python3 -m unittest test_finite_physical_prediction \
            test_finite_measurement_graph test_finite_covariance_rank3 test_finite_core \
            test_finite_prediction_covariance test_finite_ou_runtime_primitives \
            test_finite_attitude_runtime test_finite_qaxis_runtime \
            test_finite_accel_guard_runtime test_finite_sensor_source_runtime \
            test_finite_racc_runtime test_finite_held_accel_runtime \
            test_finite_prediction_runtime test_finite_post_prediction \
            test_finite_measurement_runtime test_finite_vertical_complementary_runtime \
            test_finite_frontend_runtime test_finite_frontend_prefix \
            test_finite_guarded_tuner_prefix test_finite_wpe_runtime \
            test_finite_band_variance_runtime test_finite_stillness_runtime \
            test_finite_tuner_stillness_projection test_finite_tuner_candidate \
            test_finite_tuner_projection_bridge test_finite_tuner_frontend_prefix \
            test_finite_tuner_commit test_finite_tuner_boundary_commit \
            test_finite_runtime_parameters test_finite_active_runtime_word \
            test_shipping_finite_identity test_core test_proof_plan test_bias_families -v
      - name: Verify actual shipping event correspondence without source promotion
        run: |
          python3 tools/stability/ou3_alt_contraction/shipping_finite_identity.py \
            --output /tmp/ou3-alt-finite-identity.json
      - name: Benchmark exact masked rank-three covariance arithmetic
        run: |
          python3 tools/stability/ou3_alt_contraction/benchmark_finite_rank3.py \
            --output /tmp/ou3-alt-rank3.json
      - name: Keep all theorem and storage-readiness results fail-closed
        run: |
          python3 - <<'PYCODE'
          import json
          for path in ('/tmp/ou3-alt-finite-identity.json', '/tmp/ou3-alt-rank3.json'):
              report = json.load(open(path))
              for gate in ('ALT_LIVE_PASS', 'ALT_STARTUP_PASS', 'ALT_END_TO_END_PASS'):
                  assert report[gate] is False, (path, gate)
          report = json.load(open('/tmp/ou3-alt-finite-identity.json'))
          assert report['source_uniform_word_qualified'] is False
          assert report['storage_feasibility_attempted'] is False
          assert report['recorded_sample_states_bit_identical'] is True
          assert report['deployment_roundoff_enclosed'] is False
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ou3-alt-finite-identities-${{ github.run_id }}
          path: |
            /tmp/ou3-alt-finite-identity.json
            /tmp/ou3-alt-rank3.json
          if-no-files-found: warn
          retention-days: 14
