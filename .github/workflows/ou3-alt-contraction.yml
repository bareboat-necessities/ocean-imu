name: ou3-alt-contraction

on:
  push:
    paths:
      - "src/kalman_ou_iii/SeaStateFusionFilter_OU_III.h"
      - "src/tuner/MagAutoTuner.h"
      - "tools/stability/ou3_alt_contraction/**"
      - "tests/ou3_alt_contraction/**"
      - "docs/ou3-alt-contraction.md"
      - "docs/ou3-alt-main-handover.md"
      - "docs/ou3-alt-live-magnetic-word.md"
      - "docs/ou3-alt-source-continuation.md"
      - "docs/ou3-alt-contraction-handover.md"
      - "docs/ou3-alt-finite-core-composition.md"
      - "docs/ou3-alt-finite-measurement-proof.md"
      - "docs/ou3-alt-runtime-primitives.md"
      - "docs/ou3-alt-mahony-binary32.md"
      - "docs/ou3-alt-proof-plan.md"
      - "docs/ou3-alt-word-rho-feasibility.md"
      - "docs/ou3-proof-research-state.md"
      - ".github/workflows/ou3-alt-contraction.yml"
  pull_request:
    paths:
      - "src/kalman_ou_iii/SeaStateFusionFilter_OU_III.h"
      - "src/tuner/MagAutoTuner.h"
      - "tools/stability/ou3_alt_contraction/**"
      - "tests/ou3_alt_contraction/**"
      - "docs/ou3-alt-contraction.md"
      - "docs/ou3-alt-main-handover.md"
      - "docs/ou3-alt-live-magnetic-word.md"
      - "docs/ou3-alt-source-continuation.md"
      - "docs/ou3-alt-contraction-handover.md"
      - "docs/ou3-alt-finite-core-composition.md"
      - "docs/ou3-alt-finite-measurement-proof.md"
      - "docs/ou3-alt-runtime-primitives.md"
      - "docs/ou3-alt-mahony-binary32.md"
      - "docs/ou3-alt-proof-plan.md"
      - "docs/ou3-alt-word-rho-feasibility.md"
      - "docs/ou3-proof-research-state.md"
      - ".github/workflows/ou3-alt-contraction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-alt-contraction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  algebra-regressions:
    name: Full inherited ALT regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install proof-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-scipy python3-mpmath
      - name: Run the full ALT suite without weakening shared prerequisites
        run: |
          set -o pipefail
          export PYTHONPATH="$PWD:$PWD/tools/stability:$PWD/tests/ou3_alt_contraction"
          python3 -m unittest discover -s tests/ou3_alt_contraction -v 2>&1 | tee /tmp/ou3-alt-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ou3-alt-tests-${{ github.run_id }}
          path: /tmp/ou3-alt-tests.log
          if-no-files-found: warn
          retention-days: 14

  finite-physical-identities:
    name: Finite physical identities (not stability qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OU3_ALT_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Retain exact source snapshot for independent correspondence checks
        run: |
          git archive --format=tar.gz --output=/tmp/ou3-alt-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ou3-alt-source-${{ github.run_id }}
          path: /tmp/ou3-alt-source.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Install correspondence-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libeigen3-dev python3-numpy time
      - name: Prove finite algebra and test anti-promotion guards
        run: |
          export PYTHONPATH="$PWD:$PWD/tools/stability:$PWD/tests/ou3_alt_contraction"
          python3 -m unittest test_finite_physical_prediction \
            test_finite_brmm_moment_prefix test_finite_complete_brmm_restriction test_finite_source_continuation test_finite_source_bound_live_word \
            test_finite_bias_history_restriction test_finite_admitted_startup_origin \
            test_finite_admitted_source_live_word test_finite_admitted_source_imu_word \
            test_finite_admitted_imu_disturbance test_finite_admitted_disturbance_imu_word \
            test_finite_admitted_source_mag_word test_finite_admitted_interleaved_prefix test_finite_admitted_iss_interleaved_prefix test_finite_admitted_runtime_word \
            test_finite_wrapper_clock_binary32 test_finite_magnetic_wrapper_clock test_finite_indefinite_runtime_obstruction \
            test_finite_source_origin_interleave test_finite_source_bound_prediction_word test_finite_source_bound_imu_forcing test_finite_source_bound_mag_forcing \
            test_finite_measurement_graph test_finite_covariance_rank3 test_finite_core \
            test_finite_prediction_covariance test_finite_ou_runtime_primitives \
            test_finite_attitude_runtime test_finite_source_bound_attitude_trig test_finite_qaxis_runtime \
            test_finite_qaxis_binary32_branch test_finite_qaxis_exp_binary32 test_finite_binary32_arithmetic \
            test_finite_accel_guard_runtime test_finite_sensor_source_runtime \
            test_finite_racc_runtime test_finite_held_accel_runtime \
            test_finite_prediction_runtime test_finite_post_prediction \
            test_finite_periodic_aw_sync test_finite_measurement_runtime \
            test_finite_vertical_complementary_runtime test_finite_binary32_mahony \
            test_finite_binary32_mahony_startup test_finite_startup_joined_machine_history \
            test_finite_startup_entry_obstruction test_finite_startup_disturbance_obstruction \
            test_finite_startup_sensor_contract test_finite_mahony_prefix_totality \
            test_finite_seed_svd_axis_reduction test_finite_seed_eigen_svd test_finite_seed_svd_roundoff test_finite_startup_direction_sampling \
            test_finite_startup_timeout_alignment_obstruction test_finite_live_input_contract test_target_libm_bounds test_target_wpe_compiler test_target_deployment_audits \
            test_finite_frontend_uniform_bounds test_finite_candidate_uniform_bounds test_finite_bg_gain_energy test_finite_machine_startup_core \
            test_finite_live_disturbance_overflow test_finite_machine_core_continuation \
            test_finite_startup_handoff_control test_finite_master_guard \
            test_finite_attitude_atlas test_finite_ungauged_live_word \
            test_finite_frontend_runtime test_finite_frontend_prefix \
            test_finite_guarded_tuner_prefix test_finite_wpe_runtime test_finite_wpe_output_ancestry \
            test_finite_band_variance_runtime test_finite_stillness_runtime \
            test_finite_tuner_stillness_projection test_finite_tuner_candidate \
            test_finite_tuner_projection_bridge test_finite_tuner_frontend_prefix \
            test_finite_tuner_frequency_binary32 test_finite_tuner_tau_binary32 \
            test_finite_wpe_moment_binary32 test_finite_wpe_usable_binary32 \
            test_finite_wpe_machine_binary32 test_finite_wpe_frequency_binary32 test_finite_wpe_uniform_bounds \
            test_finite_startup_wpe_machine_history test_finite_admitted_wpe_machine_clock_interleaved_prefix \
            test_finite_shipping_tau_target_binary32 test_finite_tuner_tau_roundoff_bound \
            test_finite_tuner_tau_600_domain test_finite_complete_word_tau_qualification \
            test_finite_tuner_tau_deployment_ledger \
            test_finite_tuner_spectral_binary32 test_finite_tuner_qeff_cache_binary32 \
            test_finite_tuner_deployment_config test_finite_tuner_spectral_machine_real_join \
            test_finite_tuner_rs_alpha_binary32 test_finite_tuner_rs_alpha_machine_real_join \
            test_finite_tuner_rs_alpha_conditional_bound test_finite_tuner_rs_ema_binary32 \
            test_finite_tuner_rs_ema_compiler_modes test_finite_tuner_rs_ema_machine_real_join \
            test_finite_tuner_rs_commit_binary32 \
            test_finite_tuner_commit test_finite_tuner_boundary_commit \
            test_finite_runtime_parameters test_finite_active_runtime_word \
            test_finite_live_imu_prefix test_finite_tilt_watchdog \
            test_finite_tilt_reset_runtime test_finite_live_tilt_prefix \
            test_finite_mag_bias_gate test_finite_mag_counter_saturation test_finite_mag_runtime \
            test_finite_mag_reference_runtime test_finite_mag_reference_events \
            test_finite_mag_accumulator test_finite_mag_gauge_fix test_finite_mag_tilt_frame \
            test_finite_mag_tuner_default test_finite_mag_gravity_gate \
            test_finite_mag_startup_prefix test_finite_mag_startup_source \
            test_finite_mag_startup_physical_bridge test_finite_mag_startup_word \
            test_finite_mag_source_qualification test_finite_mag_startup_capture_bound \
            test_finite_startup_handoff_seed test_finite_startup_handoff_init \
            test_finite_startup_live_entry test_finite_fresh_joint24_entry \
            test_finite_startup_live_runtime_bridge test_finite_startup_first_live_step \
            test_finite_mag_call_schedule test_finite_h18_a21_reachability \
            test_finite_h18_a21_transition test_finite_live_async_mag \
            test_finite_continuous_mag_runtime test_finite_live_magnetic_word \
            test_finite_live_interleave test_finite_source_bound_mag_dual_clock \
            test_physical_lineage_event_paths \
            test_shipping_finite_identity test_core test_proof_plan test_bias_families -v
          python3 -m unittest \
            test_finite_tuner_rs_deployment_ledger test_finite_tuner_rs_boundary_deployment \
            test_finite_tuner_sigma_binary32 test_finite_tuner_common_alpha_qualification \
            test_finite_tuner_sigma_deployment_ledger test_finite_tuner_machine_tunestate_product \
            test_finite_tuner_machine_boundary_commit \
            test_finite_band_coefficients_binary32 test_finite_band_binary32_contraction \
            test_finite_band_machine_ledger test_finite_band_noise_floor_binary32 \
            test_finite_stats_binary32_runtime test_finite_machine_frontend_sigma_source \
            test_finite_stillness_sigma_binary32 test_finite_sigma_target_machine_source -v
      - name: Verify actual shipping event correspondence without source promotion
        run: |
          python3 tools/stability/ou3_alt_contraction/shipping_finite_identity.py \
            --output /tmp/ou3-alt-finite-identity.json
      - name: Verify native preserve-yaw reset correspondence
        run: |
          python3 tools/stability/ou3_alt_contraction/shipping_tilt_reset_identity.py \
            --output /tmp/ou3-alt-tilt-reset-identity.json
      - name: Benchmark exact masked rank-three covariance arithmetic
        run: |
          python3 tools/stability/ou3_alt_contraction/benchmark_finite_rank3.py \
            --output /tmp/ou3-alt-rank3.json
      - name: Keep all theorem and storage-readiness results fail-closed
        run: |
          PYTHONPATH="$PWD:$PWD/tools/stability" python3 -m tools.stability.ou3_alt_contraction.finite_master_guard \
            --output /tmp/ou3-alt-pre-rho.json
          python3 - <<'PYCODE'
          import json
          for path in ('/tmp/ou3-alt-finite-identity.json',
                       '/tmp/ou3-alt-tilt-reset-identity.json',
                       '/tmp/ou3-alt-rank3.json'):
              report = json.load(open(path))
              for gate in ('ALT_LIVE_PASS', 'ALT_STARTUP_PASS', 'ALT_END_TO_END_PASS'):
                  assert report[gate] is False, (path, gate)
          report = json.load(open('/tmp/ou3-alt-finite-identity.json'))
          assert report['source_uniform_word_qualified'] is False
          assert report['storage_feasibility_attempted'] is False
          assert report['recorded_sample_states_bit_identical'] is True
          assert report['deployment_roundoff_enclosed'] is False
          tilt = json.load(open('/tmp/ou3-alt-tilt-reset-identity.json'))
          assert tilt['same_shipping_header_executed'] is True
          assert tilt['all_input_libm_binary32_correspondence_qualified'] is False
          assert tilt['source_uniform_word_qualified'] is False
          assert tilt['storage_feasibility_attempted'] is False
          assert tilt['deployment_roundoff_enclosed'] is False
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ou3-alt-finite-identities-${{ github.run_id }}
          path: |
            /tmp/ou3-alt-finite-identity.json
            /tmp/ou3-alt-tilt-reset-identity.json
            /tmp/ou3-alt-rank3.json
            /tmp/ou3-alt-pre-rho.json
          if-no-files-found: warn
          retention-days: 14

  complete-word-rho-feasibility:
    name: Complete-word rho feasibility (non-promoting diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libeigen3-dev python3-numpy python3-mpmath
      - name: Test the diagnostic and its anti-promotion guards
        run: |
          export PYTHONPATH="$PWD:$PWD/tools/stability:$PWD/tests/ou3_alt_contraction"
          python3 -m unittest test_finite_word_rho_diagnostic test_proof_plan \
            test_carried_storage_rho_diagnostic test_informative_superword_rho_diagnostic test_finite_startup_trap test_informative_service_theorem test_nonuniform_capture_theorem -v
          python3 -m unittest tests.validation.test_ou3_p4_complete_brmm_source_cover_envelope -v
      - name: Measure prescribed storage on carried native magnetic histories
        run: |
          PYTHONPATH="$PWD:$PWD/tools/stability" python3 -m \
            tools.stability.ou3_alt_contraction.carried_storage_rho_diagnostic \
            --work /tmp/ou3-alt-carried-storage \
            --output /tmp/ou3-alt-carried-storage-rho.json
      # The obstruction is established per sample and composes by induction, so
      # a 1 s word protects it.  The canonical 3 s measurement in
      # docs/ou3-alt-word-rho-feasibility.md is a recorded research artifact,
      # run standalone; reproducing it here would cost most of an hour to
      # re-derive numbers that are not a gate.
      - name: Measure the word rho floor in both modes
        run: |
          PYTHONPATH="$PWD:$PWD/tools/stability" python3 \
            tools/stability/ou3_alt_contraction/finite_word_rho_diagnostic.py \
            --samples 200 --output /tmp/ou3-alt-word-rho.json
      - name: Keep the measurement non-promoting and retain the falsification
        run: |
          python3 - <<'PYCODE'
          import json
          report = json.load(open('/tmp/ou3-alt-word-rho.json'))
          assert report['validation_failures'] == [], report['validation_failures']
          for gate in ('storage_search_allowed', 'ALT_LIVE_PASS',
                       'ALT_STARTUP_PASS', 'ALT_END_TO_END_PASS'):
              assert report[gate] is False, gate
          # The ungauged legal word must still show the metric-independent
          # obstruction; silently losing it would hide a theorem failure.
          assert report['declared_joint24_contraction_falsified'] is True
          assert report['failure_classification'] == 'theorem_failure'
          assert report['rho_floor_source'] == 'exact_unipotent_subspace_algebra'
          assert report['rho_floor_over_legal_words'] == 1.0
          for mode, row in report['per_sample_unipotent_induction'].items():
              assert row['length_independent'] is True, mode
          # Both modes must still show the obstruction at full joint24 width.
          for mode in ('H', 'A'):
              quiet = report['words'][mode + ':quiet_ungauged']['ungauged_yaw_certificate']
              assert quiet['subspace_is_exactly_invariant'] is True, mode
              assert quiet['worst_row_leak_outside_block'] == 0.0, mode
              assert quiet['worst_column_leak_outside_block'] == 0.0, mode
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ou3-alt-word-rho-${{ github.run_id }}
          path: |
            /tmp/ou3-alt-word-rho.json
            /tmp/ou3-alt-carried-storage-rho.json
          if-no-files-found: warn
          retention-days: 14
