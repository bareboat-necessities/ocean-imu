name: ou3-p4-entry-relation-and-classification

on:
  push:
    branches: [main]
    paths: &paths
      # Recursive: these producers import many other stability modules
      # (tuner/scheduler step, interval and transcendental primitives, the
      # correlated entry relation), and a change to any of them can leave
      # this gate stale if only the named files trigger it.
      - 'tools/stability/**'
      - 'reports/results/rao_stability/entry-block-retention.json'
      - 'tests/validation/test_ou3_p4_attitude_measurement_cap.py'
      - 'tests/validation/test_ou3_p4_correlated_entry_relation.py'
      - 'tests/validation/test_ou3_p4_blocker_falsification_classification.py'
      - '.github/workflows/ou3-p4-entry-relation-and-classification.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-entry-relation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entry-relation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the attitude measurement cap and its refutation
        run: python3 tools/stability/ou3_p4_attitude_measurement_cap.py --output /tmp/attitude-cap.json
      - name: Build the correlated integral entry relation
        run: python3 tools/stability/ou3_p4_correlated_entry_relation.py --output /tmp/entry-relation.json
      - name: Build the A-E blocker falsification classification
        run: python3 tools/stability/ou3_p4_blocker_falsification_classification.py --output /tmp/blocker-classification.json
      - name: Enforce fail-closed entry/classification semantics
        run: |
          python3 - <<'PY'
          import json
          capm=json.load(open('/tmp/attitude-cap.json'))
          rel=json.load(open('/tmp/entry-relation.json'))
          cls=json.load(open('/tmp/blocker-classification.json'))
          assert capm['validation_pass'],capm['validation_failures']
          # The prior-independent transverse attitude cap is RETRACTED. It is false
          # for the deployed residual, which carries the latent-acceleration and bias
          # blocks alongside attitude. This gate exists so it cannot come back.
          assert capm['prior_independent_transverse_cap_holds_for_the_deployed_filter'] is False
          assert capm['refutation']['refutation_is_outside_the_noise_floor'] is True
          assert capm['cap_closes_the_correction_reset_domain'] is False
          assert capm['envelope_shown_to_be_loose_by_this_argument'] is False
          assert capm['one_shot_information_route_is_a_dead_end_for_the_correction_domain'] is True
          sw=capm['sweep']
          assert sw['violations']==0,sw
          assert sw['max_achieved_over_bound']<=1.0
          assert sw['max_achieved_over_bound']>=capm['conditional_bound_tightness_floor']
          print('SWEEP_KEPT',sw['numerically_valid_cases_kept'],
                'REJECTED',sw['ill_conditioned_cases_rejected'],
                'VIOLATIONS',sw['violations'],
                'MAX_ACHIEVED_OVER_BOUND',sw['max_achieved_over_bound'])
          print('REFUTED_CAP_RAD2',capm['prior_independent_transverse_cap_claimed'],
                'ACHIEVED',capm['refutation']['achieved_transverse_attitude_marginal'],
                'CONDITIONAL_CAP_RAD2',capm['conditional_transverse_cap_rad2'])
          assert rel['validation_pass'],rel['validation_failures']
          assert cls['validation_pass'],cls['validation_failures']

          # The relation may never shrink the declared entry set, replay-fit it,
          # or borrow a covariance-confidence ellipsoid, and may never be
          # consumed by the promotion gate while it stays conditional.
          for k in ('declared_domain_shrunk','entry_radii_reduced_here','trajectory_replay_used',
                    'covariance_confidence_ellipsoid_used','P5_capture_assumed',
                    'entry_relation_consumed_by_final_gate','P4_promoted_here'):
              assert rel[k] is False,k
          assert rel['error_obeys_same_row_exactly']
          assert rel['unconditional_entry_anchor_requires_P5_or_reachable_P_SS_lower_bound']
          # The deployed S=0 regulation is a non-expansion but is not a uniform
          # anchor; if that ever changes it must be proved, not assumed here.
          assert rel['S_zero_regulation']['weighted_non_expansion_always_holds']
          assert rel['S_zero_gives_uniform_anchor_without_dwell'] is False
          # The declared independent ball must keep failing the chart threshold
          # while the correlated one-cadence relation meets it.
          assert rel['declared_radius_meets_chart_threshold'] is False
          assert rel['one_cadence_relation_meets_chart_threshold'] is True

          # Only class A or a rigorous class B may support unprovability.
          assert cls['counterexample_class_A_found'] is False
          assert cls['rigorous_infeasibility_class_B_established'] is False
          assert cls['P4_unprovable_on_declared_domain_supported'] is False
          assert cls['frozen_map_diagnostic_promoted_to_lower_bound'] is False
          assert cls['diagnostic_4p5788_treated_as_counterexample'] is False
          assert not cls['P4_MOTION_PASS'] and not cls['P4_PASS'] and not cls['P5_MAY_START']
          fp=cls['finite_precision']
          assert fp['conditional_mathematical_binary32_additive_ISS_closed']
          assert fp['missing_toolchain_qualification_is_a_mathematical_P4_blocker'] is False
          assert fp['host_arithmetic_check_is_deployment_qualification'] is False

          print('DECLARED_INDEPENDENT_INTEGRAL_M_S',rel['declared_independent_integral_radius_m_s'])
          print('DECLARED_IS_CONSERVATIVE',rel['declared_independent_radius_is_conservative'])
          print('CORRELATED_ONE_CADENCE_M_S',rel['correlated_radius_one_cadence_m_s'])
          print('CORRELATED_ONE_WORD_M_S',rel['correlated_radius_one_word_m_s'])
          print('CHART_THRESHOLD_M_S',rel['chart_retaining_integral_radius_upper_m_s'],
                'binding',rel['chart_retention_binding_mode'])
          print('S_ZERO_MU_LOWER',rel['S_zero_regulation']['worst_cell_mu_lower'])
          print('BLOCKER_CLASSES')
          for name,row in sorted(cls['blocker_classification'].items()):
              print(' -',row['class'],name)
          for mode,row in sorted(cls['correction_domain_attribution'].items()):
              print('CORRECTION_ATTRIBUTION',mode,
                    'limiter_declared',row['limiting_event_declared_entry_set'],
                    'limiter_correlated',row['limiting_event_with_correlated_integral_relation'],
                    'attitude_trace_excess',row['attitude_trace_excess_factor'])
          route=cls['magnitude_route_after_transverse_cap']
          capd=cls['conditional_transverse_attitude_cap']
          assert capd['prior_independent'] is False
          assert capd['conditional_on_joint_latent_bias_block'] is True
          assert capd['refutation_exceedance_factor'] > 1.0
          assert route['one_shot_measurement_route_closes_the_correction_domain'] is False
          th=route['one_shot_route_threshold']
          assert th['supremum_exceeds_reset_utility_cap'] is True
          assert th['requirement_is_achievable_in_principle'] is True
          print('ONE_SHOT_ROUTE_SUP',th['ceiling_supremum_over_all_attitude_bounds'],
                'REQUIRED_P_STAR_RAD2',th['required_transverse_variance_per_axis_rad2'],
                'REQUIRED_LAMBDA_MAX',th['required_joint_latent_bias_lambda_max'],
                'LAMBDA_SHORTFALL',th['joint_latent_bias_shortfall_factor'])
          print('CONDITIONAL_TRANSVERSE_CAP_RAD2',capd['transverse_trace_upper_two_axes_rad2'],
                'RETRACTED_PRIOR_INDEPENDENT',capd['retracted_prior_independent_value_rad2'],
                'REFUTATION_EXCEEDANCE',capd['refutation_exceedance_factor'])
          print('ACC_CEILING_RINV',route['accelerometer_ceiling_with_Rinverse_relaxation'])
          print('ACC_CEILING_SINV',route['accelerometer_ceiling_retaining_same_cell_Sinverse'])
          PY
      - name: Run the producer unit tests
        run: |
          python3 -m unittest -v \
            tests.validation.test_ou3_p4_attitude_measurement_cap \
            tests.validation.test_ou3_p4_correlated_entry_relation \
            tests.validation.test_ou3_p4_blocker_falsification_classification
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-entry-relation-and-classification
          path: |
            /tmp/attitude-cap.json
            /tmp/entry-relation.json
            /tmp/blocker-classification.json
          retention-days: 7
