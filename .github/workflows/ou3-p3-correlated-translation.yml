name: ou3-p3-correlated-translation

on:
  push:
    paths:
      - "tools/ou3_p2_correlation_path_memory.py"
      - "tools/ou3_p2_clock_phase_tuner_graph.py"
      - "tools/ou3_p3_correlated_translation_segment.py"
      - "tools/ou3_p3_correlated_translation_covariance_upper.py"
      - "tools/ou3_p3_p2_v1_history_frontier.py"
      - "tools/ou3_p3_p2_v1_stage_phase_translation.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p3_p2_v1_history_frontier.py"
      - "tests/validation/test_ou3_p3_p2_v1_stage_phase_translation.py"
      - "src/kalman_ou_iii/**"
      - "src/tuner/**"
      - ".github/workflows/ou3-p3-correlated-translation.yml"
  pull_request:
    paths:
      - "tools/ou3_p2_correlation_path_memory.py"
      - "tools/ou3_p2_clock_phase_tuner_graph.py"
      - "tools/ou3_p3_correlated_translation_segment.py"
      - "tools/ou3_p3_correlated_translation_covariance_upper.py"
      - "tools/ou3_p3_p2_v1_history_frontier.py"
      - "tools/ou3_p3_p2_v1_stage_phase_translation.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p3_p2_v1_history_frontier.py"
      - "tests/validation/test_ou3_p3_p2_v1_stage_phase_translation.py"
      - "src/kalman_ou_iii/**"
      - "src/tuner/**"
      - ".github/workflows/ou3-p3-correlated-translation.yml"
  workflow_dispatch:

concurrency:
  group: ou3-p3-correlated-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-complete-translation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile P2 V1 full-word history and stage-phase translation route
        run: |
          python3 -m py_compile \
            tools/ou3_p3_p2_v1_history_frontier.py \
            tools/ou3_p3_p2_v1_stage_phase_translation.py \
            tests/validation/test_ou3_p3_p2_v1_history_frontier.py \
            tests/validation/test_ou3_p3_p2_v1_stage_phase_translation.py

      - name: Test Pareto quotient, finite phase, frozen-hold and full-matrix gate primitives
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p3_p2_v1_history_frontier \
            test_ou3_p3_p2_v1_stage_phase_translation

      - name: Build exact-history quotient and source-complete translation candidate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          import ou3_p3_p2_v1_history_frontier as H
          import ou3_p3_p2_v1_stage_phase_translation as P

          h = H.build()
          hf = H.validate(h)
          h['validation_pass'] = not hf
          h['validation_failures'] = hf
          if hf:
              raise SystemExit(f'history quotient validation failed: {hf}')
          Path('/tmp/ou3_p3_p2_v1_history_frontier.json').write_text(
              json.dumps(h, indent=2, sort_keys=True), encoding='utf-8')

          p = P.build()
          pf = P.validate(p)
          p['validation_pass'] = not pf
          p['validation_failures'] = pf
          if pf:
              raise SystemExit(f'translation candidate validation failed: {pf}')
          Path('/tmp/ou3_p3_p2_v1_stage_phase_translation.json').write_text(
              json.dumps(p, indent=2, sort_keys=True), encoding='utf-8')

          assert h['P2_correlation_interface_consumed'] is True
          assert h['raw_tuner_cartesian_extrema_used'] is False
          assert h['full_source_history_family_enumerated_at_sufficient_statistic_level'] is True
          assert p['P2_correlation_interface_consumed'] is True
          assert p['process_covariance_measurement_bounds_same_source_history'] is True
          assert p['independent_cartesian_tau_sigma_R_S_extrema_used'] is False
          assert p['endpoint_phase_count'] == 800 * 26
          assert p['frozen_clock_absorbing_hold_branch_included'] is True
          assert p['frozen_clock_branch']['clock_stagnation_verified'] is True
          assert p['useful_gate'] == 1e-18
          assert p['P3_CANONICAL_PROMOTED'] is False

          print(json.dumps({
              'history_target': h['global_word_target'],
              'terminal_history_classes': h['terminal_history_classes'],
              'terminal_pareto_labels': h['terminal_pareto_labels'],
              'max_frontier_per_state': h['max_frontier_per_state'],
              'boundary_floor': p['boundary_floor'],
              'endpoint_phase_count': p['endpoint_phase_count'],
              'endpoint_phase_useful_count': p['endpoint_phase_useful_count'],
              'worst_finite_translation_margin_lower': p['worst_finite_translation_margin_lower'],
              'worst_finite_translation_endpoint_phase': p['worst_finite_translation_endpoint_phase'],
              'frozen_clock_branch': p['frozen_clock_branch'],
              'worst_translation_margin_lower': p['worst_translation_margin_lower'],
              'translation_established': p['P3_TRANSLATION_CERTIFICATE_ESTABLISHED'],
              'canonical_P3_promoted': p['P3_CANONICAL_PROMOTED'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload correlated source-complete translation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p3-p2-v1-source-complete-translation
          path: |
            /tmp/ou3_p3_p2_v1_history_frontier.json
            /tmp/ou3_p3_p2_v1_stage_phase_translation.json
          retention-days: 7
