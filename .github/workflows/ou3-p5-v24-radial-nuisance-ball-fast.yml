name: ou3-p5-v24-radial-nuisance-ball-fast

on:
  push:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_radial_nuisance_ball_subdivision_v24.py"
      - ".github/workflows/ou3-p5-v24-radial-nuisance-ball-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_radial_nuisance_ball_subdivision_v24.py"
      - ".github/workflows/ou3-p5-v24-radial-nuisance-ball-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v24-radial-nuisance-ball-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-radial-nuisance-ball-v24:
    name: P5 sample-1 radial nuisance-ball subdivision V24
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile V24 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_radial_nuisance_ball_subdivision_v24.py \
            tests/validation/test_ou3_p5_sample1_radial_nuisance_ball_subdivision_v24.py
      - name: Test V24 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_radial_nuisance_ball_subdivision_v24
      - name: Emit V24 first-witness radial nuisance-ball audit
        run: |
          python3 tools/ou3_p5_sample1_radial_nuisance_ball_subdivision_v24.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --current-component-pieces 4 \
            --output /tmp/p5_sample1_v24_radial_nuisance_ball.json
