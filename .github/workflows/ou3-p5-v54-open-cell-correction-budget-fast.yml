name: ou3-p5-v54-open-cell-correction-budget-fast

on:
  push:
    paths:
      - "tools/ou3_p5_sample1_open_cell_correction_budget_v54.py"
      - "tests/validation/test_ou3_p5_sample1_open_cell_correction_budget_v54.py"
      - "tools/ou3_p5_sample1_exact_monotone_source_gain_v51.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v8.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v9.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v10.py"
      - "tools/ou3_interval.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p5-v54-open-cell-correction-budget-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v54-open-cell-correction-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v54-open-cell-correction-budget:
    name: P5 V54 open-cell correction budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Compile V54 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_open_cell_correction_budget_v54.py \
            tests/validation/test_ou3_p5_sample1_open_cell_correction_budget_v54.py
      - name: Test V54 contract
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_open_cell_correction_budget_v54
      - name: Run V54 open-cell correction budget
        id: audit
        shell: bash
        run: |
          set +e
          python3 tools/ou3_p5_sample1_open_cell_correction_budget_v54.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_v54.json \
            > /tmp/p5_sample1_v54.log 2>&1
          rc=$?
          set -e
          cat /tmp/p5_sample1_v54.log
          python3 - "$GITHUB_OUTPUT" "$rc" <<'PY'
          import json, math, pathlib, sys
          out, rc = sys.argv[1], int(sys.argv[2])
          path = pathlib.Path('/tmp/p5_sample1_v54.json')
          d = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          cells = d.get('open_cells') or {}
          def fmt(x):
              try: y = float(x)
              except (TypeError, ValueError): return 'na'
              return f'{y:.12g}' if math.isfinite(y) else str(y)
          def gap(label):
              c = cells.get(label) or {}
              return fmt(c.get('correction_fractional_gap'))
          def need(label, factor):
              c = (cells.get(label) or {}).get('required_reductions') or {}
              row = c.get(factor) or {}
              return fmt(row.get('fractional_reduction')) if row.get(
                  'reachable_alone') else 'unreachable'
          with open(out, 'a', encoding='utf-8') as gh:
              print(f"rc={rc}", file=gh)
              print(f"status={d.get('P5_SAMPLE1_OPEN_CELL_CORRECTION_BUDGET_V54')}", file=gh)
              print(f"nearest={d.get('nearest_open_cell')}", file=gh)
              print(f"nearest_gap={fmt(d.get('nearest_open_cell_fractional_gap'))}", file=gh)
              print(f"first_gap={gap('first_open')}", file=gh)
              print(f"first_need_rho={need('first_open', 'rho')}", file=gh)
              print(f"worst_gap={gap('worst')}", file=gh)
              print(f"worst_need_rho={need('worst', 'rho')}", file=gh)
              print(f"retired_gap={gap('retired_witness')}", file=gh)
              print(f"next={d.get('next_obligation')}", file=gh)
      - name: "V54 rc=${{ steps.audit.outputs.rc }} status=${{ steps.audit.outputs.status }} nearest=${{ steps.audit.outputs.nearest }} gap=${{ steps.audit.outputs.nearest_gap }}"
        run: |
          echo "first-open  gap=${{ steps.audit.outputs.first_gap }} need_rho=${{ steps.audit.outputs.first_need_rho }}"
          echo "worst       gap=${{ steps.audit.outputs.worst_gap }} need_rho=${{ steps.audit.outputs.worst_need_rho }}"
          echo "retired     gap=${{ steps.audit.outputs.retired_gap }} (negative means inside the geodesic target)"
          echo "next=${{ steps.audit.outputs.next }}"
      - name: Fail closed on producer validation
        if: steps.audit.outputs.rc != '0'
        run: exit 2
