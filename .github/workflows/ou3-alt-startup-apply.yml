name: OU3 ALT startup continuation apply
on:
  push:
    branches: [proof/ou3-alt-startup-machine-attachment]
    paths: [.github/workflows/ou3-alt-startup-apply.yml]
permissions:
  contents: write
jobs:
  apply-validated-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OU3_ALT_REQUIRE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and apply proof-only patch
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8f964a88ca0beb023a109870f424214130faeba9 HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = [pathlib.Path(f'.proof-transfer/ou3-startup-{i}.b64').read_text().strip() for i in (1, 2, 3)]
          for i, part in enumerate(parts, 1):
              print('part', i, len(part), hashlib.sha256(part.encode()).hexdigest())
          patch = lzma.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'de43ddf746dc821f0455466a4cee02cd25254b55592281db7838d73328519873'
          pathlib.Path('/tmp/ou3-startup.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', '/tmp/ou3-startup.patch'], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '/tmp/ou3-startup.patch'], check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines()
          assert len(paths) == 17, paths
          assert all(p.startswith(('tools/stability/ou3_alt_contraction/', 'tests/ou3_alt_contraction/', 'docs/ou3-alt-')) or p == 'docs/ou3-proof-research-state.md' for p in paths)
          original = subprocess.check_output(['git', 'show', '8f964a88ca0beb023a109870f424214130faeba9:docs/ou3-proof-research-state.md'])
          edited = pathlib.Path('docs/ou3-proof-research-state.md').read_bytes()
          marker = b'## Parallel ALT contraction/dissipativity track'
          assert original.split(marker)[0] == edited.split(marker)[0]
          PY
          git diff --cached --check
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libeigen3-dev python3-numpy python3-scipy python3-mpmath
      - name: Require all finite tests including native first-sample correspondence
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD:$PWD/tools/stability:$PWD/tests/ou3_alt_contraction"
          python3 -m unittest discover -s tests/ou3_alt_contraction -p 'test_finite*.py' -v 2>&1 | tee /tmp/ou3-startup-finite.log
      - name: Publish validated proof files only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'proof(ou3-alt): attach startup machine history and correct Racc read order'
          git push origin HEAD:proof/ou3-alt-startup-machine-attachment
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ou3-startup-finite-validation
          path: /tmp/ou3-startup-finite.log
          if-no-files-found: warn
          retention-days: 7
