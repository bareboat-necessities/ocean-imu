name: wave-band-period-diagnostic

on:
  pull_request:
    paths:
      - "src/freq/**"
      - "src/kalman_ou_iii/**"
      - "tests/kalman_ou_iii/**"
      - "tools/wave_band_period_diagnostic.py"
      - ".github/workflows/wave-band-period-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-band-period-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip python3-numpy

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          mkdir -p plots/kalman_ou_ii
          unzip -o sim-data-files.zip -d plots/kalman_ou_ii >/dev/null

      - name: Compare period proxies
        run: |
          python3 -u tools/wave_band_period_diagnostic.py \
            --output-dir reports/results/wave_band_period

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wave-band-period-diagnostic
          path: reports/results/wave_band_period/**
          if-no-files-found: error
