name: OU sea-period EMA sweep

on:
  push:
    branches:
      - agent/sea-scaled-ou-ema
    paths:
      - tools/ou_sea_period_ema_experiment.py
      - .github/workflows/ou-sea-period-ema-sweep.yml

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            g++ make libeigen3-dev python3-numpy

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          unzip -o sim-data-files.zip -d tests/kalman_ou_iii >/dev/null

      - name: Patch runner checkout for experiment
        run: python3 tools/ou_sea_period_ema_experiment.py patch

      - name: Build OU-III simulator
        run: make -C tests/kalman_ou_iii kalman_ou_iii-sim

      - name: Run coarse joint sweep
        run: python3 -u tools/ou_sea_period_ema_experiment.py coarse

      - name: Rank coarse sweep
        run: python3 -u tools/ou_sea_period_ema_experiment.py rank

      - name: Commit coarse sweep summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/results/ou_sea_period_ema/coarse.csv \
                     reports/results/ou_sea_period_ema/coarse_summary.csv
          git commit -m "Record sea-period EMA coarse sweep [sweep-result]"
          git push origin HEAD:agent/sea-scaled-ou-ema

      - name: Upload sweep data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou-sea-period-ema-coarse
          path: reports/results/ou_sea_period_ema/**
          if-no-files-found: warn
