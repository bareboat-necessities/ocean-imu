name: OU sea-period EMA sweep

on:
  push:
    branches:
      - agent/sea-scaled-ou-ema
    paths:
      - tools/ou_sea_period_ema_experiment.py
      - tools/ou_sea_period_ema_preserve_cadence.py
      - .github/workflows/ou-sea-period-ema-sweep.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou-sea-period-ema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            g++ make libeigen3-dev python3-numpy

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          unzip -o sim-data-files.zip -d tests/kalman_ou_iii >/dev/null

      - name: Patch runner checkout for experiment
        run: |
          python3 tools/ou_sea_period_ema_experiment.py patch
          python3 tools/ou_sea_period_ema_preserve_cadence.py

      - name: Build OU-III simulator
        run: make -C tests/kalman_ou_iii kalman_ou_iii-sim

      - name: Run screening joint sweep
        run: |
          mkdir -p reports/results/ou_sea_period_ema
          python3 -u tools/ou_ema_adapt_study.py transition \
            --family OU_III \
            --transition-stage confirm \
            --transition-pair large,small \
            --transition-dir up,down \
            --transition-seeds 11 \
            --seeds default \
            --jobs "$(nproc)" \
            --out reports/results/ou_sea_period_ema/coarse.csv \
            --point 'a=.05,f=.05:OU_III_ADAPT_TAU_PERIODS=.05:OU_III_TUNER_FREQ_PERIODS=.05' \
            --point 'a=.05,f=.10:OU_III_ADAPT_TAU_PERIODS=.05:OU_III_TUNER_FREQ_PERIODS=.10' \
            --point 'a=.05,f=.20:OU_III_ADAPT_TAU_PERIODS=.05:OU_III_TUNER_FREQ_PERIODS=.20' \
            --point 'a=.05,f=.35:OU_III_ADAPT_TAU_PERIODS=.05:OU_III_TUNER_FREQ_PERIODS=.35' \
            --point 'a=.10,f=.05:OU_III_ADAPT_TAU_PERIODS=.10:OU_III_TUNER_FREQ_PERIODS=.05' \
            --point 'a=.10,f=.10:OU_III_ADAPT_TAU_PERIODS=.10:OU_III_TUNER_FREQ_PERIODS=.10' \
            --point 'a=.10,f=.20:OU_III_ADAPT_TAU_PERIODS=.10:OU_III_TUNER_FREQ_PERIODS=.20' \
            --point 'a=.10,f=.35:OU_III_ADAPT_TAU_PERIODS=.10:OU_III_TUNER_FREQ_PERIODS=.35' \
            --point 'a=.20,f=.05:OU_III_ADAPT_TAU_PERIODS=.20:OU_III_TUNER_FREQ_PERIODS=.05' \
            --point 'a=.20,f=.10:OU_III_ADAPT_TAU_PERIODS=.20:OU_III_TUNER_FREQ_PERIODS=.10' \
            --point 'a=.20,f=.20:OU_III_ADAPT_TAU_PERIODS=.20:OU_III_TUNER_FREQ_PERIODS=.20' \
            --point 'a=.20,f=.35:OU_III_ADAPT_TAU_PERIODS=.20:OU_III_TUNER_FREQ_PERIODS=.35' \
            --point 'a=.35,f=.05:OU_III_ADAPT_TAU_PERIODS=.35:OU_III_TUNER_FREQ_PERIODS=.05' \
            --point 'a=.35,f=.10:OU_III_ADAPT_TAU_PERIODS=.35:OU_III_TUNER_FREQ_PERIODS=.10' \
            --point 'a=.35,f=.20:OU_III_ADAPT_TAU_PERIODS=.35:OU_III_TUNER_FREQ_PERIODS=.20' \
            --point 'a=.35,f=.35:OU_III_ADAPT_TAU_PERIODS=.35:OU_III_TUNER_FREQ_PERIODS=.35'

      - name: Rank screening sweep
        run: python3 -u tools/ou_sea_period_ema_experiment.py rank

      - name: Upload sweep data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou-sea-period-ema-screen
          path: reports/results/ou_sea_period_ema/**
          if-no-files-found: warn
