name: OU sea-period EMA promotion

on:
  pull_request:
    branches: [main]
    paths:
      - tools/ou_sea_period_ema_promote.py
      - .github/workflows/ou-sea-period-ema-sweep.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ou-sea-period-ema-promote-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/sea-scaled-ou-ema'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v6
        with:
          ref: agent/sea-scaled-ou-ema
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            g++ make libeigen3-dev python3-numpy

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          unzip -o sim-data-files.zip -d tests/kalman_ou_iii >/dev/null

      - name: Apply confirmed production patch
        run: python3 tools/ou_sea_period_ema_promote.py

      - name: Build OU-III simulator and relevant tests
        run: |
          make -C tests/kalman_ou_iii \
            kalman_ou_iii-sim tuner_schedule-test tuner_coupling-test \
            wave_band_sigma-test rs_law-test

      - name: Run relevant OU-III tests
        run: |
          tests/kalman_ou_iii/tuner_schedule-test
          tests/kalman_ou_iii/tuner_coupling-test
          tests/kalman_ou_iii/wave_band_sigma-test
          tests/kalman_ou_iii/rs_law-test

      - name: Inspect production diff
        run: |
          git status --short
          git diff --check
          git diff --stat -- \
            src/tuner/SeaStateAutoTuner.h \
            src/kalman_ou_iii/SeaStateFusionFilter_OU_III.h \
            tests/kalman_ou_iii/kalman_ou_iii-sim.cpp \
            tests/kalman_ou_iii/tuner_schedule-test.cpp \
            docs/ou-ema-adaptation-tuning.md \
            doc/kalman_ou_iii/w3d-fus-methods.tex-part

      - name: Commit production changes to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/tuner/SeaStateAutoTuner.h \
            src/kalman_ou_iii/SeaStateFusionFilter_OU_III.h \
            tests/kalman_ou_iii/kalman_ou_iii-sim.cpp \
            tests/kalman_ou_iii/tuner_schedule-test.cpp \
            docs/ou-ema-adaptation-tuning.md \
            doc/kalman_ou_iii/w3d-fus-methods.tex-part
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Scale OU-III adaptation EMAs with sea time"
          git push origin HEAD:agent/sea-scaled-ou-ema
