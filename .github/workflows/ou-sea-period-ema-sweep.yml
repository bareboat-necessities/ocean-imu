name: OU sea-period EMA sweep

on:
  pull_request:
    branches: [main]
    paths:
      - tools/ou_sea_period_ema_experiment.py
      - tools/ou_sea_period_ema_preserve_cadence.py
      - .github/workflows/ou-sea-period-ema-sweep.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou-sea-period-ema-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            g++ make libeigen3-dev python3-numpy

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          unzip -o sim-data-files.zip -d tests/kalman_ou_iii >/dev/null

      - name: Patch runner checkout for experiment
        run: |
          python3 tools/ou_sea_period_ema_experiment.py patch
          python3 tools/ou_sea_period_ema_preserve_cadence.py

      - name: Build OU-III simulator
        run: make -C tests/kalman_ou_iii kalman_ou_iii-sim

      - name: Confirm on controlled transitions
        run: |
          mkdir -p reports/results/ou_sea_period_ema
          python3 -u tools/ou_ema_adapt_study.py transition \
            --family OU_III \
            --transition-stage confirm \
            --transition-pair large,small \
            --transition-dir up,down \
            --transition-seeds 11,12,13 \
            --seeds default,7,99 \
            --jobs "$(nproc)" \
            --out reports/results/ou_sea_period_ema/confirm_transition.csv \
            --point 'period_a=.20,f=.05:OU_III_ADAPT_TAU_PERIODS=.20:OU_III_TUNER_FREQ_PERIODS=.05' \
            --point 'period_a=.35,f=.05:OU_III_ADAPT_TAU_PERIODS=.35:OU_III_TUNER_FREQ_PERIODS=.05' \
            --point 'fixed_a=1.0,f=.25:OU_III_ADAPT_TAU_SEC=1.0:OU_III_TUNER_FREQ_TAU_SEC=.25' \
            --point 'fixed_a=1.8,f=.25:OU_III_ADAPT_TAU_SEC=1.8:OU_III_TUNER_FREQ_TAU_SEC=.25' \
            --point 'fixed_a=.5,f=.25:OU_III_ADAPT_TAU_SEC=.5:OU_III_TUNER_FREQ_TAU_SEC=.25'

      - name: Confirm on stationary reference seas
        run: |
          python3 -u tools/ou_ema_adapt_study.py confirm \
            --family OU_III \
            --records jonswap,pmstokes \
            --seeds default,7,99 \
            --jobs "$(nproc)" \
            --out reports/results/ou_sea_period_ema/confirm_stationary.csv \
            --point 'period_a=.20,f=.05:OU_III_ADAPT_TAU_PERIODS=.20:OU_III_TUNER_FREQ_PERIODS=.05' \
            --point 'period_a=.35,f=.05:OU_III_ADAPT_TAU_PERIODS=.35:OU_III_TUNER_FREQ_PERIODS=.05' \
            --point 'fixed_a=1.0,f=.25:OU_III_ADAPT_TAU_SEC=1.0:OU_III_TUNER_FREQ_TAU_SEC=.25' \
            --point 'fixed_a=1.8,f=.25:OU_III_ADAPT_TAU_SEC=1.8:OU_III_TUNER_FREQ_TAU_SEC=.25' \
            --point 'fixed_a=.5,f=.25:OU_III_ADAPT_TAU_SEC=.5:OU_III_TUNER_FREQ_TAU_SEC=.25'

      - name: Print confirmation verdict table
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          root = Path('reports/results/ou_sea_period_ema')
          for name in ('confirm_transition_summary.csv', 'confirm_stationary_summary.csv'):
              print('\n===', name, '===')
              with (root / name).open(newline='') as fh:
                  rows = list(csv.DictReader(fh))
              for r in rows:
                  if name.startswith('confirm_transition') and r['segment'] not in ('blend','recover','window'):
                      continue
                  print(' '.join([
                      r['label'], r['segment'],
                      '3D='+r['rms_3d_gm'], '3Dmax='+r['rms_3d_max'],
                      'Z='+r['z_rms_gm'], 'Zmax='+r['z_rms_max'],
                      'RP='+r['roll_pitch_rms_gm'], 'yaw='+r['yaw_rms_gm'],
                      'bias='+r['acc_bias_rms_3d_gm'],
                      'regr='+r['gate_regressions'], 'score='+r['score'],
                  ]))
          PY

      - name: Upload sweep data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou-sea-period-ema-confirm
          path: reports/results/ou_sea_period_ema/**
          if-no-files-found: warn
