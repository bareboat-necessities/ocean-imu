name: ou3-stability-proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "src/kalman_ou_iii/**"
      - "sensors/full_marine_ins/atomS3R_ins_kalman_ou3/**"
      - "tools/stability/**"
      - "tests/validation/test_ou3_*.py"
      - "tests/kalman_ou_iii/**"
      - "docs/ou3-*.md"
      - "doc/kalman_ou_iii/kalman_ou-w3d-stability-study.tex"
      - "reports/results/ou3_stability/**"
      - ".github/workflows/ou3-stability-proof.yml"
  push:
    branches: [main]
    paths:
      - "src/kalman_ou_iii/**"
      - "tools/stability/**"
      - "tests/validation/test_ou3_*.py"
      - "tests/kalman_ou_iii/**"
      - "docs/ou3-*.md"
      - "doc/kalman_ou_iii/kalman_ou-w3d-stability-study.tex"
      - "reports/results/ou3_stability/**"
      - ".github/workflows/ou3-stability-proof.yml"
concurrency:
  group: ou3-stability-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install factor algebra dependencies
        run: python3 -m pip install numpy scipy
      - name: Compile theorem tooling
        run: python3 -m py_compile tools/stability/ou3_theorem/*.py
      - name: Execute rational LIN path certificate
        run: |
          python3 tools/stability/ou3_theorem/lin_path_certificate.py --output /tmp/ou3-lin-path-certificate.json
          python3 -m unittest discover -s tests/validation -p test_ou3_lin_path_certificate.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_lin_matrix_certificate.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_word_energy.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_factor_word.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_root_covariance_certificate.py -v
          python3 tools/stability/ou3_theorem/block_factor_numeric.py
          python3 -m unittest discover -s tests/validation -p test_ou3_block_factor_numeric.py -v
      - name: Preserve reproducible source and LIN certificate
        if: ${{ !cancelled() }}
        run: |
          git rev-parse HEAD > /tmp/ou3-proof-source-commit.txt
          git archive --format=tar HEAD | gzip > /tmp/ou3-proof-source.tar.gz
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: ou3-proof-reproduction
          path: |
            /tmp/ou3-proof-source.tar.gz
            /tmp/ou3-proof-source-commit.txt
            /tmp/ou3-lin-path-certificate.json
          retention-days: 7
          if-no-files-found: error
      - name: Validate theorem contracts
        working-directory: tests/validation
        run: |
          python3 -m unittest -v test_ou3_architecture_cleanup test_ou3_imu_bias test_ou3_magnetic_service test_ou3_marine_motion test_ou3_no_mag_obstruction test_ou3_same_execution test_ou3_theorem_status test_ou3_tail_stability test_ou3_interval_riccati test_ou3_interval_riccati_21 test_ou3_block_factor_metric test_ou3_physical_qualification test_workflow_contract test_ou_replay_fingerprint
      - name: Validate provenance and fail-closed status
        run: python3 tools/stability/ou3_theorem/build_evidence.py --output /tmp/ou3-stability-evidence.json
      - name: Build literal shipping regressions
        run: sudo apt-get update -qq && sudo apt-get install -y g++ libeigen3-dev && make -C tests/kalman_ou_iii shipping_contract-test shipping_transition-test
      - name: Run literal shipping regressions
        run: ./tests/kalman_ou_iii/shipping_contract-test && ./tests/kalman_ou_iii/shipping_transition-test
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: ou3-stability-evidence
          path: /tmp/ou3-stability-evidence.json
          retention-days: 7
          if-no-files-found: error
