name: ou3-stability-proof
# proof-source attribution refresh
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "sensors/full_marine_ins/atomS3R_ins_kalman_ou3/**"
      - "tools/stability/**"
      - "tests/validation/test_ou3_*.py"
      - "tests/kalman_ou_iii/**"
      - "docs/ou3-*.md"
      - "doc/kalman_ou_iii/kalman_ou-w3d-stability-study.tex"
      - "doc/kalman_ou_iii/kalman_ou-w3d-stability-proofs.tex-part"
      - "reports/results/ou3_stability/**"
      - ".github/workflows/ou3-stability-proof.yml"
  push:
    branches: [main, "claude/ou3-*", "proof/ou3-*"]
    paths:
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "sensors/full_marine_ins/atomS3R_ins_kalman_ou3/**"
      - "tools/stability/**"
      - "tests/validation/test_ou3_*.py"
      - "tests/kalman_ou_iii/**"
      - "docs/ou3-*.md"
      - "doc/kalman_ou_iii/kalman_ou-w3d-stability-study.tex"
      - "doc/kalman_ou_iii/kalman_ou-w3d-stability-proofs.tex-part"
      - "reports/results/ou3_stability/**"
      - ".github/workflows/ou3-stability-proof.yml"
concurrency:
  group: ou3-stability-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  periodic-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native witness dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y g++ libeigen3-dev
      - name: Run commensurate periodic fast-gyro candidate
        run: |
          python3 -m tools.stability.ou3_theorem.periodic_fast_gyro_counterexample --native --eigen /usr/include/eigen3 > /tmp/ou3-periodic-fast-gyro.json
          cat /tmp/ou3-periodic-fast-gyro.json
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: ou3-periodic-fast-gyro-witness
          path: /tmp/ou3-periodic-fast-gyro.json
          retention-days: 7
          if-no-files-found: warn
  theorem:
    runs-on: ubuntu-24.04
    # Native source replays and the final exact enclosure exceed 20 minutes.
    # Preserve every check; a runner timeout is not a mathematical failure.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install factor algebra dependencies
        run: python3 -m pip install numpy scipy mpmath
      - name: Compile theorem tooling
        run: python3 -m py_compile tools/stability/ou3_theorem/*.py
      - name: Run source-uniform interval release diagnostic
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m tools.stability.ou3_theorem.run_interval_release | tee /tmp/ou3-interval-release.json

      - name: Diagnose physical HistoryCell subdivision
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m tools.stability.ou3_theorem.run_physical_history_subdivision | tee /tmp/ou3-physical-subdivision.json

      - name: Compute literal A21 release outer storage first
        run: |
          sudo apt-get update -qq && sudo apt-get install -y g++ libeigen3-dev
          python3 -m tools.stability.ou3_theorem.release_outer_storage_diagnostic --eigen /usr/include/eigen3 --output /tmp/ou3-release-outer-early.json
          cat /tmp/ou3-release-outer-early.json
      - name: Audit literal A21 release outer storage without theorem promotion
        run: |
          sudo apt-get update -qq && sudo apt-get install -y g++ libeigen3-dev
          python3 -m tools.stability.ou3_theorem.release_outer_storage_diagnostic --eigen /usr/include/eigen3 --output /tmp/ou3-release-outer.json
          cat /tmp/ou3-release-outer.json
      - name: Diagnose held-BA 17-s LIN word without theorem promotion
        run: |
          python3 -m tools.stability.ou3_theorem.held_ba_lin_word_diagnostic --eigen /usr/include/eigen3 --output /tmp/ou3-held-ba-lin-word.json
          cat /tmp/ou3-held-ba-lin-word.json
      - name: Audit carried source readout without promotion
        run: python3 -m tools.stability.ou3_theorem.ag_readout_source_diagnostic --eigen /usr/include/eigen3 --output /tmp/ou3-source-readout.json
      - name: Diagnose 16s 30s 60s 100s linked prospective supply
        run: |
          rm -rf /tmp/ou3-linked-horizons
          python3 -m tools.stability.ou3_theorem.linked_supply_source_diagnostic --export --directory /tmp/ou3-linked-horizons --output /tmp/ou3-linked-horizons.json --eigen /usr/include/eigen3 --horizons 16,30,60,100
          cat /tmp/ou3-linked-horizons.json
      - name: Diagnose shipping shaped Q on 60s and 100s words
        run: |
          python3 -m tools.stability.ou3_theorem.adaptive_shaped_storage_diagnostic --directory /tmp/ou3-linked-horizons --output /tmp/ou3-shaped-storage.json --horizons 16,30,60,100
          python3 -m tools.stability.ou3_theorem.adaptive_shaped_q_diagnostic --directory /tmp/ou3-linked-horizons --output /tmp/ou3-shaped-q.json --horizons 60,100
          cat /tmp/ou3-shaped-storage.json
          cat /tmp/ou3-shaped-q.json
      - name: Validate local affine-defect composition contract
        run: python3 -m unittest tests.validation.test_ou3_local_defect_composition -v
      - name: Validate exact complete-word nullspace lemma
        run: python3 -m unittest tests.validation.test_ou3_complete_word_nullspace -v
      - name: Execute rational LIN path certificate
        run: |
          python3 tools/stability/ou3_theorem/lin_path_certificate.py --output /tmp/ou3-lin-path-certificate.json
          python3 -m unittest discover -s tests/validation -p test_ou3_lin_path_certificate.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_lin_matrix_certificate.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_word_energy.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_factor_word.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_root_covariance_certificate.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_sampled_capture_obstruction.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_sampling_fidelity.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_corrected_word.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_ag_readout.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_word_diameter.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_gyro_bias_projection.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_signed_temporal.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_construction_mean_action.py -v
          python3 tools/stability/ou3_theorem/block_factor_numeric.py
          python3 -m unittest discover -s tests/validation -p test_ou3_block_factor_numeric.py -v
      - name: Preserve reproducible source and LIN certificate
        if: ${{ !cancelled() }}
        run: |
          git rev-parse HEAD > /tmp/ou3-proof-source-commit.txt
          git archive --format=tar HEAD | gzip > /tmp/ou3-proof-source.tar.gz
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: ou3-proof-reproduction
          path: |
            /tmp/ou3-proof-source.tar.gz
            /tmp/ou3-proof-source-commit.txt
            /tmp/ou3-lin-path-certificate.json
          retention-days: 7
          if-no-files-found: error
      - name: Probe commensurate periodic fast-gyro candidate without promotion
        run: |
          sudo apt-get update -qq && sudo apt-get install -y g++ libeigen3-dev
          python3 -m tools.stability.ou3_theorem.periodic_fast_gyro_counterexample --native --eigen /usr/include/eigen3 > /tmp/ou3-periodic-fast-gyro.json
          cat /tmp/ou3-periodic-fast-gyro.json
      - name: Validate theorem contracts
        working-directory: tests/validation
        run: |
          python3 -m unittest -v test_ou3_architecture_cleanup test_ou3_imu_bias test_ou3_magnetic_service test_ou3_marine_motion test_ou3_no_mag_obstruction test_ou3_same_execution test_ou3_theorem_status test_ou3_regimes test_ou3_moving_pivots test_ou3_inverse_transport test_ou3_same_cell_groups test_ou3_world_frame test_ou3_aw_covariance_ceiling test_ou3_aw_tracking test_ou3_signed_injection test_ou3_aggregate_floor test_ou3_stationary_covariance test_ou3_tail_stability test_ou3_interval_riccati test_ou3_interval_riccati_21 test_ou3_rank_loss_interval_factor test_ou3_block_factor_metric test_ou3_physical_qualification test_workflow_contract test_ou_replay_fingerprint
      - name: Build magnetic exhaustive-strata certificate
        run: |
          python3 -m tools.stability.ou3_theorem.magnetic_strata_certificate_cli --output /tmp/ou3-magnetic-strata.json
      - name: Build rank-loss interval certificate
        run: |
          python3 -m tools.stability.ou3_theorem.rank_loss_interval_certificate --output /tmp/ou3-rank-loss-interval.json --max-depth 10
      - name: Validate provenance and fail-closed status
        run: python3 tools/stability/ou3_theorem/build_evidence.py --output /tmp/ou3-stability-evidence.json
      - name: Build literal shipping regressions
        run: sudo apt-get update -qq && sudo apt-get install -y g++ libeigen3-dev && make -C tests/kalman_ou_iii shipping_contract-test shipping_transition-test sampled_capture-test && make -C tests/kalman_ou_iii -f Makefile -f RegimeRegression.mk regime_ambiguity-test && make -C tests/kalman_ou_iii -f Makefile -f ../common/GyroBiasProjectionRegression.mk gyro_bias_projection-test
      - name: Run literal shipping regressions
        run: ./tests/kalman_ou_iii/shipping_contract-test && ./tests/kalman_ou_iii/shipping_transition-test && ./tests/kalman_ou_iii/sampled_capture-test && ./tests/kalman_ou_iii/regime_ambiguity-test && ./tests/kalman_ou_iii/gyro_bias_projection-test
      - name: Diagnose 17-s terminal-AW D2 reader ratio without promotion
        run: python3 -m tools.stability.ou3_theorem.aw_port_17s_diagnostic --eigen /usr/include/eigen3 --output /tmp/ou3-aw-port-17s.json
      - name: Diagnose paired physical source bridge without promotion
        run: |
          python3 -m tools.stability.ou3_theorem.paired_two_abel_source_diagnostic --eigen /usr/include/eigen3 --output /tmp/ou3-paired-physical.json
          cat /tmp/ou3-paired-physical.json
      - name: Diagnose linked finite-supply ratio without promotion
        run: |
          mkdir -p /tmp/ou3-linked
          python3 -m tools.stability.ou3_theorem.linked_supply_source_diagnostic --directory /tmp/ou3-linked --output /tmp/ou3-linked.json --export --eigen /usr/include/eigen3
          cat /tmp/ou3-linked.json
      - name: Audit exact same-cell moving row groups without promotion
        run: python3 -m tools.stability.ou3_theorem.moving_transport_source_diagnostic --eigen /usr/include/eigen3 --output /tmp/ou3-moving-transport.json
      - name: Reproduce the committed world-frame audit without promotion
        run: python3 -m tools.stability.ou3_theorem.world_frame_source_diagnostic --eigen /usr/include/eigen3 --output /tmp/ou3-world-frame.json --expect reports/results/ou3_stability/world-frame-source-feasibility.json
      - name: Reproduce the committed AW tracking audit without promotion
        run: python3 -m tools.stability.ou3_theorem.aw_tracking_source_diagnostic --eigen /usr/include/eigen3 --output /tmp/ou3-aw-tracking.json --expect reports/results/ou3_stability/aw-tracking-source-feasibility.json
      - name: Check carried signed AW reader against analytic margin
        run: python3 -m tools.stability.ou3_theorem.aw_signed_mean_reader_diagnostic
      - name: Reproduce the committed information-ratio audit without promotion
        run: python3 -m tools.stability.ou3_theorem.information_ratio_source_diagnostic --eigen /usr/include/eigen3 --output /tmp/ou3-information-ratio.json --expect reports/results/ou3_stability/information-ratio-source-feasibility.json
      - name: Check signed adjoint compatibility on the carried word
        run: python3 -m tools.stability.ou3_theorem.signed_temporal_diagnostic --output /tmp/ou3-signed-adjoint.json
      - name: Check the forced signed balance on a carried moving word
        run: python3 -m tools.stability.ou3_theorem.signed_temporal_balance --export --directory /tmp/ou3-signed-balance --output /tmp/ou3-signed-balance.json
      - name: Audit carried construction stress history without theorem promotion
        run: python3 -m tools.stability.ou3_theorem.construction_history_diagnostic --output /tmp/ou3-construction.json
      - name: Enclose carried mean action and record the failed uniform separation attempt
        run: |
          python3 -m tools.stability.ou3_theorem.construction_mean_action --export --directory /tmp/ou3-mean --output /tmp/ou3-mean-diagnostic.json
          python3 -m tools.stability.ou3_theorem.construction_mean_action --intervals --directory /tmp/ou3-mean --output /tmp/ou3-mean-enclosure.json
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: ou3-stability-evidence
          path: |
            /tmp/ou3-stability-evidence.json
            /tmp/ou3-source-readout.json
            /tmp/ou3-aw-port-17s.json
            /tmp/ou3-moving-transport.json
            /tmp/ou3-world-frame.json
            /tmp/ou3-aw-tracking.json
            /tmp/ou3-information-ratio.json
            /tmp/ou3-signed-adjoint.json
            /tmp/ou3-signed-balance.json
            /tmp/ou3-signed-balance/export.json
            /tmp/ou3-signed-balance/balance.bin
            /tmp/ou3-construction.json
            /tmp/ou3-release-outer.json
            /tmp/ou3-mean-diagnostic.json
            /tmp/ou3-mean-enclosure.json
            /tmp/ou3-mean/export.json
            /tmp/ou3-mean/mean-action.bin
          retention-days: 7
          if-no-files-found: error
  moving-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install proof dependencies
        run: python3 -m pip install numpy scipy mpmath matplotlib
      - name: Validate all OU-III proof contracts and provenance
        run: |
          python3 -m tools.stability.ou3_theorem.build_evidence
          python3 -m unittest discover -s tests/validation -p 'test_ou3_*.py' -v
      - name: Install native diagnostic dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y g++ libeigen3-dev
      - name: Replay actual accepted magnetic information without promotion
        run: |
          python3 -m tools.stability.ou3_theorem.moving_compatibility_diagnostic --eigen /usr/include/eigen3 --duration 1200 --output /tmp/ou3-moving-compatibility.json
          cat /tmp/ou3-moving-compatibility.json
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: ou3-moving-compatibility-carried
          path: /tmp/ou3-moving-compatibility.json
          retention-days: 7
          if-no-files-found: warn

  planar-service-cell:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install planar audit dependencies
        run: |
          python3 -m pip install numpy scipy mpmath
          sudo apt-get update -qq
          sudo apt-get install -y clang libeigen3-dev
      - name: Verify analytical algebra and fail-closed bindings
        run: |
          python3 -m unittest discover -s tests/validation -p 'test_ou3_planar_service_*.py' -v
          python3 -m unittest tests.validation.test_ou3_planar_information_ceilings tests.validation.test_ou3_planar_joint_phase_cell tests.validation.test_ou3_causal_tuner_interval -v
          python3 -m tools.stability.ou3_theorem.build_evidence
      - name: Export and audit actual planar word with untapped control
        run: |
          python3 -m tools.stability.ou3_theorem.planar_service_stream --cxx clang++ --eigen /usr/include/eigen3 --duration 240 --tail 40 --stream /tmp/ou3-planar-operations.bin --output /tmp/ou3-planar-stream.json
          python3 -m tools.stability.ou3_theorem.planar_service_audit --stream /tmp/ou3-planar-operations.bin --output /tmp/ou3-planar-operation-audit.json
          python3 -m tools.stability.ou3_theorem.planar_service_frechet --stream /tmp/ou3-planar-operations.bin --output /tmp/ou3-planar-frechet.json
          python3 -m tools.stability.ou3_theorem.planar_service_verify --stream-report /tmp/ou3-planar-stream.json --operation-audit /tmp/ou3-planar-operation-audit.json --frechet /tmp/ou3-planar-frechet.json
          python3 -m tools.stability.ou3_theorem.planar_service_mahony_tube > /tmp/ou3-planar-mahony.json
          python3 -m tools.stability.ou3_theorem.planar_joint_phase_cell --frechet /tmp/ou3-planar-frechet.json --mahony /tmp/ou3-planar-mahony.json --service-floor 7.024764605642485 --output /tmp/ou3-planar-joint-threshold.json
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: ou3-planar-service-cell-diagnostics
          path: |
            /tmp/ou3-planar-stream.json
            /tmp/ou3-planar-operation-audit.json
            /tmp/ou3-planar-frechet.json
            /tmp/ou3-planar-joint-threshold.json
          retention-days: 7
          if-no-files-found: error
