name: TFG replay workspace export
on:
  push:
    branches: [tfg-rigorous-tuning]
    paths: ['.github/workflows/tfg-replay-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build headers
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - name: Verify the pinned dataset without executing simulations
        run: make ensure-sim-data
      - name: Package tracked source, verified data and public build headers only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tfg-workspace
          git archive HEAD | tar -xf - -C /tmp/tfg-workspace
          cp sim-data-files-vessel-rao-28ft.zip /tmp/tfg-workspace/
          if [ ! -f /tmp/tfg-workspace/third_party/eigen/Eigen/Dense ]; then
            mkdir -p /tmp/tfg-workspace/third_party/eigen
            cp -a /usr/include/eigen3/. /tmp/tfg-workspace/third_party/eigen/
          fi
          # Preserve exact source provenance, without checkout configuration,
          # authentication, hooks, logs or any environment material.
          mkdir -p /tmp/tfg-workspace/.git
          for path in HEAD index objects refs shallow; do
            if [ -e ".git/$path" ]; then cp -a ".git/$path" /tmp/tfg-workspace/.git/; fi
          done
          git rev-parse HEAD > /tmp/tfg-workspace/replay-source-sha.txt
          tar -czf /tmp/tfg-replay-workspace.tar.gz -C /tmp/tfg-workspace .
          sha256sum /tmp/tfg-replay-workspace.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tfg-replay-workspace-${{ github.run_id }}
          path: /tmp/tfg-replay-workspace.tar.gz
          compression-level: 0
          retention-days: 3
