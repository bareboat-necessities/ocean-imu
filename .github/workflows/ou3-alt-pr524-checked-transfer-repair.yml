name: OU3 ALT PR524 anchored checked continuation
on:
  push:
    branches: [proof/ou3-alt-live-mag-composition]
    paths: [.github/workflows/ou3-alt-pr524-checked-transfer-repair.yml]
permissions:
  contents: write
concurrency:
  group: ou3-alt-pr524-checked-transfer
  cancel-in-progress: false
jobs:
  apply-tested-continuation:
    if: github.repository == 'bareboat-necessities/ocean-imu'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - name: Apply exact source changes and section-anchored ALT documentation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2c484485341f8dd410d3e7b9d2bf00cd72345259
          test "$(git rev-parse HEAD^^)" = 9c943c5224465cb65a86bd44c0bab86b5c24a85a
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, re, subprocess
          retained = pathlib.Path('.github/workflows/ou3-alt-pr524-checked-transfer.yml').read_text()
          payload = re.search(r'base64\.b64decode\("""(.*?)"""\)', retained, re.S)
          assert payload is not None, 'missing retained patch'
          data = lzma.decompress(base64.b64decode(payload.group(1)))
          assert hashlib.sha256(data).hexdigest() == '4e257fe14a28a966c1b54a9ac2fdddadb23b1fc1eb546c1565f3eef2ed944c07'
          parts = re.split(r'(?=^diff --git )', data.decode(), flags=re.M)[1:]
          assert len(parts) == 18
          docs = {}; core = []; post = {}; paths = []
          def blob(path):
              return subprocess.check_output(['git','hash-object',path], text=True).strip()
          for part in parts:
              name = re.match(r'diff --git a/(.*?) b/(.*?)\n', part)
              assert name and name.group(1) == name.group(2)
              path = name.group(1); paths.append(path)
              index = re.search(r'^index ([0-9a-f]{40})\.\.([0-9a-f]{40}) ', part, re.M)
              assert index
              post[path] = index.group(2)
              if path in ('docs/ou3-alt-main-handover.md','docs/ou3-proof-research-state.md'):
                  docs[path] = part
              else:
                  assert path.startswith(('tools/stability/ou3_alt_contraction/','tests/ou3_alt_contraction/'))
                  assert blob(path) == index.group(1), 'source preimage mismatch: ' + path
                  core.append(part)
          assert len(core) == 16 and len(docs) == 2
          p = pathlib.Path('/tmp/ou3-alt-pr524-core.patch'); p.write_text(''.join(core))
          subprocess.run(['git','apply','--check','--index','--unidiff-zero',str(p)], check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(p)], check=True)
          def changes(part):
              result = []
              for h in re.split(r'^@@ [^\n]*\n', part, flags=re.M)[1:]:
                  lines = h.splitlines(keepends=True)
                  result.append((''.join(x[1:] for x in lines if x.startswith('-')),
                                 ''.join(x[1:] for x in lines if x.startswith('+'))))
              return result
          hand = pathlib.Path('docs/ou3-alt-main-handover.md')
          old = hand.read_text(); hs = changes(docs[str(hand)])
          assert len(hs) == 1 and not hs[0][0]
          anchor = '## Current checkpoint\n\n'; assert old.count(anchor) == 1
          hand.write_text(old.replace(anchor, anchor + hs[0][1], 1))
          state = pathlib.Path('docs/ou3-proof-research-state.md')
          old = state.read_text(); hs = changes(docs[str(state)])
          assert len(hs) == 3 and not hs[0][0] and hs[1][0] and not hs[2][0]
          marker = '## Parallel ALT contraction/dissipativity track\n'
          assert old.count(marker) == 1
          prefix, tail = old.split(marker, 1)
          anchor = '### Failure analysis and independent critic\n\n'; assert tail.count(anchor) == 1
          tail = tail.replace(anchor, anchor + hs[0][1], 1)
          assert tail.count(hs[1][0]) == 1
          tail = tail.replace(hs[1][0], hs[1][1], 1)
          anchor = '### Current limiter, DEAD_ENDS and next falsifiable work\n\n'; assert tail.count(anchor) == 1
          tail = tail.replace(anchor, anchor + hs[2][1], 1)
          assert hashlib.sha256((marker + tail).encode()).hexdigest() == '2889a7fd272e87be2dff0091cf2a15abc2907aa81a5f492b958c76441b6970cb'
          state.write_text(prefix + marker + tail)
          assert state.read_text().split(marker,1)[0] == prefix, 'original proof modified'
          for path in paths:
              if path != str(state):
                  assert blob(path) == post[path], 'source postimage mismatch: ' + path
          subprocess.run(['git','add','--',str(hand),str(state)], check=True)
          actual = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(actual) == set(paths)
          manifest = {path:hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() for path in paths}
          pathlib.Path('/tmp/ou3-alt-pr524-postimages.json').write_text(json.dumps(manifest,indent=2)+'\n')
          pathlib.Path('/tmp/ou3-alt-pr524-continuation.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--full-index']))
          print('Verified 16 exact source preimages, 17 exact postimages, exact ALT section, and unchanged original proof prefix.')
          PY
          git diff --cached --check
      - name: Install focused proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-scipy python3-mpmath
      - name: Validate all 58 targeted finite-map regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD:$PWD/tools/stability:$PWD/tests/ou3_alt_contraction"
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          python3 -m unittest test_finite_tuner_machine_boundary_commit test_finite_admitted_machine_tunestate_interleaved_prefix test_finite_tuner_machine_boundary test_finite_startup_live_machine_tunestate_bridge test_finite_guarded_tuner_machine_tunestate_deployment test_finite_tuner_sigma_machine_real_join test_finite_admitted_tau_interleaved_prefix test_finite_admitted_wpe_tau_interleaved_prefix test_finite_tuner_machine_candidate_step -v 2>&1 | tee /tmp/ou3-alt-pr524-validation.log
          python3 -m compileall -q tools/stability/ou3_alt_contraction
      - name: Remove both transfer workflows and fast-forward existing PR
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/ou3-alt-pr524-checked-transfer.yml .github/workflows/ou3-alt-pr524-checked-transfer-repair.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ALT: compose binary32 pending/goLive commits and repair executed tuner ancestry'
          git fetch origin proof/ou3-alt-live-mag-composition
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/proof/ou3-alt-live-mag-composition
          git rev-parse HEAD | tee /tmp/ou3-alt-pr524-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ou3-alt-pr524-committed-continuation
          path: |
            /tmp/ou3-alt-pr524-validation.log
            /tmp/ou3-alt-pr524-commit.txt
            /tmp/ou3-alt-pr524-postimages.json
            /tmp/ou3-alt-pr524-continuation.patch
          if-no-files-found: warn
          retention-days: 14
