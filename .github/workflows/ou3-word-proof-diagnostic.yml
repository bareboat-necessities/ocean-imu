name: ou3-word-proof-diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/ou3_sea3_finite_word_translation.py'
      - 'tools/ou3_sea3_finite_word_translation_v3.py'
      - 'tools/ou3_sea3_finite_word_translation_v4.py'
      - 'tools/ou3_sea3_riccati_tube*.py'
      - 'tools/ou3_sea3_endpoint_covariance.py'
      - 'tools/ou3_sea3_dynamic_source_certificate.py'
      - '.github/workflows/ou3-word-proof-diagnostic.yml'

permissions:
  contents: read

jobs:
  commit-word:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build SEA3 covariance ceiling
        run: |
          python3 tools/ou3_sea3_riccati_tube_factored.py \
            --output /tmp/ou3_sea3_riccati_tube.json

      - name: Certify eleven-segment commit-aligned translation word
        run: |
          python3 tools/ou3_sea3_finite_word_translation_v4.py \
            --tube /tmp/ou3_sea3_riccati_tube.json \
            --output /tmp/ou3_sea3_commit_word.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_commit_word.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['history_depth'] == 0
          assert d['source_history_graph_consumed'] is False
          assert d['predecessor_path_enumeration_consumed'] is False
          assert d['old_P2_800_state_graph_consumed'] is False
          assert d['P2_correlation_interface_consumed'] is False
          assert d['commit_aligned_word'] is True
          assert d['word_covers_PE_recurrence'] is True
          assert d['cell_index_forgotten_after_each_segment'] is True
          assert d['tau_path_correlation_assumed_across_segments'] is False
          assert d['useful_gate'] == 1e-18
          print('COMMIT_WORD_SEGMENTS', d['commit_segments_per_word'])
          print('COMMIT_WORD_DURATION', d['word_duration_s_lower'], d['word_duration_s_upper'])
          print('COMMIT_WORD_MAX_IMAGES', d['maximum_segment_image_count'])
          print('COMMIT_WORD_COMMON_SCALE', d['minimum_cross_cell_common_scale'])
          print('COMMIT_WORD_TRANSLATION_DELTA', d['relative_word_injection_floor_lower'])
          print('COMMIT_WORD_TRANSLATION_PASS', d['pass'])
          print('COMMIT_WORD_ENDPOINT_DIAG', d['endpoint_common_lower_diagonal_z'])
          PY

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ou3-sea3-commit-word
          path: |
            /tmp/ou3_sea3_riccati_tube.json
            /tmp/ou3_sea3_commit_word.json
          retention-days: 7
