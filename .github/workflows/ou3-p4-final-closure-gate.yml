name: ou3-p4-final-closure-gate
on:
  push:
    paths: &paths
      - "tools/stability/ou3_p4_final_closure_gate.py"
      - "tools/stability/ou3_p4_complete_brmm_source_cover_contract.py"
      - "tools/stability/ou3_p4_joint_brmm_frontend_transition.py"
      - "tools/stability/ou3_p4_complete_brmm_universal_target_relation.py"
      - "tools/stability/ou3_p4_exact_chord_signed_master_bridge.py"
      - "tools/stability/ou3_p4_reset_domain_binding.py"
      - "tools/stability/ou3_p4_same_cell_correction_domain.py"
      - "tools/stability/ou3_p4_reset_graph_iqc.py"
      - "tools/stability/ou3_p4_reset_signed_absorption_diagnostic.py"
      - "tools/stability/ou3_p4_exact_reset_joint_coordinate.py"
      - "tools/stability/ou3_p4_exact_reset_lifted_qc.py"
      - "tools/stability/ou3_p4_kalman_reset_binary32_iss.py"
      - "tools/stability/ou3_p4_binary32_platform_arithmetic_contract.py"
      - "tools/stability/ou3_p4_hard_entry_set.py"
      - "tools/stability/ou3_p4_bias0_family.py"
      - "tools/stability/ou3_p4_bias1_family.py"
      - "tools/stability/ou3_p4_bias2_family.py"
      - "tools/stability/ou3_p4_bias_family_joint_iss_supply.py"
      - "tools/stability/ou3_p4_p3_execution_admission.py"
      - ".github/workflows/ou3-p4-final-closure-gate.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - name: Build final P4 closure gate
        run: python3 tools/stability/ou3_p4_final_closure_gate.py --output /tmp/p4-final-gate.json
      - name: Enforce fail-closed promotion semantics
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p4-final-gate.json'))
          assert d['validation_pass'],d['validation_failures']
          assert d['hard_entry_set_admitted_without_covariance_membership']
          assert d['exact_chord_projection_BIAS1_same_history_graph_ready']
          assert d['same_cell_Joseph_reset_domain_binding_consumed']
          assert d['conditional_full_shipping_finite_precision_additive_ISS_closed']

          # Permanent theorem-family contract: no substitute proof family may promote P4.
          assert d['canonical_source']=='COMPLETE_BRMM_NORMAL_LIVE_WORD'
          assert d['BRMM_required_for_any_P4_proof']
          assert d['required_bias_families']==['BIAS0','BIAS1','BIAS2']
          for table in ('bias_family_source_uniform_same_history_closed','bias_family_source_admission',
                        'bias_family_joint_ISS_supply_materialized','bias_family_same_history_graph_ready'):
              assert set(d[table])=={'BIAS0','BIAS1','BIAS2'},table
          # Every family is admitted and lifted from its own module; that alone
          # closes nothing, and BIAS0/BIAS2 are never read off BIAS1.
          assert all(d['bias_family_source_admission'].values())
          assert all(d['bias_family_joint_ISS_supply_materialized'].values())
          assert not d['BIAS0_or_BIAS2_inferred_from_BIAS1']
          # The projection/Joseph prerequisites are family-parametric, so every
          # family reaches the graph on its own certificate, and the compactness
          # bound |e_b| <= R+B_true is one number for the three of them.
          assert d['projection_and_Joseph_prerequisites_are_family_parametric']
          assert len(set(d['bias_error_compactness_upper_mps2'].values()))==1
          assert not d['BIAS2_separation_required_for_bounded_bias_objective']
          assert d['signal_generated_tau_sigma_required']
          assert d['tau_sigma_TS_to_RS_interdependence_required']
          assert d['adaptation_schedule_candidate_active_commit_scheduler_required']
          assert not d['independent_tau_sigma_TS_RS_boxes_can_promote']
          assert not d['independent_frequency_sigma_coordinates_can_promote']
          assert d['adaptive_same_signal_source_contract_ready']

          assert not d['point_capture_can_promote']
          assert not d['rowwise_coefficient_boxes_can_promote']
          # Open closure obligations are allowed and must simply hold P4 false.
          if d['remaining_mathematical_P4_blockers']:
              assert not d['P4_MOTION_PASS'] and not d['P4_PASS'] and not d['P5_MAY_START']
          print('REQUIRED_BIAS_FAMILIES',*d['required_bias_families'])
          print('BIAS_FAMILY_ADMISSION',d['bias_family_source_admission'])
          print('BIAS_FAMILY_SUPPLY',d['bias_family_joint_supply_norm_upper_mps2'])
          print('BIAS_FAMILY_GRAPH_READY',d['bias_family_same_history_graph_ready'])
          print('BIAS_FAMILY_CLOSURE',d['bias_family_source_uniform_same_history_closed'])
          print('ADAPTIVE_SOURCE_COVER_CLOSED',d['adaptive_same_signal_source_uniform_cover_closed'])
          print('RESET_DOMAIN_CLOSED',d['source_uniform_same_graph_correction_domain_closed'])
          for mode,m in d['reset_binding_modes'].items():
              print('RESET_BINDING',mode,m['limiting_event'],m['correction_norm_upper'],m['uniform_reset_gain_over_zero_to_ceiling'])
          print('P4_MATHEMATICAL_BLOCKERS',*d['remaining_mathematical_P4_blockers'],sep='\n- ')
          print('P4_DEPLOYMENT_BLOCKERS',*d['remaining_deployment_blockers'],sep='\n- ')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-final-closure-gate
          path: /tmp/p4-final-gate.json
          retention-days: 7
