name: ou3-moving-compatibility
on:
  pull_request:
    paths:
      - "src/kalman_ou_iii/**"
      - "src/kalman_common/**"
      - "tools/stability/ou3_theorem/**"
      - "tests/validation/test_ou3_*.py"
      - "docs/ou3-*.md"
      - "doc/kalman_ou_iii/kalman_ou-w3d-stability-*.tex"
      - "reports/results/ou3_stability/**"
      - ".github/workflows/ou3-moving-compatibility.yml"
  push:
    branches: [main, "proof/ou3-*"]
    paths:
      - "src/kalman_ou_iii/**"
      - "src/kalman_common/**"
      - "tools/stability/ou3_theorem/**"
      - "tests/validation/test_ou3_*.py"
      - "docs/ou3-*.md"
      - "doc/kalman_ou_iii/kalman_ou-w3d-stability-*.tex"
      - "reports/results/ou3_stability/**"
      - ".github/workflows/ou3-moving-compatibility.yml"
concurrency:
  group: ou3-moving-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  moving-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact compatibility and fail-closed status
        run: |
          python3 -m unittest discover -s tests/validation -p test_ou3_moving_quiet_compatibility.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_lemma_manifest.py -v
          python3 -m unittest discover -s tests/validation -p test_ou3_theorem_status.py -v
      - name: Install native diagnostic dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y g++ libeigen3-dev
      - name: Replay actual accepted magnetic information without promotion
        run: |
          python3 -m tools.stability.ou3_theorem.moving_compatibility_diagnostic --eigen /usr/include/eigen3 --output /tmp/ou3-moving-compatibility.json
          cat /tmp/ou3-moving-compatibility.json
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: ou3-moving-compatibility-carried
          path: /tmp/ou3-moving-compatibility.json
          retention-days: 7
          if-no-files-found: warn
