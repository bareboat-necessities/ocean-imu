name: ou3-parity-patch-temp

on:
  push:
    branches:
      - proof/sea3-directional-stability
    paths:
      - .github/workflows/ou3-parity-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact OU-III validation mirrors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/ou_validation.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'OU_III_PSEUDO_PERIOD_BOUNDS_S = (1.0 / 200.0, 0.25)':
                  'OU_III_PSEUDO_PERIOD_BOUNDS_S = (1.0 / 200.0, 0.15)',
              'OU_III_RS_BOUNDS_MS = (0.15, 400.0)':
                  'OU_III_RS_BOUNDS_MS = (0.15, 100.0)',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- tools/ou_validation.py
      - name: Commit exact mirror patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/ou_validation.py
          git commit -m 'validation: synchronize tightened OU-III mirror clamps'
          git push origin HEAD:proof/sea3-directional-stability