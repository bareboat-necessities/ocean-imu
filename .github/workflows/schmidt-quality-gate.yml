name: Schmidt OU-III quality gate

on:
  push:
    branches:
      - agent/experiment-schmidt-s-pseudomeas
    paths:
      - .github/workflows/schmidt-quality-gate.yml
      - src/kalman_ou_iii/**
      - tests/kalman_ou_iii/**
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Download simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 --repo bareboat-necessities/oceanography-waves-lib --pattern 'sim-data-files.zip' --clobber
          unzip -o sim-data-files.zip -d plots/kalman_ou_iii
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libeigen3-dev unzip python3
      - name: Build OU-III tests
        run: make -C tests/kalman_ou_iii build
      - name: Stage simulation inputs
        run: cp plots/kalman_ou_iii/*.csv tests/kalman_ou_iii/
      - name: Run OU-III quality gates
        shell: bash
        run: |
          set -o pipefail
          cd tests/kalman_ou_iii
          chmod +x *.sh
          ./run_tests.sh 2>&1 | tee schmidt-quality-gate.log
      - name: Upload quality-gate log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schmidt-ou-iii-quality-gate
          path: tests/kalman_ou_iii/schmidt-quality-gate.log
          if-no-files-found: warn
