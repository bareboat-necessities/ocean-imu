name: ou3-p5-v34-directional-innovation-row-fast

on:
  pull_request:
    paths:
      - "tools/ou3_p5_sample1_directional_innovation_row_lift_v34.py"
      - "tests/validation/test_ou3_p5_sample1_directional_innovation_row_lift_v34.py"
      - ".github/workflows/ou3-p5-v34-directional-innovation-row-fast.yml"
  push:
    paths:
      - "tools/ou3_p5_sample1_directional_innovation_row_lift_v34.py"
      - "tests/validation/test_ou3_p5_sample1_directional_innovation_row_lift_v34.py"
      - ".github/workflows/ou3-p5-v34-directional-innovation-row-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v34-directional-innovation-row-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-directional-innovation-row-v34:
    name: P5 sample-1 directional innovation row V34
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile V34 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_directional_innovation_row_lift_v34.py \
            tests/validation/test_ou3_p5_sample1_directional_innovation_row_lift_v34.py
      - name: Test V34 semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v test_ou3_p5_sample1_directional_innovation_row_lift_v34
      - name: Emit V34 directional innovation-row lift audit
        run: |
          python3 tools/ou3_p5_sample1_directional_innovation_row_lift_v34.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --current-component-pieces 4 \
            --output /tmp/p5_sample1_v34_directional_innovation_row.json
