name: ou3-tail-phase-diagnostic
on:
  push:
    branches: [proof/ou3-moving-compatibility-audit]
jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev g++
      - name: Fresh 240s and 1200s replay
        run: |
          python3 -m tools.stability.ou3_theorem.moving_compatibility_diagnostic --eigen /usr/include/eigen3 --duration 240 --output /tmp/carried.json
          python3 -m tools.stability.ou3_theorem.moving_compatibility_diagnostic --eigen /usr/include/eigen3 --duration 1200 --output /tmp/carried-1200s.json
          cat /tmp/carried-1200s.json
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-tail-phase-diagnostic
          path: |
            /tmp/carried.json
            /tmp/carried-1200s.json
