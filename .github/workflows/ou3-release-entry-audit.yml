name: ou3-release-entry-audit
on:
  pull_request:
    paths:
      - "tools/stability/ou3_theorem/release_outer_storage_diagnostic.py"
      - ".github/workflows/ou3-release-entry-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install numpy
      - run: sudo apt-get update -qq && sudo apt-get install -y g++ libeigen3-dev
      - name: Compute literal release outer-storage diagnostic
        run: |
          python3 -m tools.stability.ou3_theorem.release_outer_storage_diagnostic --eigen /usr/include/eigen3 --output /tmp/ou3-release-outer.json
          cat /tmp/ou3-release-outer.json
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-release-entry-audit
          path: /tmp/ou3-release-outer.json
          retention-days: 7
