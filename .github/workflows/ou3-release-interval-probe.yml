name: OU3 release interval probe
on:
  workflow_dispatch:
  push:
    branches: [proof/ou3-linked-local-defects]
    paths:
      - 'tools/stability/ou3_theorem/release_interval_propagation.py'
      - 'tools/stability/ou3_theorem/golive_release_seed.py'
      - 'tools/stability/ou3_theorem/interval_riccati_21.py'
      - 'tools/stability/ou3_theorem/psd_factor_innovation.py'
      - 'tools/stability/ou3_theorem/release_factor_probe.py'
      - 'tools/stability/ou3_theorem/release_factor_force_cover.py'
      - 'tools/stability/ou3_theorem/force_direction_cone.py'
      - 'tools/stability/ou3_theorem/release_factor_direction_cover.py'
      - 'tests/validation/test_ou3_force_direction_cone.py'
      - 'tools/stability/ou3_theorem/force_cone_angle_threshold.py'
      - 'tools/stability/ou3_theorem/attitude_factor_threshold.py'
      - 'tools/stability/ou3_theorem/attitude_factor_threshold_solve.py'
      - 'tools/stability/ou3_theorem/attitude_ball_cover.py'
      - 'tools/stability/ou3_theorem/attitude_cover_factor_certificate.py'
      - 'tools/stability/ou3_theorem/joint_attitude_force_threshold.py'
      - 'tools/stability/ou3_theorem/rotated_accel_geometry.py'
      - 'tools/stability/ou3_theorem/rotated_accel_factor_probe.py'
      - 'tools/stability/ou3_theorem/blockwise_accel_gram.py'
      - 'tools/stability/ou3_theorem/blockwise_accel_gram_probe.py'
      - 'tools/stability/ou3_theorem/projector_innovation_inverse.py'
      - 'tools/stability/ou3_theorem/projector_innovation_probe.py'
      - 'tools/stability/ou3_theorem/changing_axis_inj.py'
      - 'tools/stability/ou3_theorem/same_history_axis_mismatch.py'
      - 'tests/validation/test_ou3_changing_axis_inj.py'
      - 'tools/stability/ou3_theorem/force_axis_same_history.py'
      - 'tools/stability/ou3_theorem/force_axis_mismatch_probe.py'
      - '.github/workflows/ou3-release-interval-probe.yml'
      - 'tools/stability/ou3_theorem/theorem_status.py'
      - 'tools/stability/ou3_theorem/release_accel_geometry_cover.py'
      - 'tools/stability/ou3_theorem/release_interval_propagation.py'
      - 'tools/stability/ou3_theorem/accel_geometry_cell.py'
      - 'tools/stability/ou3_theorem/interval_riccati_21.py'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy
      - run: |
          python -c 'import json; from tools.stability.ou3_theorem.force_axis_mismatch_probe import diagnostic; z=diagnostic(); print(json.dumps(z,indent=2)); raise SystemExit(0 if z["verified"] else 1)'
