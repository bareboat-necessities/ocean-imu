name: ou3-p4-candidate-generic-range

on:
  push:
    paths:
      - "tools/ou3_p4_candidate_first_accel_range.py"
      - "tools/ou3_p4_candidate_first_accel_range_v2.py"
      - "tools/ou3_p4_candidate_first_accel_range_v3.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-candidate-generic-range.yml"
  pull_request:
    paths:
      - "tools/ou3_p4_candidate_first_accel_range.py"
      - "tools/ou3_p4_candidate_first_accel_range_v2.py"
      - "tools/ou3_p4_candidate_first_accel_range_v3.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-candidate-generic-range.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-range:
    name: generic 30/25/20/15deg structured accel range
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Emit generic structured range
        run: |
          python3 tools/ou3_p4_candidate_first_accel_range_v3.py \
            --source-pieces 2 --alignment-pieces 16 --force-magnitude-pieces 4 \
            --output /tmp/ou3_p4_generic_accel_range.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_p4_generic_accel_range.json'))
          assert d['validation_pass'], d['validation_failures']
          print('status',d['P4_CANDIDATE_FIRST_ACCEL_RANGE_CERTIFICATE'])
          for r in d['candidate_rows']:
              print('GENERIC_ACCEL_RANGE',r['angle_deg'],
                    'qpred',r['post_prediction_q_upper'],
                    'K',r['max_Ktheta_norm_upper'],
                    'residual',r['max_combined_residual_norm_upper_mps2'],
                    'd',r['max_first_accelerometer_correction_norm_upper_rad'],
                    'safe',r['first_accelerometer_range_safe'])
          PY
