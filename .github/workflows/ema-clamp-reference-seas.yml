name: EMA clamp reference seas

on:
  pull_request:
    branches: [main]

jobs:
  reference-seas:
    if: github.head_ref == 'agent/universal-ema-safety-clamps'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++ make libeigen3-dev python3-numpy
      - name: Download versioned simulation records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 --repo bareboat-necessities/oceanography-waves-lib --pattern sim-data-files.zip --clobber
          mkdir -p /tmp/ema-clamp-data
          unzip -o sim-data-files.zip -d /tmp/ema-clamp-data >/dev/null
      - name: Build all three simulators
        run: |
          make -C tests/kalman_ou_ii kalman_ou_ii-sim
          make -C tests/kalman_ou_iii kalman_ou_iii-sim
          make -C tests/kalman_tfg kalman_tfg-sim
      - name: Replay all eight seas and prove clamps are inactive
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'tools'))
          import ou_validation as ouv

          records = [
              'wave_data_jonswap_H0.270_L14.047_A30.00_P60.00.csv',
              'wave_data_jonswap_H1.500_L50.710_A-30.00_P120.00.csv',
              'wave_data_jonswap_H4.000_L112.766_A30.00_P30.00.csv',
              'wave_data_jonswap_H8.500_L202.839_A-30.00_P72.00.csv',
              'wave_data_pmstokes_H0.270_L14.047_A30.00_P60.00.csv',
              'wave_data_pmstokes_H1.500_L50.710_A-30.00_P120.00.csv',
              'wave_data_pmstokes_H4.000_L112.766_A30.00_P30.00.csv',
              'wave_data_pmstokes_H8.500_L202.839_A-30.00_P72.00.csv',
          ]
          families = {
              'OU-II': ('tests/kalman_ou_ii/kalman_ou_ii-sim', 3.0),
              'OU-III': ('tests/kalman_ou_iii/kalman_ou_iii-sim', 1.5),
              'TFG': ('tests/kalman_tfg/kalman_tfg-sim', 3.0),
          }
          data = Path('/tmp/ema-clamp-data')
          lo_t, hi_t = 0.5, 6.0
          lo_h, hi_h = 0.05, 30.0
          # Strict margin means none of these replays is merely sitting on a clamp.
          eps = 1e-4
          summary = {}

          for family, (binary, drift_mult) in families.items():
              vals = {k: [] for k in ('Tsea','freq','common','variance','drift')}
              for name in records:
                  path = next(data.rglob(name), None)
                  if path is None:
                      raise SystemExit(f'missing {name}')
                  env = dict(os.environ)
                  env['W3D_WRITE_TIMESERIES'] = '0'
                  env['W3D_COLLECT_ALL_GATES'] = '1'
                  env['W3D_VALIDATION_WINDOW_SEC'] = '900'
                  cp = subprocess.run([str(Path(binary).resolve()), '--input', str(path.resolve())],
                                      env=env, text=True, capture_output=True)
                  if cp.returncode not in (0, 2):
                      print(cp.stdout[-3000:]); print(cp.stderr[-3000:], file=sys.stderr)
                      raise SystemExit(f'{family} {name}: simulator exit {cp.returncode}')
                  m = ouv.parse_validation_metrics(cp.stdout)
                  Tz = float(m['wave_period_s'])
                  tau = float(m['tau_applied_s'])
                  Tsea = 0.5*Tz
                  horizons = {
                      'freq': 0.10*Tsea,
                      'common': 0.40*Tsea,
                      'variance': 2.0*Tz,
                      'drift': drift_mult*tau,
                  }
                  if not (lo_t + eps < Tsea < hi_t - eps):
                      raise SystemExit(f'{family} {name}: Tsea {Tsea} touches [{lo_t},{hi_t}]')
                  for channel, h in horizons.items():
                      if not (lo_h + eps < h < hi_h - eps):
                          raise SystemExit(f'{family} {name}: {channel} horizon {h} touches [{lo_h},{hi_h}]')
                  vals['Tsea'].append(Tsea)
                  for k,v in horizons.items(): vals[k].append(v)
                  print(f'{family:6s} {name:62s} Tsea={Tsea:6.3f} tau={tau:6.3f} '
                        f'freq={horizons["freq"]:6.3f} common={horizons["common"]:6.3f} '
                        f'var={horizons["variance"]:6.3f} drift={horizons["drift"]:6.3f}')
              summary[family] = vals

          print('\nREFERENCE-SEA ENVELOPES')
          for family, vals in summary.items():
              print(family)
              for k, xs in vals.items():
                  print(f'  {k:8s}: {min(xs):.4f} .. {max(xs):.4f} s')
          print('\nPASS: all 24 reference replays are strictly interior to the universal EMA safety clamps')
          PY
