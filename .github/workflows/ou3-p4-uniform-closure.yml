name: ou3-p4-uniform-closure

on:
  push:
    paths: &paths
      - "tools/stability/ou3_p4_uniform_closure.py"
      - "tools/stability/ou3_p4_closure_domain.json"
      - "tools/stability/ou3_p4_projection_sector.py"
      - "tools/stability/ou3_projection_sector.py"
      - "tools/stability/ou3_p4_projection_binary32_enclosure.py"
      - "tools/stability/ou3_p4_strong_linear_margin.py"
      - "tools/stability/ou3_brmm_p3_premises.py"
      - "tools/stability/ou3_brmm_riccati_metric_p3.py"
      - "tools/stability/ou3_p4_complete_brmm_differential_events.py"
      - "tools/stability/ou3_p4_complete_brmm_differential_word.py"
      - "tools/stability/ou3_p4_complete_brmm_finite_map_mean_value.py"
      - "tools/stability/ou3_p4_complete_brmm_signed_information_ledger.py"
      - "tools/stability/ou3_p4_complete_brmm_joint_sector_master.py"
      - "tools/stability/ou3_mems_bias_contract.py"
      - "tools/stability/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p4_uniform_closure.py"
      - ".github/workflows/ou3-p4-uniform-closure.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ou3-p4-uniform-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  uniform-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install numpy
        run: sudo apt-get update && sudo apt-get install -y python3-numpy

      - name: Build fail-closed source-uniform closure audit
        run: |
          python3 tools/stability/ou3_p4_uniform_closure.py \
            --output /tmp/ou3-p4-uniform-closure.json

      - name: Test source-uniform closure audit
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p4_uniform_closure

      - name: Enforce admissions and remaining proof blockers
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3-p4-uniform-closure.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['P3_delta_consumed'] == 1e-18
          assert d['qualified_hard_entry_error_set_as_declared_theorem_assumption']
          assert not d['shipping_covariance_used_as_entry_membership_test']
          assert d['BIAS1_admission']['conditional_BIAS1_SOURCE_ADMISSION_PASS']
          assert not d['BIAS1_admission']['assembled_sensor_BIAS0_deployment_qualification_pass']
          assert d['P3_execution_admission']['conditional_execution_premises_admitted']
          assert not d['P3_execution_admission']['physical_execution_admission_proved']
          assert d['projection_global_nonlinear_sector_consumed']
          assert d['projection_finite_precision_closed']
          assert d['projection_finite_precision_contract']['single_evaluation_projection_value_error_norm_upper_mps2'] < 1e-5
          assert not d['source_uniform_Kalman_reset_coefficient_family_enclosed']
          assert not d['consecutive_compatible_storage_inequality_closed']
          assert not d['complete_filter_finite_precision_enclosure_closed']
          assert not d['finite_precision_enclosure_closed']
          assert not d['P4_MOTION_PASS'] and not d['P4_PASS'] and not d['P5_MAY_START']
          assert len(d['remaining_blockers']) >= 3
          print('P4_ADMISSIONS',
                'hard_entry=',d['qualified_hard_entry_error_set_as_declared_theorem_assumption'],
                'bias1=',d['BIAS1_admission']['conditional_BIAS1_SOURCE_ADMISSION_PASS'],
                'p3_execution=',d['P3_execution_admission']['conditional_execution_premises_admitted'],
                'projection_fp=',d['projection_finite_precision_closed'])
          print('P4_BLOCKERS', *d['remaining_blockers'], sep='\n- ')
          print('STRONG_LINEAR_MARGIN', d['strong_linear_margin_diagnostic'])
          PY

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-uniform-closure
          path: /tmp/ou3-p4-uniform-closure.json
          if-no-files-found: warn
          retention-days: 7
