name: render-stability-study-review
on:
  pull_request:
    paths:
      - .github/workflows/render-stability-study-review.yml
      - doc/kalman_ou_iii/**
  push:
    branches: [main]
    paths:
      - .github/workflows/render-stability-study-review.yml
      - doc/kalman_ou_iii/**
concurrency:
  group: render-stability-study-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          # The regional mirror can stall on the large TeX font archives.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y --no-install-recommends \
            texlive-luatex texlive-publishers texlive-latex-extra texlive-science \
            texlive-fonts-recommended texlive-fonts-extra texlive-plain-generic tex-gyre lmodern
      - name: Render two-column stability study
        working-directory: doc/kalman_ou_iii
        run: |
          paper=kalman_ou-w3d-stability-study
          latex=(lualatex -interaction=nonstopmode -halt-on-error "$paper.tex")
          "${latex[@]}"
          bibtex "$paper"
          "${latex[@]}"
          "${latex[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: kalman-ou-w3d-stability-study-two-column
          path: doc/kalman_ou_iii/kalman_ou-w3d-stability-study.pdf
          retention-days: 2
