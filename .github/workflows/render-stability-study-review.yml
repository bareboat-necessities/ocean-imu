name: render-stability-study-review
on:
  pull_request:
    paths:
      - .github/workflows/render-stability-study-review.yml
      - doc/kalman_ou_iii/**
  push:
    branches: [main]
    paths:
      - .github/workflows/render-stability-study-review.yml
      - doc/kalman_ou_iii/**
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: sudo apt-get update -qq && sudo apt-get install -y texlive-luatex texlive-publishers texlive-latex-extra texlive-science texlive-fonts-recommended texlive-fonts-extra
      - name: Render two-column stability study
        working-directory: doc/kalman_ou_iii
        run: |
          lualatex -interaction=nonstopmode -halt-on-error kalman_ou-w3d-stability-study.tex
          lualatex -interaction=nonstopmode -halt-on-error kalman_ou-w3d-stability-study.tex
      - uses: actions/upload-artifact@v4
        with:
          name: kalman-ou-w3d-stability-study-two-column
          path: doc/kalman_ou_iii/kalman_ou-w3d-stability-study.pdf
          retention-days: 2
