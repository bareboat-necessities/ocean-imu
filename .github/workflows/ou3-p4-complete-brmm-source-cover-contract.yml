name: ou3-p4-complete-brmm-source-cover-contract

on:
  push:
    paths: &paths
      - "tools/stability/ou3_p4_complete_brmm_source_cover_contract.py"
      - "tools/stability/ou3_p4_complete_brmm_source_cover_transition.py"
      - "tools/stability/ou3_p4_complete_brmm_adaptive_transition.py"
      - "tools/stability/ou3_p4_complete_brmm_target_cell.py"
      - "tools/stability/ou3_p4_complete_brmm_universal_target_relation.py"
      - "tools/stability/ou3_p4_complete_brmm_frontend_geometry_transition.py"
      - "tools/stability/ou3_p4_wave_period_interval_transition.py"
      - "tools/stability/ou3_p4_joint_estimator_transition.py"
      - "tools/stability/ou3_p4_joint_estimator_prefix_ldlt.py"
      - "tools/stability/ou3_validated_positive_transcendentals.py"
      - "tools/stability/ou3_p4_complete_brmm_finite_map_mean_value.py"
      - "tools/stability/ou3_p4_complete_brmm_differential_events.py"
      - "tools/stability/ou3_brmm_complete_source.py"
      - "tools/stability/ou3_brmm_dynamic_source_certificate.py"
      - "tools/stability/ou3_brmm_wave_period_frontend.py"
      - "tools/stability/ou3_validated_positive_roots.py"
      - "tools/stability/ou3_vector_uco_certificate.py"
      - "tools/stability/ou3_brmm_full_normal_live_word.py"
      - ".github/workflows/ou3-p4-complete-brmm-source-cover-contract.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate fail-closed same-history source-cover contract
        run: |
          python3 tools/stability/ou3_validated_positive_transcendentals.py
          python3 tools/stability/ou3_p4_joint_estimator_transition.py --output /tmp/joint-estimator-transition.json
          python3 tools/stability/ou3_p4_joint_estimator_prefix_ldlt.py --output /tmp/joint-prefix-ldlt.json
          python3 tools/stability/ou3_p4_complete_brmm_source_cover_contract.py --output /tmp/source-cover-contract.json
          python3 tools/stability/ou3_p4_complete_brmm_source_cover_transition.py --output /tmp/source-cover-transition.json
          python3 tools/stability/ou3_p4_complete_brmm_adaptive_transition.py --output /tmp/adaptive-transition.json
          python3 tools/stability/ou3_p4_complete_brmm_target_cell.py --output /tmp/target-cell.json
          python3 tools/stability/ou3_p4_complete_brmm_universal_target_relation.py --output /tmp/universal-target-relation.json
          python3 tools/stability/ou3_p4_wave_period_interval_transition.py --output /tmp/wave-period-transition.json
          python3 tools/stability/ou3_p4_complete_brmm_frontend_geometry_transition.py --output /tmp/frontend-geometry-transition.json
          python3 tools/stability/ou3_p4_complete_brmm_finite_map_mean_value.py --output /tmp/finite-map.json
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'tools/stability')
          from ou3_interval import Interval
          import ou3_p4_complete_brmm_source_cover_contract as C
          import ou3_p4_complete_brmm_differential_events as E

          I=Interval.point
          n=18
          P=[[I(1.0 if i==j else 0.0) for j in range(n)] for i in range(n)]
          R=[[I(1.0 if i==j else 0.0) for j in range(3)] for i in range(3)]
          cell=C.SourceCoverCell(
              source_token='SMOKE_ONE_HISTORY', predecessor_token='SMOKE_PREDECESSOR',
              mode='H', sample_index=0, event_ordinal=1, kind='S_zero',
              state=[I(0.0) for _ in range(n)], P=P,
              dt_s=I(0.005), tau_applied_s=I(2.0), sigma_aw_mps2=I(1.0),
              pseudo_elapsed_s=I(0.015), R=R, R_provenance=E.ACTUAL_RS_PROVENANCE,
              radial_scale=Interval.outward_bounds(0.0,1.0))
          assert C.validate_cell(cell)==[], C.validate_cell(cell)
          ev=E.source_joseph_event(**C.joseph_event_kwargs(cell))
          assert ev['same_P_H_R_cell']
          assert ev['R_provenance']==E.ACTUAL_RS_PROVENANCE

          d=json.load(open('/tmp/source-cover-contract.json'))
          t=json.load(open('/tmp/source-cover-transition.json'))
          a=json.load(open('/tmp/adaptive-transition.json'))
          x=json.load(open('/tmp/target-cell.json'))
          u=json.load(open('/tmp/universal-target-relation.json'))
          w=json.load(open('/tmp/wave-period-transition.json'))
          g=json.load(open('/tmp/frontend-geometry-transition.json'))
          f=json.load(open('/tmp/finite-map.json'))
          j=json.load(open('/tmp/joint-estimator-transition.json'))
          p=json.load(open('/tmp/joint-prefix-ldlt.json'))

          for name,obj in [('contract',d),('transition',t),('adaptive',a),('target',x),('universal',u),('wave',w),('geometry',g),('finite',f),('joint',j),('prefix',p)]:
              assert obj['validation_pass'], (name,obj.get('validation_failures'))

          # Canonical correction: period and sigma must stay on one estimator history.
          assert j['same_signal_wave_period_and_band_state_materialized']
          assert j['tuner_precedes_current_sample_wave_period_update']
          assert j['newly_usable_period_affects_tuner_only_next_sample']
          assert j['fixed_prior_used_until_predecessor_period_usable']
          assert j['same_history_positive_variance_required_before_ratio']
          assert j['raw_period_and_canonical_log_period_relation_materialized']
          assert j['exact_frequency_reciprocal_relation_materialized']
          assert j['adaptive_band_previous_tuner_frequency_lag_materialized']
          assert j['adaptive_band_time_varying_white_noise_covariance_materialized']
          assert j['sigma_first_second_moment_statistic_materialized']
          assert j['band_noise_p11_subtraction_materialized']
          assert j['joint_f_tau_sigma_TS_RS_image_materialized']
          assert not j['independent_f_sigma_rectangle_accepted_by_transition']
          assert not j['physical_BRMM_signal_attachment_closed_here']
          assert not j['all_admitted_same_history_source_cells_emitted_here']
          assert not j['endpoint_and_every_prefix_augmented_LDLT_closed_here']
          assert not j['P4_MOTION_PASS'] and not j['P4_PASS'] and not j['P5_MAY_START']

          assert d['independent_frequency_sigma_coordinates_forbidden']
          assert d['same_signal_history_must_generate_period_and_sigma']
          assert d['joint_estimator_relation_materialized']
          assert not d['joint_estimator_physical_BRMM_attachment_closed']
          assert not d['coarse_frequency_sigma_rectangle_may_promote_P4']
          assert not d['coefficient_target_inclusion_closed']
          assert not d['SOURCE_UNIFORM_COMPLETE_BRMM_COVER_CLOSED']
          assert not d['P4_promoted_here']

          assert u['joint_estimator_relation_materialized_here']
          assert u['joint_transition_rejects_independent_f_sigma']
          assert u['joint_transition_requires_split_on_dependency_loss']
          assert not u['joint_transition_physical_BRMM_attachment_closed']
          assert not u['coefficient_target_inclusion_closed']
          assert not u['complete_source_cover_closed_here']
          assert not u['P4_promoted_here']

          assert p['joint_estimator_child_ancestry_materialized']
          assert p['explicit_root_predecessor_retained']
          assert p['endpoint_cannot_substitute_for_every_prefix']
          assert p['full_interval_ISS_LDLT_reused']
          assert not p['production_source_cover_attached_here']
          assert not p['production_endpoint_LDLT_closed_here']
          assert not p['production_every_prefix_LDLT_closed_here']
          assert not p['P4_MOTION_PASS'] and not p['P4_PASS'] and not p['P5_MAY_START']

          assert t['shipping_covariance_transition_operator_available']
          assert not t['complete_BRMM_source_transition_cover_closed_here']
          assert a['raw_and_effective_sigma_coordinates_preserved']
          assert a['EMA_candidate_transition_available']
          assert a['staged_commit_transition_available']
          assert a['effective_filter_sigma_image_available']
          assert a['scheduler_due_not_due_branch_preserved']
          assert not a['complete_BRMM_adaptive_cover_closed_here']
          assert x['shipping_frequency_clamp_reapplied_before_reciprocal']
          assert x['SpectralMSE_RS_is_same_tau_sigma_image']
          assert x['independent_RS_target_forbidden']
          assert w['shipping_two_high_pass_and_leaky_integrator_transition_materialized']
          assert w['EW_first_second_moment_transition_materialized']
          assert g['fixed_prior_branch_materialized']
          assert g['moment_start_branch_preserved']
          assert not g['physical_rotation_vector_geometry_transition_materialized_here']
          assert f['source_cover_contract_consumed']
          assert not f['source_cover_uniform_complete_BRMM_closed']
          assert not f['P4_promoted_here']

          print('SOURCE_COVER_INTERFACE_SMOKE',ev['same_P_H_R_cell'],ev['R_provenance'])
          print('JOINT_ESTIMATOR_RELATION',d['joint_estimator_relation_materialized'])
          print('PHYSICAL_ATTACHMENT',d['joint_estimator_physical_BRMM_attachment_closed'])
          print('COEFFICIENT_CLOSED',d['coefficient_target_inclusion_closed'])
          print('UNIFORM_CLOSED',d['SOURCE_UNIFORM_COMPLETE_BRMM_COVER_CLOSED'])
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-complete-brmm-source-cover-contract
          path: |
            /tmp/joint-estimator-transition.json
            /tmp/joint-prefix-ldlt.json
            /tmp/source-cover-contract.json
            /tmp/source-cover-transition.json
            /tmp/adaptive-transition.json
            /tmp/target-cell.json
            /tmp/universal-target-relation.json
            /tmp/wave-period-transition.json
            /tmp/frontend-geometry-transition.json
            /tmp/finite-map.json
          retention-days: 7
