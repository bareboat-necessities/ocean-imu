name: ou3-p4-complete-brmm-source-cover-contract

on:
  push:
    paths: &paths
      - "tools/stability/ou3_p4_complete_brmm_source_cover_contract.py"
      - "tools/stability/ou3_p4_complete_brmm_source_cover_transition.py"
      - "tools/stability/ou3_p4_complete_brmm_universal_target_relation.py"
      - "tools/stability/ou3_p4_joint_brmm_frontend_transition.py"
      - "tools/stability/ou3_p4_joint_brmm_prefix_ldlt.py"
      - "tools/stability/ou3_p4_joint_estimator_transition.py"
      - "tools/stability/ou3_p4_joint_estimator_prefix_ldlt.py"
      - "tools/stability/ou3_brmm_finite_window_primitive_qualification.py"
      - "tools/stability/ou3_brmm_complete_source.py"
      - ".github/workflows/ou3-p4-complete-brmm-source-cover-contract.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate same-history source-cover chain
        run: |
          set -euo pipefail
          python3 tools/stability/ou3_p4_joint_estimator_transition.py --output /tmp/joint-estimator.json
          python3 tools/stability/ou3_p4_joint_estimator_prefix_ldlt.py --output /tmp/joint-prefix.json
          python3 tools/stability/ou3_p4_joint_brmm_frontend_transition.py --output /tmp/brmm-frontend.json
          python3 tools/stability/ou3_p4_joint_brmm_prefix_ldlt.py --output /tmp/brmm-prefix.json
          python3 tools/stability/ou3_p4_complete_brmm_universal_target_relation.py --output /tmp/target-relation.json
          python3 tools/stability/ou3_p4_complete_brmm_source_cover_contract.py --output /tmp/source-cover.json
          python3 tools/stability/ou3_p4_complete_brmm_source_cover_transition.py --output /tmp/source-transition.json
          python3 - <<'PY'
          import json
          paths = {
            'joint':'/tmp/joint-estimator.json',
            'joint-prefix':'/tmp/joint-prefix.json',
            'brmm-frontend':'/tmp/brmm-frontend.json',
            'brmm-prefix':'/tmp/brmm-prefix.json',
            'target':'/tmp/target-relation.json',
            'cover':'/tmp/source-cover.json',
            'transition':'/tmp/source-transition.json',
          }
          d={k:json.load(open(v)) for k,v in paths.items()}
          for name,obj in d.items():
              assert obj['validation_pass'], (name,obj.get('validation_failures'))
          u=d['target']; c=d['cover']; bp=d['brmm-prefix']; t=d['transition']
          assert u['joint_estimator_relation_materialized_here']
          assert u['joint_transition_physical_BRMM_attachment_closed']
          assert u['complete_BRMM_predecessor_family_covered']
          assert u['coefficient_target_inclusion_closed']
          assert c['joint_estimator_relation_materialized']
          assert c['joint_estimator_physical_BRMM_attachment_closed']
          assert c['coefficient_target_inclusion_closed']
          # These remain the actual P4 work; do not promote them by interface tests.
          assert not c['SOURCE_UNIFORM_COMPLETE_BRMM_COVER_CLOSED']
          assert not c['source_cover_all_BRMM_continuations_covered']
          assert not c['source_cover_every_radial_segment_covered']
          assert not c['source_cover_all_Joseph_cells_correlated']
          assert not bp['production_endpoint_closed_here']
          assert not bp['production_every_prefix_closed_here']
          assert not t['complete_BRMM_source_transition_cover_closed_here']
          assert not c['P4_promoted_here']
          print('PHYSICAL_ATTACHMENT',u['joint_transition_physical_BRMM_attachment_closed'])
          print('COEFFICIENT_RELATION',u['coefficient_target_inclusion_closed'])
          print('SOURCE_UNIFORM_COVER',c['SOURCE_UNIFORM_COMPLETE_BRMM_COVER_CLOSED'])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ou3-p4-complete-brmm-source-cover-contract
          path: |
            /tmp/joint-estimator.json
            /tmp/joint-prefix.json
            /tmp/brmm-frontend.json
            /tmp/brmm-prefix.json
            /tmp/target-relation.json
            /tmp/source-cover.json
            /tmp/source-transition.json
          retention-days: 7
