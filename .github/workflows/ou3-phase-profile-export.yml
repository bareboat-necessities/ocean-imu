name: ou3-phase-profile-export
on:
  push:
    branches: [proof/ou3-moving-compatibility-audit]
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev g++
      - run: pip install numpy
      - run: |
          python3 -m tools.stability.ou3_theorem.moving_compatibility_diagnostic --eigen /usr/include/eigen3 --duration 1200 --output /tmp/base.json --profile-output /tmp/profile.bin
          python3 -m tools.stability.ou3_theorem.planar_phase_profile /tmp/profile.bin
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-planar-profile
          path: /tmp/profile.bin
