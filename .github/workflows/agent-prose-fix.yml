name: agent-prose-fix

on:
  push:
    branches:
      - agent/fix-article-prose-validation
    paths:
      - .github/workflows/agent-prose-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-article-prose-validation
      - name: Apply prose validation fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          article = Path('doc/kalman_ou_iii/kalman_ou-w3d.tex')
          text = article.read_text()
          old = r'$6.67\pm0.29\%$'
          new = r'$6.66\pm0.29\%$'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one OU-II abstract aggregate, found {text.count(old)}')
          article.write_text(text.replace(old, new))
          test = Path('tests/validation/test_ou_validation.py')
          text = test.read_text()
          old_block = ('        # The stability appendix now closes UES only for the reduced Live\n'
                       '        # performance state under explicit conditions.  The introduction must\n'
                       '        # state that stronger result without broadening it to the unrestricted\n'
                       '        # 21-state estimator or to the optional legacy covariance replacement.\n'
                       '        self.assertIn("18-state Live performance filter", intro)\n'
                       '        self.assertIn("not an ISS or convergence proof of the unrestricted 21-state estimator", intro)\n'
                       '        self.assertIn("UES is not proved for that legacy mode", intro)\n')
          new_block = ('        # The stability appendix now gives a conditional local result for the\n'
                       '        # complete 21-state Live recursion.  The introduction must state that\n'
                       '        # result at exactly that scope and keep the optional legacy raw\n'
                       '        # covariance-replacement mode outside the theorem.\n'
                       '        self.assertIn("local 21-state stability result", intro)\n'
                       '        self.assertIn("uniformly detectable 21-state system", intro)\n'
                       '        self.assertIn("UES of the homogeneous 21-state Live error dynamics", intro)\n'
                       '        self.assertIn("optional legacy raw", intro)\n'
                       '        self.assertIn("outside that theorem", intro)\n')
          if text.count(old_block) != 1:
              raise SystemExit('stale stability-prose guard block not found exactly once')
          test.write_text(text.replace(old_block, new_block))
          PY
          rm .github/workflows/agent-prose-fix.yml
          git config user.name "Mikhail Grushinskiy"
          git config user.email "mgrouch@users.noreply.github.com"
          git add doc/kalman_ou_iii/kalman_ou-w3d.tex tests/validation/test_ou_validation.py .github/workflows/agent-prose-fix.yml
          git commit -m "Fix article prose validation"
          git push origin HEAD:agent/fix-article-prose-validation
