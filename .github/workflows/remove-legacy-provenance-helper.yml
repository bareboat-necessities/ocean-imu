name: remove-legacy-provenance-helper

on:
  push:
    branches: [agent/harden-ou-evidence-provenance]
    paths:
      - .legacy-provenance-cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/harden-ou-evidence-provenance
      - name: Remove obsolete robustness restatement provenance helper
        run: |
          python3 tools/remove_legacy_robustness_provenance.py
          python3 -m py_compile tools/ou_robustness.py
          ! grep -q '_restated_source_files' tools/ou_robustness.py
          ! grep -q 'sources_moved_since_rows' tools/ou_robustness.py
      - name: Commit cleanup
        run: |
          set -euo pipefail
          rm tools/remove_legacy_robustness_provenance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ou_robustness.py tools/remove_legacy_robustness_provenance.py
          git commit -m "Remove obsolete robustness restatement provenance path"
          git push origin HEAD:refs/heads/agent/harden-ou-evidence-provenance
