name: ou3-stability-json-relocation-final

on:
  push:
    branches:
      - codex/ou3-p4-p5-complete-sea3-after-492
    paths:
      - ".github/workflows/ou3-stability-json-relocation-final.yml"

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/codex/ou3-p4-p5-complete-sea3-after-492
          fetch-depth: 1

      - name: Relocate stability-domain JSON consumers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          stability = Path("tools/stability")
          pairs = (
              (' / "tools" / "ou3_proof_operating_domain.json"',
               ' / "tools" / "stability" / "ou3_proof_operating_domain.json"'),
              (' / "tools" / "ou3_sea3_directional_response_domain.json"',
               ' / "tools" / "stability" / "ou3_sea3_directional_response_domain.json"'),
          )
          changed = []
          for path in sorted(stability.glob("ou3_*.py")):
              old = path.read_text(encoding="utf-8")
              new = old
              for a, b in pairs:
                  new = new.replace(a, b)
              if new != old:
                  path.write_text(new, encoding="utf-8")
                  changed.append(str(path))

          workflow_pairs = (
              ("tools/" + "ou3_proof_operating_domain.json",
               "tools/stability/" + "ou3_proof_operating_domain.json"),
              ("tools/" + "ou3_sea3_directional_response_domain.json",
               "tools/stability/" + "ou3_sea3_directional_response_domain.json"),
          )
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              if path.name in {
                  "ou3-stability-json-relocation-once.yml",
                  "ou3-stability-json-relocation-final.yml",
              }:
                  continue
              old = path.read_text(encoding="utf-8")
              new = old
              for a, b in workflow_pairs:
                  new = new.replace(a, b)
              if new != old:
                  path.write_text(new, encoding="utf-8")
                  changed.append(str(path))
          print("rewritten", len(changed), "files")
          if len(changed) != 39:
              raise SystemExit(f"expected validated 39-file rewrite, got {len(changed)}")
          PY

          git rm tools/ou3_proof_operating_domain.json
          git rm tools/ou3_sea3_directional_response_domain.json
          git rm .github/workflows/ou3-stability-json-relocation-once.yml
          git rm .github/workflows/ou3-stability-json-relocation-final.yml

      - name: Verify exact relocation
        run: |
          python3 -m py_compile tools/stability/*.py
          python3 -m unittest -v tests.validation.test_ou3_stability_package_integrity

      - name: Commit and push relocation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move stability JSON domains into package"
          git push origin HEAD:refs/heads/codex/ou3-p4-p5-complete-sea3-after-492
