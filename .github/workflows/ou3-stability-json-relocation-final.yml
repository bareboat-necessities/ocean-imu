name: ou3-stability-json-relocation-final
on:
  push:
    branches: [codex/ou3-p4-p5-complete-sea3-after-492]
    paths: [.github/workflows/ou3-stability-json-relocation-final.yml]
permissions:
  contents: write
jobs:
  prepare-final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d2e2eb198192228de495e360cee5dd3bd81fd1e4
          persist-credentials: false
      - name: Reconstruct and hash-verify the combined reviewed tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          base='https://api.github.com/repos/bareboat-necessities/ocean-imu'
          def get_blob(sha):
              req=urllib.request.Request(base+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  d=json.load(response)
              raw=base64.b64decode(d['content'])
              assert blob_sha(raw)==sha,sha
              return raw
          def blob_sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          chunks=['d9837fca7f8a9a7a6fce44f318291c09b830f223','4773fcfc2e11ad3cfe6d58aa2ae301a8078dbf06','4510dfb08a66c54468aaa9ce2ca6033cbfbd089a']
          payload=gzip.decompress(base64.b64decode(b''.join(get_blob(s) for s in chunks),validate=True))
          assert hashlib.sha256(payload).hexdigest()=='aa853258e57cca333940704dd6d98cd212e8c8a8f6ef9eeeab321692357aecf5'
          plan=json.loads(payload)
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==plan['base_tree']
          for item in plan['files']:
              p=pathlib.Path(item['path'])
              assert not p.is_absolute() and '..' not in p.parts
              lines=get_blob(item['source_blob']).decode().splitlines(keepends=True)
              for i,j,text in reversed(item['edits']):
                  lines[i:j]=[text]
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(''.join(lines),encoding='utf-8')
              os.chmod(p,int(item['mode'],8)&0o777)
              assert blob_sha(p.read_bytes())==item['sha'],str(p)
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==plan['target_tree']=='7d87f1a2bd32442943b6691a77be975aec76802c',tree
          assert subprocess.check_output(['git','rev-parse',tree+':src'],text=True).strip()=='53a10a7c02b1a0de4cef5ebab6e13e81909c4cdd'
          pathlib.Path('/tmp/ou3-final-plan.json').write_bytes(payload)
          print('VERIFIED_FINAL_TREE',tree)
          PY
          git diff --cached --check
          make -C tests/validation build
      - name: Test final algebra and source foundation
        run: |
          python3 -m unittest -v tests.validation.test_ou3_stability_package_integrity tests.validation.test_ou3_p4_coordinate_transport_algebra tests.validation.test_ou3_p4_complete_sea3_correction_information_bound tests.validation.test_ou3_result_determinism tests.validation.test_ou3_source_domain_contract tests.validation.test_ou3_proof_cleanup tests.validation.test_ou3_translational_uco_ucc tests.validation.test_ou3_full_process_ucc tests.validation.test_ou3_vector_uco_certificate tests.validation.test_ou3_p3_pseudo_scheduler_progress_certificate tests.validation.test_ou3_sea3_spectral_moment_bridge
      - name: Test every retained P4 helper
        working-directory: tests/validation
        run: python3 -m unittest discover -v -p 'test_ou3_p4_*.py'
      - name: Publish verified content blobs without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          plan=json.loads(pathlib.Path('/tmp/ou3-final-plan.json').read_text())
          entries=[]
          base='https://api.github.com/repos/bareboat-necessities/ocean-imu'
          for item in plan['files']:
              payload={'content':pathlib.Path(item['path']).read_text(),'encoding':'utf-8'}
              req=urllib.request.Request(base+'/git/blobs',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  result=json.load(response)
              assert result['sha']==item['sha'],item['path']
              entries.append({'path':item['path'],'mode':item['mode'],'type':'blob','sha':item['sha']})
          out={'base_tree':plan['base_tree'],'target_tree':plan['target_tree'],'workflow_head':os.environ['GITHUB_SHA'],'entries':entries,'foundation_tests':72,'P4_helper_tests':33,'P4_promoted':False,'branch_updated':False}
          pathlib.Path('/tmp/ou3-final-blobs.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ou3-pr493-final-publication
          path: |
            /tmp/ou3-final-plan.json
            /tmp/ou3-final-blobs.json
          retention-days: 1
