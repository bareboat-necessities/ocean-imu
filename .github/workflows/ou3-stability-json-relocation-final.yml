name: ou3-stability-json-relocation-final
on:
  push:
    branches: [codex/ou3-p4-p5-complete-sea3-after-492]
    paths: [.github/workflows/ou3-stability-json-relocation-final.yml]
permissions:
  contents: write
jobs:
  prepare-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 80abe1beaa77feb13c994309551734810434e2bc
          persist-credentials: false
      - name: Reproduce checksum-verified preparation and tests
        run: |
          python3 - <<'PY'
          import hashlib,re,subprocess,textwrap,urllib.request
          url='https://raw.githubusercontent.com/bareboat-necessities/ocean-imu/4de1d07d65b2a970b2ec64ef5f7fdb14d226036d/.github/workflows/ou3-stability-json-relocation-final.yml'
          with urllib.request.urlopen(url,timeout=60) as response:
              raw=response.read()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='d094810d089980959df9e80e82fa1a0cfc2ad152'
          block=re.search(r'        run: \|\n(.*?)\n      - name: Stage',raw.decode(),re.S).group(1)
          subprocess.run(['bash','-e','-c',textwrap.dedent(block)],check=True)
          PY
      - name: Upload content blobs; leave tree and branch writes to connected GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.error,urllib.request
          url='https://api.github.com/repos/bareboat-necessities/ocean-imu/git/blobs'
          entries=[]
          for name in json.loads(pathlib.Path('/tmp/prepared-paths.json').read_text()):
              path=pathlib.Path(name)
              entry={'path':name,'mode':'100644','type':'blob','sha':None}
              if path.is_file():
                  data=path.read_bytes()
                  expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  request=urllib.request.Request(url,data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
                  try:
                      with urllib.request.urlopen(request,timeout=60) as response:
                          result=json.load(response)
                  except urllib.error.HTTPError as error:
                      print('BLOB_UPLOAD_ERROR',error.code,error.read().decode())
                      raise
                  assert result['sha']==expected,name
                  entry['sha']=expected
              entries.append(entry)
          manifest={'base_tree':'8fee0b062584a58fd34c60269a6f40912069c422','target_tree':'81c38af8be3cd4ed511785b7b8742391960df1bc','parent':os.environ['GITHUB_SHA'],'tree_elements':entries,'branch_updated':False}
          pathlib.Path('/tmp/ou3-prepared.json').write_text(json.dumps(manifest,indent=2))
          print('PREPARED_OBJECTS',json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-prepared-handoff
          path: /tmp/ou3-prepared.json
          retention-days: 1
