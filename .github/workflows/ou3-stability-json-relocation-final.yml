name: ou3-stability-json-relocation-final

on:
  push:
    branches:
      - codex/ou3-p4-p5-complete-sea3-after-492
    paths:
      - ".github/workflows/ou3-stability-json-relocation-final.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export exact tracked source for relocation and proof tests
        run: |
          git rev-parse HEAD > /tmp/ou3-checkout-sha.txt
          git archive --format=tar.gz HEAD > /tmp/ou3-current-checkout.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-current-checkout
          path: |
            /tmp/ou3-current-checkout.tar.gz
            /tmp/ou3-checkout-sha.txt
          retention-days: 1
