name: period-statistics-retune
on:
  push:
    branches:
      - agent/period-log-smoothing-retune

concurrency:
  group: period-statistics-retune
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  joint-confirmation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/period-log-smoothing-retune
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libeigen3-dev unzip python3-numpy python3-pandas python3-scipy
      - name: Fetch reference wave records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 --repo bareboat-necessities/oceanography-waves-lib --pattern 'sim-data-files.zip' --clobber
          unzip -o sim-data-files.zip -d plots/kalman_ou_iii
      - name: Ten-seed joint confirmation
        run: |
          python3 -u tools/ou_period_statistics_joint.py \
            --seeds 10 --jobs 4 \
            --data-dir plots/kalman_ou_iii \
            --csv reports/results/period_statistics_retune/joint_confirmation_runs.csv \
            --report reports/results/period_statistics_retune/joint_confirmation.md
      - name: Upload joint-confirmation evidence
        uses: actions/upload-artifact@v4
        with:
          name: period-statistics-joint-confirmation
          path: |
            reports/results/period_statistics_retune/joint_confirmation.md
            reports/results/period_statistics_retune/joint_confirmation_runs.csv
          if-no-files-found: error
      - name: Commit joint-confirmation evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            reports/results/period_statistics_retune/joint_confirmation.md \
            reports/results/period_statistics_retune/joint_confirmation_runs.csv
          if git diff --cached --quiet; then
            echo 'Joint-confirmation evidence already matches the branch.'
            exit 0
          fi
          git commit -m 'Record ten-seed joint period-statistics confirmation'
          git push origin HEAD:agent/period-log-smoothing-retune
