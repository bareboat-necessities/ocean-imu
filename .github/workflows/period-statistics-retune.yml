name: period-statistics-retune
on:
  push:
    branches:
      - agent/period-log-smoothing-retune

concurrency:
  group: period-statistics-retune
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - axis: moment
            values: '3,4,5,6,8'
            baseline: '8'
          - axis: log
            values: '0,0.05,0.10,0.15,0.50'
            baseline: '0.50'
          - axis: sigma_k
            values: '2,2.5,3,3.5,4'
            baseline: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/period-log-smoothing-retune
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libeigen3-dev unzip python3-numpy python3-pandas python3-scipy
      - name: Fetch reference wave records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 --repo bareboat-necessities/oceanography-waves-lib --pattern 'sim-data-files.zip' --clobber
          unzip -o sim-data-files.zip -d plots/kalman_ou_iii
      - name: Five-seed fine sweep
        run: |
          python3 -u tools/ou_period_statistics_retune.py \
            --axis '${{ matrix.axis }}' \
            --values '${{ matrix.values }}' \
            --baseline '${{ matrix.baseline }}' \
            --seeds 5 --jobs 4 \
            --data-dir plots/kalman_ou_iii \
            --csv 'reports/results/period_statistics_retune/fine_${{ matrix.axis }}_runs.csv' \
            --report 'reports/results/period_statistics_retune/fine_${{ matrix.axis }}.md'
      - name: Upload fine-sweep evidence
        uses: actions/upload-artifact@v4
        with:
          name: period-statistics-fine-${{ matrix.axis }}
          path: |
            reports/results/period_statistics_retune/fine_${{ matrix.axis }}.md
            reports/results/period_statistics_retune/fine_${{ matrix.axis }}_runs.csv
          if-no-files-found: error

  record-fine-evidence:
    if: github.actor != 'github-actions[bot]'
    needs: fine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/period-log-smoothing-retune
      - name: Download fine-sweep evidence
        uses: actions/download-artifact@v4
        with:
          pattern: period-statistics-fine-*
          merge-multiple: true
          path: reports/results/period_statistics_retune
      - name: Commit fine evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            reports/results/period_statistics_retune/fine_moment.md \
            reports/results/period_statistics_retune/fine_moment_runs.csv \
            reports/results/period_statistics_retune/fine_log.md \
            reports/results/period_statistics_retune/fine_log_runs.csv \
            reports/results/period_statistics_retune/fine_sigma_k.md \
            reports/results/period_statistics_retune/fine_sigma_k_runs.csv
          if git diff --cached --quiet; then
            echo 'Fine-sweep evidence already matches the branch.'
            exit 0
          fi
          git commit -m 'Record five-seed period-statistics fine sweeps'
          git push origin HEAD:agent/period-log-smoothing-retune
