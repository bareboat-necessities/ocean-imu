name: period-statistics-retune
on:
  push:
    branches:
      - agent/period-log-smoothing-retune

concurrency:
  group: period-statistics-retune
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  coarse:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/period-log-smoothing-retune
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libeigen3-dev unzip python3-numpy python3-pandas python3-scipy
      - name: Fetch reference wave records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 --repo bareboat-necessities/oceanography-waves-lib --pattern 'sim-data-files.zip' --clobber
          unzip -o sim-data-files.zip -d plots/kalman_ou_iii
      - name: Coarse wave-period moment horizon
        run: |
          python3 -u tools/ou_period_statistics_retune.py \
            --axis moment --values 4,6,8,10 --baseline 8 --seeds 1 --jobs 4 \
            --data-dir plots/kalman_ou_iii \
            --csv reports/results/period_statistics_retune/coarse_moment_runs.csv \
            --report reports/results/period_statistics_retune/coarse_moment.md
      - name: Coarse log-period smoothing horizon
        run: |
          python3 -u tools/ou_period_statistics_retune.py \
            --axis log --values 0,0.10,0.25,0.50,1.0 --baseline 0.50 --seeds 1 --jobs 4 \
            --data-dir plots/kalman_ou_iii \
            --csv reports/results/period_statistics_retune/coarse_log_runs.csv \
            --report reports/results/period_statistics_retune/coarse_log.md
      - name: Coarse acceleration-variance horizon
        run: |
          python3 -u tools/ou_period_statistics_retune.py \
            --axis sigma_k --values 1,2,3,4,6 --baseline 2 --seeds 1 --jobs 4 \
            --data-dir plots/kalman_ou_iii \
            --csv reports/results/period_statistics_retune/coarse_sigma_k_runs.csv \
            --report reports/results/period_statistics_retune/coarse_sigma_k.md
      - name: Commit coarse evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- reports/results/period_statistics_retune
          git commit -m 'Record coarse period-statistics retuning sweeps'
          git push origin HEAD:agent/period-log-smoothing-retune
