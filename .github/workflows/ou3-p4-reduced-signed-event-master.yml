name: ou3-p4-reduced-signed-event-master
on:
  push:
    paths: &paths
      - "tools/stability/ou3_p4_reduced_signed_event_master.py"
      - "tools/stability/ou3_p4_joseph_reset_reduced_signed_identity.py"
      - ".github/workflows/ou3-p4-reduced-signed-event-master.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reduced-event-master:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - name: Materialize reduced event quadratic
        run: python3 tools/stability/ou3_p4_reduced_signed_event_master.py --output /tmp/reduced-event-master.json
      - name: Enforce exact algebra and fail-closed status
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/reduced-event-master.json'))
          assert d['validation_pass'],d['validation_failures']
          assert d['augmented_matrix_API_available']
          assert d['full_Joseph_correction_d_retained']
          assert d['reset_uses_attitude_selector_of_d_downstream']
          assert d['dense_q_eta_d_b_e_cross_terms_retained']
          assert not d['S_inverse_used'] and not d['posterior_precision_used']
          assert not d['independent_K_box_used'] and not d['independent_reset_norm_port_used']
          assert d['algebra_smoke_quadratic_defect'] < 1e-10
          assert not d['source_uniform_event_LDLT_closed_here']
          assert not d['P4_promoted_here']
          print('REDUCED_EVENT_MASTER_DEFECT',d['algebra_smoke_quadratic_defect'])
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-reduced-signed-event-master
          path: /tmp/reduced-event-master.json
          retention-days: 7
