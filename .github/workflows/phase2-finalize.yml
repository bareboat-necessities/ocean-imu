name: phase2-finalize

on:
  pull_request:
    paths:
      - ".github/workflows/phase2-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase2-constructive-live-basin
          fetch-depth: 0

      - name: Install Eigen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev

      - name: Finalize manuscript and semantic contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cert_path = Path('doc/kalman_ou_iii/w3d-live-basin-certificate.tex-part')
          cert = cert_path.read_text(encoding='utf-8')

          start = cert.index(r'\subsubsection{Exact finite-horizon contraction certificate}')
          end = cert.index(r'\subsubsection{Constructive nonlinear remainder}')

          metric_section = r'''\subsubsection{Riccati-metric finite-horizon certificate}

          The fixed physical scaling remains useful for interpreting a basin, but it is
          unnecessarily strong to demand short-horizon contraction in that one Euclidean
          norm.  The residual accelerometer-bias state has the deliberately slow default
          correlation time $\tau_b=\SI{5000}{s}$, and non-normal coupling can therefore
          produce a long Euclidean transient even when the homogeneous Kalman error
          dynamics are UES.  A constructive certificate should use the Lyapunov metric
          already generated by the Riccati recursion rather than hide that transient by
          retuning the coordinate scales.

          Let $\mat P_k$ be the posterior covariance at the indexing phase used in
          Lemma~\ref{lem:iss-block-remainder}, and define the covariance in the fixed
          dimensionless coordinates by
          \begin{equation}
          \mat P_{z,k}=\mat D\mat P_k\mat D^\top .
          \label{eq:iss-cert-Pz}
          \end{equation}
          On a certified Live interval require finite positive bounds
          \begin{equation}
          0<\underline p\,\mat I
          \preceq \mat P_{z,k}
          \preceq \overline p\,\mat I<\infty .
          \label{eq:iss-cert-Pz-bounds}
          \end{equation}
          Write $\mat P_{z,k}=\mat L_k\mat L_k^\top$ with any nonsingular
          factor $\mat L_k$ and define the time-varying norm
          \begin{equation}
          \|\vct z\|_{V_k}:=\|\mat L_k^{-1}\vct z\|_2 .
          \label{eq:iss-cert-Vnorm}
          \end{equation}

          For the normal Live recursion, the exact prediction covariance, Joseph-form
          accepted measurement updates, and the proof-compatible positive-semidefinite
          $a_w$ covariance floor can be composed as
          \begin{equation}
          \mat P_{z,k+1}
          =\widetilde{\mat A}_k\mat P_{z,k}\widetilde{\mat A}_k^\top
           +\mat\Omega_{z,k},
          \qquad \mat\Omega_{z,k}\succeq0,
          \label{eq:iss-cert-cov-recursion}
          \end{equation}
          where $\widetilde{\mat A}_k$ is Eq.~\eqref{eq:iss-cert-one-step}.
          Hard reinitializations remain Live-interval boundaries and are not represented by
          Eq.~\eqref{eq:iss-cert-cov-recursion}.  It follows immediately that
          \begin{equation}
          \left\|
          \mat L_{k+1}^{-1}\widetilde{\mat A}_k\mat L_k
          \right\|_2\le1,
          \label{eq:iss-cert-one-step-nonexpansive}
          \end{equation}
          because the product times its transpose is bounded above by the identity.
          Thus every prefix is nonexpansive in the Riccati metric; no separate empirical
          prefix constant is required.

          For an integer horizon $H\ge1$, define the strict lifted contraction
          \begin{equation}
          \chi_{V,H}:=
          \sup_k\left\|
          \mat L_{k+H}^{-1}
          \widetilde\Psi(k+H,k)
          \mat L_k
          \right\|_2 .
          \label{eq:iss-cert-chi}
          \end{equation}

          \begin{theorem}[Constructive Riccati-metric UES certificate]
          \label{thm:iss-cert-finite-horizon}
          Suppose an uninterrupted Live interval satisfies
          Eqs.~\eqref{eq:iss-cert-Pz-bounds} and
          \eqref{eq:iss-cert-one-step-nonexpansive}, and for one fixed $H$,
          \begin{equation}
          \chi_{V,H}\le\overline\chi<1 .
          \label{eq:iss-cert-contract}
          \end{equation}
          Then the homogeneous transition is UES in the fixed dimensionless Euclidean
          coordinates with the explicit constants
          \begin{equation}
          \boxed{
          \rho_H=\overline\chi^{1/H},
          \qquad
          M_H=\sqrt{\frac{\overline p}{\underline p}}\,
              \rho_H^{-(H-1)} .}
          \label{eq:iss-cert-M-rho}
          \end{equation}
          In particular,
          \begin{equation}
          \|\widetilde\Psi(k,j)\|_2
          \le M_H\rho_H^{k-j},\qquad k\ge j,
          \label{eq:iss-cert-ues}
          \end{equation}
          and the projected constants in
          Eq.~\eqref{eq:iss-block-projected-gains} may conservatively be chosen as
          \begin{equation}
          M_{\xi\xi}=M_{\xi\ell}=M_\xi=M_H.
          \label{eq:iss-cert-projected-M}
          \end{equation}
          \end{theorem}

          \begin{proof}
          Write $k-j=qH+r$ with $0\le r<H$.  Equation
          \eqref{eq:iss-cert-one-step-nonexpansive} bounds the metric norm of the
          $r$-sample prefix by one, while each complete $H$-sample block contributes at
          most $\overline\chi$.  Hence
          \begin{equation}
          \|\vct z_k\|_{V_k}
          \le\overline\chi^q\|\vct z_j\|_{V_j}.
          \end{equation}
          Equation~\eqref{eq:iss-cert-Pz-bounds} gives
          $\|\vct z\|_2\le\sqrt{\overline p}\|\vct z\|_{V}$ and
          $\|\vct z\|_{V}\le\|\vct z\|_2/\sqrt{\underline p}$.
          Therefore
          \begin{equation}
          \|\vct z_k\|_2
          \le\sqrt{\frac{\overline p}{\underline p}}
             \overline\chi^q\|\vct z_j\|_2.
          \end{equation}
          With $\rho_H=\overline\chi^{1/H}$ and
          $qH\ge k-j-(H-1)$, this becomes Eq.~\eqref{eq:iss-cert-ues} with
          Eq.~\eqref{eq:iss-cert-M-rho}.  Projection by coordinate selectors has unit
          Euclidean norm, which yields Eq.~\eqref{eq:iss-cert-projected-M}.
          \end{proof}

          Theorem~\ref{thm:iss-cert-finite-horizon} is still an interval certificate,
          not a grid theorem.  A trajectory called certified must satisfy its own
          covariance bounds and lifted contraction inequality.  Reference replay is used
          only to show that the conditions are numerically plausible for the deployed
          operating points.

          '''

          cert = cert[:start] + metric_section + cert[end:]

          diag_start = cert.index(r'\subsubsection{Deployed-point margin diagnostic}')
          diag_tail = r'''\subsubsection{Deployed-point margin diagnostic}
          \label{sec:iss-cert-diagnostic}

          The host-side program \texttt{live\_basin\_diagnostic.cpp} reconstructs the
          exact homogeneous transition from the filter's prediction matrices, accepted
          measurement Jacobians, and Kalman gains.  It evaluates both the fixed scaled
          Euclidean norm and the Riccati metric of
          Eq.~\eqref{eq:iss-cert-Vnorm} after a \SI{120}{s} covariance warm-up, using a
          \SI{30}{s} lifted horizon at the eight committed SpectralMSE reference operating
          points.

          The Euclidean diagnostic deliberately does not pass a short-horizon contraction
          test: its worst \SI{30}{s} norm is $6.03$ and the largest prefix norm is $12.05$.
          This is why Phase 2 does not manufacture a favorable answer by rebalancing the
          physical coordinate scales.  In the Riccati metric, all eight points contract:
          \begin{equation}
          0.9354\le\chi_{V,30}\le0.9443 .
          \label{eq:iss-cert-reference-chi}
          \end{equation}
          Across those same trajectories the sampled scaled-covariance envelope is
          \begin{equation}
          2.009\times10^{-8}\le
          \lambda_{\min}(\mat P_z),\qquad
          \lambda_{\max}(\mat P_z)\le6.458\times10^{-3},
          \label{eq:iss-cert-reference-Pz}
          \end{equation}
          giving the pooled conversion factor
          $\sqrt{\overline p/\underline p}=566.9$.  Combining the worst reference
          contraction with that pooled covariance envelope gives
          $\rho_H=0.99999045$ per IMU sample
          ($0.998091$ per second) and the deliberately conservative
          $M_H\approx600.35$.

          These numbers are a reproducible margin report, not substituted hypotheses of
          Theorem~\ref{thm:iss-cert-finite-horizon}.  An unexamined Live trajectory must
          establish its own $\chi_{V,H}$ and covariance envelope before the numerical
          basin inequality is called certified.  The diagnostic is therefore a regression
          witness for feasibility of the certificate rather than a finite-grid proof of
          UES.
          '''
          cert = cert[:diag_start] + diag_tail
          cert_path.write_text(cert, encoding='utf-8')

          sem_path = Path('doc/kalman_ou_iii/w3d-semiglobal-stability.tex-part')
          sem = sem_path.read_text(encoding='utf-8')
          inc = r'\input{w3d-live-basin-certificate.tex-part}'
          if inc not in sem:
              anchor = r'\input{w3d-block-local-iss.tex-part}' + '\n'
              if anchor not in sem:
                  raise SystemExit('block-local include anchor not found')
              sem = sem.replace(anchor, anchor + inc + '\n', 1)
          sem_path.write_text(sem, encoding='utf-8')

          test = r'''"""Semantic contract for the OU--III Phase-2 Live-basin certificate."""
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          DOC = ROOT / "doc" / "kalman_ou_iii"
          TEST = ROOT / "tests" / "kalman_ou_iii"

          class OUIIILiveBasinCertificateContractTests(unittest.TestCase):
              def test_certificate_is_wired_after_block_local_refinement(self):
                  sem = (DOC / "w3d-semiglobal-stability.tex-part").read_text(encoding="utf-8")
                  block = r"\input{w3d-block-local-iss.tex-part}"
                  cert = r"\input{w3d-live-basin-certificate.tex-part}"
                  self.assertIn(cert, sem)
                  self.assertLess(sem.index(block), sem.index(cert))

              def test_certificate_uses_riccati_metric_not_fixed_euclidean_contraction(self):
                  text = (DOC / "w3d-live-basin-certificate.tex-part").read_text(encoding="utf-8")
                  for marker in (
                      r"\label{eq:iss-cert-Pz}",
                      r"\label{eq:iss-cert-Vnorm}",
                      r"\chi_{V,H}",
                      r"\label{thm:iss-cert-finite-horizon}",
                      r"\sqrt{\frac{\overline p}{\underline p}}",
                      "0.9354",
                      "0.9443",
                      "$6.03$",
                      "not a finite-grid proof",
                  ):
                      self.assertIn(marker, text)

              def test_diagnostic_uses_fixed_size_safe_svd_and_metric_gate(self):
                  src = (TEST / "live_basin_diagnostic.cpp").read_text(encoding="utf-8")
                  self.assertIn("covariance_metric_norm", src)
                  self.assertIn("all_reference_metric_contract", src)
                  self.assertNotIn("ComputeThinU", src)
                  self.assertNotIn("ComputeThinV", src)
                  run = (TEST / "run_tests.sh").read_text(encoding="utf-8")
                  self.assertIn("./live_basin_diagnostic", run)

          if __name__ == "__main__":
              unittest.main()
          '''
          Path('tests/validation/test_ou_live_basin_certificate.py').write_text(test, encoding='utf-8')

          for name in (
              '.github/workflows/phase2-horizon-probe.yml',
              '.github/workflows/phase2-metric-probe.yml',
              '.github/workflows/phase2-live-basin.yml',
              'tests/kalman_ou_iii/live_basin_metric_probe.cpp',
              '.github/workflows/phase2-finalize.yml',
          ):
              p = Path(name)
              if p.exists():
                  p.unlink()
          PY

      - name: Verify focused Phase-2 contracts
        run: |
          make -C tests/kalman_ou_iii live_basin_diagnostic
          tests/kalman_ou_iii/live_basin_diagnostic
          python3 tests/validation/test_ou_live_basin_certificate.py
          python3 tests/validation/test_ou_semiglobal_stability.py

      - name: Commit finalized Phase 2
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize Riccati-metric Live-basin certificate"
          git push origin HEAD:agent/phase2-constructive-live-basin
