name: ou3-p4-h18-shared-word-screen

on:
  push:
    paths:
      - "tools/ou3_interval_ad.py"
      - "tools/ou3_p4_h18_differential_operations.py"
      - "tools/ou3_p4_h18_interval_ad_word.py"
      - "tools/ou3_p4_h18_shared_word_screen.py"
      - "tools/ou3_p5_full_h_prefix_cells_v2.py"
      - "tools/ou3_proof_module_state.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_interval_ad.py"
      - "tests/validation/test_ou3_p4_h18_interval_ad_word.py"
      - "tests/validation/test_ou3_p4_h18_shared_word_screen.py"
      - ".github/workflows/ou3-p4-h18-shared-word-screen.yml"
  pull_request:
    paths:
      - "tools/ou3_interval_ad.py"
      - "tools/ou3_p4_h18_differential_operations.py"
      - "tools/ou3_p4_h18_interval_ad_word.py"
      - "tools/ou3_p4_h18_shared_word_screen.py"
      - "tools/ou3_p5_full_h_prefix_cells_v2.py"
      - "tools/ou3_proof_module_state.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_interval_ad.py"
      - "tests/validation/test_ou3_p4_h18_interval_ad_word.py"
      - "tests/validation/test_ou3_p4_h18_shared_word_screen.py"
      - ".github/workflows/ou3-p4-h18-shared-word-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-h18-shared-word-screen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-h18-screen:
    name: H18 shared differential whole-word screen
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Compile shared differential backend
        run: |
          python3 -m py_compile \
            tools/ou3_interval_ad.py \
            tools/ou3_p4_h18_differential_operations.py \
            tools/ou3_p4_h18_interval_ad_word.py \
            tools/ou3_p4_h18_shared_word_screen.py \
            tests/validation/test_ou3_interval_ad.py \
            tests/validation/test_ou3_p4_h18_interval_ad_word.py \
            tests/validation/test_ou3_p4_h18_shared_word_screen.py

      - name: Run shared differential tests
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_interval_ad \
            test_ou3_p4_h18_interval_ad_word \
            test_ou3_p4_h18_shared_word_screen

      - name: Run one-cell complete-word shared H18 screen
        run: |
          python3 tools/ou3_p4_h18_shared_word_screen.py \
            --cell-limit 1 \
            --output /tmp/ou3_p4_h18_shared_word_screen.json

      - name: Enforce numerical execution and fail-closed scope
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          d = json.loads(Path('/tmp/ou3_p4_h18_shared_word_screen.json').read_text())
          assert d['validation_pass'], d['validation_failures']
          assert d['shared_H18_differential_operations_used'] is True
          assert d['full_word_horizon_checked'] is True
          assert d['outer_ball_box_cells_requested'] == 1
          assert d['outer_ball_box_cells_completed'] == 1, d['first_failure']
          assert d['first_failure'] is None
          assert math.isfinite(d['max_endpoint_P3_congruence_conditioned_norm_upper'])
          assert math.isfinite(d['max_prefix_P3_congruence_conditioned_norm_upper'])
          assert d['actual_per_node_Sigma_KF_whitening_used'] is False
          assert d['P4_USABLE_CERTIFICATE_PROMOTED'] is False
          print('endpoint conditioned norm:', d['max_endpoint_P3_congruence_conditioned_norm_upper'])
          print('prefix conditioned norm:', d['max_prefix_P3_congruence_conditioned_norm_upper'])
          print('endpoint blocks:', d['screen_cells'][0]['endpoint_block_norms_conditioned'])
          print('worst prefix:', d['screen_cells'][0]['worst_prefix'])
          print('next:', d['next_obligation'])
          PY
