name: ou3-p4-candidate-ha-fast

on:
  push:
    paths:
      - "tools/ou3_p4_candidate_full_word.py"
      - "tools/ou3_p4_candidate_first_accel_range.py"
      - "tools/ou3_p4_candidate_first_accel_range_v2.py"
      - "tools/ou3_p4_candidate_first_accel_range_v3.py"
      - "tools/ou3_p4_candidate_first_accel_exact_source.py"
      - "tools/ou3_p4_p5_entrance_search_domain.py"
      - "tools/ou3_p5_45deg_first_accel_q8_bridge.py"
      - "tools/ou3_p5_45deg_sample1_entry_ha.py"
      - "tools/ou3_p5_45deg_sample1_entry_ha_v2.py"
      - "tools/ou3_p5_45deg_sample1_h_group_norms.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_rotation_gauge_v3.py"
      - "tools/ou3_p5_first_accel_structured_gain.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p4_candidate_first_accel_range.py"
      - "tests/validation/test_ou3_p5_45deg_first_accel_q8_bridge.py"
      - "tests/validation/test_ou3_p5_45deg_sample1_entry_ha.py"
      - "tests/validation/test_ou3_p5_45deg_sample1_entry_ha_v2.py"
      - "tests/validation/test_ou3_p5_45deg_sample1_h_group_norms.py"
      - ".github/workflows/ou3-p4-candidate-ha-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_p4_candidate_full_word.py"
      - "tools/ou3_p4_candidate_first_accel_range.py"
      - "tools/ou3_p4_candidate_first_accel_range_v2.py"
      - "tools/ou3_p4_candidate_first_accel_range_v3.py"
      - "tools/ou3_p4_candidate_first_accel_exact_source.py"
      - "tools/ou3_p4_p5_entrance_search_domain.py"
      - "tools/ou3_p5_45deg_first_accel_q8_bridge.py"
      - "tools/ou3_p5_45deg_sample1_entry_ha.py"
      - "tools/ou3_p5_45deg_sample1_entry_ha_v2.py"
      - "tools/ou3_p5_45deg_sample1_h_group_norms.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_rotation_gauge_v3.py"
      - "tools/ou3_p5_first_accel_structured_gain.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p4_candidate_first_accel_range.py"
      - "tests/validation/test_ou3_p5_45deg_first_accel_q8_bridge.py"
      - "tests/validation/test_ou3_p5_45deg_sample1_entry_ha.py"
      - "tests/validation/test_ou3_p5_45deg_sample1_entry_ha_v2.py"
      - "tests/validation/test_ou3_p5_45deg_sample1_h_group_norms.py"
      - ".github/workflows/ou3-p4-candidate-ha-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-candidate-ha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-preflight:
    name: 45deg P5 q8, projection-aware H/A, physical H norms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Compile focused producers and tests
        run: |
          python3 -m py_compile \
            tools/ou3_p4_candidate_first_accel_range.py \
            tools/ou3_p4_candidate_first_accel_range_v2.py \
            tools/ou3_p4_candidate_first_accel_range_v3.py \
            tools/ou3_p4_candidate_first_accel_exact_source.py \
            tools/ou3_p5_45deg_first_accel_q8_bridge.py \
            tools/ou3_p5_45deg_sample1_entry_ha.py \
            tools/ou3_p5_45deg_sample1_entry_ha_v2.py \
            tools/ou3_p5_45deg_sample1_h_group_norms.py \
            tests/validation/test_ou3_p4_candidate_first_accel_range.py \
            tests/validation/test_ou3_p5_45deg_first_accel_q8_bridge.py \
            tests/validation/test_ou3_p5_45deg_sample1_entry_ha.py \
            tests/validation/test_ou3_p5_45deg_sample1_entry_ha_v2.py \
            tests/validation/test_ou3_p5_45deg_sample1_h_group_norms.py

      - name: Test focused semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p4_candidate_first_accel_range \
            test_ou3_p5_45deg_first_accel_q8_bridge \
            test_ou3_p5_45deg_sample1_entry_ha \
            test_ou3_p5_45deg_sample1_entry_ha_v2 \
            test_ou3_p5_45deg_sample1_h_group_norms

      - name: Certify exact-source first-Live accelerometer correction range
        run: |
          python3 tools/ou3_p4_candidate_first_accel_exact_source.py --source-pieces 2 --output /tmp/acc.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/acc.json'))
          assert d['validation_pass'] and d['P4_CANDIDATE_FIRST_ACCEL_EXACT_SOURCE_CERTIFICATE']=='PASS'
          assert d['deployed_correction_limit_rad']==6.0 and d['deployed_correction_limit_increased'] is False
          for r in d['candidate_rows']:
              print('ACCEL_RANGE',r['angle_deg'],'qpred',r['post_prediction_q_upper'],'K',r['max_Ktheta_norm_upper'],'d',r['max_first_accelerometer_correction_norm_upper_rad'])
          PY

      - name: Certify sign-complete 45deg first-accel bridge into q8
        run: |
          python3 tools/ou3_p5_45deg_first_accel_q8_bridge.py --source-pieces 2 --output /tmp/q8.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/q8.json')); p=d['P5_45deg_entrance_first_accel']
          assert d['validation_pass'] and d['P5_45DEG_FIRST_ACCEL_Q8_BRIDGE_CERTIFICATE']=='PASS'
          assert d['accepted_correction_sign_assumed_favorable'] is False
          print('P5_45DEG_Q8','qpred',p['post_prediction_q_upper'],'dmax',p['max_first_accelerometer_correction_norm_upper_rad'],'qplus',p['product']['post_update_q_upper_from_scalar'],'reset_mult',p['reset']['reset_covariance_spectral_multiplier_upper'])
          PY

      - name: Retain V1 diagnostic projection witness
        run: |
          rc=0
          python3 tools/ou3_p5_45deg_sample1_entry_ha.py --source-pieces 2 --output /tmp/ha_v1.json || rc=$?
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ha_v1.json'))
          assert d['modes']['H']['complete'] is True
          print('V1_DIAGNOSTIC',d['P5_45DEG_SAMPLE1_ENTRY_HA_CERTIFICATE'],'A_failure',d['modes']['A']['first_failure'])
          PY
          echo "v1_exit=$rc"

      - name: Certify projection-aware H/A entry and deployed H-first reachability
        run: |
          python3 tools/ou3_p5_45deg_sample1_entry_ha_v2.py --source-pieces 2 --output /tmp/ha_v2.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ha_v2.json'))
          assert d['validation_pass'] and d['P5_45DEG_SAMPLE1_ENTRY_HA_V2_CERTIFICATE']=='PASS'
          assert all(d['source_reachability'].values())
          assert d['deployed_default_first_live_mode']=='H'
          assert d['deployed_default_A_first_live_reachable'] is False
          assert d['A_shipping_closed_ball_projection_used'] and d['A_projection_nonexpansive_used']
          assert d['modes']['H']['complete'] and d['modes']['A']['complete']
          print('HA_V2','q1',d['sample1_pre_measurement_q_upper'],'H',d['modes']['H']['max_state'],'A_diag',d['modes']['A']['max_state'])
          PY

      - name: Certify physical H group norms without cube readback inflation
        run: |
          python3 tools/ou3_p5_45deg_sample1_h_group_norms.py --source-pieces 2 --output /tmp/h_norms.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/h_norms.json'))
          assert d['validation_pass'] and d['P5_45DEG_H_SAMPLE1_GROUP_NORM_CERTIFICATE']=='PASS'
          assert d['norm_balls_not_reinterpreted_as_cartesian_cubes'] is True
          assert d['new_hard_bounds_invented'] is False
          print('H_PHYSICAL_NORMS','initial',d['initial_group_norm_caps'],'sample1',d['sample1_max_group_norm_caps'],'old_box',d['old_interval_box_max_reported_group_norms'],'ratios',d['max_old_box_to_physical_norm_ratio'])
          PY
