name: heave-only

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/replay-toolchain/**"
      - "src/pii_observer/**"
      - "src/ahrs/Mahony_AHRS.h"
      - "src/util/W3dSimCommon.*"
      - "tests/heave_only/**"
      - "tools/sim_dataset.py"
      - "tools/sim_dataset_manifest.json"
      - "Makefile"
      - ".github/workflows/heave-only.yml"
  pull_request:
    paths:
      - ".github/actions/replay-toolchain/**"
      - "src/pii_observer/**"
      - "src/ahrs/Mahony_AHRS.h"
      - "src/util/W3dSimCommon.*"
      - "tests/heave_only/**"
      - "tools/sim_dataset.py"
      - "tools/sim_dataset_manifest.json"
      - "Makefile"
      - ".github/workflows/heave-only.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heave-only-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [following, head]
    env:
      OCEAN_IMU_SIM_CASE: ${{ matrix.case }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libeigen3-dev

      - name: Select the reproducible replay compiler
        uses: ./.github/actions/replay-toolchain

      - name: Build with warnings
        shell: bash
        run: |
          log="${RUNNER_TEMP}/heave-only-build.log"
          if ! make -C tests/heave_only build >"${log}" 2>&1; then
            grep -nE '(^|[[:space:]])(error:|warning:|fatal error:)|make(\[[0-9]+\])?: \*\*\*' "${log}" || tail -n 160 "${log}"
            exit 1
          fi

      # Unit checks, then both front ends of the replay against their
      # regression sentinels.
      - name: Run heave-only filter tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          W3D_COLLECT_ALL_GATES: "1"
        run: make -C tests/heave_only test
