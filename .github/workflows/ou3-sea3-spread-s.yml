name: ou3-sea3-spread-s

on:
  pull_request:
    paths:
      - "tools/ou3_*.py"
      - "tests/validation/test_ou3_*.py"
      - ".github/workflows/ou3-sea3-spread-s.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spread-s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build complete SEA3 spread-S regularizer
        run: |
          python3 tools/ou3_sea3_spread_s_regularizer.py --output /tmp/ou3_sea3_spread_s_regularizer.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_spread_s_regularizer.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_source'] == 'COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['complete_SEA3_source_consumed'] is True
          assert d['source_family_replaced'] is False
          assert d['selected_S_events_replace_full_scheduler_word'] is False
          assert d['all_due_S_updates_remain_in_literal_word'] is True
          assert d['actual_applied_SpectralMSE_R_S_consumed'] is True
          assert d['spread_S_regularizer_pass'] is True
          print('SPREAD_S_GAP', d['scheduler_uniform_gap_s_upper'])
          print('SPREAD_S_WINDOWS', d['selected_backward_lag_windows_s'])
          print('SPREAD_S_RS_STD_UPPER', d['effective_observation_covariance']['actual_applied_R_S_axis_std_upper'])
          print('SPREAD_S_INFO_LOWER', d['integrator_information_lambda_min_lower'])
          PY
      - name: Test spread-S contract
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_sea3_spread_s_regularizer
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-sea3-spread-s
          path: /tmp/ou3_sea3_spread_s_regularizer.json
          retention-days: 7
