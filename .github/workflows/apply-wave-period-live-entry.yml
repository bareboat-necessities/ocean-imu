name: Apply wave-period startup patch

on:
  push:
    branches:
      - codex/wave-period-usable-live-entry

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply measured-period Live-entry patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "bool hasUsablePeriod() const" src/tuner/WavePeriodEstimator.h; then
            echo "Patch already applied"
            exit 0
          fi
          cat .github/wave-period-live-entry.patch.b64.part1 \
              .github/wave-period-live-entry.patch.b64.part2 \
            | base64 -d | gzip -d > /tmp/wave-period.patch
          git apply --check /tmp/wave-period.patch
          git apply /tmp/wave-period.patch
          python3 .github/wave-period-live-entry-postpatch.py

      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          make -C tests/kalman_ou_iii wave_period-test -j2
          ./tests/kalman_ou_iii/wave_period-test
          python3 -m unittest \
            tests.validation.test_wave_period_live_entry_parity \
            tests.validation.test_ou3_sea3_wave_period_frontend \
            tests.validation.test_ou_paper_code_parity
          python3 tools/ou3_sea3_wave_period_frontend.py > /tmp/ou3-wave-period-frontend.json

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "startup: enter live on measured wave period"
          git push origin HEAD:codex/wave-period-usable-live-entry
