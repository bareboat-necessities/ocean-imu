name: ou3-p5-v52-exact-monotone-cover-lift-fast

on:
  push:
    paths:
      - "tools/ou3_p5_sample1_exact_monotone_cover_lift_v52.py"
      - "tests/validation/test_ou3_p5_sample1_exact_monotone_cover_lift_v52.py"
      - "tools/ou3_p5_sample1_exact_monotone_source_gain_v51.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v8.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v9.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v10.py"
      - "tools/ou3_interval.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p5-v52-exact-monotone-cover-lift-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v52-exact-monotone-cover-lift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v52-exact-monotone-cover-lift:
    name: P5 V52 exact monotone cover lift
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Compile V52 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_exact_monotone_cover_lift_v52.py \
            tests/validation/test_ou3_p5_sample1_exact_monotone_cover_lift_v52.py
      - name: Test V52 contract
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_exact_monotone_cover_lift_v52
      - name: Run V52 exact monotone cover lift
        id: audit
        shell: bash
        run: |
          set +e
          python3 tools/ou3_p5_sample1_exact_monotone_cover_lift_v52.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_v52.json \
            > /tmp/p5_sample1_v52.log 2>&1
          rc=$?
          set -e
          cat /tmp/p5_sample1_v52.log
          python3 - "$GITHUB_OUTPUT" "$rc" <<'PY'
          import json, math, pathlib, sys
          out, rc = sys.argv[1], int(sys.argv[2])
          path = pathlib.Path('/tmp/p5_sample1_v52.json')
          d = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          cov = d.get('cover_comparison') or {}
          par = cov.get('parent_cover') or {}
          ref = cov.get('refined_cover') or {}
          wit = d.get('authoritative_witness') or {}
          K = 'max_combined_directional_correction_norm_upper_rad'
          def fmt(x):
              try: y = float(x)
              except (TypeError, ValueError): return 'na'
              return f'{y:.12g}' if math.isfinite(y) else str(y)
          with open(out, 'a', encoding='utf-8') as gh:
              print(f"rc={rc}", file=gh)
              print(f"status={d.get('P5_SAMPLE1_EXACT_MONOTONE_COVER_LIFT_V52')}", file=gh)
              print(f"cells={cov.get('cells_evaluated')}", file=gh)
              print(f"narrowed={cov.get('cells_narrowed')}", file=gh)
              print(f"widened={cov.get('cells_widened')}", file=gh)
              print(f"parent_max={fmt(par.get(K))}", file=gh)
              print(f"refined_max={fmt(ref.get(K))}", file=gh)
              print(f"ratio_min={fmt(cov.get('narrowing_ratio_min'))}", file=gh)
              print(f"ratio_max={fmt(cov.get('narrowing_ratio_max'))}", file=gh)
              print(f"witness_closed={wit.get('authoritative_witness_closed')}", file=gh)
              print(f"next={d.get('next_obligation')}", file=gh)
      - name: "V52 rc=${{ steps.audit.outputs.rc }} status=${{ steps.audit.outputs.status }} narrowed=${{ steps.audit.outputs.narrowed }}/${{ steps.audit.outputs.cells }} widened=${{ steps.audit.outputs.widened }}"
        run: |
          echo "cover max correction ${{ steps.audit.outputs.parent_max }} -> ${{ steps.audit.outputs.refined_max }} rad"
          echo "per-cell narrowing ratio ${{ steps.audit.outputs.ratio_min }} .. ${{ steps.audit.outputs.ratio_max }}"
          echo "authoritative witness closed=${{ steps.audit.outputs.witness_closed }}"
          echo "next=${{ steps.audit.outputs.next }}"
      - name: Fail closed on producer validation
        if: steps.audit.outputs.rc != '0'
        run: exit 2
