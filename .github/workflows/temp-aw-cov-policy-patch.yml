name: apply-aw-covariance-policy-patch

on:
  push:
    branches:
      - agent/psd-aw-covariance-inflation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/psd-aw-covariance-inflation
      - name: Apply patch
        run: python3 tools/temp_aw_cov_policy_patch.py
      - name: Check and publish patch
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/kalman_ou_ii/Kalman3D_Wave_OU_II.h \
                  src/kalman_ou_iii/Kalman3D_Wave_OU_III.h \
                  doc/kalman_ou_iii/w3d-iss-stability.tex-part \
                  doc/kalman_ou_iii/w3d-intro.tex-part \
                  doc/kalman_ou_iii/w3d-conclusion-summary.tex-part \
                  tests/kalman_ou_iii/aw_covariance_policy-test.cpp \
                  CMakeLists.txt
          git commit -m "Use PSD acceleration covariance inflation"
          git push origin HEAD:agent/psd-aw-covariance-inflation
