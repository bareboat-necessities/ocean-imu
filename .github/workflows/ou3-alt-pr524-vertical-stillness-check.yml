name: OU3 ALT PR524 vertical stillness source check
on:
  push:
    branches: [proof/ou3-alt-live-mag-composition]
    paths:
      - tools/stability/ou3_alt_contraction/finite_machine_vertical_stillness_source.py
      - tests/ou3_alt_contraction/test_finite_machine_vertical_stillness_source.py
      - .github/workflows/ou3-alt-pr524-vertical-stillness-check.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Install proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-scipy python3-mpmath libeigen3-dev g++
      - name: Focused vertical stillness tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD:$PWD/tools/stability:$PWD/tests/ou3_alt_contraction"
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 OU3_ALT_REQUIRE_NATIVE=1
          python3 -m unittest test_finite_machine_vertical_stillness_source -v
          python3 -m compileall -q tools/stability/ou3_alt_contraction
          git diff --check HEAD^
      - name: All finite-map regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD:$PWD/tools/stability:$PWD/tests/ou3_alt_contraction"
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 OU3_ALT_REQUIRE_NATIVE=1
          python3 -m unittest discover -s tests/ou3_alt_contraction -p 'test_finite*.py' -v
