name: ou3-periodic-witness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/stability/ou3_theorem/periodic_fast_gyro_counterexample.py"
      - ".github/workflows/ou3-periodic-witness.yml"
concurrency:
  group: ou3-periodic-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y g++ libeigen3-dev
      - run: |
          python3 -m tools.stability.ou3_theorem.periodic_fast_gyro_counterexample --native --eigen /usr/include/eigen3 > /tmp/ou3-periodic-fast-gyro.json
          cat /tmp/ou3-periodic-fast-gyro.json
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: ou3-periodic-fast-gyro-witness
          path: /tmp/ou3-periodic-fast-gyro.json
          retention-days: 7
          if-no-files-found: warn
