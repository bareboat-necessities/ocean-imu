name: Fix OU-III legacy cubic wording

on:
  push:
    branches: [agent/fix-ou3-legacy-cubic-wording]

permissions:
  contents: write

jobs:
  fix-wording:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-ou3-legacy-cubic-wording
          fetch-depth: 0

      - name: Correct historical comparator wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('doc/kalman_ou_iii/w3d-adaptation-coefficient-investigation.tex-part')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'compared with $4.181\\%H_s$ for the applied schedule.':
                  'compared with $4.181\\%H_s$ for the legacy cubic schedule.',
              'The static interpolation is therefore a statistical tie\nwith the applied law and supplies no evidence for replacing it.':
                  'The static interpolation is therefore a statistical tie\nwith the legacy cubic law and supplies no evidence for replacing it.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          forbidden = [
              'compared with $4.181\\%H_s$ for the applied schedule.',
              'with the applied law and supplies no evidence for replacing it.',
          ]
          for phrase in forbidden:
              if phrase in text:
                  raise SystemExit(f'stale wording remains: {phrase}')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit clean manuscript-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- doc/kalman_ou_iii/w3d-adaptation-coefficient-investigation.tex-part
          git rm -- .github/workflows/fix-ou3-legacy-wording.yml
          git diff --cached --check
          git commit -m "Clarify remaining legacy cubic wording"
          git push origin HEAD:refs/heads/agent/fix-ou3-legacy-cubic-wording
