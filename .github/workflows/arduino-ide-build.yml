name: Arduino IDE default build
on:
  pull_request:
    paths: ['src/**', 'sensors/**', 'examples/**', 'library.properties', '.github/workflows/arduino-ide-build.yml']
  push:
    paths: ['src/**', 'sensors/**', 'examples/**', 'library.properties', '.github/workflows/arduino-ide-build.yml']
  workflow_dispatch:

concurrency:
  group: arduino-ide-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows links each sketch in 2-6 min; eleven sketches plus the
    # toolchain install run close to 45 min there.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the reported ESP32 toolchain and libraries
        shell: bash
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install M5Unified@0.2.23 M5GFX@0.2.32 Eigen@0.3.2
      - name: Link every shipped sketch with Arduino IDE default flags
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' sketch; do
            echo "Compiling $sketch"
            arduino-cli compile --jobs 1 --warnings default \
              --fqbn esp32:esp32:m5stack_atoms3:CDCOnBoot=cdc,USBMode=hwcdc \
              --library "$GITHUB_WORKSPACE" "$(dirname "$sketch")"
          done < <(find sensors examples -name '*.ino' -print0 | sort -z)
