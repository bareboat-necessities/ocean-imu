name: Repair Phase 3 TeX control character

on:
  push:
    branches:
      - agent/phase3-analytic-live-basin
    paths:
      - .github/workflows/fix-phase3-tex-control.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase3-analytic-live-basin
          fetch-depth: 0
      - name: Repair malformed TeX byte and reject remaining controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('doc/kalman_ou_iii/w3d-computer-assisted-live-basin.tex-part')
          data = path.read_bytes()
          old = b'\x0crac{\\sqrt{q_c(t)}}{s_{aw}}u'
          new = b'\\frac{\\sqrt{q_c(t)}}{s_{aw}}u'
          count = data.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one malformed form-feed frac, found {count}')
          data = data.replace(old, new)

          bad = [(i, b) for i, b in enumerate(data) if b < 32 and b not in (9, 10, 13)]
          if bad:
              raise SystemExit(f'unexpected remaining control bytes: {bad[:20]}')

          path.write_bytes(data)
          PY
          git diff --check
          git diff -- doc/kalman_ou_iii/w3d-computer-assisted-live-basin.tex-part
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add doc/kalman_ou_iii/w3d-computer-assisted-live-basin.tex-part
          git commit -m 'docs: fix fatal TeX control character'
          git push origin HEAD:agent/phase3-analytic-live-basin
