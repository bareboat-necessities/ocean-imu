name: OU3 ALT workspace snapshot
on:
  push:
    branches: [proof/ou3-alt-startup-machine-attachment]
    paths: [.github/workflows/ou3-alt-workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Export tracked proof workspace
        run: |
          git archive --format=tar.gz --output=/tmp/ou3-alt-workspace.tar.gz HEAD
          git rev-parse HEAD > /tmp/ou3-alt-workspace.sha
      - uses: actions/upload-artifact@v4
        with:
          name: ou3-alt-workspace
          path: |
            /tmp/ou3-alt-workspace.tar.gz
            /tmp/ou3-alt-workspace.sha
          retention-days: 1
