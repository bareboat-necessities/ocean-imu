name: ou3-p5-v36-first-psd-offdiagonal-cone-fast

on:
  pull_request:
    paths:
      - "tools/ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py"
      - "tests/validation/test_ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py"
      - ".github/workflows/ou3-p5-v36-first-psd-offdiagonal-cone-fast.yml"
  push:
    paths:
      - "tools/ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py"
      - "tests/validation/test_ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py"
      - ".github/workflows/ou3-p5-v36-first-psd-offdiagonal-cone-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v36-first-psd-offdiagonal-cone-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  first-psd-offdiag-v36:
    name: P5 first-PSD offdiagonal cone V36
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Compile V36 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py \
            tests/validation/test_ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py
      - name: Test V36 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_first_psd_offdiagonal_cone_v36
      - name: Emit V36 PSD-cone witness audit
        run: |
          python3 tools/ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_v36_psd_offdiagonal_cone.json
