name: ou3-p5-v23-current-exact-residual-fast

on:
  push:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_current_exact_residual_subdivision_v23.py"
      - ".github/workflows/ou3-p5-v23-current-exact-residual-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_current_exact_residual_subdivision_v23.py"
      - ".github/workflows/ou3-p5-v23-current-exact-residual-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v23-current-exact-residual-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-current-exact-residual-v23:
    name: P5 sample-1 current/exact-residual subdivision V23
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile V23 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_current_exact_residual_subdivision_v23.py \
            tests/validation/test_ou3_p5_sample1_current_exact_residual_subdivision_v23.py
      - name: Test V23 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_current_exact_residual_subdivision_v23
      - name: Emit V23 first-witness current/exact-residual subdivision audit
        run: |
          python3 tools/ou3_p5_sample1_current_exact_residual_subdivision_v23.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --current-component-pieces 4 \
            --output /tmp/p5_sample1_v23_current_exact_residual.json
