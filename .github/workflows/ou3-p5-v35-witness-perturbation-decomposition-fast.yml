name: ou3-p5-v35-witness-perturbation-decomposition-fast

on:
  pull_request:
    paths:
      - "tools/ou3_p5_sample1_v12d_witness_perturbation_decomposition_v35.py"
      - "tests/validation/test_ou3_p5_sample1_v12d_witness_perturbation_decomposition_v35.py"
      - ".github/workflows/ou3-p5-v35-witness-perturbation-decomposition-fast.yml"
  push:
    paths:
      - "tools/ou3_p5_sample1_v12d_witness_perturbation_decomposition_v35.py"
      - "tests/validation/test_ou3_p5_sample1_v12d_witness_perturbation_decomposition_v35.py"
      - ".github/workflows/ou3-p5-v35-witness-perturbation-decomposition-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v35-witness-perturbation-decomposition-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  witness-perturbation-v35:
    name: P5 V12D witness perturbation decomposition V35
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Compile V35 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_v12d_witness_perturbation_decomposition_v35.py \
            tests/validation/test_ou3_p5_sample1_v12d_witness_perturbation_decomposition_v35.py
      - name: Test V35 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_v12d_witness_perturbation_decomposition_v35
      - name: Emit V35 perturbation decomposition
        run: |
          python3 tools/ou3_p5_sample1_v12d_witness_perturbation_decomposition_v35.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_v35_perturbation_decomposition.json
