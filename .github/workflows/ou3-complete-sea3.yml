name: ou3-complete-sea3

on:
  push:
    paths:
      - "tools/stability/ou3_sea3_*.py"
      - "tools/ou3_sea3_*.json"
      - "tools/stability/ou3_binary32_interval.py"
      - "tools/stability/ou3_fast_inv_sqrt_interval.py"
      - "tools/stability/ou3_validated_log.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_sea3_*.py"
      - "tests/validation/test_ou3_validated_log.py"
      - "src/ahrs/Mahony_AHRS.h"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "src/tuner/**"
      - ".github/workflows/ou3-complete-sea3.yml"
  pull_request:
    paths:
      - "tools/stability/ou3_sea3_*.py"
      - "tools/ou3_sea3_*.json"
      - "tools/stability/ou3_binary32_interval.py"
      - "tools/stability/ou3_fast_inv_sqrt_interval.py"
      - "tools/stability/ou3_validated_log.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_sea3_*.py"
      - "tests/validation/test_ou3_validated_log.py"
      - "src/ahrs/Mahony_AHRS.h"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "src/tuner/**"
      - ".github/workflows/ou3-complete-sea3.yml"
  workflow_dispatch:

concurrency:
  group: ou3-complete-sea3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  complete-sea3-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile complete SEA3 source stack
        run: |
          python3 -m py_compile \
            tools/stability/ou3_sea3_directional_response_family.py \
            tools/stability/ou3_sea3_complete_source.py \
            tools/stability/ou3_sea3_physical_admissibility.py \
            tools/stability/ou3_sea3_p1_compatibility.py \
            tools/stability/ou3_sea3_wave_period_spectral_identity.py \
            tools/stability/ou3_sea3_spectral_moment_bridge.py \
            tools/stability/ou3_sea3_wave_period_frontend.py \
            tools/stability/ou3_sea3_dynamic_source_certificate.py \
            tools/stability/ou3_sea3_windowed_vector_pe.py \
            tools/stability/ou3_sea3_shipping_prediction_primitives.py \
            tools/stability/ou3_sea3_tuner_scheduler_step.py \
            tools/stability/ou3_sea3_wpe_state_step.py \
            tools/stability/ou3_sea3_private_mahony_state_step.py \
            tools/stability/ou3_sea3_private_mahony_live_invariant.py \
            tools/stability/ou3_sea3_frontend_state_step.py \
            tools/stability/ou3_binary32_interval.py \
            tools/stability/ou3_fast_inv_sqrt_interval.py \
            tools/stability/ou3_validated_log.py \
            tools/stability/ou3_p3_pseudo_scheduler_progress_certificate.py

      - name: Build compact phase-continuous SEA3 source contract
        run: |
          python3 tools/stability/ou3_sea3_complete_source.py \
            --output /tmp/ou3_sea3_complete_source.json
          python3 tools/stability/ou3_sea3_shipping_prediction_primitives.py \
            --output /tmp/ou3_sea3_shipping_prediction_primitives.json
          python3 tools/stability/ou3_sea3_tuner_scheduler_step.py \
            --output /tmp/ou3_sea3_tuner_scheduler_step.json
          python3 tools/stability/ou3_sea3_wpe_state_step.py \
            --output /tmp/ou3_sea3_wpe_state_step.json
          python3 tools/stability/ou3_fast_inv_sqrt_interval.py \
            --output /tmp/ou3_fast_inv_sqrt_interval.json
          python3 tools/stability/ou3_sea3_private_mahony_state_step.py \
            --output /tmp/ou3_sea3_private_mahony_state_step.json
          python3 tools/stability/ou3_sea3_private_mahony_live_invariant.py \
            --output /tmp/ou3_sea3_private_mahony_live_invariant.json
          python3 tools/stability/ou3_sea3_frontend_state_step.py \
            --output /tmp/ou3_sea3_frontend_state_step.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_complete_source.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_P3_source'] == 'COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['P3_source_contract_ready'] is True
          assert d['P3_source_family_materialized'] is False
          assert d['retired_P2_stack_consumed'] is False
          sea=d['SEA3_surface_family']
          assert sea['modes_max'] == 3
          assert sea['gamma_interval'] == [1.0, 7.0]
          assert sea['parameter_domain_compact'] is True
          assert sea['compact_transition_relation_is_theorem_domain'] is True
          assert sea['independent_H_T_extrema_forbidden'] is True
          assert all(v is False for v in d['no_fallback_generators'].values())
          dyn=d['SEA3_dynamic_realization']
          assert dyn['phase_continuous'] is True
          assert dyn['same_realization_drives_translation_rotation_frontend_tuner_geometry'] is True
          assert dyn['finite_window_family_materialized'] is False
          assert dyn['probabilistic_event_may_substitute_for_realization'] is False
          assert dyn['arbitrary_bounded_input_may_substitute_for_realization'] is False
          c=d['SEA3_response_couplings']
          assert c['independent_sea_x_RAO_cartesian_product_forbidden'] is True
          assert c['same_H_s_partition_energy_enters_translation_and_rotation_conditions'] is True
          assert c['only_same_phase_continuous_SEA3_realization_may_generate_P3_words'] is True
          assert c['moment_or_probability_bound_may_not_generate_P3_word'] is True
          s=d['stochastic_forcing_corollary']
          assert s['used_to_generate_P3_source_words'] is False
          assert s['used_to_prune_homogeneous_P3_family'] is False
          assert s['configured_Racc_Rmag_remain_in_every_covariance_update'] is True
          a=d['derived_adaptive_source']
          assert a['primitive_independent_tau_sigma_RS_TS'] is False
          assert a['same_SEA3_frontend_path_generates_tau_sigma_RS_targets'] is True
          assert a['same_candidate_snapshot_commits_tau_sigma_RS'] is True
          assert a['T_S_is_function_of_same_committed_tau'] is True
          assert a['Q_uses_same_committed_tau_sigma'] is True
          assert a['rate_bounds_are_constraints_on_SEA3_derived_path_not_a_word_generator'] is True
          r=d['R_S_regularizer']
          assert r['source_parity_failures'] == []
          assert r['deployed_law'] == 'SpectralMSE'
          assert r['actual_applied_R_S_required_at_every_due_S_update'] is True
          assert r['axis_std_factors'] == [0.72,0.72,1.0]
          assert r['extra_information_rate_rescale'] == 1.0
          assert r['all_due_S_updates_remain_in_full_word'] is True
          assert r['selected_four_S_subset_may_not_replace_full_scheduler_word'] is True
          assert r['R_S_may_not_be_replaced_by_process_strictness'] is True

          p=json.load(open('/tmp/ou3_sea3_shipping_prediction_primitives.json'))
          assert p['validation_pass'], p['validation_failures']
          assert p['validated_matrix_primitives_ready'] is True
          assert p['source_domain_created_here'] is False
          assert p['consumes_only_SEA3_derived_sample_coordinates'] is True
          assert p['P3_promoted'] is False

          t=json.load(open('/tmp/ou3_sea3_tuner_scheduler_step.json'))
          assert t['validation_pass'], t['validation_failures']
          assert t['source_generator'] is False
          assert t['requires_same_SEA3_Mahony_and_WPE_state'] is True
          assert t['same_state_generates_tau_sigma_RS_TS'] is True
          assert t['spectral_MSE_actual_RS_retained'] is True
          assert t['complete_SEA3_family_materialized_here'] is False
          assert t['P3_promoted'] is False

          w=json.load(open('/tmp/ou3_sea3_wpe_state_step.json'))
          assert w['validation_pass'], w['validation_failures']
          assert w['source_generator'] is False
          assert w['requires_same_SEA3_vertical_acceleration'] is True
          assert w['validity_boundaries_are_branched_not_selected'] is True
          assert w['mathematical_WPE_state_step_closed'] is True
          assert w['private_Mahony_step_closed_here'] is False
          assert w['complete_SEA3_family_materialized_here'] is False
          assert w['P3_promoted'] is False

          fi=json.load(open('/tmp/ou3_fast_inv_sqrt_interval.json'))
          assert fi['validation_pass'], fi['validation_failures']
          assert fi['shipping_source_parity_pass'] is True
          assert fi['all_positive_normal_binary32_normalization_shell_enclosed'] is True
          assert fi['normalization_shell_checks_pass'] is True
          assert fi['ideal_inverse_sqrt_substituted'] is False
          assert fi['P3_promoted'] is False

          m=json.load(open('/tmp/ou3_sea3_private_mahony_state_step.json'))
          assert m['validation_pass'], m['validation_failures']
          assert m['source_generator'] is False
          assert m['requires_same_SEA3_gyro_and_specific_force'] is True
          assert m['requires_same_SEA3_private_observer_state'] is True
          assert m['actual_fast_inverse_sqrt_used'] is True
          assert m['low_level_TunerReady_can_wait_for_external_bootstrap'] is True
          assert m['deployed_outer_wrapper_has_timeout_logic'] is True
          assert m['deployed_proxy_startup_timeout_s'] == 150.0
          assert m['deployed_mag_acquire_deadline_s'] == 60.0
          assert m['deployed_timeout_s'] == 150.0
          assert m['timeout_path_requires_gravity_aligned_branch'] is True
          assert m['declared_startup_chart_implies_gravity_aligned_branch'] is True
          assert m['declared_domain_live_entry_upper_bound_closed'] is True
          assert m['declared_domain_live_entry_upper_bound_s'] == 150.0
          assert m['unconditional_live_entry_upper_bound_closed'] is False
          assert m['live_entry_private_observer_invariant_closed'] is True
          mi=m['private_observer_live_entry_invariant']
          assert mi['independent_quaternion_or_integral_box'] is False
          assert mi['raw_quaternion_guard_inductive'] is True
          assert mi['reset_zero_integral_memory_consumed'] is True
          assert mi['same_SEA3_history_required'] is True
          assert m['complete_SEA3_family_materialized_here'] is False
          assert m['P3_promoted'] is False

          ml=json.load(open('/tmp/ou3_sea3_private_mahony_live_invariant.json'))
          assert ml['validation_pass'], ml['validation_failures']
          assert ml['continuous_all_live_PI_invariant_closed'] is True
          assert ml['initial_set_inside_invariant'] is True
          assert ml['invariant_strictly_inside_60deg_chart'] is True
          assert ml['boundary_validation']['strict_inward_margin_lower'] > 0.0
          assert ml['source_generator'] is False
          assert ml['shipping_binary32_discrete_invariant_closed'] is False
          assert ml['P3_promoted'] is False

          fe=json.load(open('/tmp/ou3_sea3_frontend_state_step.json'))
          assert fe['validation_pass'], fe['validation_failures']
          assert fe['shipping_source_parity_pass'] is True
          assert fe['same_SEA3_sample_drives_Mahony_tuner_WPE'] is True
          assert fe['P3_promoted'] is False

          print('SEA3_SAMPLES', d['word_samples'])
          print('SEA3_DYNAMIC_REALIZATION', dyn)
          print('SEA3_RESPONSE_COUPLINGS', c)
          print('SEA3_STOCHASTIC_FORCING_ONLY', s)
          print('SEA3_FALLBACKS', d['no_fallback_generators'])
          print('SEA3_RS', r)
          print('SEA3_PREDICTION_PRIMITIVES', p['smoke'])
          print('SEA3_TUNER_STEP', t['smoke'])
          print('SEA3_WPE_STEP', w['smoke'])
          print('SEA3_PRIVATE_MAHONY', m['private_observer_live_entry_invariant'])
          print('SEA3_PRIVATE_MAHONY_ALL_LIVE', ml['boundary_validation'])
          print('SEA3_FRONTEND', fe['shipping_source_parity'])
          PY

      - name: Test SEA3 source and prediction contracts
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_validated_log \
            test_ou3_sea3_physical_admissibility \
            test_ou3_sea3_complete_source \
            test_ou3_sea3_compact_domain \
            test_ou3_sea3_no_stochastic_source \
            test_ou3_sea3_windowed_vector_pe_binary32 \
            test_ou3_sea3_shipping_prediction_primitives \
            test_ou3_sea3_prediction_not_source \
            test_ou3_sea3_tuner_scheduler_step \
            test_ou3_sea3_wpe_state_step \
            test_ou3_sea3_private_mahony_state_step \
            test_ou3_sea3_private_mahony_live_invariant \
            test_ou3_sea3_frontend_state_step \
            test_ou3_sea3_rs_full_word_contract \
            test_ou3_sea3_p3_source_semantics \
            test_ou3_sea3_full_word_source_identity \
            test_ou3_sea3_source_family_fail_closed

      - name: Upload complete SEA3 source artifact
        uses: actions/upload-artifact@v6
        with:
          name: ou3-complete-sea3-source
          path: |
            /tmp/ou3_sea3_complete_source.json
            /tmp/ou3_sea3_shipping_prediction_primitives.json
            /tmp/ou3_sea3_tuner_scheduler_step.json
            /tmp/ou3_sea3_wpe_state_step.json
            /tmp/ou3_fast_inv_sqrt_interval.json
            /tmp/ou3_sea3_private_mahony_state_step.json
            /tmp/ou3_sea3_private_mahony_live_invariant.json
            /tmp/ou3_sea3_frontend_state_step.json
          retention-days: 7
