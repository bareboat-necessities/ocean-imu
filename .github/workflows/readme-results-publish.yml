name: readme-results-publish

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    # Gate at the trigger, not in the job. build runs on every push and every
    # pull request, so without this filter each one created a readme-results
    # run that existed only to skip, burying the real history. branches
    # matches the triggering run's head branch, so non-main builds no longer
    # create a run at all. conclusion and event still have to be checked in
    # the job below: workflow_run has no trigger-level filter for either.
    branches: [main]

# This workflow turns successful main-branch build products into stable,
# versioned README assets. The TFG module produces the following-sea tracking
# figures. The OU-III plot job also renders the filter-independent input spectrum.
permissions:
  actions: read
  contents: write

concurrency:
  group: readme-results-publish-main
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Download generated README SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          rm -rf incoming
          mkdir -p incoming/kalman_tfg_shared_modes incoming/kalman_ou_iii
          gh run download "$BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name release-svgs-kalman_tfg_shared_modes \
            --dir incoming/kalman_tfg_shared_modes
          gh run download "$BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name release-svgs-kalman_ou_iii \
            --dir incoming/kalman_ou_iii

      - name: Stage stable README SVG gallery
        run: |
          set -euo pipefail
          out=reports/results/readme
          mkdir -p "$out"

          copy_figure() {
            local module="$1" name="$2"
            local src
            src="$(find "incoming/$module" -type f -name "$name" -print -quit)"
            if [ -z "$src" ]; then
              echo "required build SVG is missing: $name" >&2
              find "incoming/$module" -maxdepth 5 -type f -print >&2 || true
              exit 1
            fi
            cp -v "$src" "$out/$name"
          }

          for channel in att zkin xykin acc_bias gyro_bias; do
            copy_figure kalman_tfg_shared_modes "w3d_tfg_csm_pmstokes_medium_${channel}.svg"
          done
          copy_figure kalman_ou_iii spectrum_pmstokes_medium_3d.svg

          # Run-specific provenance is intentionally outside reports/results so
          # changing workflow ids never alter the scientific evidence digest.
          cat > reports/readme-results-provenance.md <<EOF
          # README result gallery provenance

          The shared-mode TFG tracking plots show the 1.5 m PM–Stokes following-sea
          replay with the fixed interval-rate regression profile.
          The directional spectrum describes its input sea.

          - build workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}
          - triggering source SHA: ${{ github.event.workflow_run.head_sha }}
          - tracking artifact: release-svgs-kalman_tfg_shared_modes
          - input spectrum artifact: release-svgs-kalman_ou_iii
          EOF

      - name: Verify README image targets resolve
        run: python3 tests/validation/test_readme_result_gallery.py

      - name: Commit refreshed gallery
        run: |
          set -euo pipefail

          # workflow_run can be delivered after a newer main commit has landed.
          # Never publish an older build's artifacts onto that newer source tip.
          if [ "$(git rev-parse HEAD)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "main no longer matches this build; leaving publication to the newer main build."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/results/readme reports/readme-results-provenance.md
          if git diff --cached --quiet; then
            echo "README SVG gallery is already current."
            exit 0
          fi

          git commit \
            -m "Refresh generated README SVG gallery [skip ci]" \
            -m "Produced from successful build run ${{ github.event.workflow_run.id }}."

          # Never rebase an older build artifact onto a newer main tip. If main
          # advances after this workflow's checkout, its own build will publish
          # the corresponding gallery.
          base_sha="$(git rev-parse HEAD^)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            sleep $((2 ** attempt))
            git fetch origin refs/heads/main
            if [ "$(git rev-parse FETCH_HEAD)" != "$base_sha" ]; then
              echo "main advanced after this build; leaving publication to the newer main build."
              exit 0
            fi
          done
          exit 1
