name: ou3-p5-v53-exact-monotone-q8-cover-fast

on:
  push:
    paths:
      - "tools/ou3_p5_sample1_exact_monotone_q8_cover_v53.py"
      - "tests/validation/test_ou3_p5_sample1_exact_monotone_q8_cover_v53.py"
      - "tools/ou3_p5_sample1_exact_monotone_cover_lift_v52.py"
      - "tools/ou3_p5_sample1_exact_monotone_source_gain_v51.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v8.py"
      - "tools/ou3_p5_sample1_v40_full_source_cell0_q8_lift_v41.py"
      - "tools/ou3_p5_sample1_v41_authoritative_split_signed_v45.py"
      - "tools/ou3_interval.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p5-v53-exact-monotone-q8-cover-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v53-exact-monotone-q8-cover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v53-exact-monotone-q8-cover:
    name: P5 V53 exact monotone q8 cover
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Compile V53 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_exact_monotone_q8_cover_v53.py \
            tests/validation/test_ou3_p5_sample1_exact_monotone_q8_cover_v53.py
      - name: Test V53 contract
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_exact_monotone_q8_cover_v53
      - name: Run V53 parent and refined q8 covers
        id: audit
        shell: bash
        run: |
          set +e
          python3 tools/ou3_p5_sample1_exact_monotone_q8_cover_v53.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --output /tmp/p5_sample1_v53.json \
            > /tmp/p5_sample1_v53.log 2>&1
          rc=$?
          set -e
          cat /tmp/p5_sample1_v53.log
          python3 - "$GITHUB_OUTPUT" "$rc" <<'PY'
          import json, math, pathlib, sys
          out, rc = sys.argv[1], int(sys.argv[2])
          path = pathlib.Path('/tmp/p5_sample1_v53.json')
          d = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          cmp_ = d.get('cover_comparison') or {}
          par = cmp_.get('parent') or {}
          ref = cmp_.get('refined') or {}
          first = ref.get('first_unclosed_q8_cell') or {}
          def fmt(x):
              try: y = float(x)
              except (TypeError, ValueError): return 'na'
              return f'{y:.12g}' if math.isfinite(y) else str(y)
          with open(out, 'a', encoding='utf-8') as gh:
              print(f"rc={rc}", file=gh)
              print(f"status={d.get('P5_SAMPLE1_EXACT_MONOTONE_Q8_COVER_V53')}", file=gh)
              print(f"cells={par.get('evaluated_signed_cayley_cells')}", file=gh)
              print(f"parent_open={par.get('unclosed_q8_cells')}", file=gh)
              print(f"refined_open={ref.get('unclosed_q8_cells')}", file=gh)
              print(f"newly_closed={cmp_.get('additional_cells_closed')}", file=gh)
              print(f"survivor_closed={cmp_.get('archived_first_survivor_closed_by_refinement')}", file=gh)
              print(f"parent_worst={fmt(cmp_.get('parent_worst_q_upper'))}", file=gh)
              print(f"refined_worst={fmt(cmp_.get('refined_worst_q_upper'))}", file=gh)
              print(f"first_p={first.get('p_cell', 'na')}", file=gh)
              print(f"first_t={first.get('tangent_residual_cell', 'na')}", file=gh)
              print(f"first_a={first.get('axial_residual_cell', 'na')}", file=gh)
              print(f"first_q={fmt(first.get('post_sample1_cayley_norm_upper'))}", file=gh)
              print(f"fully_closed={d.get('source_cell0_q8_cover_fully_closed')}", file=gh)
              print(f"next={d.get('next_obligation')}", file=gh)
      - name: "V53 rc=${{ steps.audit.outputs.rc }} status=${{ steps.audit.outputs.status }} open ${{ steps.audit.outputs.parent_open }} -> ${{ steps.audit.outputs.refined_open }} of ${{ steps.audit.outputs.cells }}"
        run: |
          echo "newly closed=${{ steps.audit.outputs.newly_closed }} archived survivor closed=${{ steps.audit.outputs.survivor_closed }}"
          echo "worst q ${{ steps.audit.outputs.parent_worst }} -> ${{ steps.audit.outputs.refined_worst }}"
          echo "first remaining cell p=${{ steps.audit.outputs.first_p }} t=${{ steps.audit.outputs.first_t }} a=${{ steps.audit.outputs.first_a }} q=${{ steps.audit.outputs.first_q }}"
          echo "cover fully closed=${{ steps.audit.outputs.fully_closed }}"
          echo "next=${{ steps.audit.outputs.next }}"
      - name: Fail closed on producer validation
        if: steps.audit.outputs.rc != '0'
        run: exit 2
