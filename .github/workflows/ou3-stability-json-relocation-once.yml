name: ou3-stability-json-relocation-once

on:
  push:
    branches:
      - codex/ou3-p4-p5-complete-sea3-after-492
    paths:
      - ".github/workflows/ou3-stability-json-relocation-once.yml"

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/codex/ou3-p4-p5-complete-sea3-after-492

      - name: Rewrite retained stability-domain references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          stability = Path("tools/stability")
          old_domain = ' / "tools" / "ou3_proof_operating_domain.json"'
          new_domain = ' / "tools" / "stability" / "ou3_proof_operating_domain.json"'
          old_response = ' / "tools" / "ou3_sea3_directional_response_domain.json"'
          new_response = ' / "tools" / "stability" / "ou3_sea3_directional_response_domain.json"'

          changed = []
          for path in sorted(stability.glob("ou3_*.py")):
              text = path.read_text(encoding="utf-8")
              new = text.replace(old_domain, new_domain).replace(old_response, new_response)
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  changed.append(str(path))

          workflow_replacements = {
              "tools/" + "ou3_proof_operating_domain.json":
                  "tools/stability/" + "ou3_proof_operating_domain.json",
              "tools/" + "ou3_sea3_directional_response_domain.json":
                  "tools/stability/" + "ou3_sea3_directional_response_domain.json",
          }
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              if path.name == "ou3-stability-json-relocation-once.yml":
                  continue
              text = path.read_text(encoding="utf-8")
              new = text
              for old, replacement in workflow_replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  changed.append(str(path))

          if not changed:
              raise SystemExit("no stability-domain references were rewritten")
          print("rewritten", len(changed), "files")
          for path in changed:
              print(path)
          PY
          git rm tools/ou3_proof_operating_domain.json
          git rm tools/ou3_sea3_directional_response_domain.json
          git rm .github/workflows/ou3-stability-json-relocation-once.yml

      - name: Verify relocation before commit
        run: |
          python3 -m py_compile tools/stability/*.py
          python3 -m unittest -v tests.validation.test_ou3_stability_package_integrity

      - name: Commit relocation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move stability JSON domains into package"
          git push origin HEAD:refs/heads/codex/ou3-p4-p5-complete-sea3-after-492
