name: ou3-p5-v26-v10-directional-first-open-fast

on:
  push:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_v10_directional_correction_v26.py"
      - ".github/workflows/ou3-p5-v26-v10-directional-first-open-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_v10_directional_correction_v26.py"
      - ".github/workflows/ou3-p5-v26-v10-directional-first-open-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v26-v10-directional-first-open-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-v10-directional-first-open-v26:
    name: P5 sample-1 V10 directional first-open witness V26
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Compile V26 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_v10_directional_correction_v26.py \
            tests/validation/test_ou3_p5_sample1_v10_directional_correction_v26.py
      - name: Test V26 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_v10_directional_correction_v26
      - name: Emit V26 first-open directional correction audit
        run: |
          python3 tools/ou3_p5_sample1_v10_directional_correction_v26.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --current-component-pieces 4 \
            --output /tmp/p5_sample1_v26_v10_directional_first_open.json
