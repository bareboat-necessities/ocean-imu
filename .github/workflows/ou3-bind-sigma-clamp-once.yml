name: ou3-bind-sigma-clamp-once

on:
  push:
    branches: [codex/ou3-p3-source-clock-recurrence]
    paths: [".github/workflows/ou3-bind-sigma-clamp-once.yml"]

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bind P3 sigma source envelope to MAX_SIGMA_A
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/ou3_source_reachable_matrix_p3.py')
          s=p.read_text()
          old='''        "MIN_TUNE_FREQ_HZ","MAX_TUNE_FREQ_HZ","MIN_TAU_S","MAX_TAU_S",\n        "MIN_R_S","MAX_R_S","PSEUDO_UPDATE_TAU_RATIO_DEFAULT",'''
          new='''        "MIN_TUNE_FREQ_HZ","MAX_TUNE_FREQ_HZ","MIN_TAU_S","MAX_TAU_S","MAX_SIGMA_A",\n        "MIN_R_S","MAX_R_S","PSEUDO_UPDATE_TAU_RATIO_DEFAULT",'''
          assert old in s
          s=s.replace(old,new,1)
          old='''        "sigma_aw_applied_safety":[0.05,6.0],'''
          new='''        "sigma_aw_applied_safety":[0.05,c["MAX_SIGMA_A"]],'''
          assert old in s
          s=s.replace(old,new,1)
          old='''    sigmas=interval_cells(geom_edges(0.05,6.0,5))'''
          new='''    sigma_lo,sigma_hi=sched["sigma_aw_applied_safety"]\n    sigmas=interval_cells(geom_edges(sigma_lo,sigma_hi,5))'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 -m py_compile tools/ou3_source_reachable_matrix_p3.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          import ou3_source_reachable_matrix_p3 as P
          s=P.source_schedule()
          assert s['sigma_aw_applied_safety'] == [0.05, 4.0], s['sigma_aw_applied_safety']
          assert s['pseudo_max_s'] == 0.15, s['pseudo_max_s']
          print('SIGMA_PROOF_ENVELOPE', s['sigma_aw_applied_safety'])
          print('PSEUDO_MAX_S', s['pseudo_max_s'])
          PY
      - name: Commit proof-source binding
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/ou3_source_reachable_matrix_p3.py
          git rm .github/workflows/ou3-bind-sigma-clamp-once.yml
          git commit -m "OU-III proof: consume 4 m/s2 sigma clamp in P3"
          git push
