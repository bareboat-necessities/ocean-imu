name: agent-set-ou3-tau5000

on:
  push:
    branches:
      - agent/mean-reverting-accel-bias

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/mean-reverting-accel-bias
      - name: Set OU-III residual accel-bias time constant to 5000 s
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/kalman_ou_iii/Kalman3D_Wave_OU_III.h')
          text = p.read_text()
          old = 'T tau_bacc_ = T(3000.0);'
          new = 'T tau_bacc_ = T(5000.0);'
          if old not in text:
              raise SystemExit('OU-III 3000 s declaration not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          grep -q 'T tau_bacc_ = T(5000.0);' src/kalman_ou_iii/Kalman3D_Wave_OU_III.h
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/kalman_ou_iii/Kalman3D_Wave_OU_III.h
          git commit -m 'Use 5000 s OU-III residual bias default'
          git push origin HEAD:agent/mean-reverting-accel-bias
