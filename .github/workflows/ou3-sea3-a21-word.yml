name: ou3-sea3-a21-word

on:
  pull_request:
    paths:
      - "tools/ou3_sea3_a21_accumulated_word_matrix.py"
      - "tools/ou3_sea3_word_noise_accumulation.py"
      - "tools/ou3_sea3_h18_prior_free_completion.py"
      - "tools/ou3_sea3_a21_detectability_completion.py"
      - "tools/ou3_sea3_riccati_tube*.py"
      - "tools/ou3_full_process_ucc.py"
      - "tests/validation/test_ou3_sea3_a21_accumulated_word_matrix.py"
      - ".github/workflows/ou3-sea3-a21-word.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a21-word:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build restartable complete SEA3 A21 matrix
        run: |
          python3 tools/ou3_sea3_a21_accumulated_word_matrix.py --output /tmp/ou3_sea3_a21_word.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_a21_word.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_source'] == 'COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['full_covariance_Loewner_upper_rule'] == 'P<=21*diag(u)'
          assert d['unknown_covariance_cross_terms_covered'] is True
          assert d['full_21x21_generalized_Riccati_matrix_closed'] is True
          assert d['A21_restartable_reachable_tube_contraction_closed'] is True
          assert d['worst_full_A21_inverse_space_LDLT_pivot_lower'] > 0.0
          assert d['useful_gate'] == 1.0e-18
          assert d['eta9_point_packet_shortcut_used'] is False
          assert d['independent_tau_sigma_RS_TS_product_used_as_source'] is False
          print('A21_WORD_HORIZON', d['retained_accumulated_horizon_s'])
          print('A21_WORD_X_CELLS', d['translation_word_X_cells_certified'])
          print('A21_WORD_MAX_SPLIT_DEPTH', d['translation_word_X_max_split_depth'])
          print('A21_WORD_WORST_PIVOT', d['worst_full_A21_inverse_space_LDLT_pivot_lower'])
          print('A21_WORD_CLOSED', d['A21_restartable_reachable_tube_contraction_closed'])
          print('A21_BA_BLOCK', d['active_ba_block'])
          print('A21_ATT_BG_BLOCK', d['attitude_gyro_bias_block'])
          PY
      - name: Test restartable complete SEA3 A21 matrix
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_sea3_a21_accumulated_word_matrix
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-sea3-a21-word
          path: /tmp/ou3_sea3_a21_word.json
          retention-days: 7
