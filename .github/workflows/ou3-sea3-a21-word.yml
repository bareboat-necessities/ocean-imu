name: ou3-sea3-a21-word

on:
  pull_request:
    paths:
      - "tools/ou3_sea3_a21_prior_free_completion.py"
      - "tools/ou3_sea3_a21_detectability_completion.py"
      - "tools/ou3_sea3_h18_prior_free_completion.py"
      - "tools/ou3_sea3_full_word_event_algebra.py"
      - "tools/ou3_full_process_ucc.py"
      - "tests/validation/test_ou3_sea3_a21_prior_free_completion.py"
      - ".github/workflows/ou3-sea3-a21-word.yml"
  workflow_dispatch:

concurrency:
  group: ou3-sea3-a21-word-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  a21-word:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build canonical complete SEA3 A21 prior-free matrix
        run: |
          python3 tools/ou3_sea3_a21_prior_free_completion.py --output /tmp/ou3_sea3_a21_word.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_a21_word.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_source'] == 'COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['A21_prior_free_completion_closed'] is True
          assert d['full_21x21_Omega_minus_delta_P_LDLT_closed'] is True
          assert d['full_21x21_interval_LDLT_used'] is True
          assert d['worst_full_A21_LDLT_pivot_lower'] > 0.0
          assert d['finite_full_A21_linear_estimator_constructed'] is True
          assert d['finite_full_A21_estimator_implies_D_strictly_positive'] is True
          assert d['full_A21_prior_free_D_inverse_identity_used'] is True
          assert d['eta9_point_packet_shortcut_used'] is False
          assert d['old_one_step_Euclidean_Q_min_used'] is False
          assert d['useful_gate'] == 1.0e-18
          print('A21_TRACE_UPPER', d['A21_diffuse_prior_covariance_upper']['full_A21_trace_upper'])
          print('A21_DELTA2_PENALTY', d['delta_squared_over_four_penalty_physical'])
          print('A21_X_CELLS', d['x_cells_certified'])
          print('A21_WORST_PIVOT', d['worst_full_A21_LDLT_pivot_lower'])
          print('A21_CLOSED', d['A21_prior_free_completion_closed'])
          PY
      - name: Test canonical complete SEA3 A21 matrix
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_sea3_a21_prior_free_completion
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-sea3-a21-word
          path: /tmp/ou3_sea3_a21_word.json
          retention-days: 7
