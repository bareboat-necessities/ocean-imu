name: apply-validation-discovery-patch-once

on:
  push:
    branches: [agent/harden-ou-evidence-provenance]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/harden-ou-evidence-provenance
      - name: Convert stale test overrides to direct semantic checks
        run: python3 tools/apply_validation_discovery_patch.py
      - name: Compile validation tests
        run: |
          python3 -m py_compile tests/validation/test_ou_validation.py \
            tests/validation/test_reorg_compat_overrides.py \
            tests/validation/test_zz_publication_contract.py
      - name: Commit permanent test cleanup and remove one-shot helpers
        run: |
          set -euo pipefail
          rm tools/apply_validation_discovery_patch.py
          rm .github/workflows/apply-validation-discovery-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/validation/test_ou_validation.py \
                  tests/validation/test_reorg_compat_overrides.py \
                  tests/validation/test_zz_publication_contract.py \
                  tools/apply_validation_discovery_patch.py \
                  .github/workflows/apply-validation-discovery-patch.yml
          git commit -m "Make validation tests discovery-order independent"
          git push origin HEAD:refs/heads/agent/harden-ou-evidence-provenance
