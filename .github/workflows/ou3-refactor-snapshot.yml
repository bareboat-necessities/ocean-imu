name: ou3-refactor-snapshot

on:
  push:
    branches:
      - codex/ou3-p4-p5-complete-sea3-after-492

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ou3-p4-p5-complete-sea3-after-492
          fetch-depth: 0
      - name: Apply deterministic stability refactor
        shell: bash
        run: |
          cat .refactor/ou3-stability-b64-* | base64 -d | gzip -d > /tmp/ou3_stability_refactor.py
          python3 /tmp/ou3_stability_refactor.py
          test ! -n "$(git status --short src)"
          python3 -m py_compile tools/*.py tools/stability/*.py tests/validation/test_*.py
      - name: Run expanded proof foundation
        working-directory: tests/validation
        env:
          PYTHONPATH: ../../tools/stability:../../tools
        run: |
          python3 -m unittest -q \
            test_ou3_stability_package_integrity \
            test_ou3_result_determinism \
            test_ou3_source_domain_contract \
            test_ou3_proof_cleanup \
            test_ou3_translational_uco_ucc \
            test_ou3_full_process_ucc \
            test_ou3_vector_uco_certificate \
            test_ou3_p3_pseudo_scheduler_progress_certificate
      - name: Commit consolidated proof tree without workflow files
        shell: bash
        run: |
          git restore --source=HEAD -- .github/workflows
          rm -rf .refactor
          git add -A
          test ! -n "$(git status --short src)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: consolidate OU-III stability tooling'
          git push origin HEAD:codex/ou3-p4-p5-complete-sea3-after-492
