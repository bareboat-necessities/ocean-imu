name: ou3-alt-524-checked-transfer
on:
  push:
    branches: [proof/ou3-alt-live-mag-composition]
    paths:
      - '.proof-transfer/ou3-alt-524.*.b64'
      - '.github/workflows/ou3-alt-524-transfer.yml'
permissions:
  contents: write
jobs:
  apply-tested-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply the locally tested proof-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, bz2, hashlib, pathlib, subprocess
          paths = [
              'docs/ou3-alt-contraction-handover.md',
              'docs/ou3-alt-live-magnetic-word.md',
              'docs/ou3-alt-main-handover.md',
              'docs/ou3-alt-proof-plan.md',
              'docs/ou3-alt-runtime-primitives.md',
              'docs/ou3-proof-research-state.md',
              'tests/ou3_alt_contraction/test_finite_continuous_mag_runtime.py',
              'tests/ou3_alt_contraction/test_finite_live_interleave.py',
              'tests/ou3_alt_contraction/test_finite_live_magnetic_word.py',
              'tests/ou3_alt_contraction/test_finite_mag_call_schedule.py',
              'tools/stability/ou3_alt_contraction/finite_continuous_mag_runtime.py',
              'tools/stability/ou3_alt_contraction/finite_h18_a21_reachability.py',
              'tools/stability/ou3_alt_contraction/finite_live_interleave.py',
              'tools/stability/ou3_alt_contraction/finite_live_magnetic_word.py',
              'tools/stability/ou3_alt_contraction/finite_mag_call_schedule.py',
              'tools/stability/ou3_alt_contraction/finite_mag_source_qualification.py',
          ]
          encoded = ''.join(pathlib.Path(f'.proof-transfer/ou3-alt-524.{i}.b64').read_text().strip() for i in range(4))
          patch = bz2.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd9989cf0b96d9a3cb6892eff20299d5316a8ab8869f07fb7e69e031a24875a96'
          assert len(patch) == 141119
          target = pathlib.Path('/tmp/ou3-alt-524.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(paths), changed
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['python3', '-m', 'compileall', '-q', 'tools/stability/ou3_alt_contraction', 'tests/ou3_alt_contraction'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'proof(ou3-alt): compose live magnetic calibration and interleaved finite prefixes'
          git push origin HEAD:refs/heads/proof/ou3-alt-live-mag-composition
