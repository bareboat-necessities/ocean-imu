name: tfg-divergence-investigation
on:
  push:
    branches: [fix/tfg-device-divergence]
    paths: [.github/workflows/tfg-divergence-investigation.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 40
      - name: Package exact source, recent patches and Eigen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeigen3-dev
          mkdir -p /tmp/tfg-investigation
          git archive --format=tar.gz HEAD > /tmp/tfg-investigation/source.tar.gz
          git log -40 --format='%H %P %s' > /tmp/tfg-investigation/history.txt
          git diff 59118d19 HEAD -- src/kalman_tfg sensors/full_marine_ins/atomS3R_ins_tfg > /tmp/tfg-investigation/recent-tfg.patch
          git archive --format=tar.gz 59118d19 src/kalman_tfg sensors/full_marine_ins/atomS3R_ins_tfg > /tmp/tfg-investigation/baseline-tfg.tar.gz
          tar -czf /tmp/tfg-investigation/eigen.tar.gz -C /usr/include eigen3
          git rev-parse HEAD > /tmp/tfg-investigation/SOURCE_SHA
      - uses: actions/upload-artifact@v6
        with:
          name: tfg-divergence-source
          path: /tmp/tfg-investigation/
          retention-days: 7
          if-no-files-found: error
