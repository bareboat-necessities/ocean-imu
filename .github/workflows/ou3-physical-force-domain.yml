name: ou3-physical-force-domain

on:
  push:
    paths:
      - "tools/ou3_proof_operating_domain.json"
      - "tools/ou3_physical_force_domain.py"
      - "tests/validation/test_ou3_physical_force_domain.py"
      - ".github/workflows/ou3-physical-force-domain.yml"
  pull_request:
    paths:
      - "tools/ou3_proof_operating_domain.json"
      - "tools/ou3_physical_force_domain.py"
      - "tests/validation/test_ou3_physical_force_domain.py"
      - ".github/workflows/ou3-physical-force-domain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-physical-force-domain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  force-domain:
    name: Marine CoG force-domain consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile force-domain proof and tests
        run: |
          python3 -m py_compile \
            tools/ou3_physical_force_domain.py \
            tests/validation/test_ou3_physical_force_domain.py
      - name: Run focused force-domain tests
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_physical_force_domain
      - name: Emit physical-force certificate
        run: python3 tools/ou3_physical_force_domain.py --output /tmp/ou3_physical_force_domain.json
      - name: Enforce marine scope
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/ou3_physical_force_domain.json').read_text())
          assert d['validation_pass'], d['validation_failures']
          assert d['non_gravitational_cog_acceleration_norm_upper_mps2'] == 4.0
          assert abs(d['derived_specific_force_norm_lower_mps2'] - 5.80665) < 1e-12
          assert abs(d['derived_specific_force_norm_upper_mps2'] - 13.80665) < 1e-12
          assert d['old_independent_30_mps2_cap_used'] is False
          assert d['impact_slam_in_scope'] is False
          assert d['lever_arm_enabled'] is False
          assert d['P4_USABLE_CERTIFICATE_PROMOTED'] is False
          print('a_non-grav max:', d['non_gravitational_cog_acceleration_norm_upper_mps2'])
          print('derived total specific force:', d['derived_specific_force_norm_lower_mps2'], d['derived_specific_force_norm_upper_mps2'])
          print('fractions g:', d['derived_specific_force_norm_lower_fraction_g'], d['derived_specific_force_norm_upper_fraction_g'])
          PY
