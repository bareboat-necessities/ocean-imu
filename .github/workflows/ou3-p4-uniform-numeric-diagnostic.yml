name: ou3-p4-uniform-numeric-diagnostic
on:
  push:
    paths:
      - "tools/stability/ou3_p4_uniform_numeric_diagnostic.py"
      - ".github/workflows/ou3-p4-uniform-numeric-diagnostic.yml"
  pull_request:
    paths:
      - "tools/stability/ou3_p4_uniform_numeric_diagnostic.py"
      - ".github/workflows/ou3-p4-uniform-numeric-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Produce theorem numeric diagnostic
        run: python3 tools/stability/ou3_p4_uniform_numeric_diagnostic.py --output /tmp/ou3-p4-uniform-numeric-diagnostic.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ou3-p4-uniform-numeric-diagnostic
          path: /tmp/ou3-p4-uniform-numeric-diagnostic.json
          retention-days: 7
          if-no-files-found: warn
