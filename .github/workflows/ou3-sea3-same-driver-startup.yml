name: ou3-sea3-same-driver-startup
on:
  push:
    branches: [codex/ou3-complete-sea3-shipping-feasibility]
    paths:
      - tools/stability/ou3_sea3_continuum_driver_gram.py
      - tools/stability/ou3_sea3_validated_continuum_member.py
      - tools/stability/ou3_sea3_validated_float_trace.py
      - tests/kalman_ou_iii/ou3-sea3-same-driver-startup-test.cpp
      - src/kalman_ou_iii/**
      - src/tuner/**
      - src/ahrs/**
      - .github/workflows/ou3-sea3-same-driver-startup.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-driver-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Eigen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeigen3-dev
      - name: Validate exact continuum member and bind its unique shipping float inputs
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/stability/ou3_sea3_continuum_driver_gram.py \
            tools/stability/ou3_sea3_validated_continuum_member.py \
            tools/stability/ou3_sea3_validated_float_trace.py
          python3 tools/stability/ou3_sea3_continuum_driver_gram.py --output /tmp/sea3-driver.json
          python3 tools/stability/ou3_sea3_validated_continuum_member.py \
            | tee /tmp/sea3-validated-member.json
          python3 tools/stability/ou3_sea3_validated_float_trace.py \
            --output /tmp/sea3-validated-float-trace.json \
            --shipping-input /tmp/sea3-validated-specific-force-z.txt
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/sea3-validated-float-trace.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_source']=='COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['all_intervals_round_to_unique_binary32'] is True
          assert d['same_continuum_member_before_and_after_live'] is True
          assert d['quadrature_used'] is False
          assert d['finite_harmonic_source_used'] is False
          assert d['trajectory_replay_used'] is False
          assert d['independent_sample_choice_used'] is False
          PY
      - name: Compile shipping startup bridge without modifying production code
        run: |
          g++ -O3 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -DEIGEN_NON_ARDUINO -I./src -isystem /usr/include/eigen3 \
            tests/kalman_ou_iii/ou3-sea3-same-driver-startup-test.cpp \
            -o /tmp/ou3-sea3-same-driver-startup
      - name: Execute exact continuum history through shipping startup and 601 Live samples
        run: |
          /tmp/ou3-sea3-same-driver-startup /tmp/sea3-validated-specific-force-z.txt \
            | tee /tmp/ou3-sea3-same-driver-shipping-trace.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3-sea3-same-driver-shipping-trace.json'))
          assert d['canonical_source']=='COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['same_validated_continuum_member'] is True
          assert d['trajectory_replay_used'] is False
          assert d['finite_harmonic_source_used'] is False
          assert len(d['word_schedule']) == 601
          assert len(d['live_covariance']) in (18,21)
          assert all(len(r['RS_std_xyz']) == 3 for r in d['word_schedule'])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ou3-sea3-same-driver-startup
          path: |
            /tmp/sea3-driver.json
            /tmp/sea3-validated-member.json
            /tmp/sea3-validated-float-trace.json
            /tmp/sea3-validated-specific-force-z.txt
            /tmp/ou3-sea3-same-driver-shipping-trace.json
          retention-days: 7
