name: ou3-p4-first-accel-cover-v3

on:
  push:
    paths:
      - "tools/ou3_p4_*.py"
      - "tools/ou3_full_process_ucc.py"
      - "tools/ou3_interval.py"
      - "tools/ou3_interval_ad.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_vector_uco_certificate.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-first-accel-cover-v3.yml"
  pull_request:
    paths:
      - "tools/ou3_p4_*.py"
      - "tools/ou3_full_process_ucc.py"
      - "tools/ou3_interval.py"
      - "tools/ou3_interval_ad.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_vector_uco_certificate.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-first-accel-cover-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-accel-current-head:
    strategy:
      fail-fast: false
      matrix:
        mode: [H, A]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile active first-accel route
        run: |
          python3 -m py_compile \
            tools/ou3_p4_joint_first_accel_cover.py \
            tools/ou3_p4_joint_first_accel_cover_v3.py \
            tools/ou3_p4_covariance_primitives.py \
            tools/ou3_p4_golive_covariance.py \
            tools/ou3_p4_candidate_full_word.py
      - name: Revalidate full 0.8-rad first-accelerometer cover
        run: |
          python3 tools/ou3_p4_joint_first_accel_cover_v3.py \
            --mode "${{ matrix.mode }}" \
            --source-node-index 0 \
            --max-depth 10 \
            --max-cells 5000 \
            --output "/tmp/ou3_p4_first_accel_v3_${{ matrix.mode }}.json"
      - name: Contract
        run: |
          MODE="${{ matrix.mode }}" python3 - <<'PY'
          import json, os
          mode=os.environ['MODE']
          d=json.load(open(f'/tmp/ou3_p4_first_accel_v3_{mode}.json'))
          r=d['result']
          assert d['outer_angle_rad'] == 0.80
          assert d['outer_domain_shrunk'] is False
          assert d['optimized_state_replay_verified_identical'] is True
          assert d['gyro_bias_rows_columns_6_plus_structurally_zero'] is True
          assert d['K_interval_matrix_materialized'] is False
          assert d['P4_COMPLETE_WORD_DISSIPATION_ESTABLISHED_HERE'] is False
          assert r['root_cover_cells'] == 96
          assert r['full_outer_ball_first_accel_cover_complete'] is True
          assert not r['unresolved_antipode_cells']
          assert not r['other_failures']
          print(mode,'roots',r['root_cover_cells'],'leaves',r['accepted_leaf_cells'],
                'splits',r['split_count'],'max_correction',r['max_correction_theta_norm_upper'],
                'max_post_q',r['max_post_cayley_norm_upper'])
          PY
