name: ou3-proof

on:
  push:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_*.py"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - ".github/workflows/ou3-proof.yml"
  pull_request:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_*.py"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - ".github/workflows/ou3-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile current proof tooling
        run: make -C tests/validation build

      - name: Run current proof primitive tests
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_proof_cleanup \
            test_ou3_full_process_ucc \
            test_ou3_implementation_word_language \
            test_ou3_p4_effective_vector_inputs \
            test_ou3_p4_effective_word_transport \
            test_ou3_p4_joseph_directional_weight \
            test_ou3_p4_initial_directional_packet_certificate \
            test_ou3_p4_sample_clock_source_refinement \
            test_ou3_p4_source_node_cells \
            test_ou3_p4_source_path_reachability \
            test_ou3_source_domain_contract \
            test_ou3_translational_uco_ucc \
            test_ou3_validated_transcendentals \
            test_ou3_vector_uco_certificate \
            test_ou3_verified_spd_inverse

      - name: Validate source-complete P4 word timing decomposition
        run: |
          python3 tools/ou3_p4_source_word_timing.py \
            --output /tmp/ou3_p4_source_word_timing.json

  p3-metric:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate dependency-preserving scaled OU process
        run: |
          python3 tools/ou3_p3_scaled_process.py \
            --output /tmp/ou3_p3_scaled_process.json

      - name: Run canonical source-uniform P3 matrix certificate
        run: |
          python3 tools/ou3_p3_source_uniform_certificate.py \
            --output /tmp/ou3_p3_matrix.json

      - name: Print P3 nonlinear budget inputs
        if: always()
        run: |
          if [ -f /tmp/ou3_p3_matrix.json ]; then
            python3 - <<'PY'
          import json
          d = json.load(open('/tmp/ou3_p3_matrix.json'))
          print('P3', d.get('P3_LINEAR_CERTIFICATE_ESTABLISHED'))
          for mode in ('H', 'A'):
              m = d.get('modes', {}).get(mode, {})
              print(mode,
                    'delta', m.get('relative_Riccati_injection_margin_lower'),
                    'Sigma_min', m.get('Sigma_lambda_min_lower'),
                    'Sigma_max', m.get('Sigma_lambda_max_upper'),
                    'Omega_min', m.get('word_noise_Omega_lambda_min_lower'))
          PY
          fi

      - name: Upload reproducible P3 certificate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p3-source-uniform
          path: |
            /tmp/ou3_p3_scaled_process.json
            /tmp/ou3_p3_matrix.json
          if-no-files-found: warn
          retention-days: 7

  p4-sector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile retained P4 sector route
        run: |
          python3 -m py_compile \
            tools/ou3_p4_cayley_sector_certificate.py \
            tools/ou3_p4_vector_remainder_sector.py \
            tools/ou3_p4_effective_vector_inputs.py \
            tools/ou3_p4_source_word_timing.py \
            tools/ou3_p4_signed_joseph_sector_inputs.py \
            tools/ou3_p4_effective_word_transport.py \
            tools/ou3_p4_joseph_directional_weight.py \
            tools/ou3_p4_initial_directional_packet_certificate.py

      - name: Certify usable 0.8 rad nonlinear sector primitives
        run: |
          python3 tools/ou3_p4_cayley_sector_certificate.py \
            --output /tmp/ou3_p4_cayley_sector.json
          python3 tools/ou3_p4_vector_remainder_sector.py \
            --output /tmp/ou3_p4_vector_remainder.json
          python3 tools/ou3_p4_effective_vector_inputs.py \
            --output /tmp/ou3_p4_effective_vector_inputs.json
          python3 tools/ou3_p4_joseph_directional_weight.py \
            --output /tmp/ou3_p4_joseph_directional_weight.json
          python3 tools/ou3_p4_initial_directional_packet_certificate.py \
            --output /tmp/ou3_p4_initial_directional_packet.json

      - name: Print exact effective-input and Joseph directional widening
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/ou3_p4_effective_vector_inputs.json')
          if p.exists():
              d = json.loads(p.read_text())
              print('pass', d.get('validation_pass'))
              print('q_upper', d.get('cayley_radius_upper'))
              print('mag_radial_null', d.get('mag_radial_residual_gain_null_exact'))
              print('mag_tangent_defect', d.get('mag_effective_coordinate_tangent_defect_factor_upper'))
              print('acc_eta_in_aw_range', d.get('acc_eta_in_aw_measurement_range_exact'))
              print('acc_effective_aw_input_norm', d.get('acc_effective_aw_input_norm_upper_mps2'))
          p = Path('/tmp/ou3_p4_joseph_directional_weight.json')
          if p.exists():
              d = json.loads(p.read_text())
              print('Joseph bridge pass', d.get('validation_pass'))
              for mode in ('H', 'A'):
                  m = d.get('modes', {}).get(mode, {})
                  print(mode,
                        'initial min attenuation', m.get('minimum_initial_directional_attenuation_lower'),
                        'acc', m.get('accelerometer', {}).get('joseph_vs_R_inverse_directional_attenuation_lower'),
                        'mag', m.get('magnetometer', {}).get('joseph_vs_R_inverse_directional_attenuation_lower'),
                        'S', m.get('S_zero', {}).get('joseph_vs_R_inverse_directional_attenuation_lower'))
              print('Joseph next:', d.get('next_obligation'))
          p = Path('/tmp/ou3_p4_initial_directional_packet.json')
          if p.exists():
              d = json.loads(p.read_text())
              print('initial directional packet pass', d.get('validation_pass'))
              for mode in ('H', 'A'):
                  m = d.get('modes', {}).get(mode, {})
                  print(mode,
                        'P3 alpha6', m.get('P3_R_inverse_vector_gyro_bias_alpha6_lower'),
                        'sector alpha6', m.get('finite_angle_R_inverse_directional_alpha6_lower'),
                        'Joseph sector alpha6', m.get('initial_finite_angle_Joseph_directional_alpha6_lower'))
              print('initial packet next:', d.get('next_obligation'))
          PY

      - name: Upload P4 sector primitives
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-sector-primitives
          path: |
            /tmp/ou3_p4_cayley_sector.json
            /tmp/ou3_p4_vector_remainder.json
            /tmp/ou3_p4_effective_vector_inputs.json
            /tmp/ou3_p4_joseph_directional_weight.json
            /tmp/ou3_p4_initial_directional_packet.json
          if-no-files-found: warn
          retention-days: 7

  p4-composition-inputs:
    needs: [source-foundation, p3-metric, p4-sector]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build retained same-metric P3 to P4 composition contract
        run: |
          python3 tools/ou3_p4_signed_joseph_sector_inputs.py \
            --output /tmp/ou3_p4_signed_joseph_sector_inputs.json

      - name: Build source-correlated directional word transport contract
        run: |
          python3 tools/ou3_p4_effective_word_transport.py \
            --output /tmp/ou3_p4_effective_word_transport.json

      - name: Print H/A effective-input composition and word-transport inputs
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/ou3_p4_signed_joseph_sector_inputs.json')
          if p.exists():
              d = json.loads(p.read_text())
              print('P3', d.get('P3_ESTABLISHED'))
              print('composition_prerequisites', d.get('P4_COMPOSITION_PREREQUISITES_ESTABLISHED'))
              print('P4', d.get('P4_COMPLETE_WORD_DISSIPATION_ESTABLISHED'))
              print('same_metric', d.get('same_information_metric_retained'))
              print('standalone_eta_active', d.get('standalone_vector_eta_penalty_active'))
              for mode in ('H', 'A'):
                  m = d.get('modes', {}).get(mode, {})
                  print(mode,
                        'linear_delta', m.get('P3_relative_Riccati_injection_margin_lower'),
                        'mag_tangent_defect', m.get('mag_effective_coordinate_tangent_defect_factor_upper'),
                        'acc_force_factor', m.get('acc_force_remainder_factor_upper'),
                        'acc_aw_factor', m.get('acc_aw_rotation_factor_upper'))
              print('composition next:', d.get('next_obligation'))
          w = Path('/tmp/ou3_p4_effective_word_transport.json')
          if w.exists():
              d = json.loads(w.read_text())
              print('word transport semantics', d.get('P4_WORD_TRANSPORT_SEMANTICS_ESTABLISHED'))
              print('vector packet rank', d.get('measurement_directional_rank', {}).get('stacked_vector_packet_rank_exact'))
              print('per packet scalarization', d.get('per_packet_scalarization_allowed'))
              print('directional accumulation', d.get('directional_PSD_word_accumulation_required'))
              for mode in ('H', 'A'):
                  m = d.get('modes', {}).get(mode, {})
                  print(mode,
                        'vector nullity', m.get('vector_active_nullity_exact'),
                        'word margin', m.get('strict_generalized_word_margin_lower'),
                        'rho', m.get('rho_full_nonlinear_word_upper'))
              print('word next:', d.get('next_obligation'))
          PY

      - name: Upload P4 effective-input composition contracts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-effective-input-composition
          path: |
            /tmp/ou3_p4_signed_joseph_sector_inputs.json
            /tmp/ou3_p4_effective_word_transport.json
          if-no-files-found: warn
          retention-days: 7
