name: ou3-proof

on:
  push:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_*.json"
      - "tests/validation/test_ou3_*.py"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "src/tuner/**"
      - "doc/kalman_ou_iii/w3d-iss-stability.tex-part"
      - ".github/workflows/ou3-proof.yml"
  pull_request:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_*.json"
      - "tests/validation/test_ou3_*.py"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "src/tuner/**"
      - "doc/kalman_ou_iii/w3d-iss-stability.tex-part"
      - ".github/workflows/ou3-proof.yml"
  workflow_dispatch:

concurrency:
  group: ou3-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile proof tooling
        run: make -C tests/validation build

      - name: Enforce retained local linear primitives
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_proof_cleanup \
            test_ou3_translational_uco_ucc \
            test_ou3_full_process_ucc \
            test_ou3_vector_uco_certificate \
            test_ou3_p3_pseudo_scheduler_progress_certificate

  sea3-dynamic-source:
    needs: source-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate retained SEA3 physical/front-end prerequisites
        run: |
          python3 tools/ou3_sea3_spectral_moment_bridge.py --check
          python3 tools/ou3_sea3_wave_period_frontend.py \
            --output /tmp/ou3_sea3_wave_period_frontend.json

      - name: Certify dynamic SEA3 adaptive source state
        run: |
          python3 tools/ou3_sea3_dynamic_source_certificate.py \
            --output /tmp/ou3_sea3_dynamic_source_certificate.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_dynamic_source_certificate.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['P2_DYNAMIC_SOURCE_CERTIFICATE'] == 'PASS'
          assert d['old_P2_800_state_graph_consumed'] is False
          assert d['old_P2_history_word_enumeration_consumed'] is False
          print('DYNAMIC_SOURCE_INVARIANT', d['dynamic_invariant'])
          print('DYNAMIC_SOURCE_RATES', d['validated_rate_and_jump_bounds'])
          PY

      - name: Test dynamic-source contract
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_sea3_dynamic_source_certificate

      - name: Upload dynamic source artifact
        uses: actions/upload-artifact@v6
        with:
          name: ou3-sea3-dynamic-source
          path: |
            /tmp/ou3_sea3_wave_period_frontend.json
            /tmp/ou3_sea3_dynamic_source_certificate.json
          retention-days: 7

  riccati-p3:
    needs: sea3-dynamic-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build endpoint covariance upper
        run: |
          python3 tools/ou3_sea3_riccati_tube_factored.py \
            --output /tmp/ou3_sea3_riccati_tube.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_riccati_tube.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['source_history_graph_consumed'] is False
          assert d['predecessor_path_enumeration_consumed'] is False
          assert d['P2_800_state_partition_consumed'] is False
          print('P3_ENDPOINT_COVARIANCE_MEMORY', d['covariance_memory'])
          PY

      - name: Certify four-S translation information component
        run: |
          python3 tools/ou3_sea3_rs_word_information.py \
            --output /tmp/ou3_sea3_rs_word_information.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_rs_word_information.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['P3_RS_TRANSLATION_OBSERVATION_GEOMETRY_CLOSED'] is True
          assert d['P3_RS_BATCH_NOISE_UPPER_CLOSED'] is True
          assert d['four_S_translation_observation_operator_full_rank'] is True
          assert d['old_P2_800_state_graph_consumed'] is False
          assert d['source_history_graph_consumed'] is False
          ni=d['newton_coordinate_information']
          assert ni['exact_rational_arithmetic_used_before_outward_float_conversion'] is True
          assert ni['L_inverse_one_norm_exact'] == '12/5'
          assert ni['L_inverse_infinity_norm_exact'] == '2'
          print('FOUR_S_WORD_HORIZON', d['word_horizon_s_upper'])
          print('FOUR_S_AW_DD3_LOWER', d['aw_scaled_third_divided_difference_lower'])
          print('FOUR_S_NEWTON_INFO_LOWER', ni['D_S_newton_lambda_min_lower'])
          PY

      - name: Certify asynchronous windowed PE
        run: |
          python3 tools/ou3_sea3_windowed_vector_pe.py \
            --output /tmp/ou3_sea3_windowed_vector_pe.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_windowed_vector_pe.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['hardware_magnetometer_ODR_used_as_PE_recurrence'] is False
          assert d['two_consecutive_accepted_magnetic_packets_required'] is False
          assert d['rejected_magnetic_packets_between_required_occurrences_allowed'] is True
          assert d['all_valid_accelerometer_packets_required'] is True
          assert d['spread_occurrence_selection']['word_horizon_s'] >= 3.0
          assert d['eta6_information']['alpha_6_information_lower'] > 0.0
          assert d['A_mode_bias_route']['homogeneous_bias_contraction_gap_lower'] > 0.0
          print('WINDOWED_PE_ALPHA6', d['eta6_information']['alpha_6_information_lower'])
          print('WINDOWED_PE_WORD_HORIZON', d['spread_occurrence_selection']['word_horizon_s'])
          PY

      - name: Build complete Normal-Live P3 precondition contract
        run: |
          python3 tools/ou3_sea3_p3_full_preconditions.py \
            --output /tmp/ou3_sea3_p3_full_preconditions.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_p3_full_preconditions.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_architecture'] == 'SEA3_FULL_NORMAL_LIVE_RICCATI_WORD'
          assert d['all_current_machine_checkable_preconditions_present'] is True
          assert all(d['mandatory_preconditions'].values())
          assert d['source_parity_failures'] == []
          assert d['paper_parity_failures'] == []
          c=d['final_numeric_contract']
          assert c['common_word_horizon_s'] >= 3.0
          assert c['H_dimension'] == 18 and c['A_dimension'] == 21
          assert c['actual_applied_per_axis_RS_required'] is True
          assert c['full_18x18_and_21x21_matrix_comparison_required'] is True
          assert c['useful_gate'] == 1e-18
          print('COMPLETE_P3_WORD', d['word'])
          PY

      - name: Validate shipping Live covariance seed and joint word algebra
        run: |
          python3 tools/ou3_sea3_live_covariance_seed.py \
            --output /tmp/ou3_sea3_live_covariance_seed.json
          python3 tools/ou3_sea3_full_word_riccati_backend.py
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_live_covariance_seed.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['live_entry_seed_is_source_generated_not_arbitrary_PSD'] is True
          assert d['bootstrap_mekf_covariance_propagated_before_live'] is False
          assert d['source_parity_failures'] == []
          assert d['translation_seed']['P_v'] == 1.0
          assert d['translation_seed']['P_p'] == 400.0
          assert d['translation_seed']['P_S'] == 2500.0
          assert d['aw_live_seed']['reset_to_committed_stationary_covariance_before_first_prediction'] is True
          print('LIVE_P0_TRANSLATION', d['translation_seed'])
          print('LIVE_P0_AW', d['aw_live_seed'])
          PY

      - name: Build four-S R_S translation subarchitecture
        run: |
          python3 tools/ou3_sea3_rs_innovation_p3.py \
            --tube /tmp/ou3_sea3_riccati_tube.json \
            --output /tmp/ou3_sea3_rs_innovation_p3.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_rs_innovation_p3.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['P3_RS_TRANSLATION_OBSERVATION_GEOMETRY_CLOSED'] is True
          assert d['P3_RS_BATCH_NOISE_UPPER_CLOSED'] is True
          assert d['per_sample_Riccati_lower_propagation_used'] is False
          assert d['selected_process_mode_strictness_used'] is False
          assert d['determinant_trace_scalarization_used'] is False
          assert d['scalar_information_beta_used'] is False
          PY

      - name: Build canonical full-word P3 gate
        run: |
          python3 tools/ou3_sea3_riccati_metric_p3.py \
            --tube /tmp/ou3_sea3_riccati_tube.json \
            --output /tmp/ou3_sea3_riccati_metric_p3.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_riccati_metric_p3.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_P3_architecture'] == 'SEA3_FULL_NORMAL_LIVE_RICCATI_WORD'
          assert d['complete_precondition_contract_consumed'] is True
          assert d['all_current_machine_checkable_preconditions_present'] is True
          assert d['common_word_horizon_s'] >= 3.0
          assert d['live_entry_covariance_seed_consumed'] is True
          assert d['live_entry_covariance_seed_source_generated'] is True
          assert d['arbitrary_P0_PSD_box_used'] is False
          assert d['entrywise_independent_P0_rectangle_used'] is False
          assert d['joint_P_Psi_Omega_backend_consumed'] is True
          assert d['joint_backend_validation_pass'] is True
          assert d['R_S_component_is_not_the_whole_P3_architecture'] is True
          assert d['all_valid_accelerometer_updates_consumed'] is True
          assert d['windowed_asynchronous_vector_PE_consumed'] is True
          assert d['full_process_UCC_consumed'] is True
          assert d['aw_covariance_floor_PSD_events_consumed'] is True
          assert d['A_mode_finite_bias_correlation_consumed'] is True
          assert d['hardware_magnetometer_ODR_used_as_PE_recurrence'] is False
          assert d['determinant_trace_scalarization_used'] is False
          assert d['scalar_information_beta_used'] is False
          assert d['blockwise_minimum_ratio_used_for_final_gate'] is False
          assert d['independent_tau_sigma_RS_TS_extrema_product_used'] is False
          assert d['useful_gate'] == 1e-18
          print('P3_CANONICAL_PASS', d['P3_CANONICAL_PASS'])
          print('P3_FAIL_REASONS', d['P3_CANONICAL_FAIL_REASONS'])
          PY

      - name: Test complete P3 contracts
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_sea3_rs_word_information \
            test_ou3_sea3_live_covariance_seed \
            test_ou3_sea3_full_word_riccati_backend \
            test_ou3_sea3_riccati_metric_p3

      - name: Enforce canonical P3 quantitative closure
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_riccati_metric_p3.json'))
          if not d['P3_CANONICAL_PASS']:
              raise SystemExit('canonical complete Normal-Live P3 FAIL: ' + '; '.join(d['P3_CANONICAL_FAIL_REASONS']))
          PY

      - name: Upload canonical P3 artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p3-full-normal-live
          path: |
            /tmp/ou3_sea3_riccati_tube.json
            /tmp/ou3_sea3_rs_word_information.json
            /tmp/ou3_sea3_windowed_vector_pe.json
            /tmp/ou3_sea3_p3_full_preconditions.json
            /tmp/ou3_sea3_live_covariance_seed.json
            /tmp/ou3_sea3_rs_innovation_p3.json
            /tmp/ou3_sea3_riccati_metric_p3.json
          retention-days: 7

  riccati-p4:
    needs: riccati-p3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate retained 0.8-rad geometry
        run: |
          python3 tools/ou3_p4_cayley_sector_certificate.py \
            --output /tmp/ou3_p4_cayley_sector_certificate.json

      - name: Build canonical nonlinear moving-Riccati P4 foundation
        run: |
          python3 tools/ou3_sea3_riccati_metric_p4.py \
            --output /tmp/ou3_sea3_riccati_metric_p4.json

      - name: Test moving-Riccati P4 contract
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_sea3_riccati_metric_p4

      - name: Upload canonical P4 architecture artifact
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-moving-riccati
          path: |
            /tmp/ou3_p4_cayley_sector_certificate.json
            /tmp/ou3_sea3_riccati_metric_p4.json
          retention-days: 7