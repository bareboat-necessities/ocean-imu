name: ou3-proof

on:
  push:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_*.py"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - ".github/workflows/ou3-proof.yml"
  pull_request:
    paths:
      - "tools/ou3_*.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_*.py"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - ".github/workflows/ou3-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile current proof tooling
        run: make -C tests/validation build

      - name: Run current proof primitive tests
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_proof_cleanup \
            test_ou3_full_process_ucc \
            test_ou3_implementation_word_language \
            test_ou3_p4_sample_clock_source_refinement \
            test_ou3_p4_source_node_cells \
            test_ou3_p4_source_path_reachability \
            test_ou3_source_domain_contract \
            test_ou3_translational_uco_ucc \
            test_ou3_validated_transcendentals \
            test_ou3_vector_uco_certificate \
            test_ou3_verified_spd_inverse

      - name: Validate source-complete P4 word timing decomposition
        run: |
          python3 tools/ou3_p4_source_word_timing.py \
            --output /tmp/ou3_p4_source_word_timing.json

  p3-metric:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate dependency-preserving scaled OU process
        run: |
          python3 tools/ou3_p3_scaled_process.py \
            --output /tmp/ou3_p3_scaled_process.json

      - name: Run canonical source-uniform P3 matrix certificate
        run: |
          python3 tools/ou3_p3_source_uniform_certificate.py \
            --output /tmp/ou3_p3_matrix.json

      - name: Print P3 nonlinear budget inputs
        if: always()
        run: |
          if [ -f /tmp/ou3_p3_matrix.json ]; then
            python3 - <<'PY'
          import json
          d = json.load(open('/tmp/ou3_p3_matrix.json'))
          print('P3', d.get('P3_LINEAR_CERTIFICATE_ESTABLISHED'))
          for mode in ('H', 'A'):
              m = d.get('modes', {}).get(mode, {})
              print(mode,
                    'delta', m.get('relative_Riccati_injection_margin_lower'),
                    'Sigma_min', m.get('Sigma_lambda_min_lower'),
                    'Sigma_max', m.get('Sigma_lambda_max_upper'),
                    'Omega_min', m.get('word_noise_Omega_lambda_min_lower'))
          PY
          fi

      - name: Upload reproducible P3 certificate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p3-source-uniform
          path: |
            /tmp/ou3_p3_scaled_process.json
            /tmp/ou3_p3_matrix.json
          if-no-files-found: warn
          retention-days: 7

  p4-sector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile current P4 sector route
        run: |
          python3 -m py_compile \
            tools/ou3_p4_cayley_sector_certificate.py \
            tools/ou3_p4_vector_remainder_sector.py \
            tools/ou3_p4_source_word_timing.py \
            tools/ou3_p4_signed_joseph_sector_inputs.py

      - name: Certify usable 0.8 rad nonlinear sector primitives
        run: |
          python3 tools/ou3_p4_cayley_sector_certificate.py \
            --output /tmp/ou3_p4_cayley_sector.json
          python3 tools/ou3_p4_vector_remainder_sector.py \
            --output /tmp/ou3_p4_vector_remainder.json

      - name: Upload P4 sector primitives
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-sector-primitives
          path: |
            /tmp/ou3_p4_cayley_sector.json
            /tmp/ou3_p4_vector_remainder.json
          if-no-files-found: warn
          retention-days: 7

  p4-composition-inputs:
    needs: [source-foundation, p3-metric, p4-sector]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build global signed-Joseph nonlinear budget forms
        run: |
          python3 tools/ou3_p4_signed_joseph_sector_inputs.py \
            --output /tmp/ou3_p4_signed_joseph_sector_inputs.json

      - name: Print H/A optimized nonlinear charges
        if: always()
        run: |
          if [ -f /tmp/ou3_p4_signed_joseph_sector_inputs.json ]; then
            python3 - <<'PY'
          import json
          d = json.load(open('/tmp/ou3_p4_signed_joseph_sector_inputs.json'))
          print('P3', d.get('P3_ESTABLISHED'), 'P4', d.get('P4_COMPLETE_WORD_DISSIPATION_ESTABLISHED'))
          for mode in ('H', 'A'):
              m = d.get('modes', {}).get(mode, {})
              y = m.get('optimized_accelerometer_young', {})
              e = m.get('normalized_eps1', {})
              print(mode,
                    'linear_delta', m.get('P3_relative_Riccati_injection_margin_lower'),
                    'mag_metric_charge', e.get('mag_theta_charge_upper'),
                    'acc_eps_star', y.get('epsilon_star'),
                    'acc_minimax_metric_charge', y.get('minimax_metric_charge_upper'))
          print('next:', d.get('next_obligation'))
          PY
          fi

      - name: Upload P4 signed-Joseph composition inputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-signed-joseph-inputs
          path: /tmp/ou3_p4_signed_joseph_sector_inputs.json
          if-no-files-found: warn
          retention-days: 7
