name: ou3-proof

on:
  push:
    paths:
      - "tools/stability/ou3_*.py"
      - "tools/stability/ou3_*.json"
      - "tests/validation/test_ou3_*.py"
      - "tests/validation/Makefile"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "src/tuner/**"
      - "doc/kalman_ou_iii/w3d-iss-stability.tex-part"
      - ".github/workflows/ou3-proof.yml"
  pull_request:
    paths:
      - "tools/stability/ou3_*.py"
      - "tools/stability/ou3_*.json"
      - "tests/validation/test_ou3_*.py"
      - "tests/validation/Makefile"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "src/tuner/**"
      - "doc/kalman_ou_iii/w3d-iss-stability.tex-part"
      - ".github/workflows/ou3-proof.yml"
  workflow_dispatch:

concurrency:
  group: ou3-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile proof tooling
        run: make -C tests/validation build

      - name: Enforce retained local linear primitives
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_stability_package_integrity \
            test_ou3_p4_coordinate_transport_algebra \
            test_ou3_p4_complete_sea3_correction_information_bound \
            test_ou3_result_determinism \
            test_ou3_source_domain_contract \
            test_ou3_proof_cleanup \
            test_ou3_translational_uco_ucc \
            test_ou3_full_process_ucc \
            test_ou3_vector_uco_certificate \
            test_ou3_p3_pseudo_scheduler_progress_certificate

  proof-contracts:
    needs: source-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
      - name: Run every retained source/proof contract without publication replays
        run: |
          make -C tests/validation proof-test \
            PROOF_TEST_SHARD_INDEX=${{ matrix.shard }} \
            PROOF_TEST_SHARD_COUNT=6

  complete-sea3-source:
    needs: source-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build complete SEA3 source
        run: |
          python3 tools/stability/ou3_sea3_complete_source.py \
            --output /tmp/ou3_sea3_complete_source.json
          python3 tools/stability/ou3_sea3_windowed_vector_pe.py \
            --output /tmp/ou3_sea3_windowed_vector_pe.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_complete_source.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_P3_source'] == 'COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['P3_source_contract_ready'] is True
          assert d['P3_source_family_materialized'] is False
          assert all(v is False for v in d['no_fallback_generators'].values())
          sea=d['SEA3_surface_family']
          assert sea['modes_max'] == 3
          assert sea['parameter_domain_compact'] is True
          assert sea['compact_transition_relation_is_theorem_domain'] is True
          assert sea['independent_H_T_extrema_forbidden'] is True
          dyn=d['SEA3_dynamic_realization']
          assert dyn['phase_continuous'] is True
          assert dyn['same_realization_drives_translation_rotation_frontend_tuner_geometry'] is True
          assert dyn['finite_window_family_materialized'] is False
          assert dyn['probabilistic_event_may_substitute_for_realization'] is False
          coupling=d['SEA3_response_couplings']
          assert coupling['independent_sea_x_RAO_cartesian_product_forbidden'] is True
          assert coupling['only_same_phase_continuous_SEA3_realization_may_generate_P3_words'] is True
          assert coupling['moment_or_probability_bound_may_not_generate_P3_word'] is True
          stochastic=d['stochastic_forcing_corollary']
          assert stochastic['used_to_generate_P3_source_words'] is False
          assert stochastic['used_to_prune_homogeneous_P3_family'] is False
          assert d['derived_adaptive_source']['primitive_independent_tau_sigma_RS_TS'] is False
          assert d['derived_adaptive_source']['same_SEA3_frontend_path_generates_tau_sigma_RS_targets'] is True
          assert d['R_S_regularizer']['actual_applied_R_S_required_at_every_due_S_update'] is True
          assert d['R_S_regularizer']['all_due_S_updates_remain_in_full_word'] is True
          assert d['R_S_regularizer']['selected_four_S_subset_may_not_replace_full_scheduler_word'] is True
          print('COMPLETE_SEA3_SOURCE', d['canonical_P3_source'])
          print('COMPLETE_SEA3_SAMPLES', d['word_samples'])
          print('COMPLETE_SEA3_FALLBACKS', d['no_fallback_generators'])
          PY

      - name: Upload complete SEA3 source artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ou3-complete-sea3
          path: |
            /tmp/ou3_sea3_complete_source.json
            /tmp/ou3_sea3_windowed_vector_pe.json
          retention-days: 7

  riccati-p3:
    needs: complete-sea3-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build complete SEA3 P3 preconditions
        run: |
          python3 tools/stability/ou3_sea3_p3_full_preconditions.py \
            --output /tmp/ou3_sea3_p3_full_preconditions.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_p3_full_preconditions.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_source'] == 'COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['complete_SEA3_source_consumed'] is True
          assert d['complete_SEA3_source_family_materialized'] is False
          assert d['all_current_machine_checkable_preconditions_present'] is True
          assert all(d['mandatory_preconditions'].values())
          assert all(v is False for v in d['no_fallback_generators'].values())
          assert d['measurement_runtime']['source_literals_converted_to_binary32_before_variance'] is True
          assert d['measurement_runtime']['same_runtime_covariances_used_by_PE_and_full_word'] is True
          c=d['final_numeric_contract']
          assert c['common_word_horizon_s'] >= 3.0
          assert c['H_dimension'] == 18 and c['A_dimension'] == 21
          assert c['actual_applied_per_axis_RS_required'] is True
          assert c['full_18x18_and_21x21_matrix_comparison_required'] is True
          assert c['useful_gate'] == 1e-18
          print('P3_COMPLETE_WORD', d['word'])
          PY

      - name: Validate shipping prediction matrices, Live covariance and full joint backend
        run: |
          python3 tools/stability/ou3_sea3_shipping_prediction_primitives.py \
            --output /tmp/ou3_sea3_shipping_prediction_primitives.json
          python3 tools/stability/ou3_sea3_live_covariance_seed.py \
            --output /tmp/ou3_sea3_live_covariance_seed.json
          python3 tools/stability/ou3_sea3_full_word_riccati_backend.py
          python3 -m py_compile tools/stability/ou3_sea3_full_word_riccati_backend_tight.py
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/ou3_sea3_shipping_prediction_primitives.json'))
          assert p['validation_pass'], p['validation_failures']
          assert p['validated_matrix_primitives_ready'] is True
          assert p['consumes_only_SEA3_derived_sample_coordinates'] is True
          assert p['source_domain_created_here'] is False
          assert p['P3_promoted'] is False
          d=json.load(open('/tmp/ou3_sea3_live_covariance_seed.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['live_entry_seed_is_source_generated_not_arbitrary_PSD'] is True
          assert d['bootstrap_mekf_covariance_propagated_before_live'] is False
          assert d['source_parity_failures'] == []
          r=d['H_to_A_release']
          assert r['outer_acc_bias_hold_active_until_refinement_complete'] is True
          assert r['minimum_H_mode_live_duration_before_A_release_s'] >= 30.0
          assert r['H18_full_word_guaranteed_before_A_release'] is True
          PY

      - name: Assemble literal complete H18 word and reset-complete H18/A21 API
        run: |
          python3 tools/stability/ou3_sea3_full_normal_live_word.py \
            --output /tmp/ou3_sea3_full_normal_live_word.json
          python3 tools/stability/ou3_sea3_full_normal_live_word_reset.py \
            > /tmp/ou3_sea3_full_normal_live_word_reset.txt
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('tools/stability').resolve()))
          import ou3_sea3_full_normal_live_word_reset as reset
          d=json.load(open('/tmp/ou3_sea3_full_normal_live_word.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_architecture'] == 'SEA3_FULL_NORMAL_LIVE_RICCATI_WORD'
          assert d['shipping_event_order_parity_pass'] is True
          assert d['every_valid_imu_sample_requires_prediction'] is True
          assert d['every_valid_imu_sample_requires_accelerometer_Joseph'] is True
          assert d['S_scheduler_is_executed_not_replaced_by_selected_four'] is True
          assert d['same_source_state_must_feed_F_Q_pseudo_period_and_applied_RS'] is True
          assert all(v is False for v in d['no_reduced_promotion_routes'].values())
          assert d['P3_CANONICAL_PASS'] is False
          r=reset.build()
          assert reset.validate(r) == []
          assert r['shipping_reset_source_parity_pass'] is True
          assert r['literal_reset_execution_complete'] is True
          assert r['S_Joseph_immediately_followed_by_left_reset'] is True
          assert r['accelerometer_Joseph_immediately_followed_by_left_reset'] is True
          assert r['magnetometer_Joseph_immediately_followed_by_left_reset'] is True
          assert r['reset_small_angle_bound_required'] is False
          print('LITERAL_WORD_SAMPLES', d['imu_samples_upper'])
          print('RESET_COMPLETE', r['literal_reset_execution_complete'])
          PY

      - name: Build canonical complete-SEA3 P3 gate
        run: |
          python3 tools/stability/ou3_sea3_riccati_metric_p3.py \
            --output /tmp/ou3_sea3_riccati_metric_p3.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_riccati_metric_p3.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_P3_architecture'] == 'COMPLETE_SEA3_FULL_NORMAL_LIVE_RICCATI_WORD'
          assert d['canonical_P3_topology'] == 'H18_3S_PRIOR_FREE_THEN_PRESERVED_H_TO_A_HYBRID_A21'
          assert d['canonical_source'] == 'COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['complete_SEA3_source_consumed'] is True
          assert d['complete_SEA3_response_couplings_consumed'] is True
          assert d['complete_SEA3_compact_parameter_domain_consumed'] is True
          assert d['complete_SEA3_compact_transition_relation_consumed'] is True
          assert d['complete_SEA3_phase_continuous_realization_required'] is True
          assert d['same_xs_lambda_drives_entire_execution'] is True
          assert d['stochastic_forcing_does_not_generate_source_words'] is True
          assert d['stochastic_forcing_does_not_prune_homogeneous_family'] is True
          assert d['complete_SEA3_frontend_state_consumed'] is True
          assert d['actual_applied_per_axis_RS_consumed'] is True
          assert d['all_due_S_updates_required'] is True
          assert d['all_valid_accelerometer_updates_required'] is True
          assert d['accelerometer_rejection_after_certified_Normal_Live_allowed'] is False
          assert d['same_complete_SEA3_execution_continues_across_H_to_A'] is True
          assert d['same_three_second_same_mode_word_used_for_H18_and_A21'] is False
          assert d['H_to_A_is_separate_dimension_changing_hybrid_event'] is True
          assert d['shipping_H_mode_hold_guarantees_H18_before_A_release'] is True
          assert d['reset_complete_literal_execution_consumed'] is True
          assert d['immediate_left_error_reset_congruence_consumed'] is True
          assert d['finite_source_family_materialization_required'] is False
          assert d['SOURCE_REACHABLE_EVENT_FAMILY_MATERIALIZED'] is False
          assert d['universal_complete_SEA3_certificate_chain_used_instead_of_finite_materialization'] is True
          assert d['UNIVERSAL_COMPLETE_SEA3_CERTIFICATE_CHAIN_CLOSED'] is True
          assert d['P3_FULL_WORD_ENCLOSED'] is True
          assert d['P3_FULL_MATRIX_COMPARISON_CLOSED'] is True
          assert d['no_fallback_route_enabled'] is True
          assert all(v is False for v in d['no_fallback_generators'].values())
          assert d['useful_gate'] == 1e-18
          assert d['modes']['H18']['dimension'] == 18
          assert d['modes']['A21']['dimension'] == 21
          for mode in ('H18','A21'):
              assert d['modes'][mode]['Omega_minus_delta_P_full_matrix_closed'] is True
              assert d['modes'][mode]['certified_delta_lower'] >= 1e-18
              assert d['modes'][mode]['relative_Riccati_injection_margin_lower'] >= 1e-18
          assert d['P3_CONDITIONAL_SEA3_PASS'] is True
          assert d['P3_DEPLOYMENT_PASS'] is False
          assert d['P3_CANONICAL_PASS'] is d['P3_CONDITIONAL_SEA3_PASS']
          assert d['P4_MAY_CONSUME_CONDITIONAL_SEA3_P3'] is True
          assert d['P4_MAY_CONSUME_P3'] is True
          assert d['P3_CONDITIONAL_SEA3_FAIL_REASONS'] == []
          assert d['P3_DEPLOYMENT_FAIL_REASONS']
          assert d['global_physical_deployment_left_inclusion_is_separate_obligation'] is True
          assert d['global_physical_deployment_left_inclusion_closed_here'] is False
          print('P3_H18_DELTA', d['modes']['H18']['certified_delta_lower'])
          print('P3_A21_DELTA', d['modes']['A21']['certified_delta_lower'])
          print('P3_A21_BA_MARGIN', d['modes']['A21']['first_active_ba_M_delta_margin_lower'])
          print('P3_CONDITIONAL_SEA3_PASS', d['P3_CONDITIONAL_SEA3_PASS'])
          print('P3_DEPLOYMENT_PASS', d['P3_DEPLOYMENT_PASS'])
          PY

      - name: Test complete SEA3 P3 contracts
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_sea3_physical_admissibility \
            test_ou3_sea3_shipping_prediction_primitives \
            test_ou3_sea3_live_covariance_seed \
            test_ou3_sea3_full_word_riccati_backend \
            test_ou3_sea3_full_normal_live_word \
            test_ou3_sea3_full_word_reset_congruence \
            test_ou3_sea3_riccati_metric_p3 \
            test_ou3_sea3_riccati_metric_p3_promotion_state

      - name: Enforce canonical P3 quantitative closure
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_riccati_metric_p3.json'))
          if not d['P3_CONDITIONAL_SEA3_PASS']:
              raise SystemExit('conditional complete-SEA3 P3 FAIL: ' + '; '.join(d['P3_CONDITIONAL_SEA3_FAIL_REASONS']))
          if d['P3_DEPLOYMENT_PASS']:
              raise SystemExit('deployment P3 must remain fail-closed until physical SEA0->SEA3 inclusion closes')
          if not d['P3_FULL_MATRIX_COMPARISON_CLOSED']:
              raise SystemExit('canonical complete-SEA3 P3 full-matrix comparison is not closed')
          PY

      - name: Upload canonical P3 artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p3-complete-sea3
          path: |
            /tmp/ou3_sea3_p3_full_preconditions.json
            /tmp/ou3_sea3_shipping_prediction_primitives.json
            /tmp/ou3_sea3_live_covariance_seed.json
            /tmp/ou3_sea3_full_normal_live_word.json
            /tmp/ou3_sea3_full_normal_live_word_reset.txt
            /tmp/ou3_sea3_riccati_metric_p3.json
          retention-days: 7

  riccati-p4:
    needs: riccati-p3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate retained 0.8-rad geometry
        run: |
          python3 tools/stability/ou3_p4_cayley_sector_certificate.py \
            --output /tmp/ou3_p4_cayley_sector_certificate.json

      - name: Build canonical nonlinear moving-Riccati P4 foundation
        run: |
          python3 tools/stability/ou3_sea3_riccati_metric_p4.py \
            --output /tmp/ou3_sea3_riccati_metric_p4.json

      - name: Test moving-Riccati P4 contract
        working-directory: tests/validation
        run: |
          python3 -m unittest -v test_ou3_sea3_riccati_metric_p4
          python3 -m unittest discover -v -p 'test_ou3_p4_*.py'

      - name: Distinguish validated architecture from unclosed P4 and P5
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/ou3_sea3_riccati_metric_p4.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['P3_CONDITIONAL_SEA3_PASS_consumed'] is True
          assert d['nonlinear_coordinate_shipping_binding_closed'] is False
          assert d['P4_CANONICAL_PASS'] is False
          assert d['P5_MAY_START'] is False
          print('Architecture contracts pass; nonlinear P4/P5 remain OPEN.')
          PY

      - name: Upload canonical P4 architecture artifact
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-moving-riccati
          path: |
            /tmp/ou3_p4_cayley_sector_certificate.json
            /tmp/ou3_sea3_riccati_metric_p4.json
          retention-days: 7
