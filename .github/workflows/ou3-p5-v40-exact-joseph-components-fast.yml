name: ou3-p5-v40-exact-joseph-components-fast

on:
  push:
    paths:
      - "tools/ou3_p5_sample1_first_psd_exact_joseph_components_v40.py"
      - "tools/ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py"
      - "tools/ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_first_psd_exact_joseph_components_v40.py"
      - ".github/workflows/ou3-p5-v40-exact-joseph-components-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_p5_sample1_first_psd_exact_joseph_components_v40.py"
      - "tools/ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py"
      - "tools/ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_first_psd_exact_joseph_components_v40.py"
      - ".github/workflows/ou3-p5-v40-exact-joseph-components-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v40-exact-joseph-components-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-first-psd-exact-joseph-components-v40:
    name: P5 first-PSD exact Joseph components V40
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Compile V40 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_first_psd_exact_joseph_components_v40.py \
            tests/validation/test_ou3_p5_sample1_first_psd_exact_joseph_components_v40.py
      - name: Test V40 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_first_psd_exact_joseph_components_v40
      - name: Emit V40 exact Joseph witness audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 tools/ou3_p5_sample1_first_psd_exact_joseph_components_v40.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_v40_exact_joseph_components.json
          rc=$?
          set -e
          python3 - "$rc" "$GITHUB_OUTPUT" <<'PY'
          import json
          import math
          import sys

          rc = int(sys.argv[1])
          out_path = sys.argv[2]
          with open("/tmp/p5_sample1_v40_exact_joseph_components.json", encoding="utf-8") as fh:
              d = json.load(fh)
          detail = d.get("joseph_component_detail") or {}
          ratios = d.get("refinement_ratios") or {}
          failures = d.get("validation_failures") or d.get("failures") or []

          def fmt(x):
              try:
                  y = float(x)
              except (TypeError, ValueError):
                  return "na"
              return f"{y:.12g}" if math.isfinite(y) else str(y)

          with open(out_path, "a", encoding="utf-8") as gh:
              print(f"rc={rc}", file=gh)
              print(f"status={d.get('P5_SAMPLE1_FIRST_PSD_EXACT_JOSEPH_COMPONENTS_V40', 'UNKNOWN')}", file=gh)
              print(f"strict={str(bool(d.get('strict_witness_refinement'))).lower()}", file=gh)
              print(f"s={fmt(detail.get('tangent_column_norm_upper'))}", file=gh)
              print(f"parentP={fmt(detail.get('parent_covariance_transport_upper'))}", file=gh)
              print(f"refinedP={fmt(detail.get('refined_covariance_transport_upper'))}", file=gh)
              print(f"ratioP={fmt(ratios.get('first_posterior_covariance_perturbation_upper'))}", file=gh)
              print(f"ratioTotalP={fmt(ratios.get('total_reduced_covariance_perturbation_upper'))}", file=gh)
              print(f"ratioK={fmt(ratios.get('sample1_attitude_gain_operator_perturbation_upper'))}", file=gh)
              print(f"next={d.get('next_obligation', 'UNKNOWN')}", file=gh)
              summary = ";".join(str(x).replace("\n", " ") for x in failures)[:700]
              print(f"failures={summary or 'none'}", file=gh)
          PY
      - name: "V40 witness status=${{ steps.audit.outputs.status }} strict=${{ steps.audit.outputs.strict }} s=${{ steps.audit.outputs.s }} P=${{ steps.audit.outputs.parentP }}->${{ steps.audit.outputs.refinedP }} ratio=${{ steps.audit.outputs.ratioP }} totalP=${{ steps.audit.outputs.ratioTotalP }} K=${{ steps.audit.outputs.ratioK }}"
        run: |
          echo "next=${{ steps.audit.outputs.next }}"
          echo "failures=${{ steps.audit.outputs.failures }}"
      - name: Require V40 fail-closed validation
        if: always()
        run: test "${{ steps.audit.outputs.rc }}" = "0"
