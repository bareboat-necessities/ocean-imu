name: article-reorg-finalize-once

on:
  push:
    branches:
      - agent/reorganize-ou-iii-article

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reorganize-ou-iii-article

      - name: Patch stale article wording
        run: python3 tools/article_reorg_finalize.py

      - name: Commit cleanup and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/article-reorg-finalize.yml tools/article_reorg_finalize.py
          git add doc/kalman_ou_iii/w3d-baseline-comparison-study.tex-part
          git commit -m "Remove stale adaptation and comparison wording"
          git push origin HEAD:refs/heads/agent/reorganize-ou-iii-article
