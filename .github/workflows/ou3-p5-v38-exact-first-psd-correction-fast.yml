name: ou3-p5-v38-exact-first-psd-correction-fast

on:
  push:
    paths:
      - "tools/ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py"
      - "tools/ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v11.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py"
      - ".github/workflows/ou3-p5-v38-exact-first-psd-correction-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py"
      - "tools/ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v11.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py"
      - ".github/workflows/ou3-p5-v38-exact-first-psd-correction-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v38-exact-first-psd-correction-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-first-psd-exact-correction-v38:
    name: P5 first-PSD exact correction V38
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Compile V38 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py \
            tests/validation/test_ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py
      - name: Test V38 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_first_psd_exact_correction_geometry_v38
      - name: Emit V38 exact first-PSD correction audit
        run: |
          python3 tools/ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_v38_exact_first_psd_correction.json
