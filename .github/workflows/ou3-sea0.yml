name: ou3-sea0

on:
  push:
    paths:
      - "tools/ou3_sea3_*.py"
      - "tools/ou3_sea3_*.json"
      - "tools/ou3_proof_operating_domain.json"
      - "tools/ou3_interval.py"
      - "tools/ou3_validated_transcendentals.py"
      - "tests/validation/test_ou3_sea3_*.py"
      - "src/kalman_ou_iii/SeaStateFusionFilter_OU_III.h"
      - "src/tuner/WavePeriodEstimator.h"
      - ".github/workflows/ou3-sea0.yml"
  pull_request:
    paths:
      - "tools/ou3_sea3_*.py"
      - "tools/ou3_sea3_*.json"
      - "tools/ou3_proof_operating_domain.json"
      - "tools/ou3_interval.py"
      - "tools/ou3_validated_transcendentals.py"
      - "tests/validation/test_ou3_sea3_*.py"
      - "src/kalman_ou_iii/SeaStateFusionFilter_OU_III.h"
      - "src/tuner/WavePeriodEstimator.h"
      - ".github/workflows/ou3-sea0.yml"
  workflow_dispatch:

concurrency:
  group: ou3-sea0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spectral-moment-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile SEA0 spectral tooling
        run: |
          python3 -m py_compile \
            tools/ou3_sea3_initial_estimates.py \
            tools/ou3_sea3_spectral_moment_bridge.py \
            tests/validation/test_ou3_sea3_spectral_moment_bridge.py

      - name: Check committed SEA0 spectral-moment artifact
        run: |
          python3 tools/ou3_sea3_spectral_moment_bridge.py --check
          python3 -m unittest -v \
            tests.validation.test_ou3_sea3_spectral_moment_bridge

      - name: Rebuild and enforce non-promotion contract
        run: |
          python3 tools/ou3_sea3_spectral_moment_bridge.py \
            --output /tmp/ou3_sea3_spectral_moment_bridge.json
          python3 - <<'PY'
          import json
          p = json.load(open('/tmp/ou3_sea3_spectral_moment_bridge.json'))
          assert p['validation_pass'] is True
          assert p['trajectory_replay_used'] is False
          assert p['SEA0_full_certificate_promoted'] is False
          assert p['P2_promoted_from_this_artifact'] is False
          assert p['P3_promoted_from_this_artifact'] is False
          assert p['gamma_continuum_screen']['promotion_use'] is False
          assert p['tuner_bridge_contract'][
              'surface_elevation_Tz_may_be_substituted_for_tuner_Tz'
          ] is False
          assert p['tuner_bridge_contract']['directional_vessel_IMU_RAO_required'] is True
          lo, hi = p['gamma_continuum_screen']['surface_elevation_Tz_over_Tp_outer']
          print('SEA0 surface spectral bridge PASS (non-promoting)')
          print('screened surface Tz/Tp outer', lo, hi)
          PY

      - name: Upload SEA0 spectral-moment subcertificate
        uses: actions/upload-artifact@v6
        with:
          name: ou3-sea0-spectral-moment-bridge
          path: /tmp/ou3_sea3_spectral_moment_bridge.json
          retention-days: 7

  wave-period-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile WavePeriodEstimator SEA0 tooling
        run: |
          python3 -m py_compile \
            tools/ou3_interval.py \
            tools/ou3_validated_transcendentals.py \
            tools/ou3_sea3_wave_period_frontend.py \
            tests/validation/test_ou3_sea3_wave_period_frontend.py

      - name: Certify front-end transfer identity and warping
        run: |
          python3 -m unittest -v \
            tests.validation.test_ou3_sea3_wave_period_frontend
          python3 tools/ou3_sea3_wave_period_frontend.py \
            --output /tmp/ou3_sea3_wave_period_frontend.json
          python3 - <<'PY'
          import json
          p = json.load(open('/tmp/ou3_sea3_wave_period_frontend.json'))
          assert p['validation_pass'] is True
          assert all(p['source_parity'].values())
          assert p['SEA0_full_certificate_promoted'] is False
          assert p['P2_promoted_from_this_artifact'] is False
          assert p['validated_intervals']['validated_transcendentals_used'] is True
          assert p['interpretation']['discrete_frontend_warping_is_current_limiter'] is False
          assert p['interpretation'][
              'surface_Tz_or_sinusoid_period_may_replace_tuner_Tz'
          ] is False
          print('SEA0 WavePeriodEstimator front-end PASS (subcertificate)')
          print('omega_hat/omega', p['validated_intervals']['omega_hat_over_omega'])
          print('period_hat/period', p['validated_intervals']['period_hat_over_period'])
          PY

      - name: Upload WavePeriodEstimator SEA0 subcertificate
        uses: actions/upload-artifact@v6
        with:
          name: ou3-sea0-wave-period-frontend
          path: /tmp/ou3_sea3_wave_period_frontend.json
          retention-days: 7
