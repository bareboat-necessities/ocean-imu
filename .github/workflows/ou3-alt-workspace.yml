name: ou3-alt-workspace
on:
  push:
    branches: [proof/ou3-alt-finite-word-identity-20260911]
    paths: [.github/workflows/ou3-alt-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ce63ab36966be29f74461076029e30aaf3aa3af7
      - name: Package pinned source without credentials or Git metadata
        run: git archive --format=tar.gz --output=ou3-alt-source.tar.gz HEAD
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-alt-source-ce63ab3
          path: ou3-alt-source.tar.gz
          retention-days: 1
          if-no-files-found: error
