name: ou3-sea3-h18-tangent-radius-sweep
on:
  push:
    branches: [codex/ou3-complete-sea3-shipping-feasibility]
    paths:
      - tests/kalman_ou_iii/ou3-sea3-h18-tangent-radius-sweep-test.cpp
      - tests/kalman_ou_iii/ou3-sea3-complete-word-feasibility-test.cpp
      - tools/stability/ou3_sea3_validated_continuum_member.py
      - tools/stability/ou3_sea3_complete_word_feasibility_trace.py
      - src/kalman_ou_iii/**
      - src/tuner/**
      - src/ahrs/**
      - .github/workflows/ou3-sea3-h18-tangent-radius-sweep.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  h18-tangent-radius-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Eigen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeigen3-dev
      - name: Generate the same validated continuum SEA3 trace
        run: |
          set -euo pipefail
          python3 tools/stability/ou3_sea3_complete_word_feasibility_trace.py \
            --output /tmp/sea3-complete-word-float-trace.json \
            --shipping-input /tmp/sea3-complete-word-specific-force-z.txt
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/sea3-complete-word-float-trace.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_source']=='COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['same_continuum_member_across_startup_H_release_A'] is True
          assert d['all_intervals_round_to_unique_binary32'] is True
          assert d['trajectory_replay_used'] is False
          assert d['finite_harmonic_source_used'] is False
          assert d['independent_tuner_schedule_used'] is False
          assert d['independent_RS_schedule_used'] is False
          PY
      - name: Bind point diagnostic to shipping left-error attitude coordinate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/kalman_ou_iii/ou3-sea3-complete-word-feasibility-test.cpp')
          text=p.read_text()
          old='''Eigen::VectorXf physical_increment(const Filter& pert, const Filter& nominal, int dim) {
              Eigen::VectorXf e = Eigen::VectorXf::Zero(dim);
              Eigen::Quaternionf qn = nominal.mekf().quaternion_boat();
              Eigen::Quaternionf qp = pert.mekf().quaternion_boat();
              qn.normalize(); qp.normalize();
              Eigen::Quaternionf qr = qp * qn.conjugate();
              if (qr.w() < 0.0f) qr.coeffs() *= -1.0f;
              if (!(std::abs(qr.w()) > 1e-7f)) throw std::runtime_error("relative attitude left Cayley chart");
              e.segment<3>(0) = 2.0f * qr.vec() / qr.w();
              for (int i = 3; i < dim; ++i) {
                  e(i) = pert.mekf().xext(i) - nominal.mekf().xext(i);
              }
              return e;
          }'''
          new='''Eigen::VectorXf physical_increment(const Filter& pert, const Filter& nominal, int dim) {
              Eigen::VectorXf e = Eigen::VectorXf::Zero(dim);
              // Pext attitude coordinates are the left error on qref (WORLD->BODY'):
              // qref_pert = corr(c) * qref_nominal.  Do not mix a BODY->WORLD
              // relative quaternion with the unchanged covariance cross terms.
              Eigen::Quaternionf qn = nominal.mekf().qref;
              Eigen::Quaternionf qp = pert.mekf().qref;
              qn.normalize(); qp.normalize();
              Eigen::Quaternionf qr = qp * qn.conjugate();
              if (qr.w() < 0.0f) qr.coeffs() *= -1.0f;
              if (!(std::abs(qr.w()) > 1e-7f)) throw std::runtime_error("relative attitude left Cayley chart");
              e.segment<3>(0) = 2.0f * qr.vec() / qr.w();
              for (int i = 3; i < dim; ++i) {
                  e(i) = pert.mekf().xext(i) - nominal.mekf().xext(i);
              }
              return e;
          }'''
          old_inject='''void inject(Filter& f, const Eigen::VectorXf& delta) {
              const Eigen::Vector3f c = delta.head<3>();
              if (c.squaredNorm() > 0.0f) {
                  Eigen::Quaternionf q = cayley_quaternion(c) * f.mekf().quaternion_boat();
                  q.normalize();
                  f.mekf().set_quaternion_boat(q);
              }
              for (int i = 3; i < delta.size(); ++i) f.mekf().xext(i) += delta(i);
          }'''
          new_inject='''void inject(Filter& f, const Eigen::VectorXf& delta) {
              const Eigen::Vector3f c = delta.head<3>();
              if (c.squaredNorm() > 0.0f) {
                  // Same left-error convention as shipping reset/injection.
                  Eigen::Quaternionf q = cayley_quaternion(c) * f.mekf().qref;
                  q.normalize();
                  f.mekf().qref = q;
                  f.mekf().xext.template head<3>().setZero();
              }
              for (int i = 3; i < delta.size(); ++i) f.mekf().xext(i) += delta(i);
          }'''
          if old not in text: raise SystemExit('old physical_increment block not found exactly')
          if old_inject not in text: raise SystemExit('old inject block not found exactly')
          text=text.replace(old,new,1).replace(old_inject,new_inject,1)
          Path('/tmp/ou3-sea3-complete-word-feasibility-test.cpp').write_text(text)
          Path('/tmp/ou3-sea3-h18-tangent-radius-sweep-test.cpp').write_text(
              Path('tests/kalman_ou_iii/ou3-sea3-h18-tangent-radius-sweep-test.cpp').read_text()
          )
          PY
      - name: Compile H18 tangent-radius consistency sweep
        run: |
          g++ -O3 -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-function \
            -DEIGEN_NON_ARDUINO -I./src -isystem /usr/include/eigen3 \
            /tmp/ou3-sea3-h18-tangent-radius-sweep-test.cpp \
            -o /tmp/ou3-sea3-h18-tangent-radius-sweep
      - name: Execute H18 zero-radius consistency sweep
        run: |
          /tmp/ou3-sea3-h18-tangent-radius-sweep /tmp/sea3-complete-word-specific-force-z.txt \
            | tee /tmp/ou3-sea3-h18-tangent-radius-sweep.json
          python3 - <<'PY'
          import json, math
          d=json.load(open('/tmp/ou3-sea3-h18-tangent-radius-sweep.json'))
          assert d['canonical_source']=='COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['same_shipping_H18_word'] is True
          assert d['trajectory_replay_used'] is False
          assert d['finite_harmonic_source_used'] is False
          assert d['P3_changed'] is False
          assert d['P4_promoted'] is False
          assert [round(r['radius'],6) for r in d['rows']] == [0.1,0.03,0.01,0.003,0.001]
          assert all(r['imu_samples']==601 and r['mag_events']>=31 for r in d['rows'])
          assert all(math.isfinite(r['rho']) and r['rho']>=0 for r in d['rows'])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ou3-sea3-h18-tangent-radius-sweep
          path: |
            /tmp/sea3-complete-word-float-trace.json
            /tmp/sea3-complete-word-specific-force-z.txt
            /tmp/ou3-sea3-h18-tangent-radius-sweep.json
          retention-days: 7
