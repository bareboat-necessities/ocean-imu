name: ou3-p3-accelerate-canonical-once

on:
  push:
    branches:
      - codex/ou3-p3-source-clock-recurrence
    paths:
      - ".github/workflows/ou3-p3-accelerate-canonical-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  accelerate-canonical-p3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove redundant P3 recomputation without changing theorem
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('tools/ou3_p3_p2_v1_stage_phase_translation.py')
          text = p.read_text()

          text = text.replace(
              'from ou3_interval import Interval, symmetric_positive_definite_ldlt',
              'from ou3_interval import (\n    Interval, matrix_mul, matrix_spectral_norm_upper,\n    symmetric_positive_definite_ldlt,\n)\nfrom ou3_interval_linear_algebra import IntervalPivotError, matrix_inverse_gauss_jordan',
              1,
          )

          text = text.replace(
              'def _certified_delta(Pz, h: float, upper: list[float]) -> float:',
              'def _certified_delta_bisection(Pz, h: float, upper: list[float]) -> float:',
              1,
          )

          marker = '\n\n@functools.lru_cache(maxsize=4)\ndef common_boundary_floor'
          if marker not in text:
              raise SystemExit('cannot find common-boundary insertion point')
          insert = r'''

def _validated_inverse(Pz):
    """Validated inverse of a strict-SPD selected covariance lower.

    The segment backend collapses each propagated lower to deterministic point
    intervals.  Interval LDL^T first proves the represented matrix family SPD;
    fixed-pivot outward Gauss-Jordan then encloses every inverse.  A pivot
    failure is not guessed around: the caller falls back to the retained LDL
    bisection certificate.
    """
    if not symmetric_positive_definite_ldlt(Pz)[0]:
        return None
    try:
        return matrix_inverse_gauss_jordan(Pz)
    except IntervalPivotError:
        return None


def _inverse_norm_identity_floor(Pz) -> float:
    """Direct rigorous lambda_min lower from 1/||P^-1||_2."""
    Pinv = _validated_inverse(Pz)
    if Pinv is None:
        return SCALED.certified_rho(Pz)
    nrm = matrix_spectral_norm_upper(Pinv)
    if not (math.isfinite(nrm) and nrm > 0.0):
        return SCALED.certified_rho(Pz)
    return BASE.down(1.0 / nrm)


def _direct_generalized_delta_from_inverse(Pinv, h: float, upper: list[float]) -> float:
    """Certify P_phys >= delta*diag(upper) without eigenvalue bisection.

    With D=diag(h,h^2,h^3,1), the generalized comparison is

        Pz >= delta * G,  G = D^-1 diag(upper) D^-1.

    The eigenvalues of Pz^-1 G are positive and are the reciprocals of the
    generalized eigenvalues of (Pz,G).  The validated interval inverse encloses
    Pz^-1 and matrix_spectral_norm_upper bounds the spectral radius, hence

        delta >= 1 / ||Pz^-1 G||_2.

    No determinant/e3 scalarization is used.  If this inexpensive norm bound is
    too conservative at the fixed usefulness gate, the retained interval-LDL
    bisection is used only for that subcell.
    """
    if len(upper) != 4 or any(not (math.isfinite(float(x)) and float(x) > 0.0) for x in upper):
        raise ValueError('positive finite translation covariance upper required')
    d = [float(h), float(h*h), float(h*h*h), 1.0]
    zero = Interval.point(0.0)
    G = [[zero for _ in range(4)] for _ in range(4)]
    for i in range(4):
        G[i][i] = I(float(upper[i])) / I(d[i]).square()
    M = matrix_mul(Pinv, G)
    nrm = matrix_spectral_norm_upper(M)
    if not (math.isfinite(nrm) and nrm > 0.0):
        return 0.0
    return BASE.down(1.0 / nrm)


def _certified_phase_metrics(Pz, h: float, upper: list[float]) -> tuple[float, float]:
    """Return generalized P3 margin and strict identity floor with one inverse."""
    Pinv = _validated_inverse(Pz)
    if Pinv is None:
        return _certified_delta_bisection(Pz, h, upper), SCALED.certified_rho(Pz)
    inv_norm = matrix_spectral_norm_upper(Pinv)
    rho = BASE.down(1.0 / inv_norm) if math.isfinite(inv_norm) and inv_norm > 0.0 else 0.0
    direct = _direct_generalized_delta_from_inverse(Pinv, h, upper)
    if direct >= BASE.MIN_USEFUL_DELTA:
        return direct, rho
    # Preserve the old, tighter generalized-matrix decision only where the
    # direct induced-norm lower cannot establish the unchanged usefulness gate.
    return _certified_delta_bisection(Pz, h, upper), rho
'''
          text = text.replace(marker, insert + marker, 1)

          old_boundary = re.compile(
              r'''    for s in range\(len\(rt\["nodes"\]\)\):\n        for gap in rt\["gaps"\]:\n            # Every \(s,g\) has at least one exact labelled successor; the P2 V1\n            # validator rejects dead kernels\.  Starting from zero discards all\n            # older process covariance and is therefore conservative\.\n            images = SEG\.segment_images\(zero, s, int\(gap\), rt, path\)\n            local = math\.inf\n            for row in images:\n                rho = SCALED\.certified_rho\(row\["posterior"\]\)\n                if not rho > 0\.0:\n                    raise RuntimeError\(\n                        f"one-complete-segment selected covariance lost strict SPD at source \{s\}, gap \{gap\}"\n                    \)\n                local = min\(local, rho\)\n            checked \+= 1\n            if local < worst:\n                worst = local\n                limiting = \{\n                    "source_node": s,\n                    "gap_samples": int\(gap\),\n                    "rho_z_identity_lower": local,\n                \}''',
              re.M,
          )
          new_boundary = '''    # For one fixed committed source, the Riccati covariance map is Loewner\n    # monotone and R(0)>=0. Therefore the zero-start sequence is nondecreasing:\n    # the shortest certified segment (13 samples) is a common lower for every\n    # legal 13..26-sample complete segment. Computing all 14 gaps repeated the\n    # same theorem obligation fourteen times.\n    gap = int(min(rt["gaps"]))\n    for s in range(len(rt["nodes"])):\n        images = SEG.segment_images(zero, s, gap, rt, path)\n        local = math.inf\n        for row in images:\n            rho = _inverse_norm_identity_floor(row["posterior"])\n            if not rho > 0.0:\n                raise RuntimeError(\n                    f"minimum-gap selected covariance lost strict SPD at source {s}, gap {gap}"\n                )\n            local = min(local, rho)\n        checked += 1\n        if local < worst:\n            worst = local\n            limiting = {\n                "source_node": s,\n                "gap_samples": gap,\n                "rho_z_identity_lower": local,\n            }'''
          text, n = old_boundary.subn(new_boundary, text, count=1)
          if n != 1:
              raise SystemExit(f'common boundary loop replacement count {n}')
          text = text.replace(
              '        "source_gap_kernels_checked": checked,\n        "all_800_sources_checked": checked == 800 * 14,',
              '        "source_gap_kernels_checked": checked,\n        "minimum_gap_samples_used": int(min(rt["gaps"])),\n        "fixed_source_zero_start_Riccati_monotonicity_used": True,\n        "all_800_sources_checked": checked == 800,',
              1,
          )

          phase_pattern = re.compile(
              r'''@functools\.lru_cache\(maxsize=8192\)\ndef _phase_images_cached\(source_node: int, phase_samples: int,\n                         rho_key: float, domain_path: Path = DEFAULT_DOMAIN\):\n    path = Path\(domain_path\)\.resolve\(\)\n    rt = CORR\.runtime\(path\)\n    t = int\(source_node\)\n    r = int\(phase_samples\)\n    h = float\(rt\["clock"\]\["dt_binary32_s"\]\)\n    P0 = _identity_floor\(float\(rho_key\)\)\n    if r == 0:\n        return \(P0,\)\n    node = rt\["nodes"\]\[t\]\n    return tuple\(\n        SEG\.propagate_subcell\(P0, node, r, x, h\)\n        for x in SEG\._node_x_subcells\(node, h, SEG\.X_SUBCELLS\)\n    \)\n''',
              re.M,
          )
          phase_repl = '''@functools.lru_cache(maxsize=1024)\ndef _phase_sequence_cached(source_node: int, rho_key: float,\n                           domain_path: Path = DEFAULT_DOMAIN):\n    """Propagate all 0..25 phases once per source/x-subcell.\n\n    The old cache keyed by phase restarted from the same boundary and performed\n    1+...+25=325 steps per x-subcell.  The fixed source and x cell are unchanged\n    until the next stage boundary, so one sequential 25-step trajectory is the\n    exact same deterministic Loewner-lower computation for every prefix.\n    """\n    path = Path(domain_path).resolve()\n    rt = CORR.runtime(path)\n    t = int(source_node)\n    h = float(rt["clock"]["dt_binary32_s"])\n    P0 = _identity_floor(float(rho_key))\n    node = rt["nodes"][t]\n    xcells = SEG._node_x_subcells(node, h, SEG.X_SUBCELLS)\n    phases = [(P0,)]\n    states = [P0 for _ in xcells]\n    for _ in range(1, max(PHASES) + 1):\n        states = [SEG.one_step(states[j], node, x, h) for j, x in enumerate(xcells)]\n        phases.append(tuple(states))\n    return tuple(phases)\n'''
          text, n = phase_pattern.subn(phase_repl, text, count=1)
          if n != 1:
              raise SystemExit(f'phase cache replacement count {n}')

          old = '''    images = _phase_images_cached(t, r, rho, path)\n    deltas = [_certified_delta(P, h, upper) for P in images]\n    phase_rhos = [SCALED.certified_rho(P) for P in images]'''
          new = '''    images = _phase_sequence_cached(t, rho, path)[r]\n    metrics = [_certified_phase_metrics(P, h, upper) for P in images]\n    deltas = [m[0] for m in metrics]\n    phase_rhos = [m[1] for m in metrics]'''
          if old not in text:
              raise SystemExit('phase-row metric block not found')
          text = text.replace(old, new, 1)

          p.write_text(text)

          # Pin the direct inverse-norm route on a simple diagonal generalized case.
          tp = Path('tests/validation/test_ou3_p3_p2_v1_stage_phase_translation.py')
          tt = tp.read_text()
          insert_test = '''\n    def test_direct_inverse_norm_margin_matches_simple_diagonal_case(self):\n        M = P._identity_floor(1.0)\n        Pinv = P._validated_inverse(M)\n        self.assertIsNotNone(Pinv)\n        delta = P._direct_generalized_delta_from_inverse(\n            Pinv, 1.0, [2.0, 4.0, 5.0, 10.0]\n        )\n        self.assertGreater(delta, 0.09999999999)\n        self.assertLess(delta, 0.10000000001)\n\n    def test_inverse_norm_identity_floor_is_strict(self):\n        M = P._identity_floor(0.25)\n        rho = P._inverse_norm_identity_floor(M)\n        self.assertGreater(rho, 0.2499999999)\n        self.assertLess(rho, 0.2500000001)\n'''
          needle = '\n    def test_gate_fails_above_simple_diagonal_margin(self):'
          if needle not in tt:
              raise SystemExit('stage-phase test insertion point missing')
          tt = tt.replace(needle, insert_test + needle, 1)
          tp.write_text(tt)
          PY

          git diff --check
          python3 -m py_compile tools/ou3_p3_p2_v1_stage_phase_translation.py \
            tests/validation/test_ou3_p3_p2_v1_stage_phase_translation.py
          cd tests/validation
          python3 -m unittest -v test_ou3_p3_p2_v1_stage_phase_translation
          cd ../..

      - name: Commit accelerated canonical producer and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ou3-p3-accelerate-canonical-once.yml
          git add tools/ou3_p3_p2_v1_stage_phase_translation.py \
                  tests/validation/test_ou3_p3_p2_v1_stage_phase_translation.py
          git commit -m "P3: accelerate exact stage-phase certificate"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Dispatch accelerated canonical proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ou3-proof.yml --ref "${GITHUB_REF_NAME}"
