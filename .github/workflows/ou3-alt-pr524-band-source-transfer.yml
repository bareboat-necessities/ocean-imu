          def git(*args): return subprocess.check_output(['git', *args])
          def blob(path): return git('hash-object', path).decode().strip()
          assert len(payload['preimages']) == 23
          assert set(payload['preimages']) == set(payload['postimages'])
          for path, sha in payload['preimages'].items():
              assert path.startswith(('tools/stability/ou3_alt_contraction/', 'tests/ou3_alt_contraction/')) or path == 'docs/ou3-alt-main-handover.md'
              assert blob(path) == sha, ('source preimage mismatch', path)
          p = pathlib.Path('/tmp/ou3-alt-band-source.patch'); p.write_text(payload['patch'])
          subprocess.run(['git', 'apply', '--check', '--index', '--unidiff-zero', str(p)], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', str(p)], check=True)
          for path, sha in payload['postimages'].items():
              assert blob(path) == sha, ('source postimage mismatch', path)
          marker = '## Parallel ALT contraction/dissipativity track\n'
          doc = pathlib.Path('docs/ou3-proof-research-state.md')
          old = doc.read_text(); assert old.count(marker) == 1
          prefix, tail = old.split(marker, 1)
          assert hashlib.sha256((marker + tail).encode()).hexdigest() == payload['alt_before_sha256']
          assert payload['alt_after'].startswith(marker)
          assert hashlib.sha256(payload['alt_after'].encode()).hexdigest() == payload['alt_after_sha256']
          doc.write_text(prefix + payload['alt_after'])
          assert doc.read_text().split(marker, 1)[0] == prefix
          subprocess.run(['git', 'add', '--', str(doc)], check=True)
          assert set(git('diff', '--cached', '--name-only').decode().splitlines()) == set(payload['preimages']) | {str(doc)}
          pathlib.Path('/tmp/ou3-alt-band-source-tests.txt').write_text(' '.join(payload['tests']))
          pathlib.Path('/tmp/ou3-alt-band-source-manifest.json').write_text(json.dumps({
              'base': '92c3e199448cc119a4459d9f7dce7ad7478f99ad',
              'source_postimages': payload['postimages'],
              'original_proof_prefix_sha256': hashlib.sha256(prefix.encode()).hexdigest(),
              'ALT_section_sha256': payload['alt_after_sha256']}, indent=2) + '\n')
          pathlib.Path('/tmp/ou3-alt-band-source-committed.patch').write_bytes(git('diff', '--cached', '--full-index'))
          print('Verified 23 exact source pre/postimages, section-anchored ALT text, and unchanged original proof prefix.')
          PY
          git diff --cached --check
      - name: Install proof and native correspondence dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libeigen3-dev python3-numpy python3-scipy python3-mpmath
      - name: Validate targeted composition and all finite-map regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD:$PWD/tools/stability:$PWD/tests/ou3_alt_contraction"
          python3 -m unittest $(cat /tmp/ou3-alt-band-source-tests.txt) -v 2>&1 | tee /tmp/ou3-alt-band-source-targeted.log
          python3 -m unittest discover -s tests/ou3_alt_contraction -p 'test_finite*.py' -v 2>&1 | tee /tmp/ou3-alt-band-source-finite.log
          python3 -m compileall -q tools/stability/ou3_alt_contraction tests/ou3_alt_contraction
          git diff --cached --check
      - name: Remove transfer workflow and fast-forward existing PR only
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/ou3-alt-pr524-band-source-transfer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ALT: bind persistent machine frontend sources and post-commit prediction roots'
          git fetch origin proof/ou3-alt-live-mag-composition
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/proof/ou3-alt-live-mag-composition
          git rev-parse HEAD | tee /tmp/ou3-alt-band-source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ou3-alt-pr524-band-source-continuation
          path: |
            /tmp/ou3-alt-band-source-targeted.log
            /tmp/ou3-alt-band-source-finite.log
            /tmp/ou3-alt-band-source-manifest.json
            /tmp/ou3-alt-band-source-committed.patch
            /tmp/ou3-alt-band-source-commit.txt
          if-no-files-found: warn
          retention-days: 14
