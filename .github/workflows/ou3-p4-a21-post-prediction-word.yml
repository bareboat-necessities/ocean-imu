name: ou3-p4-a21-post-prediction-word

on:
  pull_request:
    paths:
      - 'tools/stability/ou3_p4_a21_post_prediction_word.py'
      - 'tools/stability/ou3_p4_a21_source_indexed_prefix_transport.py'
      - 'tools/stability/ou3_p4_information_storage_coercivity.py'
      - 'tests/validation/test_ou3_p4_a21_post_prediction_word.py'
      - '.github/workflows/ou3-p4-a21-post-prediction-word.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-a21-post-prediction-word-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate A21 post-prediction words
        run: |
          set -euo pipefail
          mkdir -p /tmp/ou3-a21-post-prediction
          python3 tools/stability/ou3_p4_a21_post_prediction_word.py --output /tmp/ou3-a21-post-prediction/word.json
          python3 -m unittest -v tests.validation.test_ou3_p4_a21_post_prediction_word
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3-a21-post-prediction/word.json'))
          assert d['validation_pass'],d['validation_failures']
          assert d['all_BIAS0_BIAS1_BIAS2_post_prediction_words_materialized']
          assert d['A21_post_prediction_word_transport_closed']
          assert d['first_prediction_driver_not_double_counted']
          assert d['metric_comparison_mu']==1.0
          assert not d['BRMM_moment_radial_sector_attached_here']
          assert not d['binary32_prefix_map_attached_here']
          assert not d['endpoint_augmented_LDLT_closed_here']
          assert not d['P4_PASS'] and not d['P5_MAY_START']
          assert d['P3_delta']==1e-18
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ou3-p4-a21-post-prediction-word
          path: /tmp/ou3-a21-post-prediction/
          retention-days: 7
