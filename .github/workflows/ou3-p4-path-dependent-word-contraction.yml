name: ou3-p4-path-dependent-word-contraction

on:
  push:
    paths:
      - "tools/ou3_physical_force_domain.py"
      - "tools/ou3_p4_path_dependent_word_contraction.py"
      - "tools/ou3_p4_h18_interval_ad_word.py"
      - "tools/ou3_interval_ad.py"
      - "tools/ou3_p4_node_metrics.py"
      - "tools/ou3_p4_exact_word_map.py"
      - "tools/ou3_p4_source_path_reachability.py"
      - "tools/ou3_p4_operation_matched_sector_certificate.py"
      - "tools/ou3_proof_operating_domain.json"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "tests/validation/test_ou3_physical_force_domain.py"
      - "tests/validation/test_ou3_p4_path_dependent_word_contraction.py"
      - "tests/validation/test_ou3_p4_h18_interval_ad_word.py"
      - "tests/validation/test_ou3_interval_ad.py"
      - "docs/ou-iii-p4-path-dependent-word-contraction.md"
      - ".github/workflows/ou3-p4-path-dependent-word-contraction.yml"
  pull_request:
    paths:
      - "tools/ou3_physical_force_domain.py"
      - "tools/ou3_p4_path_dependent_word_contraction.py"
      - "tools/ou3_p4_h18_interval_ad_word.py"
      - "tools/ou3_interval_ad.py"
      - "tools/ou3_p4_node_metrics.py"
      - "tools/ou3_p4_exact_word_map.py"
      - "tools/ou3_p4_source_path_reachability.py"
      - "tools/ou3_p4_operation_matched_sector_certificate.py"
      - "tools/ou3_proof_operating_domain.json"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "tests/validation/test_ou3_physical_force_domain.py"
      - "tests/validation/test_ou3_p4_path_dependent_word_contraction.py"
      - "tests/validation/test_ou3_p4_h18_interval_ad_word.py"
      - "tests/validation/test_ou3_interval_ad.py"
      - "docs/ou-iii-p4-path-dependent-word-contraction.md"
      - ".github/workflows/ou3-p4-path-dependent-word-contraction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-path-dependent-word-contraction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-contract:
    name: Path-dependent whole-word contraction route
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile route, marine force gate, interval AD, H18 backend and tests
        run: |
          python3 -m py_compile \
            tools/ou3_physical_force_domain.py \
            tools/ou3_interval_ad.py \
            tools/ou3_p4_path_dependent_word_contraction.py \
            tools/ou3_p4_h18_interval_ad_word.py \
            tests/validation/test_ou3_physical_force_domain.py \
            tests/validation/test_ou3_interval_ad.py \
            tests/validation/test_ou3_p4_h18_interval_ad_word.py \
            tests/validation/test_ou3_p4_path_dependent_word_contraction.py

      - name: Run marine force-domain and interval-AD primitive tests
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_physical_force_domain \
            test_ou3_interval_ad \
            test_ou3_p4_h18_interval_ad_word

      - name: Run route-contract unit tests
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p4_path_dependent_word_contraction

      - name: Emit marine physical-force certificate
        run: |
          python3 tools/ou3_physical_force_domain.py \
            --output /tmp/ou3_physical_force_domain.json

      - name: Emit route diagnostic
        run: |
          python3 tools/ou3_p4_path_dependent_word_contraction.py \
            --output /tmp/ou3_p4_path_dependent_word_contraction.json

      - name: Run boundary-cell full-word H18 interval-AD screen
        continue-on-error: true
        run: |
          python3 tools/ou3_p4_h18_interval_ad_word.py \
            --cell-limit 1 \
            --output /tmp/ou3_p4_h18_interval_ad_word.json

      - name: Enforce marine force domain, independent route and fail-closed H18 scope
        run: |
          python3 - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          force = json.loads(Path('/tmp/ou3_physical_force_domain.json').read_text())
          assert force['validation_pass'], force['validation_failures']
          assert force['non_gravitational_cog_acceleration_norm_upper_mps2'] == 4.0
          assert abs(force['derived_specific_force_norm_lower_mps2'] - 5.80665) < 1e-12
          assert abs(force['derived_specific_force_norm_upper_mps2'] - 13.80665) < 1e-12
          assert force['old_independent_30_mps2_cap_used'] is False
          assert force['impact_slam_in_scope'] is False
          assert force['lever_arm_enabled'] is False

          d = json.loads(Path('/tmp/ou3_p4_path_dependent_word_contraction.json').read_text())
          assert d['validation_pass'], d['validation_failures']
          assert d['route_contract_pass'] is True
          assert d['P5_entrance_angle_deg'] == 45.0
          assert d['P5_45deg_entrance_preserved'] is True
          assert d['outer_geometry_angle_rad'] == 0.80
          assert d['declared_domain_changed'] is False
          assert d['filter_changed'] is False
          assert d['source_replay_used'] is False

          r = d['route_distinctions']
          assert r['atomic_object'] == 'COMPLETE_SOURCE_WORD_RETURN_MAP'
          assert r['individual_packet_rank_may_be_singular'] is True
          assert r['per_packet_full_rank_required'] is False
          assert r['per_operation_sector_invariance_required'] is False
          assert r['N_times_global_lipschitz_defect_used'] is False
          assert r['translation_nontranslation_schur_split_required'] is False
          assert r['full_18_21_state_jacobian_test_required'] is True
          assert r['endpoint_metric_tied_to_actual_reachable_source_node'] is True
          assert r['arbitrary_node_rescaling_allowed'] is False
          assert r['P3_delta_used_as_nonlinear_radius'] is False

          for mode in ('H', 'A'):
              m = d['modes'][mode]
              assert m['P3_delta_used_as_nonlinear_radius'] is False
              assert m['P3_delta_used_as_whole_word_jacobian_acceptance_threshold'] is False
              gap = Decimal(m['P3_linear_origin_contraction_gap_diagnostic']['one_minus_sqrt_one_minus_delta'])
              assert gap > 0
              assert gap < Decimal('1e-15')

          assert d['P4_COMPLETE_WORD_DIFFERENTIAL_CONTRACTION_ESTABLISHED_HERE'] is False
          assert d['P4_USABLE_CERTIFICATE_PROMOTED'] is False

          h = json.loads(Path('/tmp/ou3_p4_h18_interval_ad_word.json').read_text())
          assert h['dimension'] == 18
          assert h['outer_angle_rad'] == 0.80
          assert h['interval_AD_used_for_state_return_map'] is True
          assert h['finite_difference_used'] is False
          assert h['deployed_quaternion_generalized_jacobian_used'] is True
          assert h['full_18_state_cross_derivatives_retained'] is True
          assert h['all_source_vector_orientation_covariance_correlations_checked'] is False
          assert h['optional_accepted_branch_family_between_required_events_checked'] is False
          assert h['actual_per_node_Sigma_KF_whitening_used'] is False
          assert h['source_graph_all_reachable_edges_checked'] is False
          assert h['H18_COMPLETE_SOURCE_EDGE_CONTRACTION_ESTABLISHED_HERE'] is False
          assert h['P4_USABLE_CERTIFICATE_PROMOTED'] is False
          if h['first_failure'] is None:
              assert h['validation_pass'], h['validation_failures']
          else:
              assert h['H18_SCREEN_GAMMA_LT_ONE'] is False
              assert h['outer_ball_box_cells_completed'] == 0
              assert 'correction cell exceeds validated deployed quaternion range' in h['first_failure']['error']
              allowed = {
                  'full-word H18 screen did not contain all four mandatory S events',
                  'full-word H18 screen did not contain both mandatory vector packets',
              }
              assert set(h['validation_failures']).issubset(allowed), h['validation_failures']

          print('marine non-grav CoG accel max:', force['non_gravitational_cog_acceleration_norm_upper_mps2'])
          print('marine total specific-force envelope:', force['derived_specific_force_norm_lower_mps2'], force['derived_specific_force_norm_upper_mps2'])
          print('source graph:', d['source_graph'])
          print('H18 samples:', h['samples_checked'], '/', h['full_word_samples'])
          print('H18 Cayley cells:', h['outer_ball_box_cells_completed'], '/', h['outer_ball_box_cover_total'])
          print('H18 endpoint conditioned norm upper:', h['max_endpoint_P3_congruence_conditioned_norm_upper'])
          print('H18 prefix conditioned norm upper:', h['max_prefix_P3_congruence_conditioned_norm_upper'])
          print('H18 first failure:', h['first_failure'])
          print('H18 next:', h['next_obligation'])
          PY
