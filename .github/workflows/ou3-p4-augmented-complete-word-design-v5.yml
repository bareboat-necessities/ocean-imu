name: ou3-p4-augmented-complete-word-design-v5

on:
  push:
    paths:
      - "tools/ou3_p4_*.py"
      - "tools/ou3_full_process_ucc.py"
      - "tools/ou3_implementation_word_language.py"
      - "tools/ou3_interval.py"
      - "tools/ou3_interval_ad.py"
      - "tools/ou3_interval_linear_algebra.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_validated_transcendentals.py"
      - "tools/ou3_vector_uco_certificate.py"
      - "tools/ou3_verified_spd_inverse.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-augmented-complete-word-design-v5.yml"
  pull_request:
    paths:
      - "tools/ou3_p4_*.py"
      - "tools/ou3_full_process_ucc.py"
      - "tools/ou3_implementation_word_language.py"
      - "tools/ou3_interval.py"
      - "tools/ou3_interval_ad.py"
      - "tools/ou3_interval_linear_algebra.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_validated_transcendentals.py"
      - "tools/ou3_vector_uco_certificate.py"
      - "tools/ou3_verified_spd_inverse.py"
      - "tools/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-augmented-complete-word-design-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  augmented-word-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile active P4 route
        run: |
          python3 -m py_compile \
            tools/ou3_p4_augmented_complete_word_design.py \
            tools/ou3_p4_augmented_complete_word_design_v2.py \
            tools/ou3_p4_augmented_complete_word_design_v3.py \
            tools/ou3_p4_augmented_complete_word_design_v4.py \
            tools/ou3_p4_augmented_complete_word_design_v5.py \
            tools/ou3_p4_covariance_primitives.py \
            tools/ou3_p4_golive_covariance.py \
            tools/ou3_p4_candidate_full_word.py
      - name: Run scaled-inverse H/A design word
        run: |
          python3 tools/ou3_p4_augmented_complete_word_design_v5.py \
            --source-node-index 0 \
            --attitude-halfwidth-factor 0.03125 \
            --epsilon 0.5 \
            --output /tmp/ou3_augmented_word_v5.json
      - name: Print design numbers
        if: always()
        run: |
          if [ -f /tmp/ou3_augmented_word_v5.json ]; then
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_augmented_word_v5.json'))
          print('validation_pass_v5',d.get('validation_pass_v5'))
          print('validation_failures_v5',d.get('validation_failures_v5'))
          for mode in ('H','A'):
              m=d.get('modes',{}).get(mode,{})
              ops=m.get('operations',[])
              print(mode,
                    'mu',m.get('signed_word_generalized_margin_design'),
                    'rho',m.get('rho_homogeneous_design_upper'),
                    'beta_measurement',m.get('beta_measurement_design_upper'),
                    'ops',m.get('operation_count'),
                    'inverse_backends',[x.get('inverse_backend') for x in ops],
                    'max_raw_correction',max([x.get('correction_theta_norm_upper_raw',0.0) for x in ops] or [0.0]),
                    'max_tight_correction',max([x.get('correction_theta_norm_upper',0.0) for x in ops] or [0.0]))
          PY
          fi
