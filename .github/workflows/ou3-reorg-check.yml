name: ou3-reorg-check
on:
  push:
    branches:
      - agent/reorg-ou3-article-adaptation-flow

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run semantic publication contract
        run: python3 tests/validation/test_zz_publication_contract.py
      - name: Check recursive article wiring and duplicate labels
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('doc/kalman_ou_iii')
          start = root / 'kalman_ou-w3d.tex'
          seen_files = set()
          labels = {}

          def walk(path):
              path = path.resolve()
              if path in seen_files:
                  return
              seen_files.add(path)
              text = path.read_text(encoding='utf-8')
              rel = path.relative_to(Path.cwd().resolve())
              for label in re.findall(r'\\label\{([^}]+)\}', text):
                  labels.setdefault(label, []).append(str(rel))
              for name in re.findall(r'\\input\{([^}]+)\}', text):
                  child = path.parent / name
                  if child.suffix == '':
                      child = child.with_suffix('.tex')
                  if child.exists():
                      walk(child)

          walk(start)
          dup = {k: v for k, v in labels.items() if len(v) > 1}
          if dup:
              for label, files in sorted(dup.items()):
                  print(f'duplicate label {label}: {files}')
              raise SystemExit(1)
          print(f'checked {len(seen_files)} recursively wired files and {len(labels)} unique labels')
          PY
