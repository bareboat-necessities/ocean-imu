name: ou-validation

on:
  pull_request:
    paths:
      - "src/kalman_ou_ii/**"
      - "src/kalman_ou_iii/**"
      - "src/kalman_common/**"
      - "src/tuner/**"
      - "src/util/W3dSimCommon.*"
      - "tests/kalman_ou_ii/**"
      - "tests/kalman_ou_iii/**"
      - "tests/validation/**"
      - "tools/ou_validation.py"
      - "tools/ou_roundtrip_transition.py"
      - "tools/ou_evidence_provenance.py"
      - "tools/ou_evidence_contract.py"
      - "tools/ou_publication_sync.py"
      - "plots/kalman_ou_iii/baseline-comparison.py"
      - "reports/results/ou_validation/**"
      - "reports/results/ou_rs_law/**"
      - "doc/kalman_ou_iii/**"
      - "Makefile"
      - ".github/workflows/ou-validation.yml"
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Experiment size
        required: true
        default: smoke
        type: choice
        options: [smoke, full]
  workflow_call:
    inputs:
      validation_mode:
        description: Experiment size
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ou-validation-${{ inputs.validation_mode || 'gate' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SHARD_COUNT: 3

jobs:
  validate:
    if: inputs.validation_mode != 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 27
        run: |
          set -uo pipefail
          apt_get() {
            sudo timeout 8m env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Dpkg::Use-Pty=0 "$@"
          }
          for attempt in 1 2 3; do
            if apt_get update && apt_get install -y --no-install-recommends \
                g++ make libeigen3-dev python3-numpy python3-matplotlib; then
              exit 0
            fi
            sudo dpkg --configure -a || true
            sleep $((attempt * 15))
          done
          exit 1

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip --clobber
          mkdir -p plots/kalman_ou_ii tests/kalman_ou_iii
          unzip -o sim-data-files.zip -d plots/kalman_ou_ii >/dev/null
          unzip -o sim-data-files.zip -d tests/kalman_ou_iii >/dev/null

      - name: Run validation unit tests
        run: make -C tests/validation test

      - name: Run paired validation
        run: |
          python3 -u tools/ou_validation.py \
            --mode smoke \
            --bootstrap-resamples 1000 \
            --output-dir reports/results/ou_validation

      - name: Run bidirectional transition validation
        run: |
          make -C tests/kalman_ou_iii build
          python3 -u tools/ou_roundtrip_transition.py \
            --output-dir reports/results/ou_rs_law
          make -C tests/kalman_ou_iii clean

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou-validation-smoke
          path: |
            reports/results/ou_validation/**
            reports/results/ou_rs_law/**
          if-no-files-found: warn

  regenerate:
    if: inputs.validation_mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 27
        run: |
          set -uo pipefail
          apt_get() {
            sudo timeout 8m env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Dpkg::Use-Pty=0 "$@"
          }
          for attempt in 1 2 3; do
            if apt_get update && apt_get install -y --no-install-recommends \
                g++ make libeigen3-dev python3-numpy python3-matplotlib; then
              exit 0
            fi
            sudo dpkg --configure -a || true
            sleep $((attempt * 15))
          done
          exit 1

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip --clobber
          mkdir -p plots/kalman_ou_ii
          unzip -o sim-data-files.zip -d plots/kalman_ou_ii >/dev/null

      - name: Run paired validation shard
        run: |
          python3 -u tools/ou_validation.py \
            --mode full \
            --bootstrap-resamples 10000 \
            --jobs "$(nproc)" \
            --shard-count ${{ env.SHARD_COUNT }} \
            --shard-index ${{ matrix.shard }} \
            --shard-dir shards \
            --output-dir reports/results/ou_validation

      - name: Upload shard
        uses: actions/upload-artifact@v6
        with:
          name: ou-validation-shard-${{ matrix.shard }}
          path: shards/**
          if-no-files-found: error

  combine:
    needs: regenerate
    if: inputs.validation_mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 27
        run: |
          set -uo pipefail
          apt_get() {
            sudo timeout 8m env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Dpkg::Use-Pty=0 "$@"
          }
          for attempt in 1 2 3; do
            if apt_get update && apt_get install -y --no-install-recommends \
                g++ make libeigen3-dev python3-numpy python3-matplotlib; then
              exit 0
            fi
            sudo dpkg --configure -a || true
            sleep $((attempt * 15))
          done
          exit 1

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip --clobber
          mkdir -p plots/kalman_ou_ii tests/kalman_ou_iii
          unzip -o sim-data-files.zip -d plots/kalman_ou_ii >/dev/null
          unzip -o sim-data-files.zip -d tests/kalman_ou_iii >/dev/null

      - name: Download this study's shards
        uses: actions/download-artifact@v8
        with:
          pattern: ou-validation-shard-*
          merge-multiple: true
          path: shards

      - name: Combine paired validation shards
        run: |
          python3 -u tools/ou_validation.py \
            --mode full \
            --bootstrap-resamples 10000 \
            --combine-shards \
            --shard-dir shards \
            --output-dir reports/results/ou_validation

      - name: Align validation publication wording with the article
        run: |
          python3 tools/ou_publication_sync.py \
            --validation-dir reports/results/ou_validation

      - name: Generate bidirectional transition evidence
        run: |
          make -C tests/kalman_ou_iii build
          python3 -u tools/ou_roundtrip_transition.py \
            --output-dir reports/results/ou_rs_law
          make -C tests/kalman_ou_iii clean

      - name: Upload regenerated bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou-validation-full
          path: |
            reports/results/ou_validation/**
            reports/results/ou_rs_law/**
          if-no-files-found: error

  commit:
    needs: combine
    if: inputs.validation_mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Install dependencies
        timeout-minutes: 27
        run: |
          set -uo pipefail
          apt_get() {
            sudo timeout 8m env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Dpkg::Use-Pty=0 "$@"
          }
          for attempt in 1 2 3; do
            if apt_get update && apt_get install -y --no-install-recommends \
                python3-numpy python3-matplotlib; then
              exit 0
            fi
            sudo dpkg --configure -a || true
            sleep $((attempt * 15))
          done
          exit 1

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip --clobber
          mkdir -p plots/kalman_ou_ii
          unzip -o sim-data-files.zip -d plots/kalman_ou_ii >/dev/null

      - name: Download regenerated bundles
        uses: actions/download-artifact@v8
        with:
          name: ou-validation-full
          path: regenerated

      - name: Place bundles and mirror the manuscript copies
        run: |
          set -euo pipefail
          rm -rf reports/results/ou_validation reports/results/ou_rs_law
          mkdir -p reports/results/ou_validation reports/results/ou_rs_law
          cp -a regenerated/ou_validation/. reports/results/ou_validation/
          cp -a regenerated/ou_rs_law/. reports/results/ou_rs_law/
          rm -rf regenerated

          python3 tools/ou_publication_sync.py \
            --validation-dir reports/results/ou_validation
          cp reports/results/ou_validation/ou_validation_macros.tex \
             doc/kalman_ou_iii/w3d-ou-validation-macros-generated.tex-part
          cp reports/results/ou_validation/ou_validation_tuning_points.tex \
             doc/kalman_ou_iii/w3d-ou-validation-tuning-points-generated.tex-part
          cp reports/results/ou_validation/ou_validation_vertical.svg \
             doc/kalman_ou_iii/ou_validation_vertical.svg
          cp reports/results/ou_rs_law/ou_rs_roundtrip_transition.svg \
             doc/kalman_ou_iii/ou_rs_roundtrip_transition.svg
          cp reports/results/ou_rs_law/ou_rs_roundtrip_scores.tex \
             doc/kalman_ou_iii/w3d-roundtrip-transition-scores-generated.tex-part
          rm -f doc/kalman_ou_iii/ou_validation_transition.svg \
                doc/kalman_ou_iii/ou_robustness_sensitivity.svg \
                doc/kalman_ou_iii/ou_robustness_stress.svg \
                doc/kalman_ou_iii/w3d-ou-robustness-results-generated.tex-part \
                doc/kalman_ou_iii/w3d-ou-robustness-macros-generated.tex-part

      - name: Check the manuscript against the regenerated evidence
        run: make -C tests/validation test

      - name: Commit the regenerated evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/results/ou_validation reports/results/ou_rs_law \
                  doc/kalman_ou_iii
          if git diff --cached --quiet; then
            echo "Regenerated bundle is identical to the committed one."
            exit 0
          fi
          git commit \
            -m "Regenerate current OU validation evidence" \
            -m "Produced by ou-validation run ${{ github.run_id }} from ${{ github.sha }}."
          for attempt in 1 2 3 4; do
            git push origin HEAD:refs/heads/${{ github.ref_name }} && exit 0
            sleep $((2 ** attempt))
            git pull --rebase origin refs/heads/${{ github.ref_name }}
            make -C tests/validation test
          done
          exit 1
