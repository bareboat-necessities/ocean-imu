name: ou-validation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: period-statistics-confirm-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  period-statistics-confirm:
    name: period-statistics-confirm (${{ matrix.axis }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - axis: moment
            values: "4,5,6,8"
            baseline: "8"
          - axis: log
            values: "0,0.05,0.10,0.25,0.50"
            baseline: "0.50"
          - axis: sigma_k
            values: "1.5,2,2.5,3"
            baseline: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libeigen3-dev unzip python3-numpy python3-pandas python3-scipy

      - name: Fetch reference wave records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern 'sim-data-files.zip' \
            --clobber
          unzip -o sim-data-files.zip -d plots/kalman_ou_iii

      - name: Run paired ${{ matrix.axis }} confirmation
        run: |
          python3 -u tools/ou_period_statistics_retune.py \
            --axis "${{ matrix.axis }}" \
            --values "${{ matrix.values }}" \
            --baseline "${{ matrix.baseline }}" \
            --seeds 5 --jobs 4 \
            --data-dir plots/kalman_ou_iii \
            --csv "reports/results/period_statistics_retune/confirm_${{ matrix.axis }}_runs.csv" \
            --report "reports/results/period_statistics_retune/confirm_${{ matrix.axis }}.md"

      - name: Upload paired ${{ matrix.axis }} evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: period-statistics-confirm-${{ matrix.axis }}
          path: reports/results/period_statistics_retune/**
          if-no-files-found: warn
