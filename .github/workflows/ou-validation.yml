name: ou-validation

on:
  pull_request:
    paths:
      - "src/kalman_ou_ii/**"
      - "src/kalman_ou_iii/**"
      - "src/util/W3dSimCommon.*"
      - "tests/kalman_ou_ii/**"
      - "tests/kalman_ou_iii/**"
      - "tests/validation/**"
      - "tools/ou_validation.py"
      - "tools/ou_robustness.py"
      - "reports/results/ou_robustness/**"
      - "Makefile"
      - ".github/workflows/ou-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/kalman_ou_ii/**"
      - "src/kalman_ou_iii/**"
      - "src/util/W3dSimCommon.*"
      - "tests/kalman_ou_ii/**"
      - "tests/kalman_ou_iii/**"
      - "tests/validation/**"
      - "tools/ou_validation.py"
      - "tools/ou_robustness.py"
      - "reports/results/ou_robustness/**"
      - "Makefile"
      - ".github/workflows/ou-validation.yml"
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Experiment size
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: ou-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            g++ make libeigen3-dev unzip \
            python3-numpy python3-matplotlib

      - name: Run validation unit tests
        run: make -C tests/validation test

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          mkdir -p plots/kalman_ou_ii
          unzip -o sim-data-files.zip -d plots/kalman_ou_ii >/dev/null

      - name: Run paired validation
        shell: bash
        run: |
          mode="${{ github.event.inputs.validation_mode || 'smoke' }}"
          if [ "${mode}" = "full" ]; then
            resamples=10000
          else
            resamples=1000
          fi
          python3 -u tools/ou_validation.py \
            --mode "${mode}" \
            --bootstrap-resamples "${resamples}" \
            --output-dir reports/results/ou_validation

      - name: Run robustness validation
        shell: bash
        run: |
          mode="${{ github.event.inputs.validation_mode || 'smoke' }}"
          if [ "${mode}" = "full" ]; then
            resamples=10000
          else
            resamples=1000
          fi
          python3 -u tools/ou_robustness.py \
            --mode "${mode}" \
            --bootstrap-resamples "${resamples}" \
            --output-dir reports/results/ou_robustness

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou-validation-${{ github.event.inputs.validation_mode || 'smoke' }}
          path: |
            reports/results/ou_validation/**
            reports/results/ou_robustness/**
          if-no-files-found: warn
