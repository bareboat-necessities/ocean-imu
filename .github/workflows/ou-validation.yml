name: ou-validation

on:
  pull_request:
    paths:
      - "src/kalman_ou_ii/**"
      - "src/kalman_ou_iii/**"
      - "src/util/W3dSimCommon.*"
      - "tests/kalman_ou_ii/**"
      - "tests/kalman_ou_iii/**"
      - "tests/validation/**"
      - "tools/ou_validation.py"
      - "tools/ou_robustness.py"
      - "reports/results/ou_validation/**"
      - "reports/results/ou_robustness/**"
      - "docs/ou-validation.md"
      - "docs/ou-robustness.md"
      - "doc/kalman_ou_iii/**"
      - "Makefile"
      - ".github/workflows/ou-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/kalman_ou_ii/**"
      - "src/kalman_ou_iii/**"
      - "src/util/W3dSimCommon.*"
      - "tests/kalman_ou_ii/**"
      - "tests/kalman_ou_iii/**"
      - "tests/validation/**"
      - "tools/ou_validation.py"
      - "tools/ou_robustness.py"
      - "reports/results/ou_validation/**"
      - "reports/results/ou_robustness/**"
      - "docs/ou-validation.md"
      - "docs/ou-robustness.md"
      - "doc/kalman_ou_iii/**"
      - "Makefile"
      - ".github/workflows/ou-validation.yml"
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Experiment size
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: ou-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Must match the length of the regenerate matrix's shard list.
  SHARD_COUNT: 3

jobs:
  # Fast gate. Runs on every pull request and push, and on a smoke dispatch.
  # Smoke mode exists to catch breakage in the runner and the committed
  # bundles, not to produce evidence: it never writes numbers anyone cites.
  validate:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.validation_mode == 'smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            g++ make libeigen3-dev unzip \
            python3-numpy python3-matplotlib

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          mkdir -p plots/kalman_ou_ii
          unzip -o sim-data-files.zip -d plots/kalman_ou_ii >/dev/null

      - name: Run validation unit tests
        run: make -C tests/validation test

      - name: Run paired validation
        run: |
          python3 -u tools/ou_validation.py \
            --mode smoke \
            --bootstrap-resamples 1000 \
            --output-dir reports/results/ou_validation

      - name: Run robustness validation
        run: |
          python3 -u tools/ou_robustness.py \
            --mode smoke \
            --sensitivity-scales "0.5,1.0,1.5" \
            --bootstrap-resamples 1000 \
            --output-dir reports/results/ou_robustness

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou-validation-smoke
          path: |
            reports/results/ou_validation/**
            reports/results/ou_robustness/**
          if-no-files-found: warn

  # Evidence regeneration. Dispatch-only, and sharded: the full validation
  # study is roughly 840 twenty-minute simulator replays and the robustness
  # study another 310, and a single four-core runner gets through those at
  # about the rate that made this a multi-hour job.
  #
  # Every replay is fixed by its seed triplet, so the seed repetitions split
  # across runners with no coordination. Each shard writes its rows to a file;
  # the combine job merges them and produces the bundle a single process would
  # have produced, byte for byte. Sharding by study as well as by seed keeps a
  # failure in one bundle from throwing away the other's hours.
  regenerate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.validation_mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        study: [validation, robustness]
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            g++ make libeigen3-dev unzip \
            python3-numpy python3-matplotlib

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          mkdir -p plots/kalman_ou_ii
          unzip -o sim-data-files.zip -d plots/kalman_ou_ii >/dev/null

      - name: Run paired validation shard
        if: matrix.study == 'validation'
        run: |
          python3 -u tools/ou_validation.py \
            --mode full \
            --bootstrap-resamples 10000 \
            --jobs "$(nproc)" \
            --shard-count ${{ env.SHARD_COUNT }} \
            --shard-index ${{ matrix.shard }} \
            --shard-dir shards \
            --output-dir reports/results/ou_validation

      - name: Run robustness validation shard
        if: matrix.study == 'robustness'
        run: |
          python3 -u tools/ou_robustness.py \
            --mode full \
            --sensitivity-scales "0.5,0.75,1.0,1.25,1.5" \
            --bootstrap-resamples 10000 \
            --jobs "$(nproc)" \
            --shard-count ${{ env.SHARD_COUNT }} \
            --shard-index ${{ matrix.shard }} \
            --shard-dir shards \
            --output-dir reports/results/ou_robustness

      - name: Upload shard
        uses: actions/upload-artifact@v6
        with:
          name: ou-${{ matrix.study }}-shard-${{ matrix.shard }}
          path: shards/**
          if-no-files-found: error

  # Merges the shards and writes the bundle. Kept separate from the shards
  # because the statistics are computed over all ten repetitions at once --
  # bootstrap intervals and paired effects are not something a shard can hold
  # a piece of.
  combine:
    needs: regenerate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.validation_mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        study: [validation, robustness]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            g++ make libeigen3-dev unzip \
            python3-numpy python3-matplotlib

      # The combine step re-derives the calibrated tuning points and the
      # transition diagnostic, which are simulator work, so it needs the same
      # records and toolchain the shards had.
      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          mkdir -p plots/kalman_ou_ii
          unzip -o sim-data-files.zip -d plots/kalman_ou_ii >/dev/null

      - name: Download this study's shards
        uses: actions/download-artifact@v8
        with:
          pattern: ou-${{ matrix.study }}-shard-*
          merge-multiple: true
          path: shards

      # Spelled out per study rather than templated, so the flags that shape
      # the protocol recorded in the manifest are the same ones the shards ran
      # under and cannot drift apart silently.
      - name: Combine paired validation shards
        if: matrix.study == 'validation'
        run: |
          python3 -u tools/ou_validation.py \
            --mode full \
            --bootstrap-resamples 10000 \
            --combine-shards \
            --shard-dir shards \
            --output-dir reports/results/ou_validation

      - name: Combine robustness shards
        if: matrix.study == 'robustness'
        run: |
          python3 -u tools/ou_robustness.py \
            --mode full \
            --sensitivity-scales "0.5,0.75,1.0,1.25,1.5" \
            --bootstrap-resamples 10000 \
            --combine-shards \
            --shard-dir shards \
            --output-dir reports/results/ou_robustness

      - name: Upload regenerated bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou-${{ matrix.study }}-full
          path: reports/results/ou_${{ matrix.study }}/**
          if-no-files-found: warn

  # Lands the regenerated evidence on the dispatched ref. Both bundles are
  # committed together so reports/results/ is never half one study's run and
  # half another's.
  #
  # The commit is not gated on the manuscript still agreeing with the numbers.
  # Gating it would put the bundle back behind a human, which is what this job
  # exists to avoid; instead the consistency tests run first, the bundle lands
  # either way, and a disagreement fails this job with the numbers that moved.
  # That is a prose edit, and it is the only part of regeneration a person
  # actually has to do.
  commit:
    needs: combine
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.validation_mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-numpy python3-matplotlib

      - name: Download regenerated bundles
        uses: actions/download-artifact@v8
        with:
          pattern: ou-*-full
          path: regenerated

      - name: Place bundles and mirror the manuscript copies
        run: |
          set -euo pipefail
          rm -rf reports/results/ou_validation reports/results/ou_robustness
          mkdir -p reports/results/ou_validation reports/results/ou_robustness
          cp -a regenerated/ou-validation-full/. reports/results/ou_validation/
          cp -a regenerated/ou-robustness-full/. reports/results/ou_robustness/
          rm -rf regenerated

          # The tests require every one of these to be byte-identical to the
          # generated bundle, so the copy is mechanical and belongs here rather
          # than in someone's working tree. The consistency step below is what
          # keeps this list honest: miss a pair and it fails before the push.
          mirror() {
            cp "reports/results/$1" "doc/kalman_ou_iii/$2"
          }
          mirror ou_validation/ou_validation_publication.tex \
                 w3d-ou-validation-results-generated.tex-part
          mirror ou_validation/ou_validation_macros.tex \
                 w3d-ou-validation-macros-generated.tex-part
          mirror ou_validation/ou_validation_tuning_points.tex \
                 w3d-ou-validation-tuning-points-generated.tex-part
          mirror ou_validation/ou_validation_vertical.svg \
                 ou_validation_vertical.svg
          mirror ou_validation/ou_validation_transition.svg \
                 ou_validation_transition.svg
          mirror ou_robustness/ou_robustness_publication.tex \
                 w3d-ou-robustness-results-generated.tex-part
          mirror ou_robustness/ou_robustness_sensitivity.svg \
                 ou_robustness_sensitivity.svg
          mirror ou_robustness/ou_robustness_stress.svg \
                 ou_robustness_stress.svg

      - name: Check the manuscript against the regenerated numbers
        id: consistency
        continue-on-error: true
        run: make -C tests/validation test

      - name: Commit the regenerated evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/results/ou_validation reports/results/ou_robustness \
                  doc/kalman_ou_iii
          if git diff --cached --quiet; then
            echo "Regenerated bundle is identical to the committed one."
            exit 0
          fi
          git commit \
            -m "Regenerate the full OU validation and robustness evidence" \
            -m "Produced by ou-validation run ${{ github.run_id }} from ${{ github.sha }}."
          for attempt in 1 2 3 4; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((2 ** attempt))
            git pull --rebase origin ${{ github.ref_name }}
          done
          exit 1

      - name: Fail if the manuscript no longer matches
        if: steps.consistency.outcome == 'failure'
        run: |
          echo "The regenerated bundle is committed, but the manuscript still"
          echo "quotes the previous numbers. Update the prose in"
          echo "doc/kalman_ou_iii/ to match, then re-run the validate gate."
          exit 1
