name: ou-validation

on:
  pull_request:
    paths:
      - "src/kalman_ou_ii/**"
      - "src/kalman_ou_iii/**"
      - "src/util/W3dSimCommon.*"
      - "tests/kalman_ou_ii/**"
      - "tests/kalman_ou_iii/**"
      - "tests/validation/**"
      - "tools/ou_validation.py"
      - "tools/ou_robustness.py"
      - "tools/ou_evidence_provenance.py"
      - "tools/ou_evidence_contract.py"
      - "reports/results/ou_validation/**"
      - "reports/results/ou_robustness/**"
      - "docs/ou-validation.md"
      - "docs/ou-robustness.md"
      - "doc/kalman_ou_iii/**"
      - "Makefile"
      - ".github/workflows/ou-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/kalman_ou_ii/**"
      - "src/kalman_ou_iii/**"
      - "src/util/W3dSimCommon.*"
      - "tests/kalman_ou_ii/**"
      - "tests/kalman_ou_iii/**"
      - "tests/validation/**"
      - "tools/ou_validation.py"
      - "tools/ou_robustness.py"
      - "tools/ou_evidence_provenance.py"
      - "tools/ou_evidence_contract.py"
      - "reports/results/ou_validation/**"
      - "reports/results/ou_robustness/**"
      - "docs/ou-validation.md"
      - "docs/ou-robustness.md"
      - "doc/kalman_ou_iii/**"
      - "Makefile"
      - ".github/workflows/ou-validation.yml"
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Experiment size
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
  # Called by the build workflow so a main build regenerates the evidence
  # before the article is typeset. The caller's ref is what the commit job
  # pushes to, and the caller has to grant contents: write for it.
  workflow_call:
    inputs:
      validation_mode:
        description: Experiment size
        required: true
        type: string

permissions:
  contents: read

# Keyed on the mode as well as the ref. The fast gate and a full regeneration
# are different pieces of work with different runtimes, and on a push to main
# both are in flight at once -- a shared group would have them cancelling each
# other rather than the stale copy of themselves.
concurrency:
  group: ou-validation-${{ inputs.validation_mode || 'gate' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Must match the length of the regenerate matrix's shard list.
  SHARD_COUNT: 3

jobs:
  # Fast gate. Runs on every pull request and push, and on a smoke dispatch.
  # Smoke mode exists to catch breakage in the runner and the committed
  # bundles, not to produce evidence: it never writes numbers anyone cites.
  # Gated on the mode rather than the event: in a called workflow
  # github.event_name is the caller's event, so an event test here would read
  # "push" and run the wrong half. `inputs` covers dispatch and workflow_call
  validate:
    if: ${{ (inputs.validation_mode || 'smoke') == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          # Each attempt is capped at 8 minutes and there are two retries.
          # A stalled mirror is then abandoned and retried against whatever
          # the load balancer hands out next, instead of holding the step
          # until its own timeout kills the job with nothing installed.
          apt_get() {
            sudo timeout 8m env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Dpkg::Use-Pty=0 \
              "$@"
          }
          install_deps() {
            apt_get update && apt_get install -y --no-install-recommends \
              g++ make libeigen3-dev \
              python3-numpy python3-matplotlib
          }
          for attempt in 1 2 3; do
            if install_deps; then
              echo "dependencies installed on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed; clearing any half-configured state"
            sudo dpkg --configure -a || true
            sleep $((attempt * 15))
          done
          echo "apt-get did not succeed after 3 attempts"
          exit 1

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          mkdir -p plots/kalman_ou_ii
          unzip -o sim-data-files.zip -d plots/kalman_ou_ii >/dev/null

      - name: Run validation unit tests
        run: make -C tests/validation test

      - name: Run paired validation
        run: |
          python3 -u tools/ou_validation.py \
            --mode smoke \
            --bootstrap-resamples 500 \
            --output-dir reports/results/ou_validation_smoke

      - name: Run robustness validation
        run: |
          python3 -u tools/ou_robustness.py \
            --mode smoke \
            --sensitivity-scales '0.5,0.75,1.0,1.25,1.5' \
            --bootstrap-resamples 500 \
            --output-dir reports/results/ou_robustness_smoke

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou-validation-smoke
          path: |
            reports/results/ou_validation_smoke/**
            reports/results/ou_robustness_smoke/**

  regenerate:
    if: ${{ inputs.validation_mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          apt_get() {
            sudo timeout 8m env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Dpkg::Use-Pty=0 \
              "$@"
          }
          install_deps() {
            apt_get update && apt_get install -y --no-install-recommends \
              g++ make libeigen3-dev \
              python3-numpy python3-matplotlib
          }
          for attempt in 1 2 3; do
            if install_deps; then
              echo "dependencies installed on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed; clearing any half-configured state"
            sudo dpkg --configure -a || true
            sleep $((attempt * 15))
          done
          echo "apt-get did not succeed after 3 attempts"
          exit 1

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          mkdir -p plots/kalman_ou_ii
          unzip -o sim-data-files.zip -d plots/kalman_ou_ii >/dev/null

      - name: Run validation shard
        run: |
          mkdir -p reports/results/ou_validation_shards
          python3 -u tools/ou_validation.py \
            --mode full \
            --bootstrap-resamples 10000 \
            --shard-count "$SHARD_COUNT" \
            --shard-index "${{ matrix.shard }}" \
            --shard-dir reports/results/ou_validation_shards

      - name: Run robustness shard
        run: |
          mkdir -p reports/results/ou_robustness_shards
          python3 -u tools/ou_robustness.py \
            --mode full \
            --bootstrap-resamples 10000 \
            --shard-count "$SHARD_COUNT" \
            --shard-index "${{ matrix.shard }}" \
            --shard-dir reports/results/ou_robustness_shards

      - name: Upload validation shard
        uses: actions/upload-artifact@v6
        with:
          name: ou-validation-shard-${{ matrix.shard }}
          path: reports/results/ou_validation_shards/**

      - name: Upload robustness shard
        uses: actions/upload-artifact@v6
        with:
          name: ou-robustness-shard-${{ matrix.shard }}
          path: reports/results/ou_robustness_shards/**

  combine:
    if: ${{ inputs.validation_mode == 'full' }}
    needs: regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          apt_get() {
            sudo timeout 8m env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Dpkg::Use-Pty=0 \
              "$@"
          }
          install_deps() {
            apt_get update && apt_get install -y --no-install-recommends \
              g++ make libeigen3-dev \
              python3-numpy python3-matplotlib
          }
          for attempt in 1 2 3; do
            if install_deps; then
              echo "dependencies installed on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed; clearing any half-configured state"
            sudo dpkg --configure -a || true
            sleep $((attempt * 15))
          done
          echo "apt-get did not succeed after 3 attempts"
          exit 1

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          mkdir -p plots/kalman_ou_ii
          unzip -o sim-data-files.zip -d plots/kalman_ou_ii >/dev/null

      - name: Download validation shards
        uses: actions/download-artifact@v7
        with:
          pattern: ou-validation-shard-*
          path: reports/results/ou_validation_shards
          merge-multiple: true

      - name: Download robustness shards
        uses: actions/download-artifact@v7
        with:
          pattern: ou-robustness-shard-*
          path: reports/results/ou_robustness_shards
          merge-multiple: true

      - name: Combine validation shards
        run: |
          python3 -u tools/ou_validation.py \
            --mode full \
            --combine-shards \
            --shard-count "$SHARD_COUNT" \
            --shard-dir reports/results/ou_validation_shards \
            --bootstrap-resamples 10000 \
            --output-dir reports/results/ou_validation

      - name: Combine robustness shards
        run: |
          python3 -u tools/ou_robustness.py \
            --mode full \
            --combine-shards \
            --shard-count "$SHARD_COUNT" \
            --shard-dir reports/results/ou_robustness_shards \
            --bootstrap-resamples 10000 \
            --output-dir reports/results/ou_robustness

      - name: Normalize and bind evidence provenance
        run: python3 tools/ou_evidence_contract.py --auto

      - name: Verify committed-to-generated evidence contracts
        run: make -C tests/validation test

      - name: Upload full validation bundle
        uses: actions/upload-artifact@v6
        with:
          name: ou-validation-full
          path: reports/results/ou_validation/**

      - name: Upload full robustness bundle
        uses: actions/upload-artifact@v6
        with:
          name: ou-robustness-full
          path: reports/results/ou_robustness/**

  commit:
    if: ${{ inputs.validation_mode == 'full' }}
    needs: combine
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download full validation bundle
        uses: actions/download-artifact@v7
        with:
          name: ou-validation-full
          path: reports/results/ou_validation

      - name: Download full robustness bundle
        uses: actions/download-artifact@v7
        with:
          name: ou-robustness-full
          path: reports/results/ou_robustness

      - name: Mirror generated manuscript fragments
        run: |
          cp reports/results/ou_validation/ou_validation_macros.tex \
             doc/kalman_ou_iii/w3d-ou-validation-macros-generated.tex-part
          cp reports/results/ou_validation/ou_validation_results.tex \
             doc/kalman_ou_iii/w3d-ou-validation-generated.tex-part
          cp reports/results/ou_validation/ou_validation_paired_effects.tex \
             doc/kalman_ou_iii/w3d-ou-validation-paired-generated.tex-part
          cp reports/results/ou_robustness/ou_robustness_macros.tex \
             doc/kalman_ou_iii/w3d-ou-robustness-macros-generated.tex-part
          cp reports/results/ou_robustness/ou_robustness_publication.tex \
             doc/kalman_ou_iii/w3d-ou-robustness-generated.tex-part

      - name: Commit regenerated evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/results/ou_validation \
            reports/results/ou_robustness \
            doc/kalman_ou_iii/w3d-ou-validation-macros-generated.tex-part \
            doc/kalman_ou_iii/w3d-ou-validation-generated.tex-part \
            doc/kalman_ou_iii/w3d-ou-validation-paired-generated.tex-part \
            doc/kalman_ou_iii/w3d-ou-robustness-macros-generated.tex-part \
            doc/kalman_ou_iii/w3d-ou-robustness-generated.tex-part
          if git diff --cached --quiet; then
            echo "Full evidence is already current"
            exit 0
          fi
          git commit -m "Regenerate the full OU validation and robustness evidence"
          # The normal full-regeneration path is main. A manual dispatch on a
          # feature branch is allowed as well, but it only updates that branch.
          git push origin "HEAD:${branch}"
