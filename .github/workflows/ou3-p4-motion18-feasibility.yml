name: ou3-p4-motion18-feasibility

on:
  push:
    paths: &paths
      - 'tests/kalman_ou_iii/ou3_p4_motion18_word_feasibility.py'
      - 'tests/kalman_ou_iii/ou3_p4_motion18_bias_iss_feasibility.py'
      - 'tests/kalman_ou_iii/ou3_p4_complete_brmm_word_feasibility.py'
      - 'tests/kalman_ou_iii/ou3_p4_frozen_gain_shadow_feasibility.py'
      - 'tests/kalman_ou_iii/ou3-operation-ledger-sim.cpp'
      - 'tests/kalman_ou_iii/ou3-frozen-gain-shadow-sim.cpp'
      - 'tests/kalman_ou_iii/Makefile'
      - 'src/kalman_ou_iii/**'
      - 'src/kalman_ou_common/**'
      - 'src/tuner/**'
      - 'tools/stability/ou3_proof_operating_domain.json'
      - '.github/workflows/ou3-p4-motion18-feasibility.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ou3-p4-motion18-feasibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  motion18:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev python3-numpy
      - name: Fetch genuine coupled wave simulation data
        run: make ensure-sim-data
      - name: Build one shipping observer and frozen-gain shadow
        working-directory: tests/kalman_ou_iii
        run: make -j2 ou3-operation-ledger-sim ou3-frozen-gain-shadow-sim
      - name: Generate one same-history 3-second map/covariance scan
        working-directory: tests/kalman_ou_iii
        env:
          OU3_LEDGER_MAP_TRACE: /tmp/ou3_motion18_maps.bin
          OU3_LEDGER_COV_TRACE: /tmp/ou3_motion18_cov.bin
          OU3_LEDGER_MAP_STRIDE: '600'
          W3D_WRITE_TIMESERIES: '0'
          W3D_VALIDATION_WINDOW_SEC: '0'
        run: ./ou3-operation-ledger-sim --input wave_data_pmstokes_H1.500_L50.710_A-30.00_P120.00.csv
      - name: Compute motion-only H18/A21 controlling directions
        run: |
          python3 tests/kalman_ou_iii/ou3_p4_motion18_word_feasibility.py \
            --map /tmp/ou3_motion18_maps.bin --cov /tmp/ou3_motion18_cov.bin \
            --output /tmp/ou3_motion18_linear.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_motion18_linear.json'))
          assert d['validation_pass'],d['validation_failures']
          assert d['theorem_objective']=='bounded accelerometer-bias error plus practical ISS of other 18 coordinates'
          assert d['full_21_state_word_composed_before_motion_selection']
          assert d['A21_within_word_motion_bias_motion_feedback_retained']
          assert d['bounded_bias_supply_still_required_separately']
          for mode in ('H18','A21'):
              w=d['modes'][mode]['worst']
              print('MOTION18_LINEAR',mode,'rho=',w['rho_linear'],'margin=',w['distance_to_one'],
                    't0=',w['t0'],'ba_root=',w['maximizing_direction']['group_euclidean_norms']['ba'])
          PY
      - name: Quantify explicit point bounded-bias ISS gain
        run: |
          python3 tests/kalman_ou_iii/ou3_p4_motion18_bias_iss_feasibility.py \
            --map /tmp/ou3_motion18_maps.bin --cov /tmp/ou3_motion18_cov.bin \
            --motion-json /tmp/ou3_motion18_linear.json \
            --output /tmp/ou3_motion18_bias_iss.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_motion18_bias_iss.json'))
          assert d['validation_pass'],d['validation_failures']
          assert d['complete_21_state_word_partitioned_only_after_composition']
          for mode in ('H18','A21'):
              m=d['modes'][mode]
              print('MOTION18_BIAS_ISS',mode,'rho0=',m['rho0'],'rho=',m['rho_target'],
                    'g2=',m['g2'],'gamma_bias=',m['gamma_bias'],'t0=',m['t0'])
          PY
      - name: Test exact-Cayley finite-amplitude shadow on motion-only directions
        run: |
          python3 tests/kalman_ou_iii/ou3_p4_frozen_gain_shadow_feasibility.py \
            --linear-json /tmp/ou3_motion18_linear.json \
            --domain tools/stability/ou3_proof_operating_domain.json \
            --sim tests/kalman_ou_iii/ou3-frozen-gain-shadow-sim \
            --input tests/kalman_ou_iii/wave_data_pmstokes_H1.500_L50.710_A-30.00_P120.00.csv \
            --output-dir /tmp/ou3_motion18_shadow_cases \
            --output /tmp/ou3_motion18_shadow.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_motion18_shadow.json'))
          assert d['point_same_history_diagnostic_only'] and not d['P4_promoted']
          for mode in ('H18','A21'):
              m=d['modes'][mode]
              print('MOTION18_NONLINEAR',mode,
                    'linear=',m['rho_linear_worst_word'],
                    'worst_raw=',m['worst_reliable_raw_rho'],
                    'worst_phi=',m['worst_reliable_phi_rho'],
                    'first_raw_cross=',m['first_reliable_raw_rho_ge_one_absolute_scale'],
                    'first_phi_cross=',m['first_reliable_phi_rho_ge_one_absolute_scale'],
                    'scale_limit=',m['declared_scale_limit'])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ou3-p4-motion18-feasibility
          path: |
            /tmp/ou3_motion18_linear.json
            /tmp/ou3_motion18_bias_iss.json
            /tmp/ou3_motion18_shadow.json
          retention-days: 7
