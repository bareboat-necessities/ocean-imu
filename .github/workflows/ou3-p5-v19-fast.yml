name: ou3-p5-v19-fast

on:
  push:
    paths:
      - "tools/ou3_p5_sample1_signed_cayley_q8_v14.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v16.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v17.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v18.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v18b.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v19.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_gate.py"
      - "tools/ou3_p5_sample1_source_phase_manifest.py"
      - "tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v19.py"
      - ".github/workflows/ou3-p5-v19-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_p5_sample1_signed_cayley_q8_v14.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v16.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v17.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v18.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v18b.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v19.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_gate.py"
      - "tools/ou3_p5_sample1_source_phase_manifest.py"
      - "tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v19.py"
      - ".github/workflows/ou3-p5-v19-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v19-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-joint-yz-direction-subdivision-q8-v19:
    name: P5 sample-1 joint yz direction subdivision q8 V19
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Compile V19 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_signed_cayley_q8_v19.py \
            tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v19.py \
            tools/ou3_p5_sample1_signed_cayley_q8_gate.py \
            tools/ou3_p5_sample1_source_phase_manifest.py
      - name: Test V19 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_signed_cayley_q8_v19
      - name: Emit complete source-phase manifest
        run: |
          python3 tools/ou3_p5_sample1_source_phase_manifest.py \
            --source-pieces 4 \
            --output /tmp/p5_sample1_source_phase_manifest.json
      - name: Evaluate V13E-to-V14D diagnostic gate
        run: |
          python3 tools/ou3_p5_sample1_signed_cayley_q8_gate.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 2 --parallel-pieces 2 \
            --output /tmp/p5_sample1_v13e_to_v14d_gate.json
      - name: Emit fine V19 joint yz direction subdivision cover
        run: |
          python3 tools/ou3_p5_sample1_signed_cayley_q8_v19.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --subdivision-q-ceiling 64 \
            --output /tmp/p5_sample1_v19.json
