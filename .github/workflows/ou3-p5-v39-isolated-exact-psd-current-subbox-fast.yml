name: ou3-p5-v39-isolated-exact-psd-current-subbox-fast

on:
  push:
    paths:
      - "tools/ou3_p5_sample1_v38_exact_psd_current_subbox_lift_v39.py"
      - "tools/ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py"
      - "tools/ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py"
      - "tools/ou3_p5_sample1_directional_innovation_row_lift_v34.py"
      - "tools/ou3_p5_sample1_exact_theta_x_deltac_lift_v32.py"
      - "tools/ou3_p5_sample1_v30_current_subbox_lift_v31.py"
      - "tools/ou3_p5_sample1_theta_x_gain_perturbation_v30.py"
      - "tools/ou3_p5_sample1_directional_v12d_remainder_v29.py"
      - "tools/ou3_p5_sample1_split_gravity_signed_components_v28.py"
      - "tools/ou3_p5_sample1_signed_post_first_aw_components_v27.py"
      - "tools/ou3_p5_sample1_current_exact_residual_subdivision_v23.py"
      - "tools/ou3_p5_sample1_exact_nonlinear_residual_v22.py"
      - "tools/ou3_p5_sample1_effective_input_correction_v21b.py"
      - "tools/ou3_p5_sample1_effective_input_correction_v21.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_v38_exact_psd_current_subbox_lift_v39.py"
      - ".github/workflows/ou3-p5-v39-isolated-exact-psd-current-subbox-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_p5_sample1_v38_exact_psd_current_subbox_lift_v39.py"
      - "tools/ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py"
      - "tools/ou3_p5_sample1_first_psd_offdiagonal_cone_v36.py"
      - "tools/ou3_p5_sample1_directional_innovation_row_lift_v34.py"
      - "tools/ou3_p5_sample1_exact_theta_x_deltac_lift_v32.py"
      - "tools/ou3_p5_sample1_v30_current_subbox_lift_v31.py"
      - "tools/ou3_p5_sample1_theta_x_gain_perturbation_v30.py"
      - "tools/ou3_p5_sample1_directional_v12d_remainder_v29.py"
      - "tools/ou3_p5_sample1_split_gravity_signed_components_v28.py"
      - "tools/ou3_p5_sample1_signed_post_first_aw_components_v27.py"
      - "tools/ou3_p5_sample1_current_exact_residual_subdivision_v23.py"
      - "tools/ou3_p5_sample1_exact_nonlinear_residual_v22.py"
      - "tools/ou3_p5_sample1_effective_input_correction_v21b.py"
      - "tools/ou3_p5_sample1_effective_input_correction_v21.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_v38_exact_psd_current_subbox_lift_v39.py"
      - ".github/workflows/ou3-p5-v39-isolated-exact-psd-current-subbox-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v39-isolated-exact-psd-current-subbox-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-v38-isolated-exact-psd-current-subbox-v39:
    name: P5 V38 isolated exact-PSD current-subbox lift V39
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Compile V39 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_v38_exact_psd_current_subbox_lift_v39.py \
            tests/validation/test_ou3_p5_sample1_v38_exact_psd_current_subbox_lift_v39.py
      - name: Test V39 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_v38_exact_psd_current_subbox_lift_v39
      - name: Emit V39 isolated exact-PSD 64-subbox lift audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 tools/ou3_p5_sample1_v38_exact_psd_current_subbox_lift_v39.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --current-component-pieces 4 \
            --output /tmp/p5_sample1_v39_isolated_exact_psd_current_subbox.json
          rc=$?
          set -e
          python3 - "$rc" "$GITHUB_OUTPUT" <<'PY'
          import json
          import math
          import sys

          rc = int(sys.argv[1])
          out_path = sys.argv[2]
          with open("/tmp/p5_sample1_v39_isolated_exact_psd_current_subbox.json", encoding="utf-8") as fh:
              d = json.load(fh)
          first = d.get("first_open_current_subbox") or {}
          failures = d.get("validation_failures") or d.get("failures") or []

          def fmt(x):
              try:
                  y = float(x)
              except (TypeError, ValueError):
                  return "na"
              return f"{y:.12g}" if math.isfinite(y) else str(y)

          summary = ";".join(str(x).replace("\n", " ") for x in failures)[:700]
          with open(out_path, "a", encoding="utf-8") as gh:
              print(f"rc={rc}", file=gh)
              print(f"status={d.get('P5_SAMPLE1_V38_ISOLATED_EXACT_PSD_CURRENT_SUBBOX_LIFT_V39', 'UNKNOWN')}", file=gh)
              print(f"open={d.get('open_current_subboxes', 'na')}", file=gh)
              print(f"closed={d.get('closed_current_subboxes', 'na')}", file=gh)
              print(f"qmin={fmt(d.get('minimum_best_q_upper'))}", file=gh)
              print(f"qmax={fmt(d.get('maximum_best_q_upper'))}", file=gh)
              print(f"first_index={first.get('current_subbox_index', first.get('subbox_index', 'na'))}", file=gh)
              print(f"first_q={fmt(first.get('best_q_upper', first.get('product_q_upper')))}", file=gh)
              print(f"next={d.get('next_obligation', 'UNKNOWN')}", file=gh)
              print(f"failures={summary or 'none'}", file=gh)
          PY
      - name: "V39 witness status=${{ steps.audit.outputs.status }} open=${{ steps.audit.outputs.open }} closed=${{ steps.audit.outputs.closed }} qmin=${{ steps.audit.outputs.qmin }} qmax=${{ steps.audit.outputs.qmax }} first=${{ steps.audit.outputs.first_index }} firstq=${{ steps.audit.outputs.first_q }}"
        run: |
          echo "next=${{ steps.audit.outputs.next }}"
          echo "failures=${{ steps.audit.outputs.failures }}"
      - name: Require V39 fail-closed validation
        if: always()
        run: test "${{ steps.audit.outputs.rc }}" = "0"
