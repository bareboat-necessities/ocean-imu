name: TFG tuning dispatch
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit containing the study
        required: true
        default: tfg-rigorous-tuning
      study:
        description: Study runner
        required: true
        type: choice
        options:
          - rao-core-refit
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev python3-numpy
      - name: Fetch pinned RAO data
        run: make ensure-sim-data
      - name: Build TFG simulator
        run: make -C tests/kalman_tfg kalman_tfg-sim
      - name: Run RAO core coefficient refit
        if: inputs.study == 'rao-core-refit'
        run: python3 tools/tfg_rao_core_refit.py --jobs 4
      - name: Upload study evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfg-tuning-${{ inputs.study }}
          path: reports/results/tfg_rao_core_refit
          retention-days: 14
