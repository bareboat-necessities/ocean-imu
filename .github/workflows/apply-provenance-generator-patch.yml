name: apply-provenance-generator-patch-once

on:
  push:
    branches: [agent/harden-ou-evidence-provenance]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/harden-ou-evidence-provenance
      - name: Patch large generator files
        run: python3 tools/apply_provenance_generator_patch.py
      - name: Compile patched Python
        run: |
          python3 -m py_compile tools/ou_validation.py tools/ou_robustness.py tools/ou_evidence_provenance.py tools/ou_evidence_contract.py
      - name: Commit permanent patch and remove one-shot helpers
        run: |
          set -euo pipefail
          rm tools/apply_provenance_generator_patch.py
          rm .github/workflows/apply-provenance-generator-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add tools/ou_validation.py tools/ou_robustness.py tools/ou_evidence_provenance.py tools/ou_evidence_contract.py \
                  tools/apply_provenance_generator_patch.py .github/workflows/apply-provenance-generator-patch.yml
          git commit -m "Protect replay provenance during evidence restatement"
          git push origin HEAD:refs/heads/agent/harden-ou-evidence-provenance
