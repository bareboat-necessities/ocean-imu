name: TFG H8.5 Ablation

on:
  push:
    branches:
      - agent/tfg-math-hardening
    paths:
      - .github/workflows/tfg-h85-ablation.yml
      - tests/kalman_tfg/prepare_h85_ablation.py
  workflow_dispatch:

jobs:
  h85-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install simulation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libeigen3-dev unzip curl

      - name: Download paired wave records
        run: |
          curl -fL --retry 3 --connect-timeout 20 \
            https://github.com/bareboat-necessities/oceanography-waves-lib/releases/download/v1.1.3/sim-data-files.zip \
            -o sim-data-files.zip
          unzip -o sim-data-files.zip -d tests/kalman_tfg >/dev/null

      - name: Run four H8.5 ablations
        shell: bash
        run: |
          set -euo pipefail

          JONSWAP=wave_data_jonswap_H8.500_L202.839_A-30.00_P72.00.csv
          PMSTOKES=wave_data_pmstokes_H8.500_L202.839_A-30.00_P72.00.csv

          for variant in corrected joseph_only old_mag_lock old_bias_qd; do
            echo "============================================================"
            echo "ABLATION_VARIANT: ${variant}"
            echo "============================================================"

            # Every arm starts from the same committed corrected source.
            git checkout -- src/kalman_tfg/Kalman3D_Wave_TFG.h \
                            src/kalman_tfg/SeaStateFusionFilter_TFG.h
            python3 tests/kalman_tfg/prepare_h85_ablation.py "${variant}"

            # Force a full rebuild because the ablation changes headers.
            rm -f tests/kalman_tfg/kalman_tfg-sim \
                  tests/kalman_tfg/kalman_tfg-sim.o \
                  tests/kalman_tfg/W3dSimCommon.o \
                  tests/kalman_tfg/kalman_tfg-sim.d \
                  tests/kalman_tfg/W3dSimCommon.d
            make -C tests/kalman_tfg kalman_tfg-sim

            set +e
            (
              cd tests/kalman_tfg
              W3D_WRITE_TIMESERIES=0 \
              W3D_COLLECT_ALL_GATES=1 \
              ./kalman_tfg-sim --input "./${JONSWAP}" --input "./${PMSTOKES}"
            ) >"/tmp/tfg-h85-${variant}.log" 2>&1
            sim_status=$?
            set -e

            echo "ABLATION_SIM_EXIT: ${sim_status}"
            cat "/tmp/tfg-h85-${variant}.log"
            echo "---------------- compact ${variant} ----------------"
            grep -E '^(Processing|XYZ RMS \(m\)|XYZ RMS \(%Hs\)|3D RMS \(m\)|Angles RMS \(deg\)|Bias error RMS \(acc|Bias error RMS \(gyro, deg/s\)|QUALITY_GATE:)' \
              "/tmp/tfg-h85-${variant}.log" || true
          done

          # Restore the checkout before the job ends so an accidental patch
          # failure cannot masquerade as a committed source change.
          git checkout -- src/kalman_tfg/Kalman3D_Wave_TFG.h \
                          src/kalman_tfg/SeaStateFusionFilter_TFG.h

      - name: Upload ablation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfg-h85-ablation-logs
          path: /tmp/tfg-h85-*.log
          if-no-files-found: error
