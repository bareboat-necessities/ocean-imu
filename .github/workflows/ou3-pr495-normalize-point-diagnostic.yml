name: ou3-pr495-normalize-point-diagnostic
on:
  push:
    branches: [codex/ou3-complete-sea3-shipping-feasibility]
    paths: [.github/workflows/ou3-pr495-normalize-point-diagnostic.yml]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Commit the exact diagnostic that CI executes
        env:
          BRANCH: codex/ou3-complete-sea3-shipping-feasibility
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          python3 - <<'PY'
          from pathlib import Path

          cpp = Path('tests/kalman_ou_iii/ou3-sea3-complete-word-feasibility-test.cpp')
          text = cpp.read_text()
          old_mag = 'constexpr int MAG_STRIDE = 20;  // 0.1 s; within the declared <=1 s PE window.'
          new_mag = 'constexpr int MAG_STRIDE = 2;  // 0.01 s (100 Hz); admissible point schedule and shipping 250-update unlock.'
          if text.count(old_mag) != 1:
              raise SystemExit('complete-word magnetic cadence anchor changed')
          text = text.replace(old_mag, new_mag, 1)
          old = '''Eigen::VectorXf physical_increment(const Filter& pert, const Filter& nominal, int dim) {
              Eigen::VectorXf e = Eigen::VectorXf::Zero(dim);
              Eigen::Quaternionf qn = nominal.mekf().quaternion_boat();
              Eigen::Quaternionf qp = pert.mekf().quaternion_boat();
              qn.normalize(); qp.normalize();
              Eigen::Quaternionf qr = qp * qn.conjugate();
              if (qr.w() < 0.0f) qr.coeffs() *= -1.0f;
              if (!(std::abs(qr.w()) > 1e-7f)) throw std::runtime_error("relative attitude left Cayley chart");
              e.segment<3>(0) = 2.0f * qr.vec() / qr.w();
              for (int i = 3; i < dim; ++i) {
                  e(i) = pert.mekf().xext(i) - nominal.mekf().xext(i);
              }
              return e;
          }'''
          new = '''Eigen::VectorXf physical_increment(const Filter& pert, const Filter& nominal, int dim) {
              Eigen::VectorXf e = Eigen::VectorXf::Zero(dim);
              // Pext attitude coordinates are the shipping left error on qref
              // (WORLD->BODY'): qref_pert = corr(c) * qref_nominal.
              Eigen::Quaternionf qn = nominal.mekf().qref;
              Eigen::Quaternionf qp = pert.mekf().qref;
              qn.normalize(); qp.normalize();
              Eigen::Quaternionf qr = qp * qn.conjugate();
              if (qr.w() < 0.0f) qr.coeffs() *= -1.0f;
              if (!(std::abs(qr.w()) > 1e-7f)) throw std::runtime_error("relative attitude left Cayley chart");
              e.segment<3>(0) = 2.0f * qr.vec() / qr.w();
              for (int i = 3; i < dim; ++i) {
                  e(i) = pert.mekf().xext(i) - nominal.mekf().xext(i);
              }
              return e;
          }'''
          if text.count(old) != 1:
              raise SystemExit('complete-word physical_increment anchor changed')
          text = text.replace(old, new, 1)
          old = '''void inject(Filter& f, const Eigen::VectorXf& delta) {
              const Eigen::Vector3f c = delta.head<3>();
              if (c.squaredNorm() > 0.0f) {
                  Eigen::Quaternionf q = cayley_quaternion(c) * f.mekf().quaternion_boat();
                  q.normalize();
                  f.mekf().set_quaternion_boat(q);
              }
              for (int i = 3; i < delta.size(); ++i) f.mekf().xext(i) += delta(i);
          }'''
          new = '''void inject(Filter& f, const Eigen::VectorXf& delta) {
              const Eigen::Vector3f c = delta.head<3>();
              if (c.squaredNorm() > 0.0f) {
                  // Test-only state injection in the same left-error coordinate
                  // as shipping reset/injection. Covariance is intentionally unchanged.
                  Eigen::Quaternionf q = cayley_quaternion(c) * f.mekf().qref;
                  q.normalize();
                  f.mekf().qref = q;
                  f.mekf().xext.template head<3>().setZero();
              }
              for (int i = 3; i < delta.size(); ++i) f.mekf().xext(i) += delta(i);
          }'''
          if text.count(old) != 1:
              raise SystemExit('complete-word inject anchor changed')
          cpp.write_text(text.replace(old, new, 1))

          cand = Path('tests/kalman_ou_iii/ou3-sea3-candidate-angle-sweep-test.cpp')
          text = cand.read_text()
          text = text.replace(
              '// The workflow provides /tmp/ou3-sea3-complete-word-feasibility-corrected.cpp,\n// which is the same mandatory point diagnostic bound to shipping\'s qref left\n// error coordinate.  This harness only exposes the already-existing evaluator',
              '// The checked-in complete-word evaluator is itself bound to shipping\'s qref\n// left-error coordinate. This harness only exposes that same evaluator',
          )
          if text.count('#include "ou3-sea3-complete-word-feasibility-corrected.cpp"') != 1:
              raise SystemExit('candidate include anchor changed')
          text = text.replace('#include "ou3-sea3-complete-word-feasibility-corrected.cpp"',
                              '#include "ou3-sea3-complete-word-feasibility-test.cpp"', 1)
          cand.write_text(text)

          h18 = Path('tests/kalman_ou_iii/ou3-sea3-h18-tangent-radius-sweep-test.cpp')
          text = h18.read_text()
          text = text.replace('The\n// 0.1 s magnetic packet spacing in the included point harness is already an\n// admissible asynchronous PE realization inside the declared <=1 s recurrence\n// window.',
                              'The\n// 100 Hz accepted magnetic point schedule in the included harness is admissible\n// under the asynchronous PE premise and also satisfies shipping\'s unchanged\n// 250-update H-to-A unlock inside the 3 s H18 word.')
          h18.write_text(text)

          def drop_step(path: str, start_name: str, next_name: str):
              p = Path(path)
              t = p.read_text()
              start = t.index(f'      - name: {start_name}\n')
              end = t.index(f'      - name: {next_name}\n', start)
              p.write_text(t[:start] + t[end:])

          same = '.github/workflows/ou3-sea3-same-driver-startup.yml'
          drop_step(same,
                    'Bind complete point word to shipping coordinates and 100 Hz admissible mag packets',
                    'Compile complete H18 release A21 shipping-word diagnostic')
          p = Path(same); t = p.read_text()
          t = t.replace("grep -q 'constexpr int MAG_STRIDE = 2;' /tmp/ou3-sea3-complete-word-feasibility-test.cpp\n          grep -q 'nominal.mekf().qref' /tmp/ou3-sea3-complete-word-feasibility-test.cpp",
                        "grep -q 'constexpr int MAG_STRIDE = 2;' tests/kalman_ou_iii/ou3-sea3-complete-word-feasibility-test.cpp\n          grep -q 'nominal.mekf().qref' tests/kalman_ou_iii/ou3-sea3-complete-word-feasibility-test.cpp")
          t = t.replace('            /tmp/ou3-sea3-complete-word-feasibility-test.cpp \\\n',
                        '            tests/kalman_ou_iii/ou3-sea3-complete-word-feasibility-test.cpp \\\n')
          if '/tmp/ou3-sea3-complete-word-feasibility-test.cpp' in t:
              raise SystemExit('same-driver workflow still compiles a patched source')
          p.write_text(t)

          candwf = '.github/workflows/ou3-sea3-candidate-angle-sweep.yml'
          drop_step(candwf, 'Materialize corrected shipping-coordinate evaluator', 'Compile candidate-angle sweep')
          p = Path(candwf); t = p.read_text().replace('-DEIGEN_NON_ARDUINO -I/tmp -I./src', '-DEIGEN_NON_ARDUINO -I./src')
          if 'corrected.cpp' in t or 'Materialize corrected' in t:
              raise SystemExit('candidate workflow still materializes patched source')
          p.write_text(t)

          h18wf = '.github/workflows/ou3-sea3-h18-tangent-radius-sweep.yml'
          drop_step(h18wf, 'Bind point diagnostic to shipping left-error attitude coordinate', 'Compile H18 tangent-radius consistency sweep')
          p = Path(h18wf); t = p.read_text()
          t = t.replace('            /tmp/ou3-sea3-h18-tangent-radius-sweep-test.cpp \\\n',
                        '            tests/kalman_ou_iii/ou3-sea3-h18-tangent-radius-sweep-test.cpp \\\n')
          t = t.replace("r['mag_events']>=31", "r['mag_events']>=250")
          if '/tmp/ou3-sea3-h18-tangent-radius-sweep-test.cpp' in t or 'Bind point diagnostic' in t:
              raise SystemExit('H18 workflow still materializes patched source')
          p.write_text(t)

          # Permanent tree must not contain this one-shot mutator.
          Path('.github/workflows/ou3-pr495-normalize-point-diagnostic.yml').unlink()
          PY
          git diff --check
          grep -q 'constexpr int MAG_STRIDE = 2;' tests/kalman_ou_iii/ou3-sea3-complete-word-feasibility-test.cpp
          grep -q 'nominal.mekf().qref' tests/kalman_ou_iii/ou3-sea3-complete-word-feasibility-test.cpp
          ! grep -R 'complete-word-feasibility-corrected.cpp' .github/workflows tests/kalman_ou_iii
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows tests/kalman_ou_iii
          git commit -m 'Commit exact SEA3 point diagnostic used by CI'
          git push origin HEAD:"$BRANCH"
