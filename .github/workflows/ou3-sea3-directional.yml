name: ou3-sea3-directional

on:
  pull_request:
    paths:
      - "tools/ou3_sea3_*.py"
      - "tools/ou3_sea3_*.json"
      - "tools/ou3_p2_*.py"
      - "tools/ou3_p3_*.py"
      - "tools/ou3_p4_source_path_reachability.py"
      - "tests/validation/test_ou3_sea3_*.py"
      - "src/kalman_ou_iii/**"
      - "src/tuner/**"
      - ".github/workflows/ou3-sea3-directional.yml"
  workflow_dispatch:

concurrency:
  group: ou3-sea3-directional-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  directional-response-p2-inclusion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile and test SEA3 directional bridge
        run: |
          python3 -m py_compile \
            tools/ou3_sea3_directional_p2_ha_feasibility.py \
            tests/validation/test_ou3_sea3_directional_p2_ha_feasibility.py
          python3 -m unittest -v \
            tests.validation.test_ou3_sea3_directional_p2_ha_feasibility

      - name: Build directional response enclosure and SEA3-to-P2 inclusion
        run: |
          python3 tools/ou3_sea3_directional_p2_ha_feasibility.py \
            --output /tmp/ou3_sea3_directional_p2_ha_feasibility.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_directional_p2_ha_feasibility.json'))
          assert d['validation_pass'], d['validation_failures']
          r=d['response_enclosure']
          p=d['p2_inclusion']
          assert r['response_hypothesis_status'] == 'PROVISIONAL_NOT_DATA_DERIVED'
          assert r['physical_SEA0_promoted'] is False
          assert r['directional_cross_axis_coupling']['rank_one_complex_outer_product_retained_before_outer_bound'] is True
          assert p['SEA3_TO_P2_INCLUSION_CERTIFICATE'] == 'PASS'
          assert p['Lhat_SEA3_subset_L_current_source'] is True
          assert p['P2_pruned_by_SEA3'] is False
          assert p['provisional_directional_response_gain_used_for_inclusion'] is False
          print('response accel trace/Hs^2 upper', r['matrix_moment_trace_upper_per_Hs2']['acceleration'][1])
          print('SEA3 -> P2', p['SEA3_TO_P2_INCLUSION_CERTIFICATE'])
          print('P2 states', p['P2_physical_source_states'])
          PY

      - name: Upload SEA3 inclusion artifact
        uses: actions/upload-artifact@v6
        with:
          name: ou3-sea3-directional-p2-inclusion
          path: /tmp/ou3_sea3_directional_p2_ha_feasibility.json
          retention-days: 7

  ha-feasibility:
    needs: directional-response-p2-inclusion
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download certified SEA3-to-P2 inclusion
        uses: actions/download-artifact@v6
        with:
          name: ou3-sea3-directional-p2-inclusion
          path: sea3-inclusion

      - name: Build the frozen full-P2 H/A candidate and canonical verdict
        run: |
          python3 tools/ou3_p3_p2_v1_stage_phase_translation.py \
            --output /tmp/ou3_p3_p2_v1_stage_phase_translation.json
          python3 tools/ou3_p3_p2_v1_full_state_join.py \
            --translation-candidate /tmp/ou3_p3_p2_v1_stage_phase_translation.json \
            --output /tmp/ou3_p3_p2_v1_full_state_join.json
          python3 tools/ou3_p3_canonical_gate.py \
            --p3-candidate /tmp/ou3_p3_p2_v1_full_state_join.json \
            --output /tmp/ou3_p3_canonical_gate.json

      - name: Attach H/A feasibility to the SEA3 inclusion chain
        run: |
          python3 tools/ou3_sea3_directional_p2_ha_feasibility.py \
            --inclusion-candidate sea3-inclusion/ou3_sea3_directional_p2_ha_feasibility.json \
            --ha-candidate /tmp/ou3_p3_p2_v1_full_state_join.json \
            --canonical-candidate /tmp/ou3_p3_canonical_gate.json \
            --output /tmp/ou3_sea3_directional_p2_ha_final.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_sea3_directional_p2_ha_final.json'))
          assert d['validation_pass'], d['validation_failures']
          h=d['ha_feasibility']
          assert h['SEA3_HA_FEASIBILITY'] in (
              'PASS_BY_P2_SUPERSET',
              'INCONCLUSIVE_REQUIRES_SEA3_NARROWING',
          )
          assert h['uniform_P2_FAIL_implies_SEA3_FAIL'] is False
          assert h['SEA3_specific_HA_recomputed_on_pruned_language'] is False
          print('H margin', h['H_relative_Riccati_injection_margin_lower'])
          print('A margin', h['A_relative_Riccati_injection_margin_lower'])
          print('full-P2 worst H/A', h['full_P2_canonical_worst_H_A_margin'])
          print('SEA3 H/A feasibility', h['SEA3_HA_FEASIBILITY'])
          PY

      - name: Upload SEA3 H/A feasibility artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ou3-sea3-directional-ha-feasibility
          path: |
            /tmp/ou3_p3_p2_v1_stage_phase_translation.json
            /tmp/ou3_p3_p2_v1_full_state_join.json
            /tmp/ou3_p3_canonical_gate.json
            /tmp/ou3_sea3_directional_p2_ha_final.json
          retention-days: 7
