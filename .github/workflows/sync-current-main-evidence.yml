name: sync-current-main-evidence

on:
  push:
    branches: [agent/harden-ou-evidence-provenance]
    paths:
      - .sync-current-main-evidence-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/harden-ou-evidence-provenance
          fetch-depth: 0

      - name: Merge current main and prefer its newly regenerated evidence on conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo "merge failed without ordinary file conflicts"
              exit "$merge_status"
            fi
            for f in "${conflicts[@]}"; do
              case "$f" in
                reports/results/ou_validation/*|reports/results/ou_robustness/*|doc/kalman_ou_iii/ou_validation*.svg)
                  echo "Taking current-main regenerated evidence: $f"
                  git checkout --theirs -- "$f"
                  git add "$f"
                  ;;
                *)
                  echo "Unexpected non-evidence merge conflict: $f"
                  exit 1
                  ;;
              esac
            done
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge current main regenerated OU evidence"

      - name: Adjust provenance model to the current full replay lineage
        run: |
          python3 tools/apply_current_main_provenance_patch.py
          python3 -m py_compile \
            tools/ou_evidence_provenance.py \
            tools/ou_evidence_contract.py \
            tools/ou_validation.py \
            tools/ou_robustness.py

      - name: Migrate current full replay into schema v2
        run: |
          python3 tools/ou_evidence_contract.py \
            --migrate-legacy \
            --study all \
            --replay-commit 538a6337fae3542b4249d4d250905c0630fdf2d9 \
            --historical-evidence-commit bfe25ed2972d67ed806301129cc2a6547d4090ac

      - name: Prove current-main numerical evidence remains byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- \
            reports/results/ou_validation/ou_validation_raw.csv \
            reports/results/ou_validation/ou_validation_summary.csv \
            reports/results/ou_validation/ou_validation_paired_effects.csv \
            reports/results/ou_robustness/ou_robustness_raw.csv \
            reports/results/ou_robustness/ou_robustness_summary.csv \
            reports/results/ou_robustness/ou_robustness_paired_effects.csv

      - name: Verify contracts and current lineage
        run: |
          python3 tools/ou_evidence_contract.py --check --study validation
          python3 tools/ou_evidence_contract.py --check --study robustness
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('reports/results/ou_validation/ou_validation_manifest.json'),
              Path('reports/results/ou_robustness/ou_robustness_manifest.json'),
          ):
              manifest = json.loads(path.read_text())
              replay = manifest['replay_provenance']
              assert replay['git_commit'] == '538a6337fae3542b4249d4d250905c0630fdf2d9'
              assert replay['provenance_migration']['historical_evidence_commit'] == 'bfe25ed2972d67ed806301129cc2a6547d4090ac'
              assert replay['provenance_migration']['normalization_only_columns_removed'] == []
              assert 'restatement' not in manifest
          PY
          grep -Ei '\title\{.*navigation' doc/kalman_ou_iii/kalman_ou-w3d.tex

      - name: Commit migrated current evidence provenance and push
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_current_main_provenance_patch.py
          git add \
            tools/ou_evidence_provenance.py \
            tests/validation/test_ou_robustness.py \
            docs/ou-validation.md \
            reports/results/ou_validation/PROVENANCE.md \
            reports/results/ou_validation/ou_validation_manifest.json \
            reports/results/ou_robustness/ou_robustness_manifest.json \
            tools/apply_current_main_provenance_patch.py
          git commit -m "Bind provenance to current main full replay"
          git push origin HEAD:refs/heads/agent/harden-ou-evidence-provenance
