name: ou3-p2-sample-clock

on:
  push:
    paths:
      - "tools/ou3_p2_sample_clock_path_reachability.py"
      - "tools/ou3_p4_source_path_reachability.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "src/kalman_ou_iii/SeaStateFusionFilter_OU_III.h"
      - "src/tuner/SeaStateAdaptationLimits.h"
      - "tests/validation/test_ou3_p2_sample_clock_path_reachability.py"
      - ".github/workflows/ou3-p2-sample-clock.yml"
  pull_request:
    paths:
      - "tools/ou3_p2_sample_clock_path_reachability.py"
      - "tools/ou3_p4_source_path_reachability.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "src/kalman_ou_iii/SeaStateFusionFilter_OU_III.h"
      - "src/tuner/SeaStateAdaptationLimits.h"
      - "tests/validation/test_ou3_p2_sample_clock_path_reachability.py"
      - ".github/workflows/ou3-p2-sample-clock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-sample-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile sample-clock P2
        run: |
          python3 -m py_compile \
            tools/ou3_p2_sample_clock_path_reachability.py \
            tests/validation/test_ou3_p2_sample_clock_path_reachability.py

      - name: Run sample-clock P2 regression tests
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p2_sample_clock_path_reachability

      - name: Emit sample-clock source graph
        run: |
          python3 tools/ou3_p2_sample_clock_path_reachability.py \
            --output /tmp/ou3_p2_sample_clock.json

      - name: Enforce non-Cartesian source language
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_p2_sample_clock.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['P2_SAMPLE_CLOCK_SOURCE_PATH_CERTIFICATE'] == 'PASS'
          assert d['transition_edges'] < d['full_cartesian_transition_edges']
          assert d['edge_elapsed_interval_s'] == [d['configured_sample_dt_s']]*2
          print('states', d['partition']['states'])
          print('edges', d['transition_edges'])
          print('density', d['transition_density'])
          print('SCCs', d['strongly_connected_components'])
          print('recurrent', d['recurrent_states'])
          print('old-corner cycle', d['old_worst_corner_has_internal_recurrent_cycle'])
          print('old-corner max residence s', d['old_worst_corner_max_residence_s_upper'])
          PY

      - name: Upload P2 sample-clock certificate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p2-sample-clock
          path: /tmp/ou3_p2_sample_clock.json
          if-no-files-found: warn
          retention-days: 7
