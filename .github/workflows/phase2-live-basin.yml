name: phase2-live-basin

on:
  pull_request:
    paths:
      - "tests/kalman_ou_iii/live_basin_diagnostic.cpp"
      - "tests/kalman_ou_iii/Makefile"
      - ".github/workflows/phase2-live-basin.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Eigen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev
      - name: Build contraction diagnostic
        run: make -C tests/kalman_ou_iii live_basin_diagnostic
      - name: Measure deployed Live contraction margins
        run: tests/kalman_ou_iii/live_basin_diagnostic
