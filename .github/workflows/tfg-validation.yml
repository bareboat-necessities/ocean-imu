name: tfg-validation

on:
  push:
    paths:
      - "tools/sim_dataset.py"
      - 'src/kalman_tfg/**'
      - 'src/kalman_common/**'
      - 'src/lie/**'
      - 'src/tuner/**'
      - 'src/util/W3dSimCommon.*'
      - 'tests/kalman_tfg/**'
      - '.github/workflows/tfg-validation.yml'
  pull_request:
    paths:
      - "tools/sim_dataset.py"
      - 'src/kalman_tfg/**'
      - 'src/kalman_common/**'
      - 'src/lie/**'
      - 'src/tuner/**'
      - 'src/util/W3dSimCommon.*'
      - 'tests/kalman_tfg/**'
      - '.github/workflows/tfg-validation.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install compiler dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libeigen3-dev

      - name: Build TFG tests
        run: make -C tests/kalman_tfg build

      - name: Run TFG mathematical unit tests
        working-directory: tests/kalman_tfg
        run: |
          set -euo pipefail
          ./lie_group-test
          ./convention-test
          ./ou_chain_identity-test
          ./tfg_propagation-test
          ./tfg_jacobians-test
          ./covariance_transport-test
          ./tfg_process_covariance-test
          ./tfg_orchestrator-test
          ./tfg_rs_axis_factors-test

  wave-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6

      - name: Install simulation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libeigen3-dev unzip curl

      - name: Download paired wave records
        run: |
          python3 tools/sim_dataset.py
          unzip -o sim-data-files-vessel-rao-28ft-5kn.zip -d tests/kalman_tfg >/dev/null

      - name: Build PR comparison simulators
        run: make -C tests/kalman_tfg kalman_tfg-sim kalman_tfg-legacy-sim

      # The two arms deliberately use identical records, seeds and 900 s
      # scoring windows. Collect all record-level gates so a changed default
      # cannot truncate the paired comparison at its first regression.
      - name: Run SpectralMSE TFG arm
        working-directory: tests/kalman_tfg
        env:
          W3D_WRITE_TIMESERIES: '0'
          W3D_VALIDATION_WINDOW_SEC: '900'
          W3D_COLLECT_ALL_GATES: '1'
        run: ./kalman_tfg-sim | tee tfg-spectral-mse.log || true

      - name: Run legacy cubic TFG arm
        working-directory: tests/kalman_tfg
        env:
          W3D_WRITE_TIMESERIES: '0'
          W3D_VALIDATION_WINDOW_SEC: '900'
          W3D_COLLECT_ALL_GATES: '1'
        run: ./kalman_tfg-legacy-sim | tee tfg-legacy-cubic.log || true

      - name: Gate SpectralMSE default
        working-directory: tests/kalman_tfg
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('../../tools').resolve()))
          from filter_sim_gates import parse_w3d, measured_worst

          text = Path('tfg-spectral-mse.log').read_text()
          rows = parse_w3d(text)
          if text.count('QUALITY_GATE: PASS=1 REASON=ok') != 8 or 'QUALITY_GATE: PASS=0' in text:
              raise SystemExit('TFG default did not pass all eight underway gates')
          limits = json.loads(Path('../../reports/results/filter_sim_gates/limits.json').read_text())['families']['tfg']['current_limits']
          failures = []
          for key, value in measured_worst(rows).items():
              limit = limits[key]
              print(f'TFG_PARITY_GATE {key} worst={value:.6g} limit={limit}')
              if value > limit:
                  failures.append(f'{key}={value:.6g} > {limit}')
          if failures:
              raise SystemExit('TFG SpectralMSE regression: ' + '; '.join(failures))
          PY

      - name: Upload comparison logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tfg-rs-law-comparison
          path: |
            tests/kalman_tfg/tfg-spectral-mse.log
            tests/kalman_tfg/tfg-legacy-cubic.log
