name: ou3-p4-operation-matched-dissipation

on:
  push:
    paths:
      - "tools/ou3_p4_operation_matched_joseph_ledger.py"
      - "tools/ou3_p4_directional_packet_rank.py"
      - "tools/ou3_p4_operation_matched_sector_certificate.py"
      - "tools/ou3_p4_first_accel_sector_budget.py"
      - "tools/ou3_p4_first_accel_aw_sigma_consistency.py"
      - "tools/ou3_p5_effective_vector_input.py"
      - "tools/ou3_p5_exact_correction_transport.py"
      - "tools/ou3_p5_outer_information_geometry.py"
      - "tools/ou3_p4_p5_entrance_search_domain.py"
      - "tools/ou3_proof_operating_domain.json"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "tests/validation/test_ou3_p4_operation_matched_joseph_ledger.py"
      - "tests/validation/test_ou3_p4_directional_packet_rank.py"
      - "tests/validation/Makefile"
      - "docs/ou-iii-certificate-usability-envelope.md"
      - "docs/ou-iii-operation-matched-joseph-ledger.md"
      - ".github/workflows/ou3-p4-operation-matched-dissipation.yml"
  pull_request:
    paths:
      - "tools/ou3_p4_operation_matched_joseph_ledger.py"
      - "tools/ou3_p4_directional_packet_rank.py"
      - "tools/ou3_p4_operation_matched_sector_certificate.py"
      - "tools/ou3_p4_first_accel_sector_budget.py"
      - "tools/ou3_p4_first_accel_aw_sigma_consistency.py"
      - "tools/ou3_p5_effective_vector_input.py"
      - "tools/ou3_p5_exact_correction_transport.py"
      - "tools/ou3_p5_outer_information_geometry.py"
      - "tools/ou3_p4_p5_entrance_search_domain.py"
      - "tools/ou3_proof_operating_domain.json"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "tests/validation/test_ou3_p4_operation_matched_joseph_ledger.py"
      - "tests/validation/test_ou3_p4_directional_packet_rank.py"
      - "tests/validation/Makefile"
      - "docs/ou-iii-certificate-usability-envelope.md"
      - "docs/ou-iii-operation-matched-joseph-ledger.md"
      - ".github/workflows/ou3-p4-operation-matched-dissipation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-operation-matched-dissipation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strong-route-ledger:
    name: Operation-matched Joseph directional ledger
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Compile producers and tests
        run: |
          python3 -m py_compile \
            tools/ou3_p4_operation_matched_joseph_ledger.py \
            tools/ou3_p4_directional_packet_rank.py \
            tests/validation/test_ou3_p4_operation_matched_joseph_ledger.py \
            tests/validation/test_ou3_p4_directional_packet_rank.py

      - name: Run focused unit tests
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p4_directional_packet_rank \
            test_ou3_p4_operation_matched_joseph_ledger

      - name: Emit directional packet rank certificate
        run: |
          python3 tools/ou3_p4_directional_packet_rank.py \
            --output /tmp/ou3_p4_directional_packet_rank.json

      - name: Emit strong-route ledger
        run: |
          python3 tools/ou3_p4_operation_matched_joseph_ledger.py \
            --output /tmp/ou3_p4_operation_matched_joseph_ledger.json

      - name: Enforce directional rank, signed Joseph, no-shrink and fail-closed scope
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          rank = json.loads(Path('/tmp/ou3_p4_directional_packet_rank.json').read_text())
          d = json.loads(Path('/tmp/ou3_p4_operation_matched_joseph_ledger.json').read_text())

          assert rank['validation_pass'], rank['validation_failures']
          assert rank['measurement_structure']['accelerometer_rank_exact'] == 3
          assert rank['measurement_structure']['magnetometer_rank_exact'] == 2
          assert rank['measurement_structure']['stacked_vector_packet_rank_exact'] == 5
          assert rank['modes']['H']['stacked_vector_packet_nullity_exact_on_active_block'] == 1
          assert rank['modes']['A']['stacked_vector_packet_nullity_exact_on_active_block'] == 4
          assert rank['instantaneous_full_state_measurement_information_positive_definite_possible'] is False
          assert rank['instantaneous_positive_scalar_full_state_packet_margin_is_valid_target'] is False
          assert rank['directional_PSD_operation_credit_required'] is True
          assert rank['word_level_directional_accumulation_required'] is True
          assert rank['P4_COMPLETE_WORD_DISSIPATION_ESTABLISHED_HERE'] is False
          assert rank['P4_USABLE_CERTIFICATE_PROMOTED'] is False

          assert d['validation_pass'], d['validation_failures']
          assert d['declared_P5_entrance_angle_deg'] == 45.0
          assert d['P5_45DEG_ENTRANCE_PRESERVED'] is True
          assert d['declared_domain_changed'] is False
          assert d['filter_changed'] is False
          assert d['source_replay_used'] is False
          assert d['candidate_angle_reduction_used_for_closure'] is False
          assert d['aw_sigma_consistency_assumption_used'] is False

          # Reproduce the old obstruction, but do not use it as the new gate.
          assert d['legacy_sector_invariance_obstruction_reproduced'] is True
          assert d['legacy_sector_budget_distance_only'] is True
          assert d['per_operation_sector_invariance_is_P4_promotion_gate'] is False

          # Strong route: exact correction-range reductions but exact signed
          # Joseph nonlinear term.  Nothing is dropped or independently
          # maximized.
          assert d['accelerometer_eta_absorbed_for_state_correction_range'] is True
          assert d['accelerometer_large_aw_error_charged_as_independent_measurement_eta'] is False
          assert d['accelerometer_finite_angle_eta_penalty_dropped_from_Joseph_identity'] is False
          assert d['accelerometer_finite_angle_eta_independent_norm_budget_used'] is False
          assert d['magnetometer_radial_eta_changes_state'] is False
          assert d['reset_condition_number_multiplier_used'] is False

          # Existing positive vector constant is attitude geometry only, and
          # exact rank five makes an instantaneous scalar full-state packet
          # margin an invalid target.
          assert d['directional_packet_rank_exact'] == 5
          assert d['instantaneous_scalar_full_state_packet_margin_valid'] is False
          assert d['directional_PSD_word_accumulation_required'] is True
          assert d['finite_angle_vector_pair_attitude_geometry_vs_goLive_metric_lower'] > 0.0
          assert d['finite_angle_vector_pair_attitude_geometry_strict'] is True
          assert d['full_state_directional_word_credit_established_here'] is False

          # This PR closes the calculus/rank obligations, not the complete word.
          assert d['strong_route_operation_ledger_closed'] is True
          assert d['P4_COMPLETE_WORD_DISSIPATION_ESTABLISHED_HERE'] is False
          assert d['P4_USABLE_CERTIFICATE_PROMOTED'] is False
          assert d['P5_FINITE_INNER_CAPTURE_ESTABLISHED_HERE'] is False

          acc = {r['operation']: r for r in d['operation_ledger']}['accelerometer_accepted']
          assert acc['finite_angle_eta_penalty_dropped'] is False
          assert acc['finite_angle_eta_independently_maximized'] is False
          assert 'eta_a^T R_a^-1 eta_a' in acc['exact_information_decrease']

          print('vector packet exact rank:', rank['measurement_structure']['stacked_vector_packet_rank_exact'])
          print('H/A active nullity:',
                rank['modes']['H']['stacked_vector_packet_nullity_exact_on_active_block'],
                rank['modes']['A']['stacked_vector_packet_nullity_exact_on_active_block'])
          print('45deg entrance q:', d['declared_P5_entrance_q_upper'])
          print('outer sector q:', d['operation_matched_outer_q_upper'])
          print('attitude geometry lower:',
                d['finite_angle_vector_pair_attitude_geometry_vs_goLive_metric_lower'])
          print('conditional 25deg c diagnostic:',
                d['conditional_25deg_consistency_constant_diagnostic'])
          print('next:', d['next_obligation'])
          PY
