name: ou3-proof-import
on:
  push:
    branches: ["proof/ou3-planar-service-phase"]
    paths: [".github/workflows/ou3-proof-import.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify and export content-addressed proof blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path, data=None):
              cmd=['gh','api',path]
              if data is None:
                  return json.loads(subprocess.check_output(cmd,text=True))
              return json.loads(subprocess.check_output(cmd+['--method','POST','--input','-'],input=json.dumps(data),text=True))
          repo='repos/bareboat-necessities/ocean-imu'
          base='84c7b5f79f9744d5805ca15df700353b483e46ac'
          assert git('rev-parse','HEAD^')=='13812d76474ded63f01b8b9ae3732ce5075d39b9', 'Concurrent branch edit'
          assert git('rev-parse',base+'^{tree}')=='9e165fefa4220a40eac3bc748d09ab777a0a8978'
          blobs=['60c824c395e3fc0ea14ec672528c35836b748a09','ba69183a179945b5b56abf35cceddf25369f70ab','2bb011606efeba275c6e3123f5b06298620c1a10','4200d9bcd3d045aa6542566f3b5c9e271654fde1','a7bd2f500fe23b8b17e2dfc0891f1ba346c66ae6','a19004d5cd7eac0a868530d38c4ed96cde1702fa','1a13002c53eff6564367c6c5fcc1dc616df3b9ba','fc04ff6770814bc7a605f3dae7dd6396acb6c552','e98087b57da7d48e983a9c356a45c933832fc206','5840629de478b189280f91f57dbff2010753af84']
          packed=b''
          for sha in blobs:
              b=base64.b64decode(api(repo+'/git/blobs/'+sha)['content'])
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha
              packed+=b
          raw=lzma.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='8f8a3d50df887a8edc5ec114af6bbaa123f235d8822a2679d8625b014a2bbfcc'
          payload=json.loads(raw)
          allowed=('docs/ou3-','doc/kalman_ou_iii/','reports/results/ou3_stability/','tools/stability/','tests/validation/')
          workflows={'.github/workflows/ou3-stability-proof.yml','.github/workflows/ou3-planar-service-audit.yml'}
          for op in payload['operations']:
              p=pathlib.Path(op['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert str(p).startswith(allowed) or str(p) in workflows
              if op['op']=='delete':
                  p.unlink()
              elif op['op']=='write':
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(op['data'],encoding='utf-8')
              elif op['op']=='patch':
                  subprocess.run(['git','apply','--whitespace=error','-'],input=op['data'],text=True,check=True)
              else:
                  raise ValueError(op['op'])
          pathlib.Path('.github/workflows/ou3-proof-import.yml').unlink()
          subprocess.run(['git','add','-A'],check=True)
          target=git('write-tree')
          assert target==payload['target_tree']=='0843050d83a5dd49d5599a4e49a2a6be325957f4'
          entries=[]
          for path in git('diff','--cached','--name-only','HEAD').splitlines():
              p=pathlib.Path(path)
              ent={'path':path,'mode':'100644','type':'blob','sha':None}
              if p.exists():
                  staged=git('ls-files','--stage',path).split()
                  result=api(repo+'/git/blobs',{'content':p.read_text(encoding='utf-8'),'encoding':'utf-8'})
                  assert result['sha']==staged[1]
                  ent.update(mode=staged[0],sha=result['sha'])
              entries.append(ent)
          print('VERIFIED_TARGET_TREE='+target)
          print('IMPORT_PARENT='+git('rev-parse','HEAD'))
          print('IMPORT_BASE_TREE='+git('rev-parse','HEAD^{tree}'))
          print('VERIFIED_ENTRIES='+json.dumps(entries,separators=(',',':')))
          # No tree, commit, ref or main write here. The authenticated connector
          # creates the exact verified tree and performs a non-forced branch update.
          PY
