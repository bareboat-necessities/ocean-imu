name: ou3-proof-import
on:
  push:
    branches: ["proof/ou3-planar-service-phase"]
    paths: [".github/workflows/ou3-proof-import.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reconstruct and verify the locally tested proof tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path, data=None):
              cmd=['gh','api',path]
              if data is None:
                  return json.loads(subprocess.check_output(cmd,text=True))
              return json.loads(subprocess.check_output(cmd+['--method','POST','--input','-'], input=json.dumps(data),text=True))
          repo='repos/bareboat-necessities/ocean-imu'
          base='84c7b5f79f9744d5805ca15df700353b483e46ac'
          assert git('rev-parse','HEAD^') == base, 'Concurrent branch edit: stop'
          assert git('rev-parse',base+'^{tree}') == '9e165fefa4220a40eac3bc748d09ab777a0a8978'
          blobs=[
              '60c824c395e3fc0ea14ec672528c35836b748a09',
              'ba69183a179945b5b56abf35cceddf25369f70ab',
              '2bb011606efeba275c6e3123f5b06298620c1a10',
              '4200d9bcd3d045aa6542566f3b5c9e271654fde1',
              'a7bd2f500fe23b8b17e2dfc0891f1ba346c66ae6',
              'a19004d5cd7eac0a868530d38c4ed96cde1702fa',
              '1a13002c53eff6564367c6c5fcc1dc616df3b9ba',
              'fc04ff6770814bc7a605f3dae7dd6396acb6c552',
              'e98087b57da7d48e983a9c356a45c933832fc206',
              '5840629de478b189280f91f57dbff2010753af84',
          ]
          packed=b''
          for sha in blobs:
              r=api(repo+'/git/blobs/'+sha)
              b=base64.b64decode(r['content'])
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha
              packed+=b
          raw=lzma.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='8f8a3d50df887a8edc5ec114af6bbaa123f235d8822a2679d8625b014a2bbfcc'
          payload=json.loads(raw)
          assert payload['version']==1
          assert payload['base_tree']==git('rev-parse',base+'^{tree}')
          allowed=('docs/ou3-', 'doc/kalman_ou_iii/', 'reports/results/ou3_stability/', 'tools/stability/', 'tests/validation/')
          workflows={'.github/workflows/ou3-stability-proof.yml','.github/workflows/ou3-planar-service-audit.yml'}
          for op in payload['operations']:
              p=pathlib.Path(op['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert op['path'].startswith(allowed) or op['path'] in workflows
              if op['op']=='delete':
                  p.unlink()
              elif op['op']=='write':
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(op['data'],encoding='utf-8')
              elif op['op']=='patch':
                  subprocess.run(['git','apply','--whitespace=error','-'],input=op['data'],text=True,check=True)
              else:
                  raise ValueError(op['op'])
          pathlib.Path('.github/workflows/ou3-proof-import.yml').unlink()
          subprocess.run(['git','add','-A'],check=True)
          target=git('write-tree')
          assert target==payload['target_tree']=='0843050d83a5dd49d5599a4e49a2a6be325957f4'
          entries=[]
          for path in git('diff','--cached','--name-only','HEAD').splitlines():
              p=pathlib.Path(path)
              ent={'path':path,'mode':'100644','type':'blob'}
              if p.exists():
                  mode=git('ls-files','--stage',path).split()[0]
                  ent.update(mode=mode,content=p.read_text(encoding='utf-8'))
              else:
                  ent['sha']=None
              entries.append(ent)
          tree=api(repo+'/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})
          assert tree['sha']==target
          commit=api(repo+'/git/commits',{
              'message':'OU-III: linked planar cell algebra, real guard theorem, and literal frontend audit\n\nKeep all-time moving admission OPEN; preserve shipping behavior.\n691 proof tests pass on the reproduced tree.',
              'tree':target,
              'parents':[git('rev-parse','HEAD')]
          })
          print('VERIFIED_PROOF_TREE='+target)
          print('VERIFIED_PROOF_COMMIT='+commit['sha'])
          # Deliberately do not update any ref here. The authenticated connector
          # performs the reviewed, non-forced proof-branch update separately.
          PY
