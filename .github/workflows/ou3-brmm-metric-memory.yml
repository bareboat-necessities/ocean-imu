name: ou3-brmm-metric-memory

on:
  pull_request:
    paths:
      - "tools/stability/ou3_brmm_*.py"
      - "tools/stability/ou3_full_process_ucc.py"
      - "tools/stability/ou3_translational_uco_ucc.py"
      - "tools/stability/ou3_source_domain_contract.py"
      - "tests/validation/test_ou3_brmm_*.py"
      - "tools/stability/ou3_proof_operating_domain.json"
      - "src/kalman_ou_iii/**"
      - ".github/workflows/ou3-brmm-metric-memory.yml"
  workflow_dispatch:

concurrency:
  group: ou3-brmm-metric-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metric-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build complete-BRMM covariance diagnostics
        run: |
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/stability')
          import ou3_brmm_riccati_tube_factored as TUBE
          d=TUBE.build()
          d['covariance_envelope_validation_failures']=TUBE.validate_covariance_ceiling(d)
          d['covariance_envelope_validation_pass']=not d['covariance_envelope_validation_failures']
          d['full_moving_tube_validation_failures']=TUBE.validate(d)
          d['full_moving_tube_validation_pass']=not d['full_moving_tube_validation_failures']
          Path('/tmp/ou3_brmm_metric_memory_diagnostic.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          assert d['covariance_envelope_validation_pass'],d['covariance_envelope_validation_failures']
          assert d['endpoint_referenced_translation_covariance'] is True
          assert d['post_reconstruction_forward_propagation_used'] is False
          # The scalar relative moving-tube margin is diagnostic only. Canonical
          # P3 below proves its full-matrix theorem without this scalar route.
          assert d['moving_Riccati_tube_pass'] is False
          assert d['full_moving_tube_validation_pass'] is False
          PY
          python3 tools/stability/ou3_brmm_p3_conditional_composition.py --output /tmp/ou3_brmm_conditional_p3.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_brmm_metric_memory_diagnostic.json'))
          c=json.load(open('/tmp/ou3_brmm_conditional_p3.json'))
          assert d['covariance_envelope_validation_pass'], d['covariance_envelope_validation_failures']
          assert d['source_generated_not_trajectory_fit'] is True
          assert d['trajectory_replay_used'] is False
          assert d['source_history_graph_consumed'] is False
          assert d['predecessor_path_enumeration_consumed'] is False
          assert d['P2_800_state_partition_consumed'] is False
          assert c['validation_pass'], c['validation_failures']
          assert c['canonical_source'] == 'COMPLETE_BRMM_NORMAL_LIVE_WORD'
          assert c['actual_applied_SpectralMSE_R_S_consumed'] is True
          assert c['one_step_process_Q_used_as_contraction_strictness'] is False
          print('H_PBAR_DIAG', d['modes']['H']['Pbar_diagonal_variance_upper'])
          print('A_PBAR_DIAG', d['modes']['A']['Pbar_diagonal_variance_upper'])
          print('TUBE_H_DELTA_DIAGNOSTIC_ONLY', d['modes']['H']['relative_Riccati_injection_margin_lower'])
          print('TUBE_A_DELTA_DIAGNOSTIC_ONLY', d['modes']['A']['relative_Riccati_injection_margin_lower'])
          print('FULL_TUBE_DIAGNOSTIC_FAILURES', d['full_moving_tube_validation_failures'])
          print('COMPLETE_BRMM_H18_INFORMATION', c['H18_information_lambda_min_lower'])
          print('A_BIAS_GAP', c['A21_bias_homogeneous_contraction_gap_lower'])
          PY
      - name: Test complete BRMM composition diagnostics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_brmm_p3_conditional_composition
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-brmm-metric-memory
          path: |
            /tmp/ou3_brmm_metric_memory_diagnostic.json
            /tmp/ou3_brmm_conditional_p3.json
          retention-days: 7
