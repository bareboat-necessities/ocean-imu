name: tfg-study-workspace
on:
  push:
    branches: [codex/ou3-tfg-comparison]
    paths: [.github/workflows/tfg-study-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install simulator header dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libeigen3-dev
      - name: Archive exact study sources and headers
        run: |
          git archive --format=tar.gz HEAD > /tmp/ocean-imu-study-source.tar.gz
          tar -czf /tmp/eigen-headers.tar.gz -C /usr/include/eigen3 .
      - uses: actions/upload-artifact@v6
        with:
          name: tfg-study-source
          path: |
            /tmp/ocean-imu-study-source.tar.gz
            /tmp/eigen-headers.tar.gz
          retention-days: 1
          if-no-files-found: error
