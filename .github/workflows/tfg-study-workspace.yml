name: tfg-study-workspace
on:
  push:
    branches: [codex/ou3-tfg-comparison]
    paths: [.github/workflows/tfg-study-workspace.yml]
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply reviewed study changes
        env:
          PATCH_B64: >-
            
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, subprocess, zlib
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH_B64']))
          expected = 'a7b19626f0c227d08c162efb7c6d908d54ade164d6e7c2a84f1106a4a5c4b3cb'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('patch integrity check failed')
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm .github/workflows/tfg-study-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add TFG to the OU-III comparison and paired validation contract'
          git push origin HEAD:refs/heads/codex/ou3-tfg-comparison
      - name: Install study dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends g++ make libeigen3-dev python3-numpy python3-pandas python3-matplotlib texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-dejavu-core cm-super
      - name: Prepare pinned records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make ensure-sim-data
      - name: Execute paired and deterministic studies
        run: |
          set -euo pipefail
          python3 -u tools/tfg_comparison.py --mode full --jobs 2
          python3 tools/tfg_comparison.py --check --require-ci --publish
          for entry in kalman_ou_iii:kalman_ou_iii-sim kalman_tfg:kalman_tfg-sim kalman_ou_ii:kalman_ou_ii-sim pii_observer:pii_observer-adaptive nlo:nlo-sim; do
            directory="${entry%:*}"
            binary="${entry#*:}"
            make -C "tests/$directory" "$binary"
            (cd "tests/$directory"; W3D_COLLECT_ALL_GATES=1 "./$binary")
          done
          cp tests/kalman_ou_iii/*_fusion_ou3.csv plots/kalman_ou_iii/
          cp tests/kalman_tfg/*_fusion_tfg.csv plots/kalman_ou_iii/
          cp tests/kalman_ou_ii/*_fusion_ou2.csv plots/kalman_ou_iii/
          cp tests/pii_observer/*_nonkalman_fusion.csv plots/kalman_ou_iii/
          cp tests/nlo/*_tvg_nlo_nomag_nognss.csv plots/kalman_ou_iii/
          (cd plots/kalman_ou_iii; python3 baseline-comparison.py)
          cp plots/kalman_ou_iii/w3d-baseline-results-generated.tex-part doc/kalman_ou_iii/
          cp plots/kalman_ou_iii/w3d_multi_observer_jonswap_medium.svg doc/kalman_ou_iii/
          python3 -m unittest discover -s tests/validation -p 'test_tfg_comparison.py' -v
          python3 -m unittest discover -s tests/validation -p 'test_deterministic_baseline_contract.py' -v
      - name: Publish the retained CI evidence on this branch
        run: |
          git add reports/results/tfg_comparison reports/results/baseline_comparison doc/kalman_ou_iii
          git commit -m 'Record CI-paired TFG comparison and five-filter article results'
          git push origin HEAD:refs/heads/codex/ou3-tfg-comparison
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tfg-comparison-review
          path: |
            reports/results/tfg_comparison/
            reports/results/baseline_comparison/
            doc/kalman_ou_iii/w3d-tfg-comparison-generated.tex-part
            plots/kalman_ou_iii/w3d-baseline-results-generated.tex-part
            plots/kalman_ou_iii/w3d_multi_observer_jonswap_medium.*
          if-no-files-found: warn
