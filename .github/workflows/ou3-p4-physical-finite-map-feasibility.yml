name: ou3-p4-physical-finite-map-feasibility

on:
  push:
    paths: &audit_paths
      - "tests/kalman_ou_iii/ou3_p4_*"
      - "tests/kalman_ou_iii/ou3_physical_sea3_membership.py"
      - "tools/stability/ou3-sea-generator-membership.cpp"
      - "tools/stability/ou3-source-endpoint.cpp"
      - "tools/stability/ou3_sea3_response_union.py"
      - "tests/validation/test_ou3_sea3_response_union.py"
      - "tests/kalman_ou_iii/fixtures/ou3_physical_generator_provenance.json"
      - "tests/kalman_ou_iii/fixtures/ou3_p4_retained_*"
      - "tests/validation/test_ou3_bias_witness_admissibility.py"
      - "tests/validation/test_ou3_retained_word_attachment.py"
      - "tests/validation/test_ou3_physical_sea3_membership.py"
      - "tests/validation/test_ou3_source_endpoint.py"
      - "tools/stability/ou3_mems_bias_contract.py"
      - "tools/stability/ou3_p4_complete_sea3_signed_information_ledger.py"
      - "tools/stability/ou3_proof_operating_domain.json"
      - ".github/workflows/ou3-p4-physical-finite-map-feasibility.yml"
  pull_request:
    paths: *audit_paths
  workflow_dispatch:

concurrency:
  group: ou3-p4-physical-finite-map-feasibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  physical-finite-map-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install point-audit and physical-generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy g++ libeigen3-dev

      - name: Checkout the pinned physical sea generator
        uses: actions/checkout@v6
        with:
          repository: bareboat-necessities/oceanography-waves-lib
          ref: c5ddd8ddba6e062bb131d92efcd672dfa189455a
          path: _physical-sea-generator
          persist-credentials: false

      - name: Execute the generating model and check physical SEA3 admission
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -isystem /usr/include/eigen3 -isystem _physical-sea-generator/src \
            tools/stability/ou3-sea-generator-membership.cpp -o /tmp/ou3-sea-generator-membership
          /tmp/ou3-sea-generator-membership > /tmp/ou3-sea-generator-observation.json
          python3 tests/kalman_ou_iii/ou3_physical_sea3_membership.py \
            --generator-root _physical-sea-generator \
            --observation /tmp/ou3-sea-generator-observation.json \
            --output /tmp/ou3-physical-sea3-membership.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3-physical-sea3-membership.json'))
          assert d['linear_vessel_response_admission'] == 'REJECTED'
          assert d['direct_generator_response_admission'] == 'ADMITTED'
          assert d['admission_scope'] == 'RESPONSE_MODEL_ONLY_NOT_COMPLETE_RETAINED_WORD'
          assert d['Stokes_response_test']['branch'] == 'STOKES_WAVE_FOLLOWING'
          assert not d['Stokes_response_test']['outward_complete_word_certificate']
          assert d['exact_response_test']['squared_gap_exact'] == '1'
          assert d['finite_sample_membership_under_another_realization'] == 'UNDETERMINED'
          assert not d['canonical_P4_falsified'] and not d['P4_promoted']
          print('PHYSICAL_GENERATOR_OBSERVATION',d['public_generator_API_observation'])
          print('SEA3_PLUS_RESPONSE_ADMISSION', d['Stokes_response_test'])
          PY

      - name: Test bias and finite attachment algebra
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_bias_witness_admissibility test_ou3_retained_word_attachment test_ou3_physical_sea3_membership test_ou3_sea3_response_union test_ou3_source_endpoint

      - name: Capture one source-connected finite shipping history and test fixed endpoints
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I src -isystem /usr/include/eigen3 -isystem _physical-sea-generator/src \
            tools/stability/ou3-source-endpoint.cpp -o /tmp/ou3-source-endpoint
          /tmp/ou3-source-endpoint /tmp/ou3-source-endpoint
          python3 tests/kalman_ou_iii/ou3_p4_source_endpoint.py \
            --prefix /tmp/ou3-source-endpoint \
            --generator-root _physical-sea-generator \
            --output /tmp/ou3-source-endpoint.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/ou3-source-endpoint.json'))
          assert d['initial_covariance_from_actual_shipping_history']
          assert d['nominal_and_covariance_reset_feedback_owned_by_shipping']
          assert not d['P4_promoted'] and not d['P5_may_start']
          for mode, result in d['modes'].items():
              assert result['events']['imu'] == 600
              assert result['source_root_point_parity_pass'], (mode, result)
              assert result['checked_common_premises']['BIAS1_zero_true_root_and_driver']
              assert result['homogeneous_P4_endpoint_ratio'] is None
              assert not result['canonical_P4_falsified']
          PY

      - name: Audit exact retained payloads without regeneration or a new search
        run: |
          python3 tests/kalman_ou_iii/ou3_p4_bias_witness_admissibility.py \
            --unpack-retained \
            --payload-prefix /tmp/ou3_p4_physical_payload \
            --output /tmp/ou3_p4_bias_witness_admissibility.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_p4_bias_witness_admissibility.json'))
          assert d['conditional_mathematical_experiment']
          assert not d['hardware_qualification_required_to_run_this_experiment']
          assert not d['new_source_or_direction_or_scale_search']
          assert not d['filter_or_domain_changed']
          assert not d['BIAS2_uniform_sector_available']
          assert not d['canonical_P4_falsified_here']
          assert not d['P4_promoted'] and not d['P5_may_start']
          for mode in ('H18','A21'):
              m=d['modes'][mode]
              assert m['retained_payload_identity_verified']
              assert m['all_actual_RS_values_copied_bit_for_bit']
              assert m['event_counts']['prediction'] == 600
              assert m['event_counts']['accelerometer'] == 600
              assert m['source_evidence']['membership_decision'] == 'UNDETERMINED'
              t=m['captured_reset_storage_transport']
              assert t['dropping_resets_with_unchanged_F_Q_H_is_not_a_gauge_attachment']
              print('FINITE_ATTACHMENT', mode, t['max_required_transport_difference'])
              for c in m['cases']:
                  assert c['bias_recurrence_point_check_pass']
                  r=c['finite_reset_energy_attachment']
                  assert r['max_relative_signed_identity_residual'] < 1e-10
                  if c['rho_endpoint'] > 1 and c['conditional_point_checks_pass']:
                      print('BIAS2_EXPANDING_RETAINED_CASE', mode, c['scale'],
                            'rho=',c['rho_endpoint'],
                            'mu_point=',c['BIAS2']['mu_sufficient_point'],
                            'canonical_counterexample=',c['canonical_P4_falsified_here'])
          print('SOURCE_STATUS', d['source_membership_status'])
          print('RESET_STATUS', d['finite_reset_storage_attachment_status'])
          PY

      - name: Upload retained-word attachment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-retained-word-attachment
          path: |
            /tmp/ou3_p4_bias_witness_admissibility.json
            /tmp/ou3_p4_bias_witness_admissibility.prefixes.csv.gz
            /tmp/ou3-sea-generator-observation.json
            /tmp/ou3-physical-sea3-membership.json
            /tmp/ou3-source-endpoint.json
            /tmp/ou3-source-endpoint.root.json
            /tmp/ou3-source-endpoint.inputs.csv
            /tmp/ou3-source-endpoint.prefixes.jsonl
          retention-days: 7
