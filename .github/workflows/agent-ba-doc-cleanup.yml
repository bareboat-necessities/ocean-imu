name: agent-ba-doc-cleanup
on:
  push:
    branches: [agent/mean-reverting-accel-bias]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/mean-reverting-accel-bias
      - name: Apply consistency edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Clean stale implementation comments in both OU filters.
          for rel in [
              'src/kalman_ou_ii/Kalman3D_Wave_OU_II.h',
              'src/kalman_ou_iii/Kalman3D_Wave_OU_III.h',
          ]:
              p = Path(rel)
              s = p.read_text()
              old = '''    // Accelerometer-bias random walk, as a variance per second: (5e-4)^2, i.e.
              // 5e-4 m/s^2 per sqrt(s), which is exactly what the reference simulation
              // generates (acc_bias_rw in util/W3dSimCommon.h, applied as sigma*sqrt(dt)).
              // The previous 1e-6 was twice the true process noise with nothing
              // justifying the excess.
          '''
              new = '''    // Continuous driving spectral density for the slow residual
              // accelerometer-bias OU process. The historical (5e-4)^2 value is
              // retained so its short-step covariance matches the previous random-walk
              // calibration and the reference simulator's acc_bias_rw driving scale.
          '''
              if old not in s:
                  raise SystemExit(f'stale bias comment anchor missing in {rel}')
              p.write_text(s.replace(old, new, 1))

          # Implementation constants table: distinguish filter prior from simulation truth.
          p = Path('doc/kalman_ou_iii/w3d-fus-methods.tex-part')
          s = p.read_text()
          old = '''accelerometer-bias random walk
          & \\SI{5e-4}{m.s^{-2}.s^{-0.5}}
          & adaptation cadence / time constant & $0.1/1.8$ s \\\\
          '''
          new = '''accelerometer-bias residual OU
          & $\\tau_b=\\SI{1000}{s}$; drive $\\SI{5e-4}{m.s^{-2}.s^{-0.5}}$
          & adaptation cadence / time constant & $0.1/1.8$ s \\\\
          '''
          if old not in s:
              raise SystemExit('fusion-methods table anchor missing')
          p.write_text(s.replace(old, new, 1))

          # Simulation truth remains a random walk; label the deliberate model mismatch.
          p = Path('doc/kalman_ou_iii/w3d-sim-charts.tex-part')
          s = p.read_text()
          old = '''    Bias random-walk & \\SI{5e-4}{\\meter\\per\\second\\squared\\per\\second\\tothe{0.5}} & increment std $\\propto \\sqrt{\\Delta t}$ \\\\
          '''
          new = '''    Bias random-walk & \\SI{5e-4}{\\meter\\per\\second\\squared\\per\\second\\tothe{0.5}} & simulation truth; estimator uses slow OU residual \\\\
          '''
          if old not in s:
              raise SystemExit('simulation bias table anchor missing')
          s = s.replace(old, new, 1)
          marker = '''increments scale with $\\sqrt{\\Delta t}$.
          '''
          addition = '''increments scale with $\\sqrt{\\Delta t}$.  The accelerometer truth generator deliberately
          retains this random walk. OU--II and OU--III instead estimate the residual about
          the temperature-calibration curve with the fixed slow prior $\\tau_b=\\SI{1000}{s}$
          and the same continuous driving-noise scale. The validation therefore includes
          accelerometer-bias process-model mismatch rather than making the simulated truth
          identical to the stabilizing filter prior.
          '''
          if marker not in s:
              raise SystemExit('simulation bias paragraph anchor missing')
          p.write_text(s.replace(marker, addition, 1))

          # Abstract: describe the actual bias model without touching result numbers.
          p = Path('doc/kalman_ou_iii/kalman_ou-w3d.tex')
          s = p.read_text()
          old = 'correlation. Gyroscope and accelerometer biases are modeled explicitly. To\n'
          new = ('correlation. Gyroscope bias is modeled explicitly, while accelerometer bias is a\n'
                 'slow first-order Gauss--Markov residual about a deterministic temperature-calibration\n'
                 'curve. To\n')
          if old not in s:
              raise SystemExit('abstract bias sentence anchor missing')
          p.write_text(s.replace(old, new, 1))

          # Remove an accidental Unicode multiplication sign from the proof source.
          p = Path('doc/kalman_ou_iii/w3d-iss-stability.tex-part')
          s = p.read_text()
          if '×' in s:
              s = s.replace('×', r'\\times ')
          p.write_text(s)

          Path('.github/workflows/agent-ba-doc-cleanup.yml').unlink()
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kalman_ou_ii/Kalman3D_Wave_OU_II.h \
                  src/kalman_ou_iii/Kalman3D_Wave_OU_III.h \
                  doc/kalman_ou_iii/w3d-fus-methods.tex-part \
                  doc/kalman_ou_iii/w3d-sim-charts.tex-part \
                  doc/kalman_ou_iii/kalman_ou-w3d.tex \
                  doc/kalman_ou_iii/w3d-iss-stability.tex-part \
                  .github/workflows/agent-ba-doc-cleanup.yml
          git commit -m "Align article and code with residual bias OU model"
          git push origin HEAD:refs/heads/agent/mean-reverting-accel-bias
