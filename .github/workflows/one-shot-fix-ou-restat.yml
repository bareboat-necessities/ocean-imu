name: one-shot-fix-ou-restat

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-fix-ou-restat.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Make generator own the publication wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/ou_validation.py")
          text = path.read_text(encoding="utf-8")
          retired = " The vertical gain of OU--III is paid for in the horizontal channels."
          count = text.count(retired)
          if count != 1:
              raise SystemExit(f"expected exactly one retired sentence, found {count}")
          path.write_text(text.replace(retired, "", 1), encoding="utf-8")
          PY
          python3 -m py_compile tools/ou_validation.py

      - name: Commit fix and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-ou-restat.yml
          git add tools/ou_validation.py
          git commit -m "Fix OU validation restatement publication wording"
          git push origin HEAD:refs/heads/main
