name: agent-ba-final-model
on:
  push:
    branches: [agent/mean-reverting-accel-bias]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/mean-reverting-accel-bias
      - name: Apply 3000 s residual bias OU default
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for rel in [
              'src/kalman_ou_ii/Kalman3D_Wave_OU_II.h',
              'src/kalman_ou_iii/Kalman3D_Wave_OU_III.h',
          ]:
              p = Path(rel)
              s = p.read_text()
              old = 'T tau_bacc_ = T(1000.0);             // residual accel-bias OU correlation time [s]'
              new = 'T tau_bacc_ = T(3000.0);             // residual accel-bias OU correlation time [s]'
              if old not in s:
                  if new in s:
                      continue
                  raise SystemExit(f'tau_b default anchor missing in {rel}')
              p.write_text(s.replace(old, new, 1))

          for rel in [
              'doc/kalman_ou_iii/w3d-state.tex-part',
              'doc/kalman_ou_iii/w3d-proc-cont.tex-part',
              'doc/kalman_ou_iii/w3d-intro.tex-part',
              'doc/kalman_ou_iii/w3d-iss-stability.tex-part',
              'doc/kalman_ou_iii/w3d-conclusion-summary.tex-part',
              'doc/kalman_ou_iii/w3d-fus-methods.tex-part',
              'doc/kalman_ou_iii/w3d-sim-charts.tex-part',
          ]:
              p = Path(rel)
              s = p.read_text()
              s = s.replace('\\tau_b=\\SI{1000}{s}', '\\tau_b=\\SI{3000}{s}')
              s = s.replace('$\\tau_b=\\SI{1000}{s}$', '$\\tau_b=\\SI{3000}{s}$')
              s = s.replace('approximately $\\SI{0.01118}{m\\,s^{-2}}$', 'approximately $\\SI{0.01936}{m\\,s^{-2}}$')
              s = s.replace('approximately \\SI{0.01118}{m\\,s^{-2}}', 'approximately \\SI{0.01936}{m\\,s^{-2}}')
              p.write_text(s)

          Path('.github/workflows/agent-ba-final-model.yml').unlink()
          PY
      - name: Commit 3000 s default
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kalman_ou_ii/Kalman3D_Wave_OU_II.h \
                  src/kalman_ou_iii/Kalman3D_Wave_OU_III.h \
                  doc/kalman_ou_iii/w3d-state.tex-part \
                  doc/kalman_ou_iii/w3d-proc-cont.tex-part \
                  doc/kalman_ou_iii/w3d-intro.tex-part \
                  doc/kalman_ou_iii/w3d-iss-stability.tex-part \
                  doc/kalman_ou_iii/w3d-conclusion-summary.tex-part \
                  doc/kalman_ou_iii/w3d-fus-methods.tex-part \
                  doc/kalman_ou_iii/w3d-sim-charts.tex-part \
                  .github/workflows/agent-ba-final-model.yml
          git commit -m "Use 3000 s residual bias OU default"
          git push origin HEAD:refs/heads/agent/mean-reverting-accel-bias
