name: ou3-lever-arm-study

on:
  pull_request:
    paths:
      - "src/kalman_ou_iii/**"
      - "src/tuner/**"
      - "src/util/W3dSimCommon.*"
      - "tests/kalman_ou_iii/**"
      - "tools/ou_validation.py"
      - "tools/ou3_lever_arm_study.py"
      - "tools/ou3_lever_arm_tex.py"
      - "tests/validation/test_ou3_lever_arm_study.py"
      - "tests/validation/test_ou3_lever_arm_article.py"
      - "docs/ou-iii-imu-lever-arm.md"
      - "doc/kalman_ou_iii/w3d-imu-lever-arm-study.tex-part"
      - "doc/kalman_ou_iii/w3d-post-results-investigations.tex-part"
      - ".github/workflows/ou3-lever-arm-study.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Study size
        required: true
        default: full
        type: choice
        options: [smoke, full]

permissions:
  contents: read

concurrency:
  group: ou3-lever-arm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make libeigen3-dev python3-numpy python3-matplotlib

      - name: Download versioned simulation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip \
            --clobber
          mkdir -p /tmp/ou3-lever-data
          unzip -o sim-data-files.zip -d /tmp/ou3-lever-data >/dev/null

      - name: Build OU-III simulator
        run: make -C tests/kalman_ou_iii kalman_ou_iii-sim

      - name: Unit-test the simulator lever-arm stage
        run: |
          make -C tests/kalman_ou_iii imu_lever_arm-test
          ./tests/kalman_ou_iii/imu_lever_arm-test

      - name: Unit-test lever-arm study and paper contract
        run: python3 tests/validation/test_ou3_lever_arm_study.py

      # Keep the committed summaries where the re-run cannot overwrite them,
      # so the study can be asked whether it still reaches the same numbers.
      - name: Stage the committed summaries
        if: ${{ (inputs.mode || 'full') == 'full' }}
        run: |
          mkdir -p /tmp/ou3-lever-committed
          for name in lever_arm_summary.csv lever_arm_cutoff_summary.csv; do
            git show "HEAD:reports/results/ou3_lever_arm_study/$name" \
              > "/tmp/ou3-lever-committed/$name"
          done

      - name: Run lever-arm study
        run: |
          MODE="${{ inputs.mode || 'full' }}"
          COMPARE=""
          if [ "$MODE" = "full" ]; then
            COMPARE="--compare-to /tmp/ou3-lever-committed"
          fi
          python3 -u tools/ou3_lever_arm_study.py \
            --data-dir /tmp/ou3-lever-data \
            --mode "$MODE" \
            --jobs 4 \
            --output-dir reports/results/ou3_lever_arm_study \
            --mirror-doc $COMPARE

      - name: Generate paper result fragment
        if: ${{ (inputs.mode || 'full') == 'full' }}
        run: |
          python3 tools/ou3_lever_arm_tex.py \
            reports/results/ou3_lever_arm_study/lever_arm_summary.csv \
            doc/kalman_ou_iii/w3d-imu-lever-arm-results.tex-part \
            --cutoff-summary \
              reports/results/ou3_lever_arm_study/lever_arm_cutoff_summary.csv

      # The article contract is checked against what this run produced, not
      # against the committed bytes.  Byte equality across machines is not
      # available here and asserting it would fail for reasons that have
      # nothing to do with the result: the simulator is built -march=native,
      # and this runner's Matplotlib is not the one that drew the committed
      # figures.  The comparison that matters -- every published ratio, to a
      # tolerance far below the effects the section reports -- already ran
      # inside the study above.
      - name: Check the article against this run
        if: ${{ (inputs.mode || 'full') == 'full' }}
        run: |
          python3 tests/validation/test_ou3_lever_arm_article.py
          git --no-pager diff --stat -- \
            reports/results/ou3_lever_arm_study doc/kalman_ou_iii

      - name: Upload study artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-lever-arm-study
          path: reports/results/ou3_lever_arm_study/**
          if-no-files-found: warn
