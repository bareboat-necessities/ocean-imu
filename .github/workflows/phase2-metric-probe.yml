name: phase2-metric-probe

on:
  pull_request:
    paths:
      - ".github/workflows/phase2-metric-probe.yml"
      - "tests/kalman_ou_iii/live_basin_metric_probe.cpp"
      - "tests/kalman_ou_iii/live_basin_diagnostic.cpp"

permissions:
  contents: read

jobs:
  metric:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Eigen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev
      - name: Build covariance-metric probe
        run: |
          g++ -O3 -std=c++20 -Wall -Wextra -Wshadow -Wconversion \
            -funroll-loops -fno-finite-math-only -march=native \
            -I./src -isystem /usr/include/eigen3 \
            tests/kalman_ou_iii/live_basin_metric_probe.cpp \
            -o /tmp/live_basin_metric_probe
      - name: Measure covariance-metric contraction
        run: /tmp/live_basin_metric_probe
