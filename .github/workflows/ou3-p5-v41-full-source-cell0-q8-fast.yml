name: ou3-p5-v41-full-source-cell0-q8-fast

on:
  push:
    paths:
      - "tools/ou3_p5_sample1_v40_full_source_cell0_q8_lift_v41.py"
      - "tools/ou3_p5_sample1_first_psd_exact_joseph_components_v40.py"
      - "tools/ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v18b.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v18.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v16.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_v40_full_source_cell0_q8_lift_v41.py"
      - ".github/workflows/ou3-p5-v41-full-source-cell0-q8-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_p5_sample1_v40_full_source_cell0_q8_lift_v41.py"
      - "tools/ou3_p5_sample1_first_psd_exact_joseph_components_v40.py"
      - "tools/ou3_p5_sample1_first_psd_exact_correction_geometry_v38.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v18b.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v18.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v16.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_v40_full_source_cell0_q8_lift_v41.py"
      - ".github/workflows/ou3-p5-v41-full-source-cell0-q8-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v41-full-source-cell0-q8-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-v40-full-source-cell0-q8-v41:
    name: P5 V40 full source-cell0 q8 lift V41
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Compile V41 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_v40_full_source_cell0_q8_lift_v41.py \
            tests/validation/test_ou3_p5_sample1_v40_full_source_cell0_q8_lift_v41.py
      - name: Test V41 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_v40_full_source_cell0_q8_lift_v41
      - name: Emit V41 complete refined source-cell0 q8 cover
        id: audit
        shell: bash
        run: |
          python3 tools/ou3_p5_sample1_v40_full_source_cell0_q8_lift_v41.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --output /tmp/p5_sample1_v41_full_source_cell0_q8.json
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import math
          import sys

          with open("/tmp/p5_sample1_v41_full_source_cell0_q8.json", encoding="utf-8") as fh:
              d = json.load(fh)
          cells = int(d.get("evaluated_signed_cayley_cells", -1))
          unclosed = int(d.get("unclosed_q8_cells", -1))
          closed = cells - unclosed if cells >= 0 and unclosed >= 0 else -1
          first = d.get("first_unclosed_q8_cell") or {}
          worst = d.get("worst_q8_cell") or {}

          def fmt(x):
              try:
                  y = float(x)
              except (TypeError, ValueError):
                  return "na"
              return f"{y:.12g}" if math.isfinite(y) else str(y)

          with open(sys.argv[1], "a", encoding="utf-8") as gh:
              print(f"status={d.get('P5_SAMPLE1_V40_FULL_SOURCE_CELL0_Q8_LIFT_V41', 'UNKNOWN')}", file=gh)
              print(f"cells={cells}", file=gh)
              print(f"closed={closed}", file=gh)
              print(f"unclosed={unclosed}", file=gh)
              print(f"helper_calls={d.get('V40_exact_Joseph_first_PSD_helper_calls', 'na')}", file=gh)
              print(f"first_q={fmt(first.get('post_sample1_cayley_norm_upper'))}", file=gh)
              print(f"first_p={first.get('p_cell', 'na')}", file=gh)
              print(f"first_t={first.get('tangent_residual_cell', 'na')}", file=gh)
              print(f"first_a={first.get('axial_residual_cell', 'na')}", file=gh)
              print(f"worst_q={fmt(worst.get('post_sample1_cayley_norm_upper'))}", file=gh)
              print(f"next={d.get('next_obligation', 'UNKNOWN')}", file=gh)
      - name: "V41 status=${{ steps.audit.outputs.status }} cells=${{ steps.audit.outputs.cells }} closed=${{ steps.audit.outputs.closed }} open=${{ steps.audit.outputs.unclosed }} firstq=${{ steps.audit.outputs.first_q }} worstq=${{ steps.audit.outputs.worst_q }}"
        run: |
          echo "V40 helper calls=${{ steps.audit.outputs.helper_calls }}"
          echo "first open cell p/t/a=${{ steps.audit.outputs.first_p }}/${{ steps.audit.outputs.first_t }}/${{ steps.audit.outputs.first_a }}"
          echo "next=${{ steps.audit.outputs.next }}"
