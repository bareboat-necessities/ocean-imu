name: ou3-p5-rotation-gauge-fast

# Active focused route: exact source-reachable first accelerometer through the corrected sample-1 S/accelerometer prefix.
on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_rotation_gauge_v3.py"
      - "tools/ou3_p5_first_accel_structured_gain.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_first_accel_post_reset.py"
      - "tools/ou3_p5_sample1_entry.py"
      - "tools/ou3_p5_sample1_entry_v2.py"
      - "tools/ou3_p5_sample1_entry_v3.py"
      - "tools/ou3_p5_sample1_prefix.py"
      - "tools/ou3_p5_sample1_prefix_v2.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v2.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_effective_vector_input.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_first_accel_exact_source.py"
      - "tests/validation/test_ou3_p5_first_accel_post_reset.py"
      - "tests/validation/test_ou3_p5_sample1_entry.py"
      - "tests/validation/test_ou3_p5_sample1_entry_v2.py"
      - "tests/validation/test_ou3_p5_sample1_entry_v3.py"
      - "tests/validation/test_ou3_p5_sample1_prefix.py"
      - "tests/validation/test_ou3_p5_sample1_prefix_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-prefix:
    name: P5 corrected source-correlated sample-1 S/accelerometer prefix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile sample-1 prefix producers
        run: |
          python3 -m py_compile \
            tools/ou3_p5_first_accel_rotation_gauge_v3.py \
            tools/ou3_p5_first_accel_structured_gain.py \
            tools/ou3_p5_first_accel_exact_source.py \
            tools/ou3_p5_first_accel_exact_source_v2.py \
            tools/ou3_p5_first_accel_post_reset.py \
            tools/ou3_p5_sample1_entry.py \
            tools/ou3_p5_sample1_entry_v2.py \
            tools/ou3_p5_sample1_entry_v3.py \
            tools/ou3_p5_sample1_prefix.py \
            tools/ou3_p5_sample1_prefix_v2.py \
            tests/validation/test_ou3_p5_sample1_prefix_v2.py
      - name: Test corrected sample-1 prefix semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_prefix_v2
      - name: Emit corrected sample-1 S/accelerometer result
        run: |
          python3 tools/ou3_p5_sample1_prefix_v2.py \
            --source-pieces 2 \
            --output /tmp/ou3_p5_sample1_prefix_v2.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_p5_sample1_prefix_v2.json'))
          print('P5_SAMPLE1_PREFIX_V2:', d['P5_SAMPLE1_S_ACCEL_PREFIX_CERTIFICATE'])
          print('P5_SAMPLE1_V2_PATHS:', d['evaluated_sample1_paths'])
          print('P5_SAMPLE1_V2_PHASE_COUNTS:', d['sample1_phase_counts'])
          print('P5_SAMPLE1_V2_INVERSE_BACKENDS:', d['inverse_backend_counts'])
          print('P5_SAMPLE1_V2_MAX_S_D:', d['max_sample1_S_correction_norm_upper_rad'])
          print('P5_SAMPLE1_V2_MAX_Q_AFTER_S:', d['max_sample1_q_after_S_upper'])
          print('P5_SAMPLE1_V2_MAX_ACC_RESIDUAL:', d['max_sample1_acc_residual_norm_upper_mps2'])
          print('P5_SAMPLE1_V2_MAX_ACC_D:', d['max_sample1_acc_correction_norm_upper_rad'])
          print('P5_SAMPLE1_V2_FIRST_FAILURE:', d['first_failure'])
          print('P5_SAMPLE1_V2_NEXT:', d['next_obligation'])
          PY
