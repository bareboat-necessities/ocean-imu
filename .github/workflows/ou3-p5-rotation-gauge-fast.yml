  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-full-v12b:
    name: P5 sample-1 PSD-preserving resolvent closure
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_structured_full_gain_v4.py \
            tools/ou3_p5_sample1_structured_full_gain_v5.py \
            tools/ou3_p5_sample1_structured_full_gain_v6.py \
            tools/ou3_p5_sample1_structured_full_gain_v7.py \
            tools/ou3_p5_sample1_structured_full_gain_v8.py \
            tools/ou3_p5_sample1_structured_full_gain_v9.py \
            tools/ou3_p5_sample1_structured_full_gain_v10.py \
            tools/ou3_p5_sample1_structured_full_gain_v11.py \
            tools/ou3_p5_sample1_structured_full_gain_v12.py \
            tools/ou3_p5_sample1_structured_full_gain_v12b.py \
            tools/ou3_p5_sample1_signed_radial_subcells_v13.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v10.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v11.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v12.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v12b.py \
            tests/validation/test_ou3_p5_sample1_signed_radial_subcells_v13.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py
      - name: Test focused semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p5_sample1_structured_full_gain_v10 \
            test_ou3_p5_sample1_structured_full_gain_v11 \
            test_ou3_p5_sample1_structured_full_gain_v12 \
            test_ou3_p5_sample1_structured_full_gain_v12b \
            test_ou3_p5_sample1_signed_radial_subcells_v13 \
            test_ou3_p5_deployed_quaternion_cayley_cell_v2
      - name: Emit PSD-preserving sample-1 closure
        run: |
          python3 tools/ou3_p5_sample1_structured_full_gain_v12b.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_full_v12b.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_sample1_full_v12b.json'))
          print('P5_FULL_V12B_STATUS:',d['P5_SAMPLE1_PSD_S_PSD_RESOLVENT_V12B'])
          print('P5_FULL_V12B_CELLS:',d['evaluated_joint_cells'])
          print('P5_FULL_V12B_UNCLOSED:',d['unclosed_joint_cells'])
          print('P5_FULL_V12B_MAX_DRHO:',d['max_total_residual_perturbation_upper_mps2'])
          print('P5_FULL_V12B_MAX_DP:',d['max_total_reduced_covariance_perturbation_upper'])
          print('P5_FULL_V12B_MAX_DH:',d['max_sample1_H_perturbation_upper'])
          print('P5_FULL_V12B_MAX_DS:',d['max_sample1_innovation_perturbation_upper'])
          print('P5_FULL_V12B_MAX_DK:',d['max_sample1_gain_operator_perturbation_upper'])
          print('P5_FULL_V12B_MAX_D:',d['max_V12B_correction_norm_upper_rad'])
          print('P5_FULL_V12B_FIRST_UNCLOSED:',d['first_unclosed_joint_cell'])
          print('P5_FULL_V12B_WORST:',d['worst_joint_cell'])
          print('P5_FULL_V12B_NEXT:',d['next_obligation'])
          PY
