name: ou3-p5-rotation-gauge-fast

on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v4.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v5.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v6.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v7.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v8.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v9.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v9.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-full-v9:
    name: P5 sample-1 directional residual block gain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_structured_full_gain_v4.py \
            tools/ou3_p5_sample1_structured_full_gain_v5.py \
            tools/ou3_p5_sample1_structured_full_gain_v6.py \
            tools/ou3_p5_sample1_structured_full_gain_v7.py \
            tools/ou3_p5_sample1_structured_full_gain_v8.py \
            tools/ou3_p5_sample1_structured_full_gain_v9.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v9.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py
      - name: Test focused semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p5_sample1_structured_full_gain_v9 \
            test_ou3_p5_deployed_quaternion_cayley_cell_v2
      - name: Emit directional residual block core
        run: |
          python3 tools/ou3_p5_sample1_structured_full_gain_v9.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_full_v9.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_sample1_full_v9.json'))
          print('P5_FULL_V9_STATUS:',d['P5_SAMPLE1_DIRECTIONAL_RESIDUAL_BLOCK_GAIN_V9'])
          print('P5_FULL_V9_CELLS:',d['evaluated_joint_cells'])
          print('P5_FULL_V9_UNCLOSED:',d['unclosed_joint_cells'])
          print('P5_FULL_V9_OFFDIAG:',d['body_rotation_offdiag_abs_upper'])
          print('P5_FULL_V9_FIRST_PERP_AW:',d['first_perpendicular_aw_component_upper_mps2'])
          print('P5_FULL_V9_MAX_X_RESIDUAL:',d['max_source_correlated_x_residual_upper_mps2'])
          print('P5_FULL_V9_MAX_FULL_RESIDUAL:',d['max_full_residual_norm_upper_mps2'])
          print('P5_FULL_V9_MAX_K_PERP:',d['max_Ktheta_perpendicular_block_upper'])
          print('P5_FULL_V9_MAX_K_PARALLEL:',d['max_Ktheta_parallel_block_upper'])
          print('P5_FULL_V9_MAX_PARENT:',d['max_parent_isotropic_correction_upper_rad'])
          print('P5_FULL_V9_MAX_DIRECTIONAL:',d['max_directional_correction_norm_upper_rad'])
          print('P5_FULL_V9_FIRST_UNCLOSED:',d['first_unclosed_joint_cell'])
          print('P5_FULL_V9_WORST:',d['worst_directional_joint_cell'])
          print('P5_FULL_V9_NEXT:',d['next_obligation'])
          PY
