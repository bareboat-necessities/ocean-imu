name: ou3-p5-rotation-gauge-fast

on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_rotation_gauge_v3.py"
      - "tools/ou3_p5_first_accel_structured_gain.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_sample1_repeated_tangent_channel.py"
      - "tools/ou3_p5_sample1_correction_range_bridge.py"
      - "tools/ou3_p5_sample1_reset_tangent_structure.py"
      - "tools/ou3_p5_sample1_structured_S_prefix.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_repeated_tangent_channel.py"
      - "tests/validation/test_ou3_p5_sample1_correction_range_bridge.py"
      - "tests/validation/test_ou3_p5_sample1_reset_tangent_structure.py"
      - "tests/validation/test_ou3_p5_sample1_structured_S_prefix.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-S:
    name: P5 sample-1 structured consecutive S prefix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producers
        run: |
          python3 -m py_compile \
            tools/ou3_p5_first_accel_rotation_gauge.py \
            tools/ou3_p5_first_accel_rotation_gauge_v3.py \
            tools/ou3_p5_first_accel_structured_gain.py \
            tools/ou3_p5_first_accel_exact_source.py \
            tools/ou3_p5_first_accel_exact_source_v2.py \
            tools/ou3_p5_sample1_repeated_tangent_channel.py \
            tools/ou3_p5_sample1_correction_range_bridge.py \
            tools/ou3_p5_sample1_reset_tangent_structure.py \
            tools/ou3_p5_sample1_structured_S_prefix.py \
            tools/ou3_p5_deployed_quaternion_cayley_cell.py \
            tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py \
            tests/validation/test_ou3_p5_sample1_repeated_tangent_channel.py \
            tests/validation/test_ou3_p5_sample1_correction_range_bridge.py \
            tests/validation/test_ou3_p5_sample1_reset_tangent_structure.py \
            tests/validation/test_ou3_p5_sample1_structured_S_prefix.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py
      - name: Test focused semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p5_sample1_repeated_tangent_channel \
            test_ou3_p5_sample1_correction_range_bridge \
            test_ou3_p5_sample1_reset_tangent_structure \
            test_ou3_p5_sample1_structured_S_prefix \
            test_ou3_p5_deployed_quaternion_cayley_cell \
            test_ou3_p5_deployed_quaternion_cayley_cell_v2
      - name: Emit structured consecutive S prefix
        run: |
          python3 tools/ou3_p5_sample1_structured_S_prefix.py \
            --source-pieces 4 --source-cell-index 0 --d-pieces 32 \
            --output /tmp/p5_sample1_S.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_sample1_S.json'))
          print('P5_S_STATUS:',d['P5_SAMPLE1_STRUCTURED_S_PREFIX_DIAGNOSTIC'])
          print('P5_S_CELLS:',d['evaluated_d_cells'])
          print('P5_S_FIXED:',d['fixed_pivot_inverse_count'])
          print('P5_S_FALLBACK:',d['spectral_fallback_inverse_count'])
          print('P5_S_MAX_RESIDUAL:',d['max_sample1_S_residual_norm_upper_m_s'])
          print('P5_S_MAX_D:',d['max_sample1_S_attitude_correction_norm_upper_rad'])
          print('P5_S_MAX_Q:',d['max_sample1_q_after_S_upper'])
          print('P5_S_FIRST_UNCLOSED:',d['first_unclosed_cell'])
          print('P5_S_NEXT:',d['next_obligation'])
          PY
