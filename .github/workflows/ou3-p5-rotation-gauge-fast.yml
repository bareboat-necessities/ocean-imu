name: ou3-p5-rotation-gauge-fast

on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v4.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v5.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v6.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v7.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v8.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v9.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v10.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v11.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - "tools/ou3_p5_exact_correction_transport.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v10.py"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v11.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-full-v11:
    name: P5 sample-1 PSD and S perturbation closure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_structured_full_gain_v4.py \
            tools/ou3_p5_sample1_structured_full_gain_v5.py \
            tools/ou3_p5_sample1_structured_full_gain_v6.py \
            tools/ou3_p5_sample1_structured_full_gain_v7.py \
            tools/ou3_p5_sample1_structured_full_gain_v8.py \
            tools/ou3_p5_sample1_structured_full_gain_v9.py \
            tools/ou3_p5_sample1_structured_full_gain_v10.py \
            tools/ou3_p5_sample1_structured_full_gain_v11.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v10.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v11.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py
      - name: Test focused semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p5_sample1_structured_full_gain_v10 \
            test_ou3_p5_sample1_structured_full_gain_v11 \
            test_ou3_p5_deployed_quaternion_cayley_cell_v2
      - name: Emit PSD and S perturbation closure
        run: |
          python3 tools/ou3_p5_sample1_structured_full_gain_v11.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_full_v11.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_sample1_full_v11.json'))
          print('P5_FULL_V11_STATUS:',d['P5_SAMPLE1_PSD_S_PERTURBATION_V11'])
          print('P5_FULL_V11_CELLS:',d['evaluated_joint_cells'])
          print('P5_FULL_V11_UNCLOSED:',d['unclosed_joint_cells'])
          print('P5_FULL_V11_EPS:',d['attitude_covariance_remainder_spectral_upper'])
          print('P5_FULL_V11_S_BOUNDS:',d['sample1_S_perturbation_bounds'])
          print('P5_FULL_V11_MAX_DRHO:',d['max_total_residual_perturbation_upper_mps2'])
          print('P5_FULL_V11_MAX_DP:',d['max_total_reduced_covariance_perturbation_upper'])
          print('P5_FULL_V11_MAX_DK:',d['max_sample1_gain_operator_perturbation_upper'])
          print('P5_FULL_V11_MAX_DS:',d['max_innovation_perturbation_upper'])
          print('P5_FULL_V11_MIN_LAMBDA:',d['minimum_perturbed_innovation_lambda_lower'])
          print('P5_FULL_V11_MAX_D:',d['max_V11_correction_norm_upper_rad'])
          print('P5_FULL_V11_FIRST_UNCLOSED:',d['first_unclosed_joint_cell'])
          print('P5_FULL_V11_WORST:',d['worst_joint_cell'])
          print('P5_FULL_V11_NEXT:',d['next_obligation'])
          PY
