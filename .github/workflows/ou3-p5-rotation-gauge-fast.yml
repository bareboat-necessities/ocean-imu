name: ou3-p5-rotation-gauge-fast

# Active focused route: exact source-reachable first accelerometer geometry.
on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_rotation_gauge_v3.py"
      - "tools/ou3_p5_first_accel_structured_gain.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v2.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_effective_vector_input.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_first_accel_exact_source.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-first-accel:
    name: P5 exact-source first accelerometer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile exact-source first-accelerometer producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_first_accel_rotation_gauge_v3.py \
            tools/ou3_p5_first_accel_structured_gain.py \
            tools/ou3_p5_first_accel_exact_source.py \
            tools/ou3_p5_first_accel_exact_source_v2.py \
            tests/validation/test_ou3_p5_first_accel_exact_source.py
      - name: Test exact-source first-accelerometer semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_first_accel_exact_source
      - name: Emit exact-source first-accelerometer result
        run: |
          python3 tools/ou3_p5_first_accel_exact_source_v2.py \
            --source-pieces 2 \
            --output /tmp/ou3_p5_first_accel_exact_source.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_p5_first_accel_exact_source.json'))
          print('P5_FIRST_ACCEL_EXACT_SOURCE:', d['P5_FIRST_ACCEL_EXACT_SOURCE_CERTIFICATE'])
          print('P5_EXACT_SOURCE_CELLS:', d['evaluated_source_phase_cells'])
          print('P5_EXACT_SOURCE_Q_FULL:', d['post_prediction_full_cayley_norm_upper'])
          print('P5_EXACT_SOURCE_Q_TANGENT:', d['post_prediction_cayley_tangent_norm_upper'])
          print('P5_EXACT_SOURCE_FORCE:', d['first_accel_specific_force_magnitude_mps2'])
          print('P5_EXACT_SOURCE_MAX_K:', d['max_Ktheta_norm_upper'])
          print('P5_EXACT_SOURCE_MAX_D:', d['max_first_accelerometer_correction_norm_upper_rad'])
          print('P5_EXACT_SOURCE_MARGIN:', d['minimum_correction_range_margin_rad'])
          print('P5_EXACT_SOURCE_OVER_LIMIT:', d['children_above_validated_correction_limit'])
          print('P5_EXACT_SOURCE_FIRST_UNCLOSED:', d['first_unclosed_child'])
          print('P5_EXACT_SOURCE_NEXT:', d['next_obligation'])
          PY
