name: ou3-p5-rotation-gauge-fast

on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_sample1_reset_perp_scalar_channel.py"
      - "tools/ou3_p5_sample1_reset_perp_scalar_channel_v2.py"
      - "tools/ou3_p5_sample1_reset_perp_scalar_channel_v3.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v4.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v4.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-full-v4:
    name: P5 sample-1 structured full accelerometer gain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_structured_full_gain_v4.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v4.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py
      - name: Test focused semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p5_sample1_structured_full_gain_v4 \
            test_ou3_p5_deployed_quaternion_cayley_cell_v2
      - name: Emit structured full-gain core
        run: |
          python3 tools/ou3_p5_sample1_structured_full_gain_v4.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --d-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_full_v4.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_sample1_full_v4.json'))
          print('P5_FULL_V4_STATUS:',d['P5_SAMPLE1_STRUCTURED_FULL_GAIN_V4'])
          print('P5_FULL_V4_CELLS:',d['evaluated_joint_cells'])
          print('P5_FULL_V4_FIXED:',d['fixed_pivot_inverse_count'])
          print('P5_FULL_V4_FALLBACK:',d['spectral_fallback_inverse_count'])
          print('P5_FULL_V4_MAX_FORCE:',d['max_sample1_force_norm_upper_mps2'])
          print('P5_FULL_V4_MAX_CHORD:',d['max_attitude_rotation_chord_upper'])
          print('P5_FULL_V4_MAX_EAW:',d['max_post_prediction_aw_error_norm_upper_mps2'])
          print('P5_FULL_V4_MAX_RHO:',d['max_sample1_residual_norm_upper_mps2'])
          print('P5_FULL_V4_MAX_K:',d['max_Ktheta_operator_norm_upper'])
          print('P5_FULL_V4_MAX_D:',d['max_correction_norm_upper_rad'])
          print('P5_FULL_V4_FIRST_UNCLOSED:',d['first_unclosed_joint_cell'])
          print('P5_FULL_V4_NEXT:',d['next_obligation'])
          PY
