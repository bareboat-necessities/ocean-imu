name: ou3-p5-rotation-gauge-fast

on:
  push:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v4.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v5.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v6.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v7.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v8.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v9.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v10.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v11.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v12.py"
      - "tools/ou3_p5_sample1_signed_radial_subcells_v13.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - "tools/ou3_p5_exact_correction_transport.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v10.py"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v11.py"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v12.py"
      - "tests/validation/test_ou3_p5_sample1_signed_radial_subcells_v13.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v4.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v5.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v6.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v7.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v8.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v9.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v10.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v11.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v12.py"
      - "tools/ou3_p5_sample1_signed_radial_subcells_v13.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - "tools/ou3_p5_exact_correction_transport.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v10.py"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v11.py"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v12.py"
      - "tests/validation/test_ou3_p5_sample1_signed_radial_subcells_v13.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-full-v12:
    name: P5 sample-1 actual-innovation PSD/S closure
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_structured_full_gain_v4.py \
            tools/ou3_p5_sample1_structured_full_gain_v5.py \
            tools/ou3_p5_sample1_structured_full_gain_v6.py \
            tools/ou3_p5_sample1_structured_full_gain_v7.py \
            tools/ou3_p5_sample1_structured_full_gain_v8.py \
            tools/ou3_p5_sample1_structured_full_gain_v9.py \
            tools/ou3_p5_sample1_structured_full_gain_v10.py \
            tools/ou3_p5_sample1_structured_full_gain_v11.py \
            tools/ou3_p5_sample1_structured_full_gain_v12.py \
            tools/ou3_p5_sample1_signed_radial_subcells_v13.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v10.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v11.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v12.py \
            tests/validation/test_ou3_p5_sample1_signed_radial_subcells_v13.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py
      - name: Test focused semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p5_sample1_structured_full_gain_v10 \
            test_ou3_p5_sample1_structured_full_gain_v11 \
            test_ou3_p5_sample1_structured_full_gain_v12 \
            test_ou3_p5_sample1_signed_radial_subcells_v13 \
            test_ou3_p5_deployed_quaternion_cayley_cell_v2
      - name: Emit actual-innovation PSD/S closure
        run: |
          python3 tools/ou3_p5_sample1_structured_full_gain_v12.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_full_v12.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_sample1_full_v12.json'))
          print('P5_FULL_V12_STATUS:',d['P5_SAMPLE1_PSD_S_ACTUAL_INNOVATION_V12'])
          print('P5_FULL_V12_CELLS:',d['evaluated_joint_cells'])
          print('P5_FULL_V12_UNCLOSED:',d['unclosed_joint_cells'])
          print('P5_FULL_V12_MIN_NOMINAL_LAMBDA:',d['minimum_nominal_innovation_lambda_lower'])
          print('P5_FULL_V12_MAX_DS:',d['max_innovation_perturbation_upper'])
          print('P5_FULL_V12_MIN_PERTURBED_LAMBDA:',d['minimum_perturbed_innovation_lambda_lower'])
          print('P5_FULL_V12_MAX_DRHO:',d['max_total_residual_perturbation_upper_mps2'])
          print('P5_FULL_V12_MAX_DP:',d['max_total_reduced_covariance_perturbation_upper'])
          print('P5_FULL_V12_MAX_DK:',d['max_sample1_gain_operator_perturbation_upper'])
          print('P5_FULL_V12_MAX_D:',d['max_V12_correction_norm_upper_rad'])
          print('P5_FULL_V12_FIRST_UNCLOSED:',d['first_unclosed_joint_cell'])
          print('P5_FULL_V12_WORST:',d['worst_joint_cell'])
          print('P5_FULL_V12_NEXT:',d['next_obligation'])
          PY
      - name: Gate signed radial stage
        id: v12gate
        run: |
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/p5_sample1_full_v12.json'))
          passed=d['P5_SAMPLE1_PSD_S_ACTUAL_INNOVATION_V12']=='PASS'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('pass=' + ('true' if passed else 'false') + '\n')
          print('V13_GATE_V12_PASS:', passed)
          PY
      - name: Emit signed radial sample-1 correction cells
        if: steps.v12gate.outputs.pass == 'true'
        run: |
          python3 tools/ou3_p5_sample1_signed_radial_subcells_v13.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 12 --parallel-pieces 12 \
            --output /tmp/p5_sample1_v13.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_sample1_v13.json'))
          print('P5_V13_STATUS:',d['P5_SAMPLE1_SIGNED_RADIAL_SUBCELLS_V13'])
          print('P5_V13_SOURCE_ROWS:',d['evaluated_source_rows'])
          print('P5_V13_SIGNED_SUBCELLS:',d['evaluated_signed_subcells'])
          print('P5_V13_ABOVE_6:',d['above_6rad_subcells'])
          print('P5_V13_UNCLOSED:',d['unclosed_radial_subcells'])
          print('P5_V13_MAX_RADIAL_UPPER:',d['max_radial_upper'])
          print('P5_V13_MIN_RADIAL_LOWER_ABOVE_6:',d['minimum_radial_lower_above_6'])
          print('P5_V13_FIRST_UNCLOSED:',d['first_unclosed_radial_subcell'])
          print('P5_V13_WORST:',d.get('worst_radial_subcell'))
          print('P5_V13_NEXT:',d['next_obligation'])
          PY
