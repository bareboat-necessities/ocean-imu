name: ou3-p5-rotation-gauge-fast

on:
  push:
    paths:
      - "tools/ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tools/ou3_p5_sample1_signed_radial_subcells_v13.py"
      - "tools/ou3_p5_sample1_signed_radial_subcells_v13d.py"
      - "tools/ou3_p5_sample1_signed_radial_subcells_v13e.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v14.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v14b.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v14c.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v14d.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_sample1_prefix_v2.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v14.py"
      - "tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v14b.py"
      - "tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v14c.py"
      - "tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v14d.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tools/ou3_p5_sample1_signed_radial_subcells_v13.py"
      - "tools/ou3_p5_sample1_signed_radial_subcells_v13d.py"
      - "tools/ou3_p5_sample1_signed_radial_subcells_v13e.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v14.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v14b.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v14c.py"
      - "tools/ou3_p5_sample1_signed_cayley_q8_v14d.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_sample1_prefix_v2.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v14.py"
      - "tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v14b.py"
      - "tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v14c.py"
      - "tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v14d.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-signed-cayley-q8-v14d:
    name: P5 sample-1 signed Cayley q8 composition V14D
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_structured_full_gain_v12d.py \
            tools/ou3_p5_sample1_signed_radial_subcells_v13.py \
            tools/ou3_p5_sample1_signed_radial_subcells_v13d.py \
            tools/ou3_p5_sample1_signed_radial_subcells_v13e.py \
            tools/ou3_p5_sample1_signed_cayley_q8_v14.py \
            tools/ou3_p5_sample1_signed_cayley_q8_v14b.py \
            tools/ou3_p5_sample1_signed_cayley_q8_v14c.py \
            tools/ou3_p5_sample1_signed_cayley_q8_v14d.py \
            tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v14.py \
            tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v14b.py \
            tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v14c.py \
            tests/validation/test_ou3_p5_sample1_signed_cayley_q8_v14d.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py
      - name: Test focused semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p5_sample1_signed_cayley_q8_v14 \
            test_ou3_p5_sample1_signed_cayley_q8_v14b \
            test_ou3_p5_sample1_signed_cayley_q8_v14c \
            test_ou3_p5_sample1_signed_cayley_q8_v14d \
            test_ou3_p5_deployed_quaternion_cayley_cell_v2
      - name: Emit source-correlated sample-1 q8 composition
        run: |
          python3 tools/ou3_p5_sample1_signed_cayley_q8_v14d.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --output /tmp/p5_sample1_v14d.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_sample1_v14d.json'))
          print('P5_V14D_STATUS:',d['P5_SAMPLE1_SIGNED_CAYLEY_Q8_V14D'])
          print('P5_V14D_CELLS:',d['evaluated_signed_cayley_cells'])
          print('P5_V14D_RADIAL_NOT_READY:',d['radial_not_ready_cells'])
          print('P5_V14D_ANTIPODE_CELLS:',d['product_scalar_antipode_cells'])
          print('P5_V14D_UNCLOSED:',d['unclosed_q8_cells'])
          print('P5_V14D_MIN_ABS_W:',d['minimum_abs_product_scalar_lower'])
          print('P5_V14D_MAX_Q_PLUS:',d['max_post_sample1_cayley_norm_upper'])
          print('P5_V14D_FIRST_UNCLOSED:',d['first_unclosed_q8_cell'])
          print('P5_V14D_WORST:',d['worst_q8_cell'])
          print('P5_V14D_NEXT:',d['next_obligation'])
          print('P5_V14D_VALIDATION:',d['validation_failures'])
          PY