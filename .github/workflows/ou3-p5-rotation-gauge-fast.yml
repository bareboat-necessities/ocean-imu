  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-full-v12c:
    name: P5 sample-1 one-plus-two attitude resolvent closure
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_structured_full_gain_v4.py \
            tools/ou3_p5_sample1_structured_full_gain_v5.py \
            tools/ou3_p5_sample1_structured_full_gain_v6.py \
            tools/ou3_p5_sample1_structured_full_gain_v7.py \
            tools/ou3_p5_sample1_structured_full_gain_v8.py \
            tools/ou3_p5_sample1_structured_full_gain_v9.py \
            tools/ou3_p5_sample1_structured_full_gain_v10.py \
            tools/ou3_p5_sample1_structured_full_gain_v11.py \
            tools/ou3_p5_sample1_structured_full_gain_v12c.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v10.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v11.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v12c.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py
      - name: Test focused semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p5_sample1_structured_full_gain_v10 \
            test_ou3_p5_sample1_structured_full_gain_v11 \
            test_ou3_p5_sample1_structured_full_gain_v12c \
            test_ou3_p5_deployed_quaternion_cayley_cell_v2
      - name: Emit one-plus-two sample-1 closure
        run: |
          python3 tools/ou3_p5_sample1_structured_full_gain_v12c.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_full_v12c.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_sample1_full_v12c.json'))
          print('P5_FULL_V12C_STATUS:',d['P5_SAMPLE1_ONE_PLUS_TWO_ATTITUDE_RESOLVENT_V12C'])
          print('P5_FULL_V12C_CELLS:',d['evaluated_joint_cells'])
          print('P5_FULL_V12C_UNCLOSED:',d['unclosed_joint_cells'])
          print('P5_FULL_V12C_FALLBACKS:',d['noise_floor_inverse_fallback_cells'])
          print('P5_FULL_V12C_MIN_NOMINAL_LAMBDA:',d['minimum_nominal_block_lambda_lower'])
          print('P5_FULL_V12C_MAX_BETA:',d['max_nominal_inverse_times_innovation_perturbation_upper'])
          print('P5_FULL_V12C_MAX_INV:',d['max_actual_innovation_inverse_operator_upper'])
          print('P5_FULL_V12C_MAX_DRHO:',d['max_total_residual_perturbation_upper_mps2'])
          print('P5_FULL_V12C_MAX_DP:',d['max_total_reduced_covariance_perturbation_upper'])
          print('P5_FULL_V12C_MAX_DH:',d['max_sample1_H_perturbation_upper'])
          print('P5_FULL_V12C_MAX_DS:',d['max_sample1_innovation_perturbation_upper'])
          print('P5_FULL_V12C_MAX_DKTHETA:',d['max_sample1_attitude_gain_operator_perturbation_upper'])
          print('P5_FULL_V12C_MAX_D:',d['max_V12C_correction_norm_upper_rad'])
          print('P5_FULL_V12C_FIRST_UNCLOSED:',d['first_unclosed_joint_cell'])
          print('P5_FULL_V12C_WORST:',d['worst_joint_cell'])
          print('P5_FULL_V12C_NEXT:',d['next_obligation'])
          PY
