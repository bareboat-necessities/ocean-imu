name: ou3-p5-rotation-gauge-fast

on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_rotation_gauge_v3.py"
      - "tools/ou3_p5_first_accel_structured_gain.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_first_accel_post_reset.py"
      - "tools/ou3_p5_sample1_entry.py"
      - "tools/ou3_p5_sample1_entry_v3.py"
      - "tools/ou3_p5_sample1_prefix.py"
      - "tools/ou3_p5_sample1_prefix_v2.py"
      - "tools/ou3_p5_sample1_rotation_gauge_refinement.py"
      - "tools/ou3_p5_sample1_rotation_gauge_refinement_v2.py"
      - "tools/ou3_p5_sample1_transported_crosscov_refinement.py"
      - "tools/ou3_p5_sample1_force_cone_crosscov_refinement.py"
      - "tools/ou3_p5_sample1_forward_crosscov_refinement.py"
      - "tools/ou3_p5_sample1_coupled_tangent_refinement.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_coupled_tangent_refinement.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coupled-tangent:
    name: P5 sample-1 coupled tangent refinement
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_first_accel_rotation_gauge.py \
            tools/ou3_p5_first_accel_rotation_gauge_v3.py \
            tools/ou3_p5_first_accel_structured_gain.py \
            tools/ou3_p5_first_accel_exact_source.py \
            tools/ou3_p5_first_accel_exact_source_v2.py \
            tools/ou3_p5_first_accel_post_reset.py \
            tools/ou3_p5_sample1_entry.py \
            tools/ou3_p5_sample1_entry_v3.py \
            tools/ou3_p5_sample1_prefix.py \
            tools/ou3_p5_sample1_prefix_v2.py \
            tools/ou3_p5_sample1_rotation_gauge_refinement.py \
            tools/ou3_p5_sample1_rotation_gauge_refinement_v2.py \
            tools/ou3_p5_sample1_transported_crosscov_refinement.py \
            tools/ou3_p5_sample1_coupled_tangent_refinement.py \
            tests/validation/test_ou3_p5_sample1_coupled_tangent_refinement.py
      - name: Test coupled tangent semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_coupled_tangent_refinement
      - name: Emit coupled tangent result
        run: |
          python3 tools/ou3_p5_sample1_coupled_tangent_refinement.py \
            --source-pieces 4 --source-cell-index 0 \
            --delta-pieces 16 \
            --output /tmp/p5_coupled_tangent.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_coupled_tangent.json'))
          print('P5_COUPLED_STATUS:',d['P5_SAMPLE1_COUPLED_TANGENT_WITNESS_REFINEMENT'])
          print('P5_COUPLED_CELLS:',d['evaluated_delta_cells'])
          print('P5_COUPLED_BETA:',d['beta_interval_mps2_per_rad'])
          print('P5_COUPLED_COMBO_GAIN:',d['first_tangent_combined_gain_norm_upper'])
          print('P5_COUPLED_REM0:',d['first_tangent_relation_remainder_norm_upper_mps2'])
          print('P5_COUPLED_FIXED:',d['fixed_pivot_inverse_count'])
          print('P5_COUPLED_FALLBACK:',d['spectral_fallback_inverse_count'])
          print('P5_COUPLED_MAX_ETHETA:',d['max_E_theta_norm_upper'])
          print('P5_COUPLED_MAX_PJE:',d['max_Pj_Et_first6_norm_upper'])
          print('P5_COUPLED_MAX_C:',d['max_actual_Ctheta_norm_upper'])
          print('P5_COUPLED_MAX_D:',d['max_sample1_acc_correction_norm_upper_rad'])
          print('P5_COUPLED_FIRST_UNCLOSED:',d['first_unclosed_delta_cell'])
          print('P5_COUPLED_NEXT:',d['next_obligation'])
          PY
