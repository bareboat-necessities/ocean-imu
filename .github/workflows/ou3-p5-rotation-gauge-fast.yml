name: ou3-p5-rotation-gauge-fast

# Active focused route: V2 axis-hulled rotation gauge.
on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_rotation_gauge_v2.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v2.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_effective_vector_input.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_first_accel_rotation_gauge_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rotation-gauged-first-accel:
    name: P5 rotation-gauged first accelerometer V2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile rotation-gauged V2 producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_first_accel_rotation_gauge.py \
            tools/ou3_p5_first_accel_rotation_gauge_v2.py \
            tests/validation/test_ou3_p5_first_accel_rotation_gauge_v2.py
      - name: Test rotation-gauged V2 semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_first_accel_rotation_gauge_v2
      - name: Emit rotation-gauged first-accelerometer V2 result
        run: |
          python3 tools/ou3_p5_first_accel_rotation_gauge_v2.py \
            --source-pieces 2 \
            --yaw-axis-face-pieces 4 \
            --force-magnitude-pieces 4 \
            --output /tmp/ou3_p5_first_accel_rotation_gauge_v2.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_p5_first_accel_rotation_gauge_v2.json'))
          print('P5_FIRST_ACCEL_ROTATION_GAUGE_V2:', d['P5_FIRST_ACCEL_ROTATION_GAUGED_CERTIFICATE'])
          print('P5_ROTATION_GAUGE_CHILDREN:', d['evaluated_child_count'])
          print('P5_ROTATION_GAUGE_OVER_LIMIT:', d['children_above_validated_correction_limit'])
          print('P5_ROTATION_GAUGE_MAX_D:', d['max_first_accelerometer_correction_norm_upper_rad'])
          print('P5_ROTATION_GAUGE_MARGIN:', d['minimum_correction_range_margin_rad'])
          print('P5_ROTATION_GAUGE_FIXED_INV:', d['fixed_pivot_inverse_count'])
          print('P5_ROTATION_GAUGE_FALLBACK_INV:', d['spectral_fallback_inverse_count'])
          print('P5_ROTATION_GAUGE_FIRST_UNCLOSED:', d['first_unclosed_child'])
          print('P5_ROTATION_GAUGE_NEXT:', d['next_obligation'])
          PY
