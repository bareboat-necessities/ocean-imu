name: ou3-p5-rotation-gauge-fast

# Active focused route: exact source-reachable first accelerometer through deployed injection/reset.
on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_rotation_gauge_v3.py"
      - "tools/ou3_p5_first_accel_structured_gain.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_first_accel_post_reset.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v2.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_effective_vector_input.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_first_accel_exact_source.py"
      - "tests/validation/test_ou3_p5_first_accel_post_reset.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-first-accel-post-reset:
    name: P5 exact-source first accelerometer through reset
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile exact-source first-accelerometer/reset producers
        run: |
          python3 -m py_compile \
            tools/ou3_p5_first_accel_rotation_gauge_v3.py \
            tools/ou3_p5_first_accel_structured_gain.py \
            tools/ou3_p5_first_accel_exact_source.py \
            tools/ou3_p5_first_accel_exact_source_v2.py \
            tools/ou3_p5_first_accel_post_reset.py \
            tests/validation/test_ou3_p5_first_accel_exact_source.py \
            tests/validation/test_ou3_p5_first_accel_post_reset.py
      - name: Test exact-source first-accelerometer/reset semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p5_first_accel_exact_source \
            test_ou3_p5_first_accel_post_reset
      - name: Emit exact-source first-accelerometer post-reset result
        run: |
          python3 tools/ou3_p5_first_accel_post_reset.py \
            --source-pieces 2 \
            --output /tmp/ou3_p5_first_accel_post_reset.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_p5_first_accel_post_reset.json'))
          print('P5_FIRST_ACCEL_POST_RESET:', d['P5_FIRST_ACCEL_POST_RESET_PREFIX_CERTIFICATE'])
          print('P5_POST_RESET_Q_BEFORE:', d['pre_accel_cayley_norm_upper'])
          print('P5_POST_RESET_D_MAX:', d['accepted_accel_correction_norm_upper_rad'])
          print('P5_POST_RESET_THETA_AFTER:', d['post_accel_geodesic_angle_upper_rad'])
          print('P5_POST_RESET_Q_AFTER:', d['post_accel_cayley_norm_upper'])
          print('P5_POST_RESET_OPERATOR_NORM:', d['reset_operator_norm_upper'])
          print('P5_POST_RESET_COV_MULTIPLIER:', d['reset_covariance_quadratic_multiplier_upper'])
          print('P5_POST_RESET_NEXT:', d['next_obligation'])
          PY
