name: ou3-p5-rotation-gauge-fast

on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v4.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v5.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v6.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v7.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v8.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v9.py"
      - "tools/ou3_p5_sample1_structured_full_gain_v10.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - "tools/ou3_p5_exact_correction_transport.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v10.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-full-v10:
    name: P5 sample-1 combined perpendicular residual
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_structured_full_gain_v4.py \
            tools/ou3_p5_sample1_structured_full_gain_v5.py \
            tools/ou3_p5_sample1_structured_full_gain_v6.py \
            tools/ou3_p5_sample1_structured_full_gain_v7.py \
            tools/ou3_p5_sample1_structured_full_gain_v8.py \
            tools/ou3_p5_sample1_structured_full_gain_v9.py \
            tools/ou3_p5_sample1_structured_full_gain_v10.py \
            tests/validation/test_ou3_p5_sample1_structured_full_gain_v10.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py
      - name: Test focused semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p5_sample1_structured_full_gain_v10 \
            test_ou3_p5_deployed_quaternion_cayley_cell_v2
      - name: Emit combined perpendicular residual core
        run: |
          python3 tools/ou3_p5_sample1_structured_full_gain_v10.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --output /tmp/p5_sample1_full_v10.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_sample1_full_v10.json'))
          print('P5_FULL_V10_STATUS:',d['P5_SAMPLE1_COMBINED_PERPENDICULAR_RESIDUAL_V10'])
          print('P5_FULL_V10_CELLS:',d['evaluated_joint_cells'])
          print('P5_FULL_V10_UNCLOSED:',d['unclosed_joint_cells'])
          print('P5_FULL_V10_ALPHA:',d['alpha_interval'])
          print('P5_FULL_V10_FIRST_ROT_X:',d['first_gravity_x_rotational_residual_upper_mps2'])
          print('P5_FULL_V10_TRANSPORT_CHORD:',d['one_step_error_transport_rotation_norm_upper'])
          print('P5_FULL_V10_SERIES_MISMATCH:',d['max_series_vs_axis_rotation_mismatch_upper'])
          print('P5_FULL_V10_MAX_X_RESIDUAL:',d['max_combined_source_x_residual_upper_mps2'])
          print('P5_FULL_V10_MAX_FULL_RESIDUAL:',d['max_full_residual_norm_upper_mps2'])
          print('P5_FULL_V10_MAX_K_PERP:',d['max_Ktheta_perpendicular_block_upper'])
          print('P5_FULL_V10_MAX_K_PARALLEL:',d['max_Ktheta_parallel_block_upper'])
          print('P5_FULL_V10_MAX_PARENT:',d['max_parent_isotropic_correction_upper_rad'])
          print('P5_FULL_V10_MAX_DIRECTIONAL:',d['max_combined_directional_correction_norm_upper_rad'])
          print('P5_FULL_V10_FIRST_UNCLOSED:',d['first_unclosed_joint_cell'])
          print('P5_FULL_V10_WORST:',d['worst_directional_joint_cell'])
          print('P5_FULL_V10_NEXT:',d['next_obligation'])
          PY
