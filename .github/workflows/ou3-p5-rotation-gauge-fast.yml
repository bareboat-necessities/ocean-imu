name: ou3-p5-rotation-gauge-fast

# Active focused route: analytic structured gain after source-sparsity gauge.
on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_rotation_gauge_v3.py"
      - "tools/ou3_p5_first_accel_structured_gain.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v2.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_effective_vector_input.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_first_accel_structured_gain.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structured-first-accel:
    name: P5 analytic structured first accelerometer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile structured first-accelerometer producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_first_accel_rotation_gauge_v3.py \
            tools/ou3_p5_first_accel_structured_gain.py \
            tests/validation/test_ou3_p5_first_accel_structured_gain.py
      - name: Test structured gain semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_first_accel_structured_gain
      - name: Emit structured first-accelerometer result
        run: |
          python3 tools/ou3_p5_first_accel_structured_gain.py \
            --source-pieces 2 \
            --alignment-pieces 16 \
            --force-magnitude-pieces 4 \
            --output /tmp/ou3_p5_first_accel_structured_gain.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_p5_first_accel_structured_gain.json'))
          print('P5_FIRST_ACCEL_STRUCTURED_GAIN:', d['P5_FIRST_ACCEL_STRUCTURED_GAIN_CERTIFICATE'])
          print('P5_STRUCTURED_GAIN_CHILDREN:', d['evaluated_child_count'])
          print('P5_STRUCTURED_GAIN_OVER_LIMIT:', d['children_above_validated_correction_limit'])
          print('P5_STRUCTURED_GAIN_MAX_D:', d['max_first_accelerometer_correction_norm_upper_rad'])
          print('P5_STRUCTURED_GAIN_MARGIN:', d['minimum_correction_range_margin_rad'])
          print('P5_STRUCTURED_GAIN_MAX_K:', d['max_Ktheta_norm_upper'])
          print('P5_STRUCTURED_GAIN_MAX_KH:', d['max_Ktheta_Htheta_norm_upper'])
          print('P5_STRUCTURED_GAIN_FIRST_UNCLOSED:', d['first_unclosed_child'])
          print('P5_STRUCTURED_GAIN_NEXT:', d['next_obligation'])
          PY
