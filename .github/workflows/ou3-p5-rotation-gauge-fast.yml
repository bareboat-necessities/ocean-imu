name: ou3-p5-rotation-gauge-fast

on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_rotation_gauge_v3.py"
      - "tools/ou3_p5_first_accel_structured_gain.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_first_accel_post_reset.py"
      - "tools/ou3_p5_sample1_entry.py"
      - "tools/ou3_p5_sample1_entry_v3.py"
      - "tools/ou3_p5_sample1_prefix.py"
      - "tools/ou3_p5_sample1_prefix_v2.py"
      - "tools/ou3_p5_sample1_rotation_gauge_refinement.py"
      - "tools/ou3_p5_sample1_rotation_gauge_refinement_v2.py"
      - "tools/ou3_p5_sample1_schur_gain_refinement.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_rotation_gauge_refinement.py"
      - "tests/validation/test_ou3_p5_sample1_rotation_gauge_refinement_v2.py"
      - "tests/validation/test_ou3_p5_sample1_schur_gain_refinement.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-schur-refinement:
    name: P5 sample-1 Schur gain witness refinement
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producers
        run: |
          python3 -m py_compile \
            tools/ou3_p5_first_accel_rotation_gauge.py \
            tools/ou3_p5_first_accel_rotation_gauge_v3.py \
            tools/ou3_p5_first_accel_structured_gain.py \
            tools/ou3_p5_first_accel_exact_source.py \
            tools/ou3_p5_first_accel_exact_source_v2.py \
            tools/ou3_p5_first_accel_post_reset.py \
            tools/ou3_p5_sample1_entry.py \
            tools/ou3_p5_sample1_entry_v3.py \
            tools/ou3_p5_sample1_prefix.py \
            tools/ou3_p5_sample1_prefix_v2.py \
            tools/ou3_p5_sample1_rotation_gauge_refinement.py \
            tools/ou3_p5_sample1_rotation_gauge_refinement_v2.py \
            tools/ou3_p5_sample1_schur_gain_refinement.py \
            tests/validation/test_ou3_p5_sample1_schur_gain_refinement.py
      - name: Test Schur refinement semantics
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_schur_gain_refinement
      - name: Emit Schur witness result
        run: |
          python3 tools/ou3_p5_sample1_schur_gain_refinement.py \
            --source-pieces 2 --source-cell-index 0 --delta-pieces 8 \
            --output /tmp/p5_schur.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_schur.json'))
          print('P5_SCHUR_STATUS:',d['P5_SAMPLE1_SCHUR_GAIN_WITNESS_REFINEMENT'])
          print('P5_SCHUR_DELTA_CELLS:',d['evaluated_delta_cells'])
          print('P5_SCHUR_MAX_S_D:',d['max_sample1_S_attitude_correction_norm_upper_rad'])
          print('P5_SCHUR_MAX_S_AW:',d['max_sample1_S_aw_correction_norm_upper_mps2'])
          print('P5_SCHUR_MAX_RESIDUAL:',d['max_sample1_acc_residual_norm_upper_mps2'])
          print('P5_SCHUR_MAX_ACC_D:',d['max_sample1_acc_correction_norm_upper_rad'])
          print('P5_SCHUR_FIRST_UNCLOSED:',d['first_unclosed_delta_cell'])
          print('P5_SCHUR_NEXT:',d['next_obligation'])
          PY
