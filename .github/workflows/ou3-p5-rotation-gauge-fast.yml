name: ou3-p5-rotation-gauge-fast

on:
  push:
    paths:
      - "tools/ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tools/ou3_p5_sample1_signed_radial_subcells_v13.py"
      - "tools/ou3_p5_sample1_signed_radial_subcells_v13d.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tests/validation/test_ou3_p5_sample1_signed_radial_subcells_v13d.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tools/ou3_p5_sample1_signed_radial_subcells_v13.py"
      - "tools/ou3_p5_sample1_signed_radial_subcells_v13d.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_structured_full_gain_v12d.py"
      - "tests/validation/test_ou3_p5_sample1_signed_radial_subcells_v13d.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-signed-radial-v13d:
    name: P5 sample-1 signed radial correction closure
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producer
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_structured_full_gain_v12d.py \
            tools/ou3_p5_sample1_signed_radial_subcells_v13.py \
            tools/ou3_p5_sample1_signed_radial_subcells_v13d.py \
            tests/validation/test_ou3_p5_sample1_signed_radial_subcells_v13d.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py
      - name: Test focused semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p5_sample1_signed_radial_subcells_v13d \
            test_ou3_p5_deployed_quaternion_cayley_cell_v2
      - name: Emit signed radial sample-1 cells
        run: |
          python3 tools/ou3_p5_sample1_signed_radial_subcells_v13d.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --output /tmp/p5_sample1_v13d.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_sample1_v13d.json'))
          print('P5_V13D_STATUS:',d['P5_SAMPLE1_SIGNED_RADIAL_SUBCELLS_V13D'])
          print('P5_V13D_SOURCE_ROWS:',d['evaluated_source_rows'])
          print('P5_V13D_SIGNED_SUBCELLS:',d['evaluated_signed_subcells'])
          print('P5_V13D_ABOVE_6:',d['above_6rad_subcells'])
          print('P5_V13D_UNCLOSED:',d['unclosed_radial_subcells'])
          print('P5_V13D_MAX_RADIAL_UPPER:',d['max_radial_upper'])
          print('P5_V13D_MIN_RADIAL_LOWER_ABOVE_6:',d['minimum_radial_lower_above_6'])
          print('P5_V13D_FIRST_UNCLOSED:',d['first_unclosed_radial_subcell'])
          print('P5_V13D_WORST:',d.get('worst_radial_subcell'))
          print('P5_V13D_NEXT:',d['next_obligation'])
          PY
