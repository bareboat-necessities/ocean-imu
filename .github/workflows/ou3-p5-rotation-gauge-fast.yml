name: ou3-p5-rotation-gauge-fast

on:
  pull_request:
    paths:
      - "tools/ou3_p5_first_accel_rotation_gauge.py"
      - "tools/ou3_p5_first_accel_rotation_gauge_v3.py"
      - "tools/ou3_p5_first_accel_structured_gain.py"
      - "tools/ou3_p5_first_accel_exact_source.py"
      - "tools/ou3_p5_first_accel_exact_source_v2.py"
      - "tools/ou3_p5_sample1_coupled_tangent_gauge_v2.py"
      - "tools/ou3_p5_sample1_repeated_tangent_channel.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - "tools/ou3_p5_full_h_prefix_cells.py"
      - "tools/ou3_p5_full_h_prefix_cells_v3.py"
      - "tools/ou3_p5_go_live_covariance_stage.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p5_sample1_repeated_tangent_channel.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell.py"
      - "tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py"
      - ".github/workflows/ou3-p5-rotation-gauge-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-rotation-gauge-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample1-range:
    name: P5 sample-1 scalar core + 9-rad quaternion range
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile focused producers
        run: |
          python3 -m py_compile \
            tools/ou3_p5_first_accel_rotation_gauge.py \
            tools/ou3_p5_first_accel_rotation_gauge_v3.py \
            tools/ou3_p5_first_accel_structured_gain.py \
            tools/ou3_p5_first_accel_exact_source.py \
            tools/ou3_p5_first_accel_exact_source_v2.py \
            tools/ou3_p5_sample1_repeated_tangent_channel.py \
            tools/ou3_p5_deployed_quaternion_cayley_cell.py \
            tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py \
            tests/validation/test_ou3_p5_sample1_repeated_tangent_channel.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell.py \
            tests/validation/test_ou3_p5_deployed_quaternion_cayley_cell_v2.py
      - name: Test focused semantics
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p5_sample1_repeated_tangent_channel \
            test_ou3_p5_deployed_quaternion_cayley_cell \
            test_ou3_p5_deployed_quaternion_cayley_cell_v2
      - name: Emit repeated tangent core and extended range
        run: |
          python3 tools/ou3_p5_sample1_repeated_tangent_channel.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 32 --axial-pieces 32 \
            --output /tmp/p5_repeated_tangent.json
          python3 tools/ou3_p5_deployed_quaternion_cayley_cell_v2.py \
            --output /tmp/p5_quaternion_v2.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5_repeated_tangent.json'))
          q=json.load(open('/tmp/p5_quaternion_v2.json'))
          print('P5_REPEAT_STATUS:',d['P5_SAMPLE1_REPEATED_TANGENT_CORE_WITNESS'])
          print('P5_REPEAT_CELLS:',d['evaluated_joint_cells'])
          print('P5_REPEAT_RHO_TANGENT:',d['sample1_tangent_residual_norm_upper_mps2'])
          print('P5_REPEAT_MIN_S:',d['minimum_scalar_innovation_variance_lower'])
          print('P5_REPEAT_MAX_K:',d['max_scalar_Ktheta_abs_upper'])
          print('P5_REPEAT_MAX_D:',d['max_scalar_correction_norm_upper_rad'])
          print('P5_REPEAT_FIRST_UNCLOSED:',d['first_unclosed_joint_cell'])
          print('P5_QUAT_V2_STATUS:',q['P5_DEPLOYED_QUATERNION_CAYLEY_CELL_V2_PRIMITIVE'])
          print('P5_QUAT_V2_MAX_RAD:',q['maximum_validated_correction_norm_rad'])
          print('P5_QUAT_V2_AUDIT:',q['audit_extended_over_2pi'])
          print('P5_QUAT_V2_NEXT:',q['next_obligation'])
          PY
