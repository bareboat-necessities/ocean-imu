name: ou3-sea3-window-contract

on:
  push:
    paths:
      - "tools/stability/ou3_sea3_continuum_phase_state.py"
      - "tools/stability/ou3_sea3_continuum_driver_gram.py"
      - "tools/stability/ou3_sea3_fixed_history_source_core.py"
      - "tools/stability/ou3_sea3_hard_window_behavior.py"
      - "tools/stability/ou3_sea3_hard_shaping_state.py"
      - "tools/stability/ou3_sea3_hard_finite_window_source.py"
      - "tools/stability/ou3_sea3_rlambda_transition.py"
      - "tools/stability/ou3_sea3_complete_window_executor.py"
      - "tools/stability/ou3_sea3_complete_window_execution_kernel.py"
      - "tools/stability/ou3_sea3_window_artifact_codec.py"
      - "tools/stability/ou3_sea3_response_regularity_moment.py"
      - "tools/stability/ou3_sea3_aw_covariance_floor.py"
      - "tests/validation/test_ou3_sea3_continuum_phase_state.py"
      - "tests/validation/test_ou3_sea3_hard_window_behavior.py"
      - "tests/validation/test_ou3_sea3_hard_shaping_state.py"
      - "tests/validation/test_ou3_sea3_hard_finite_window_source.py"
      - "tests/validation/test_ou3_sea3_rlambda_transition.py"
      - "tests/validation/test_ou3_sea3_complete_window_executor.py"
      - "tests/validation/test_ou3_sea3_complete_window_execution_kernel.py"
      - "tests/validation/test_ou3_sea3_window_artifact_codec.py"
      - "tests/validation/test_ou3_sea3_response_regularity_moment.py"
      - "tests/validation/test_ou3_sea3_aw_covariance_floor.py"
      - "doc/kalman_ou_iii/w3d-sea3-stability-theorem.tex-part"
      - ".github/workflows/ou3-sea3-window-contract.yml"
  pull_request:
    paths:
      - "tools/stability/ou3_sea3_continuum_phase_state.py"
      - "tools/stability/ou3_sea3_continuum_driver_gram.py"
      - "tools/stability/ou3_sea3_fixed_history_source_core.py"
      - "tools/stability/ou3_sea3_hard_window_behavior.py"
      - "tools/stability/ou3_sea3_hard_shaping_state.py"
      - "tools/stability/ou3_sea3_hard_finite_window_source.py"
      - "tools/stability/ou3_sea3_rlambda_transition.py"
      - "tools/stability/ou3_sea3_complete_window_executor.py"
      - "tools/stability/ou3_sea3_complete_window_execution_kernel.py"
      - "tools/stability/ou3_sea3_window_artifact_codec.py"
      - "tools/stability/ou3_sea3_response_regularity_moment.py"
      - "tools/stability/ou3_sea3_aw_covariance_floor.py"
      - "tests/validation/test_ou3_sea3_continuum_phase_state.py"
      - "tests/validation/test_ou3_sea3_hard_window_behavior.py"
      - "tests/validation/test_ou3_sea3_hard_shaping_state.py"
      - "tests/validation/test_ou3_sea3_hard_finite_window_source.py"
      - "tests/validation/test_ou3_sea3_rlambda_transition.py"
      - "tests/validation/test_ou3_sea3_complete_window_executor.py"
      - "tests/validation/test_ou3_sea3_complete_window_execution_kernel.py"
      - "tests/validation/test_ou3_sea3_window_artifact_codec.py"
      - "tests/validation/test_ou3_sea3_response_regularity_moment.py"
      - "tests/validation/test_ou3_sea3_aw_covariance_floor.py"
      - "doc/kalman_ou_iii/w3d-sea3-stability-theorem.tex-part"
      - ".github/workflows/ou3-sea3-window-contract.yml"
  workflow_dispatch:

concurrency:
  group: ou3-sea3-window-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hard-window-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile provider and executor boundary
        run: |
          python3 -m py_compile \
            tools/stability/ou3_sea3_continuum_phase_state.py \
            tools/stability/ou3_sea3_continuum_driver_gram.py \
            tools/stability/ou3_sea3_fixed_history_source_core.py \
            tools/stability/ou3_sea3_hard_window_behavior.py \
            tools/stability/ou3_sea3_hard_shaping_state.py \
            tools/stability/ou3_sea3_hard_finite_window_source.py \
            tools/stability/ou3_sea3_rlambda_transition.py \
            tools/stability/ou3_sea3_complete_window_executor.py \
            tools/stability/ou3_sea3_complete_window_execution_kernel.py \
            tools/stability/ou3_sea3_window_artifact_codec.py \
            tools/stability/ou3_sea3_response_regularity_moment.py \
            tools/stability/ou3_sea3_aw_covariance_floor.py \
            tests/validation/test_ou3_sea3_continuum_phase_state.py \
            tests/validation/test_ou3_sea3_hard_window_behavior.py \
            tests/validation/test_ou3_sea3_hard_shaping_state.py \
            tests/validation/test_ou3_sea3_hard_finite_window_source.py \
            tests/validation/test_ou3_sea3_rlambda_transition.py \
            tests/validation/test_ou3_sea3_complete_window_executor.py \
            tests/validation/test_ou3_sea3_complete_window_execution_kernel.py \
            tests/validation/test_ou3_sea3_window_artifact_codec.py \
            tests/validation/test_ou3_sea3_response_regularity_moment.py \
            tests/validation/test_ou3_sea3_aw_covariance_floor.py

      - name: Build complete SEA3 source boundary and legal feasibility point
        run: |
          python3 tools/stability/ou3_sea3_rlambda_transition.py --output /tmp/ou3_sea3_rlambda_transition.json
          python3 tools/stability/ou3_sea3_continuum_phase_state.py --output /tmp/ou3_sea3_continuum_phase_state.json
          python3 tools/stability/ou3_sea3_continuum_driver_gram.py --output /tmp/ou3_sea3_continuum_driver_gram.json
          python3 tools/stability/ou3_sea3_fixed_history_source_core.py --output /tmp/ou3_sea3_fixed_history_source_core.json
          python3 tools/stability/ou3_sea3_hard_window_behavior.py --output /tmp/ou3_sea3_hard_window_behavior.json
          python3 tools/stability/ou3_sea3_hard_shaping_state.py --output /tmp/ou3_sea3_hard_shaping_state.json
          python3 tools/stability/ou3_sea3_hard_finite_window_source.py --output /tmp/ou3_sea3_hard_finite_window_source.json
          python3 tools/stability/ou3_sea3_complete_window_executor.py --output /tmp/ou3_sea3_complete_window_executor.json
          python3 tools/stability/ou3_sea3_complete_window_execution_kernel.py --output /tmp/ou3_sea3_complete_window_execution_kernel.json
          python3 tools/stability/ou3_sea3_window_artifact_codec.py --output /tmp/ou3_sea3_window_artifact_codec.json
          python3 tools/stability/ou3_sea3_response_regularity_moment.py --output /tmp/ou3_sea3_response_regularity_moment.json
          python3 tools/stability/ou3_sea3_aw_covariance_floor.py --output /tmp/ou3_sea3_aw_covariance_floor.json
          python3 - <<'PY'
          import json
          load=lambda n: json.load(open('/tmp/'+n+'.json'))
          l=load('ou3_sea3_rlambda_transition')
          p=load('ou3_sea3_continuum_phase_state')
          g=load('ou3_sea3_continuum_driver_gram')
          x=load('ou3_sea3_fixed_history_source_core')
          b=load('ou3_sea3_hard_window_behavior')
          h=load('ou3_sea3_hard_shaping_state')
          s=load('ou3_sea3_hard_finite_window_source')
          e=load('ou3_sea3_complete_window_executor')
          k=load('ou3_sea3_complete_window_execution_kernel')
          c=load('ou3_sea3_window_artifact_codec')
          r=load('ou3_sea3_response_regularity_moment')
          f=load('ou3_sea3_aw_covariance_floor')

          for d in (l,p,g,x,b,h,s,e,k,c,r,f):
              assert d['validation_pass'], d.get('validation_failures')

          assert l['machine_readable_R_lambda_closed'] is True
          assert l['actual_rate_bounded_R_lambda_subset_Rhat'] is True
          assert l['rate_constants_fitted_or_invented'] is False
          assert l['fixed_lambda_word_used'] is False

          # Phase propagation remains independently closed. This module does
          # not own the now-closed driver set, so its local legacy flag stays false.
          assert p['continuum_phase_coordinate_set_closed'] is True
          assert p['phase_continuous_propagation_closed'] is True
          assert p['finite_frequency_grid_used'] is False
          assert p['finite_direction_grid_used'] is False
          assert p['seeded_phase_realization_used'] is False
          assert p['phase_reset_on_lambda_transition_allowed'] is False

          # Canonical complete-SEA3 hard driver: one continuum field for the
          # full 601-sample translation+rotation history, never sample boxes.
          assert g['hard_spectral_driver_set_closed'] is True
          assert g['exact_fixed_history_correlated_oracle_formula_closed'] is True
          assert g['same_driver_field_entire_window'] is True
          assert g['same_driver_field_translation_and_rotation'] is True
          assert g['finite_frequency_grid_used'] is False
          assert g['finite_harmonic_source_used'] is False
          assert g['trajectory_replay_used'] is False
          assert g['independent_sample_boxes_used'] is False
          assert g['validated_complete_family_gram_enclosure_closed'] is False

          # The diagnostic point is an actual member of the same continuum
          # source by operator construction. Quadrature evaluates its continuum
          # integral but is not promoted to source modes.
          assert x['canonical_source'] == 'COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert x['source_membership']['membership_is_by_operator_construction_not_quadrature'] is True
          assert x['source_membership']['same_driver_field_entire_window'] is True
          assert x['source_membership']['same_driver_field_translation_and_rotation'] is True
          assert x['fixed_response_member']['inside_declared_continuum_RAO_family'] is True
          assert x['fixed_response_member']['finite_RAO_grid_used'] is False
          assert x['quadrature_diagnostic']['source_modes_are_quadrature_nodes'] is False
          assert len(x['source_core']) == 601
          assert x['front_end_entry_derived_from_same_history'] is False
          assert x['live_covariance_seed_derived_from_same_history'] is False
          assert x['complete_executor_artifact_materialized'] is False
          assert x['P4_promoted'] is False and x['P5_promoted'] is False

          assert b['behavior_set_symbol'] == 'B^601_SEA3'
          assert b['sampled_behavior_set_compact'] is True
          assert b['membership_requires_common_SEA3_witness'] is True
          assert b['normal_live_caps_are_membership_sufficient'] is False
          assert b['independent_sample_boxes_define_behavior_set'] is False
          assert b['validated_membership_or_separation_oracle_closed'] is False
          assert b['validated_correlated_outer_enclosure_closed'] is False

          assert h['SEA3_parameter_domain_compact'] is True
          assert h['hard_driver_certificate']['hard_spectral_driver_set_closed'] is True
          assert h['hard_driver_certificate']['same_driver_field_entire_window'] is True
          assert h['executable_ingredients'] == {
              'continuum_phase_coordinate_set_closed': True,
              'phase_continuous_propagation_closed': True,
              'hard_spectral_driver_set_closed': True,
              'complete_SEA3_left_inclusion_closed': False,
              'joint_source_output_map_closed': False,
          }
          assert h['hard_shaping_state_or_excitation_bound_closed'] is True
          assert h['conditional_SEA3_source_output_closed'] is False

          # Provider consumes the closed hard driver, but remains closed until
          # same-history joint physical output plus reachable entry/seed exist.
          assert s['hard_shaping_certificate']['hard_shaping_state_or_excitation_bound_closed'] is True
          assert s['executable_provider_ingredients'] == {
              'machine_readable_R_lambda_closed': True,
              'hard_shaping_state_or_excitation_bound_closed': True,
              'joint_translational_rotational_shaping_closed': False,
          }
          assert s['provider_implementation_closed'] is False
          assert s['source_reachable_event_family_materialized'] is False
          assert s['P3_promoted'] is False

          assert r['SEA3_parameter_domain_compact'] is True
          assert r['same_continuum_RAO_family_consumed'] is True
          assert r['hard_finite_window_source_materialized'] is False
          assert r['may_substitute_for_hard_window_IQC'] is False
          assert f['floor_request_is_source_event'] is True
          assert f['floor_increment_is_source_coordinate'] is False
          assert f['floor_increment_depends_on_current_mode_Riccati_covariance'] is True
          assert f['same_source_request_may_produce_different_H18_A21_increment'] is True
          assert k['typed_execution_kernel_ready'] is True
          assert k['raw_gyro_and_bias_corrected_rate_are_distinct_same_witness_coordinates'] is True
          assert k['covariance_floor_increment_computed_from_current_mode_P'] is True
          assert k['front_end_branch_splits_retained'] is True
          assert k['frontend_completed_before_async_mag'] is True
          assert c['strict_codec_ready'] is True
          assert c['requires_provider_acceptance_before_canonical_use'] is True
          assert c['establishes_source_reachability'] is False
          assert c['precomputed_aw_floor_increment_accepted'] is False
          assert e['only_canonical_SEA0_provider_artifact_accepted'] is True
          assert e['raw_sample_array_accepted'] is False
          assert e['independent_F_Q_schedule_accepted'] is False
          assert e['independent_RS_schedule_accepted'] is False
          assert e['arbitrary_P0_accepted'] is False
          assert e['strict_artifact_codec_ready'] is True
          assert e['typed_execution_kernel_ready'] is True
          assert e['gated_601_sample_execution_path_implemented'] is True
          assert e['gated_endpoint_full_matrix_LDLT_path_implemented'] is True
          assert e['SOURCE_REACHABLE_EVENT_FAMILY_MATERIALIZED'] is False
          assert e['FULL_H18_WORD_EXECUTED'] is False
          assert e['FULL_A21_WORD_EXECUTED'] is False
          assert e['FULL_H18_A21_LDLT_CLOSED'] is False
          assert e['execution_contract']['delta_lower_required'] == 1e-18
          assert e['P3_PROMOTED'] is False

          print('SEA3_DRIVER', g['next_obligation'])
          print('SEA3_FIXED_HISTORY', x['next_obligation'])
          print('SEA0_WINDOW_PROVIDER', s['next_obligation'])
          print('SEA3_WINDOW_EXECUTOR', e['next_obligation'])
          PY

      - name: Test anti-shortcut and provider contracts
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_sea3_continuum_phase_state \
            test_ou3_sea3_hard_window_behavior \
            test_ou3_sea3_hard_shaping_state \
            test_ou3_sea3_hard_finite_window_source \
            test_ou3_sea3_rlambda_transition \
            test_ou3_sea3_complete_window_executor \
            test_ou3_sea3_complete_window_execution_kernel \
            test_ou3_sea3_window_artifact_codec \
            test_ou3_sea3_response_regularity_moment \
            test_ou3_sea3_aw_covariance_floor

      - name: Upload boundary status
        uses: actions/upload-artifact@v6
        with:
          name: ou3-sea3-window-contract
          path: |
            /tmp/ou3_sea3_rlambda_transition.json
            /tmp/ou3_sea3_continuum_phase_state.json
            /tmp/ou3_sea3_continuum_driver_gram.json
            /tmp/ou3_sea3_fixed_history_source_core.json
            /tmp/ou3_sea3_hard_window_behavior.json
            /tmp/ou3_sea3_hard_shaping_state.json
            /tmp/ou3_sea3_hard_finite_window_source.json
            /tmp/ou3_sea3_complete_window_executor.json
            /tmp/ou3_sea3_complete_window_execution_kernel.json
            /tmp/ou3_sea3_window_artifact_codec.json
            /tmp/ou3_sea3_response_regularity_moment.json
            /tmp/ou3_sea3_aw_covariance_floor.json
          retention-days: 7
