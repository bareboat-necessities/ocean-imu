name: Generate noise-free mismatch ablation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/model-mismatch-noise-free-ablation'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/model-mismatch-noise-free-ablation
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            g++ make libeigen3-dev python3-numpy

      - name: Download versioned simulation records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.1.3 \
            --repo bareboat-necessities/oceanography-waves-lib \
            --pattern sim-data-files.zip --clobber
          mkdir -p /tmp/model-mismatch-data
          unzip -o sim-data-files.zip -d /tmp/model-mismatch-data >/dev/null

      - name: Build study and unit test
        run: |
          python3 -m py_compile tools/model_mismatch_ablation.py \
            tests/validation/test_model_mismatch_ablation.py
          (cd tests/validation && python3 -m unittest -v test_model_mismatch_ablation.py)
          make -C tests/kalman_ou_ii kalman_ou_ii-sim
          make -C tests/kalman_ou_iii kalman_ou_iii-sim
          make -C tests/kalman_tfg kalman_tfg-sim

      - name: Run 24 noise-free replays
        run: |
          python3 -u tools/model_mismatch_ablation.py \
            --data-dir /tmp/model-mismatch-data \
            --output-dir reports/results/model_mismatch_ablation \
            --window-sec 900 \
            --jobs 3
          cat reports/results/model_mismatch_ablation/model_mismatch_report.md

      - name: Commit generated evidence to feature branch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            reports/results/model_mismatch_ablation/model_mismatch_runs.csv \
            reports/results/model_mismatch_ablation/model_mismatch_summary.csv \
            reports/results/model_mismatch_ablation/model_mismatch_report.md \
            reports/results/model_mismatch_ablation/manifest.json
          git diff --cached --check
          git commit -m "Record noise-free model-mismatch ablation results"
          git push origin HEAD:refs/heads/agent/model-mismatch-noise-free-ablation
