name: update-stability-methodology-guard

on:
  push:
    branches:
      - agent/psd-aw-covariance-inflation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/psd-aw-covariance-inflation
      - name: Update stale manuscript guard and remove helper workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/validation/test_ou_validation.py')
          text = p.read_text()
          old = '''        # The ISS appendix is a conditional local result and has to be\n        # described that way where it is claimed as a contribution.\n        self.assertIn("conditional sufficient-condition", intro)\n        self.assertIn("not an unconditional EKF convergence claim", intro)\n'''
          new = '''        # The stability appendix now closes UES only for the reduced Live\n        # performance state under explicit conditions.  The introduction must\n        # state that stronger result without broadening it to the unrestricted\n        # 21-state estimator or to the optional legacy covariance replacement.\n        self.assertIn("18-state Live performance filter", intro)\n        self.assertIn("not an ISS or convergence proof of the unrestricted 21-state estimator", intro)\n        self.assertIn("UES is not proved for that legacy mode", intro)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale stability guard, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/temp-fix-stability-guard.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/validation/test_ou_validation.py
          git commit -m "Update stability manuscript guard"
          git push origin HEAD:agent/psd-aw-covariance-inflation
