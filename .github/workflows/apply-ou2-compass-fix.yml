name: apply-ou2-compass-fix
on:
  push:
    branches: [fix/immediate-device-magnetic-heading]
    paths: [.github/workflows/apply-ou2-compass-fix.yml]
permissions:
  contents: write
jobs:
  apply-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      patch_sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Extend the existing regression to OU2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/validation/test_device_compass_startup.py')
          s = p.read_text()
          old = '    "atomS3R_ins_kalman_ou3", "atomS3R_ins_tfg",'
          assert s.count(old) == 1
          s = s.replace(old, '    "atomS3R_ins_kalman_ou2", "atomS3R_ins_kalman_ou3", "atomS3R_ins_tfg",')
          old = 'if "kalman_ou3" in path.name:'
          assert s.count(old) == 1
          s = s.replace(old, 'if "kalman_ou" in path.name:')
          p.write_text(s)
          PY
      - name: Reproduce the missing OU2 startup output
        shell: bash
        run: |
          set +e
          python3 tests/validation/test_device_compass_startup.py DeviceCompassStartupTest.test_startup_compass_then_fused_live_output -v > /tmp/ou2-before.log 2>&1
          rc=$?
          set -e
          cat /tmp/ou2-before.log
          test "$rc" -ne 0
          grep -q 'Missing definition: updateCompassHeading_' /tmp/ou2-before.log
      - name: Port only the reviewed OU3 compass output changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import runpy
          function = runpy.run_path('tests/validation/test_device_compass_startup.py')['function']
          root = Path('sensors/full_marine_ins')
          p = root / 'atomS3R_ins_kalman_ou2/atomS3R_ins_kalman_ou2.ino'
          reference = (root / 'atomS3R_ins_kalman_ou3/atomS3R_ins_kalman_ou3.ino').read_text()
          original = p.read_text()
          s = original
          def replace(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          replace('    - filter yaw is the primary heading output after north-lock\n    - tilt-compensated magnetic heading is kept only for diagnostics',
                  '    - measured magnetic heading is available from the first valid IMU/mag sample\n    - startup tilt comes from the private proxy, then from the live filter\n    - startup compass does not wait for INS; fused filter yaw takes over once Live')
          replace(function(s, 'magneticHeadingFromDownAndMagBody_'),
                  function(reference, 'magneticHeadingFromDownAndMagBody_'))
          replace('  float heading_deg_      = 0.0f;', '  float heading_deg_      = NAN;')
          replace('  bool  heading_valid_    = false;', '  bool  heading_valid_    = false;\n  bool  heading_fused_    = false;')
          replace('    heading_deg_   = 0.0f;\n    heading_valid_ = false;',
                  '    heading_deg_   = NAN;\n    heading_valid_ = false;\n    heading_fused_ = false;')
          comment = '  // Before INS readiness, report the measured compass using startup tilt.\n  // Once the magnetically informed filter is Live, publish its fused yaw.\n'
          replace('  void updateFilter_(const ImuSample& s) {',
                  comment + function(reference, 'updateCompassHeading_') + '\n\n  void updateFilter_(const ImuSample& s) {')
          start = s.index('    heading_valid_ = fusion_.hasMagNorthLock();')
          end = s.index('    gyro_bias_learning_ = still;', start)
          new_start = reference.index('    // The core is held during bootstrap.')
          new_end = reference.index('    gyro_bias_learning_ = still;', new_start)
          s = s[:start] + reference[new_start:new_end] + s[end:]
          replace('    const bool valid = fusion_.isLive() && heading_valid_;',
                  '    const bool valid = fusion_.isLive() && heading_fused_;')
          replace('"hdg_filt=%s%.2f | hdg_mag=', '"hdg=%s%.2f | hdg_mag=')
          # The boot wizard and all sensor/calibration code must remain literal.
          for name in ['begin', 'tick', 'reloadBlobAndRuntime_', 'runWizardFlow_', 'reinitImu_']:
              assert function(original, name) == function(s, name), name
          assert 'runWizardFlow_(true)' in function(s, 'begin')
          assert 'if (!have_blob_)' in function(s, 'begin')
          assert 'SeaStateFusion_OU_II<TrackerType::KALMANF>' in s
          p.write_text(s)
          PY
          git diff --check
          git diff --stat
      - name: Install host dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev
      - name: Test all three actual sketch compass output paths
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/test_device_compass_startup.py -v 2>&1 | tee /tmp/ou2-after.log
      - name: Publish the tested patch and remove this temporary workflow
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-ou2-compass-fix.yml
          git add sensors/full_marine_ins/atomS3R_ins_kalman_ou2/atomS3R_ins_kalman_ou2.ino tests/validation/test_device_compass_startup.py
          git diff --cached --check
          git diff --cached -- . ':!.github/workflows/apply-ou2-compass-fix.yml' > /tmp/ou2-compass.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Report OU2 startup magnetic heading and retain fused Live output'
          git push origin HEAD:refs/heads/fix/immediate-device-magnetic-heading
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Retain before and after results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou2-compass-regressions
          path: |
            /tmp/ou2-before.log
            /tmp/ou2-after.log
            /tmp/ou2-compass.patch
          if-no-files-found: warn
  arduino-ou2:
    needs: apply-test-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.apply-test-publish.outputs.patch_sha }}
      - name: Compile the actual OU2 AtomS3 sketch with the pinned deployment toolchain
        uses: ArminJo/arduino-test-compile@v3
        with:
          arduino-board-fqbn: esp32:esp32:m5stack_atoms3:CDCOnBoot=cdc,USBMode=hwcdc
          arduino-platform: esp32:esp32@3.3.7
          platform-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          required-libraries: M5Unified@0.2.13,M5GFX@0.2.19,Eigen@0.3.2
          sketch-names: '*.ino'
          sketch-names-find-start: sensors/full_marine_ins/atomS3R_ins_kalman_ou2
          build-properties: >-
            { "All": "-funroll-loops -fno-finite-math-only" }
          extra-arduino-cli-args: >-
            --warnings default
            --library ${{ github.workspace }}
          set-build-path: true
  primary-validation:
    needs: apply-test-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.apply-test-publish.outputs.patch_sha }}
      - name: Install host dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev
      - name: Repository primary validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make all
