name: ou3-alt-startup-reachability-diagnostic
on:
  push:
    branches: [codex/ou3-alt-quaternion-shell]
    paths:
      - tests/ou3_alt_contraction/startup_antialigned_docking.cpp
      - .github/workflows/ou3-alt-shell-workspace.yml
permissions:
  contents: read
jobs:
  docking:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y g++ libeigen3-dev
      - name: Compile physical docking diagnostic
        run: g++ -std=c++20 -O1 -ffp-contract=off -fno-fast-math -DEIGEN_DONT_VECTORIZE -I/usr/include/eigen3 -Isrc tests/ou3_alt_contraction/startup_antialigned_docking.cpp -o /tmp/docking
      - name: Extend same continuous source to one million updates
        run: /tmp/docking - 1000000 | tee /tmp/docking-million.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ou3-alt-docking-million
          path: /tmp/docking-million.txt
          retention-days: 2
