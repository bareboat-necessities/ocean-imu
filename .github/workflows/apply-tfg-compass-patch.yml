name: Apply TFG startup compass patch
on:
  push:
    branches: [fix/tfg-startup-compass]
    paths: [.github/workflows/apply-tfg-compass-patch.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/tfg-startup-compass
          fetch-depth: 0
      - name: Recover the reviewed patch and test from the preparation commit
        shell: bash
        run: |
          git show af790a94ee199e9aa25c8a83aaf0d42814a0b0b2:.github/workflows/apply-tfg-compass-patch.yml > /tmp/tfg-preparation.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/tfg-preparation.yml').read_text()
          for name, marker in [('tfg-startup-compass.patch', 'PATCH'), ('tfg-compass-smoke.cpp', 'CPP')]:
              start = "cat > /tmp/" + name + " <<'" + marker + "'\n"
              body = text.split(start, 1)[1].split('\n          ' + marker, 1)[0]
              lines = body.splitlines()
              assert all(line.startswith('          ') for line in lines)
              Path('/tmp/' + name).write_text('\n'.join(line[10:] for line in lines) + '\n')
          PY
      - name: Apply the reviewed two-file patch
        shell: bash
        run: |
          git apply --unidiff-zero --check /tmp/tfg-startup-compass.patch
          git apply --unidiff-zero /tmp/tfg-startup-compass.patch
          git diff --check
          git diff --stat
          git diff > /tmp/tfg-startup-compass-applied.patch
      - name: Compile and run startup compass regression
        shell: bash
        run: |
          if [[ ! -f third_party/eigen/Eigen/Dense && ! -f /usr/include/eigen3/Eigen/Dense ]]; then
            sudo apt-get update
            sudo apt-get install -y libeigen3-dev
          fi
          g++ -O1 -std=c++20 -I src -isystem third_party/eigen -isystem /usr/include/eigen3 /tmp/tfg-compass-smoke.cpp -o /tmp/tfg-compass-smoke
          /tmp/tfg-compass-smoke
          make -C tests/kalman_tfg tfg_orchestrator-test
          tests/kalman_tfg/tfg_orchestrator-test
      - name: Publish only the requested patch files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kalman_tfg/SeaStateFusionFilter_TFG.h sensors/full_marine_ins/atomS3R_ins_tfg/atomS3R_ins_tfg.ino
          git commit -m 'Fix frozen TFG startup compass heading'
          git push origin HEAD:fix/tfg-startup-compass
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: tfg-startup-compass-applied-patch
          path: /tmp/tfg-startup-compass-applied.patch
      - name: Run repository validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make all
