name: phase2-horizon-probe

on:
  pull_request:
    paths:
      - ".github/workflows/phase2-horizon-probe.yml"
      - "tests/kalman_ou_iii/live_basin_diagnostic.cpp"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Eigen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev
      - name: Probe lifted horizons
        shell: bash
        run: |
          set -euo pipefail
          src=tests/kalman_ou_iii/live_basin_diagnostic.cpp
          for h in 60 120 300 600; do
            echo "===== HORIZON ${h}s ====="
            sed \
              -e "s/constexpr int H = 30 \* 200;/constexpr int H = ${h} * 200;/" \
              -e "s/1.0 \/ 30.0/1.0 \/ ${h}.0/" \
              -e 's/prefix = std::max(prefix, norm2(Psi));/if ((k % 200) == 0) prefix = std::max(prefix, norm2(Psi));/' \
              "$src" > /tmp/live_basin_${h}.cpp
            g++ -O3 -std=c++20 -Wall -Wextra -Wshadow -Wconversion \
              -funroll-loops -fno-finite-math-only -march=native \
              -I./src -isystem /usr/include/eigen3 \
              /tmp/live_basin_${h}.cpp -o /tmp/live_basin_${h}
            /tmp/live_basin_${h} || true
          done
