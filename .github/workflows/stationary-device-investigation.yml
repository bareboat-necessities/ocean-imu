name: stationary-device investigation
on:
  push:
    branches: [fix/stationary-heave-ripple-heading]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stationary-device-investigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - name: Capture source and compiler headers for offline reproduction
        run: |
          mkdir -p stationary-investigation
          git rev-parse HEAD > stationary-investigation/source-sha.txt
          git archive HEAD | gzip > stationary-investigation/source.tar.gz
          tar -czf stationary-investigation/eigen3.tar.gz -C /usr/include eigen3
          g++ --version > stationary-investigation/compiler.txt
      - name: Baseline handoff regression
        run: |
          set -o pipefail
          g++ -std=c++17 -O2 -I src -I /usr/include/eigen3 tests/kalman_tfg/tfg_handoff_heave-test.cpp -o /tmp/tfg_handoff_heave-test
          /tmp/tfg_handoff_heave-test | tee stationary-investigation/handoff-baseline.log
      - name: Retain reproducible investigation inputs and results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stationary-device-investigation
          path: stationary-investigation/
          if-no-files-found: error
