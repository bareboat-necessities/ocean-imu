name: stationary-device investigation
on:
  push:
    branches: [fix/stationary-heave-ripple-heading]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stationary-device-investigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    if: github.repository == 'bareboat-necessities/ocean-imu' && github.ref == 'refs/heads/fix/stationary-heave-ripple-heading'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8
      - name: Apply integrity-checked reviewed source patch to this PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stationary-results
          gh api repos/bareboat-necessities/ocean-imu/git/blobs/8983574eb3a5812c32024d84c554ea302c5bf5bb --jq .content | base64 -d | gzip -d > /tmp/stationary.patch
          echo 'fe929939795ef78b145480eca2868542236e5ebaa06d3faa26a69b6140f4612f  /tmp/stationary.patch' | sha256sum -c -
          git apply --check /tmp/stationary.patch
          git apply --index /tmp/stationary.patch
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reduce device heave correction teeth and keep TFG startup anchored to magnetic north'
          git push origin HEAD:refs/heads/fix/stationary-heave-ripple-heading
          git rev-parse HEAD | tee /tmp/stationary-results/source-sha.txt
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - name: Run all three stationary and rest-wave-rest replays
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for family in kalman_ou_ii kalman_ou_iii kalman_tfg; do
            if g++ -std=c++20 -O2 -I src -I /usr/include/eigen3 tests/$family/stationary_device-test.cpp -o /tmp/$family-stationary > /tmp/stationary-results/$family-build.log 2>&1; then
              /tmp/$family-stationary 2>&1 | tee /tmp/stationary-results/$family.log || status=1
            else
              cat /tmp/stationary-results/$family-build.log
              status=1
            fi
          done
          python3 -m unittest discover -s tests/validation -p test_stationary_device_contract.py -v 2>&1 | tee /tmp/stationary-results/sketch-contract.log || status=1
          exit "$status"
      - name: Existing TFG turning, acquisition and orchestrator regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -I src -I /usr/include/eigen3 tests/kalman_tfg/tfg_orchestrator-test.cpp -o /tmp/tfg-orchestrator > /tmp/stationary-results/tfg-orchestrator-build.log 2>&1
          /tmp/tfg-orchestrator 2>&1 | tee /tmp/stationary-results/tfg-orchestrator.log
      - name: Prove the stationary heading regression fails before the fix
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/before/kalman_tfg
          git show 934d11bf0cc880d917e112adc67a59080ed73b21:src/kalman_tfg/SeaStateFusionFilter_TFG.h > /tmp/before/kalman_tfg/SeaStateFusionFilter_TFG.h
          g++ -std=c++20 -O2 -I /tmp/before -I src -I /usr/include/eigen3 tests/kalman_tfg/stationary_device-test.cpp -o /tmp/tfg-before > /tmp/stationary-results/tfg-before-build.log 2>&1
          set +e
          /tmp/tfg-before > /tmp/stationary-results/tfg-before.log 2>&1
          rc=$?
          set -e
          cat /tmp/stationary-results/tfg-before.log
          test "$rc" -eq 1
          grep -q 'FAIL: TFG stationary handoff lost magnetic north' /tmp/stationary-results/tfg-before.log
      - name: Preserve numerical results and exact source identity
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stationary-device-regression-results
          path: /tmp/stationary-results/
          if-no-files-found: error
