name: ou3-p4-h18-prefix-ldlt-diagnostic

on:
  pull_request:
    paths:
      - "tools/stability/ou3_p4_h18_prefix_ldlt_diagnostic.py"
      - "tools/stability/ou3_p4_h18_source_indexed_prefix_transport.py"
      - "tools/stability/ou3_p4_structural_prefix_transport.py"
      - "tests/validation/test_ou3_p4_h18_prefix_ldlt_diagnostic.py"
      - ".github/workflows/ou3-p4-h18-prefix-ldlt-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-h18-prefix-ldlt-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Actual H18 every-prefix augmented LDLT diagnostic
        run: |
          set -euo pipefail
          mkdir -p /tmp/ou3-h18-prefix-ldlt
          python3 tools/stability/ou3_p4_h18_prefix_ldlt_diagnostic.py --output /tmp/ou3-h18-prefix-ldlt/diagnostic.json
          python3 -m unittest discover -s tests/validation -p 'test_ou3_p4_h18_prefix_ldlt_diagnostic.py' -v
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3-h18-prefix-ldlt/diagnostic.json'))
          assert d['validation_pass'],d['validation_failures']
          assert d['actual_synchronized_H18_prefix_transport_consumed']
          assert d['actual_event_covariance_information_matrices_consumed']
          assert d['one_conservative_independent_source_column_used_for_diagnostic']
          assert not d['production_endpoint_LDLT_promoted_here']
          assert not d['P4_PASS'] and not d['P5_MAY_START']
          print('H18_PREFIX_DIAGNOSTIC_ALL_CLOSE',d['diagnostic_all_prefixes_close'])
          print('H18_PREFIX_DIAGNOSTIC_FIRST_FAILED',d['first_failed_prefix'])
          for r in d['prefixes']:
              print('PREFIX',r['prefix'],r['kind'],'closed=',r['ldlt_closes_with_scalar_source_supply'],'gamma=',r['first_gamma'],'Ddiag=',r['D_diagonal_lower_min'])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ou3-p4-h18-prefix-ldlt-diagnostic
          path: /tmp/ou3-h18-prefix-ldlt/
          retention-days: 7
