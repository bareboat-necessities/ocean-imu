name: Import verified ALT observability changes
on:
  push:
    branches: ['proof/alt-observability-superwords']
    paths: ['.github/workflows/ou3-alt-observability-transfer.yml']
permissions:
  contents: read
concurrency:
  group: alt-observability-import
  cancel-in-progress: false
jobs:
  import-proof-only:
    name: Import verified ALT observability changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: proof/alt-observability-superwords
          persist-credentials: true
          fetch-depth: 0
      - name: Verify all predecessor and successor hashes before writing
        env:
          EXPECTED_REF: refs/heads/proof/alt-observability-superwords
        run: |
          test "$GITHUB_REF" = "$EXPECTED_REF"
          git merge-base --is-ancestor 584b21309d376219a8ecbb9721eba4fe9380234f HEAD
          python3 - <<'PY'
          import hashlib,json,lzma,pathlib,subprocess
          compressed=b''.join(pathlib.Path(p).read_bytes() for p in ['.proof-transfer/alt-observability.xz.0', '.proof-transfer/alt-observability.xz.1', '.proof-transfer/alt-observability.xz.2', '.proof-transfer/alt-observability.xz.3'])
          assert hashlib.sha256(compressed).hexdigest()=='4dd314ace8cf5e0c0916a73659f83aaccdda6b03e5f03c4adbfe74a0b8cfa18c'
          raw=lzma.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest()=='09654d5ac087809e4a79627c121566731f58429f7b5ae691a16d1b05bdd9e453'
          edits=json.loads(raw)
          allowed={'docs/ou3-proof-research-state.md', 'docs/ou3-alt-contraction-handover.md', 'tools/stability/ou3_alt_contraction/finite_master_guard.py', 'tests/ou3_alt_contraction/test_observability_rho_diagnostic.py', 'tests/ou3_alt_contraction/test_observability_formulation.py', 'docs/ou3-alt-contraction.md', 'docs/ou3-alt-word-rho-feasibility.md', 'tests/ou3_alt_contraction/observability_word.cpp', 'docs/ou3-alt-main-handover.md', 'tools/stability/ou3_alt_contraction/observability_formulation.py', 'tools/stability/ou3_alt_contraction/observability_rho_diagnostic.py', 'reports/ou3-alt-observability-feasibility.json', 'tools/stability/ou3_alt_contraction/proof_plan.py', '.github/workflows/ou3-alt-contraction.yml', 'tests/ou3_alt_contraction/test_finite_master_guard.py', 'docs/ou3-alt-proof-plan.md', 'docs/ou3-alt-observability-formulation.md'}
          assert len(edits)==len(allowed) and {e['path'] for e in edits}==allowed
          outputs=[]
          for e in edits:
              p=pathlib.Path(e['path'])
              assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
              if e['old'] is None:
                  assert not p.exists(),str(p)
                  old=b''
              else:
                  old=p.read_bytes()
                  assert hashlib.sha256(old).hexdigest()==e['old'],str(p)
              lines=old.decode().splitlines(keepends=True)
              previous=len(lines)+1
              for start,end,text in reversed(e['ops']):
                  assert 0<=start<=end<=len(lines) and end<=previous,str(p)
                  lines[start:end]=text.splitlines(keepends=True)
                  previous=start
              new=''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest()==e['new'],str(p)
              # Stage the CI workflow as ordinary text; only the connector
              # installs it, so this job does not need workflow-write access.
              target=pathlib.Path('.proof-transfer/alt-observability-final-workflow.txt') if e['path']=='.github/workflows/ou3-alt-contraction.yml' else p
              if target!=p:
                  assert not target.exists()
              outputs.append((target,new))
          for p,data in outputs:
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data)
          subprocess.run(['git','add','--']+[str(p) for p,_ in outputs],check=True)
          PY
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- src .github)"
          python3 -m compileall -q tools/stability/ou3_alt_contraction/observability_formulation.py tools/stability/ou3_alt_contraction/observability_rho_diagnostic.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Select ALT quotient and informative superwords; measure native storage ratios'
          git push origin HEAD:proof/alt-observability-superwords
