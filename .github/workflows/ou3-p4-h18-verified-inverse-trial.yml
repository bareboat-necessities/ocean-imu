name: ou3-p4-h18-verified-inverse-trial

on:
  push:
    paths:
      - "tools/ou3_verified_spd_inverse.py"
      - "tools/ou3_p4_h18_verified_inverse_trial.py"
      - "tools/ou3_p4_h18_correction_subdivision.py"
      - "tools/ou3_p4_h18_differential_operations.py"
      - "tools/ou3_p4_source_node_cells.py"
      - ".github/workflows/ou3-p4-h18-verified-inverse-trial.yml"
  pull_request:
    paths:
      - "tools/ou3_verified_spd_inverse.py"
      - "tools/ou3_p4_h18_verified_inverse_trial.py"
      - "tools/ou3_p4_h18_correction_subdivision.py"
      - "tools/ou3_p4_h18_differential_operations.py"
      - "tools/ou3_p4_source_node_cells.py"
      - ".github/workflows/ou3-p4-h18-verified-inverse-trial.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-h18-verified-inverse-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trial:
    name: H18 verified innovation inverse trial
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Compile trial
        run: |
          python3 -m py_compile \
            tools/ou3_verified_spd_inverse.py \
            tools/ou3_p4_h18_verified_inverse_trial.py
      - name: Run exact-node full-word trial
        run: |
          python3 tools/ou3_p4_h18_verified_inverse_trial.py \
            --source-node-index 0 \
            --output /tmp/ou3_p4_h18_verified_inverse_trial.json
      - name: Enforce diagnostic scope
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/ou3_p4_h18_verified_inverse_trial.json').read_text())
          assert d['validation_pass'], d['validation_failures']
          assert d['outer_angle_rad'] == 0.80
          assert d['source_node_index'] == 0
          assert d['full_word_samples'] == 202
          assert d['verified_inverse_attempt_count'] > 0
          assert d['filter_changed'] is False
          assert d['declared_domain_changed'] is False
          assert d['P4_USABLE_CERTIFICATE_PROMOTED'] is False
          print('attempts/accepted/rejected:', d['verified_inverse_attempt_count'], d['verified_inverse_accept_count'], d['verified_inverse_reject_count'])
          print('completed:', d['word_completed_without_correction_range_failure'])
          print('first failure:', d['first_failure'])
          print('maximum correction:', d['maximum_correction'])
          print('last rejection:', d['verified_inverse_rejections'][-1] if d['verified_inverse_rejections'] else None)
          print('next:', d['next_obligation'])
          PY
