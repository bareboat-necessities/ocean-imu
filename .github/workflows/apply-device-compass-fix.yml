name: apply-device-compass-fix

on:
  push:
    branches: [fix/immediate-device-magnetic-heading]
    paths: [.github/workflows/apply-device-compass-fix.yml]

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/immediate-device-magnetic-heading
      - name: Apply targeted compass output changes
        shell: python
        run: |
          from pathlib import Path
          def replace_once(s, old, new):
              assert s.count(old) == 1, (old[:120], s.count(old))
              return s.replace(old, new, 1)
          method = '''  // A measured compass is independent of north-reference learning and INS
          // readiness. The attitude supplies tilt only; its yaw cancels out.
          void updateCompassHeading_(const Eigen::Quaternionf& q_bw, bool attitude_ok) {
            heading_mag_ok_ = false;
            heading_mag_deg_ = NAN;
            if (mag_ok_ && attitude_ok) {
              const Vector3f down_b = quatRotate_(q_bw.conjugate(), Vector3f::UnitZ());
              heading_mag_ok_ = magneticHeadingFromDownAndMagBody_(
                  down_b, m_cal_, heading_mag_deg_);
            }
            heading_valid_ = heading_mag_ok_;
            heading_deg_ = heading_valid_ ? heading_mag_deg_ : NAN;
          }

          '''
          for name in ('atomS3R_ins_tfg', 'atomS3R_ins_kalman_ou3'):
              p = Path('sensors/full_marine_ins') / name / (name + '.ino')
              s = p.read_text()
              # Do not block first use in an interactive calibration wizard.
              # Saved NVS calibration is loaded as before; tap still opens it.
              start = s.index('#if SEA_STATE_ENABLE_WIZARD\n    if (!have_blob_)')
              stop = s.index('#endif', start) + len('#endif')
              s = s[:start] + '''    if (!have_blob_) {
                Serial.println("[BOOT] No saved calibration: magnetic heading is UNCALIBRATED.");
          #if SEA_STATE_ENABLE_WIZARD
                Serial.println("[BOOT] Tap to calibrate; compass startup is not blocked.");
          #endif
              }''' + s[stop:]
              # Reject invalid geometry rather than accidentally publishing zero/NaN as valid.
              s = replace_once(s, '  const Vector3f FWD_B(1.0f, 0.0f, 0.0f);', '''  heading_deg_out = NAN;
            if (!down_b_unit.allFinite() || !mag_b_uT.allFinite()) return false;
            const Vector3f FWD_B(1.0f, 0.0f, 0.0f);''')
              for norm in ('dn', 'mn', 'en', 'nn'):
                  s = replace_once(s, f'  if ({norm} < 1e-6f) return false;',
                                   f'  if (!std::isfinite({norm}) || !({norm} > 1e-6f)) return false;')
              s = replace_once(s, '''  heading_deg_out = wrap360_(atan2f(e, n) * RAD_TO_DEG);
            return true;''', '''  if (!(std::hypot(e, n) > 1e-6f)) return false;
            heading_deg_out = wrap360_(atan2f(e, n) * RAD_TO_DEG);
            return std::isfinite(heading_deg_out);''')
              s = replace_once(s, '  void updateFilter_(const ImuSample& s) {',
                               method + '  void updateFilter_(const ImuSample& s) {')
              update_start = s.index('  void updateFilter_(const ImuSample& s) {')
              if name == 'atomS3R_ins_tfg':
                  s = replace_once(s, '''    - startup compass uses private-proxy tilt plus calibrated magnetic heading
              - filter yaw takes over only after Live and core magnetic-reference setup
              - tilt-compensated magnetic heading remains available for diagnostics''', '''    - measured magnetic heading is available from the first valid IMU/mag sample
              - startup tilt comes from the private proxy, then from the live filter
              - compass output never waits for wave startup or switches to filter yaw''')
                  s = s.replace('  bool  heading_fused_    = false;\n', '')
                  s = s.replace('    heading_fused_ = false;\n', '')
                  update_start = s.index('  void updateFilter_(const ImuSample& s) {')
                  start = s.index('    heading_mag_ok_ = false;', update_start)
                  stop = s.index('    gyro_bias_learning_ = still;', start)
                  s = s[:start] + '    updateCompassHeading_(q_bw, attitude_ok);\n\n' + s[stop:]
                  s = replace_once(s, '    const bool valid = fusion_.isLive() && heading_fused_;',
                                   '''    const bool valid = fusion_.isLive() && heading_valid_ &&
                fusion_.mekf().has_magnetic_reference();''')
              else:
                  s = replace_once(s, '''    - filter yaw is the primary heading output after north-lock
              - tilt-compensated magnetic heading is kept only for diagnostics''', '''    - measured magnetic heading is available from the first valid IMU/mag sample
              - startup tilt comes from the private proxy, then from the live filter
              - compass output never waits for wave startup or switches to filter yaw''')
                  start = s.index('    heading_valid_ = fusion_.hasMagNorthLock();', update_start)
                  stop = s.index('    gyro_bias_learning_ = still;', start)
                  s = s[:start] + '''    // The core is held during bootstrap. Read the active attitude owner,
              // which is seeded from the first sample, not the inactive identity.
              Eigen::Quaternionf q_bw = fusion_.attitudeQuat();
              const bool have_attitude = fusion_.isLive() ||
                  fusion_.raw().startupProxyInitialized();
              float roll_est_deg = roll_deg_;
              float pitch_est_deg = pitch_deg_;
              float heading_est_deg = heading_deg_;
              const bool attitude_ok = have_attitude &&
                  rollPitchHeadingFromQuatBw_(q_bw, roll_est_deg, pitch_est_deg, heading_est_deg);
              if (attitude_ok) {
                q_bw.normalize();
                roll_deg_ = roll_est_deg;
                pitch_deg_ = pitch_est_deg;
              }
              updateCompassHeading_(q_bw, attitude_ok);

          ''' + s[stop:]
                  s = replace_once(s, '    const bool valid = fusion_.isLive() && heading_valid_;',
                                   '''    const bool valid = fusion_.isLive() && heading_valid_ &&
                fusion_.hasMagNorthLock();''')
              s = s.replace('float heading_deg_      = 0.0f;', 'float heading_deg_      = NAN;')
              s = s.replace('heading_deg_   = 0.0f;', 'heading_deg_   = NAN;')
              s = s.replace('hdg_filt=%s%.2f', 'hdg=%s%.2f')
              p.write_text(s)
      - name: Install host dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev python3-numpy python3-scipy python3-matplotlib python3-pandas
      - name: Verify first-sample output and invalid-input regressions
        run: python3 tests/validation/test_device_compass_startup.py -v
      - name: Publish tested patch and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/apply-device-compass-fix.yml
          git add sensors/full_marine_ins/atomS3R_ins_tfg/atomS3R_ins_tfg.ino sensors/full_marine_ins/atomS3R_ins_kalman_ou3/atomS3R_ins_kalman_ou3.ino
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Report measured magnetic heading immediately in both device sketches'
          git push origin HEAD:fix/immediate-device-magnetic-heading
          git show --stat --oneline HEAD
      - name: Repository primary validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make all
