name: Temporary OU-III cadence compensation patch

on:
  push:
    branches:
      - agent/ou3-tau-scaled-pseudo-cadence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ou3-tau-scaled-pseudo-cadence
          fetch-depth: 0

      - name: Apply compensation patch
        run: python3 .github/tmp-ou3-patch.py

      - name: Commit intended changes and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/tmp-ou3-patch.py \
                 .github/tmp-ou3-cadence-trigger \
                 .github/workflows/tmp-ou3-cadence-compensation.yml
          git add src/kalman_ou_iii/SeaStateFusionFilter_OU_III.h \
                  tests/kalman_ou_iii/tuner_schedule-test.cpp
          git commit -m "Compensate OU-III pseudo information rate"
          git push origin HEAD:agent/ou3-tau-scaled-pseudo-cadence
