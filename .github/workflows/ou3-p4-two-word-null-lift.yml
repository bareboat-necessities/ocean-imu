name: ou3-p4-two-word-null-lift

on:
  push:
    paths:
      - "tools/ou3_interval_ad.py"
      - "tools/ou3_p4_h18_differential_operations.py"
      - "tools/ou3_p4_two_word_packet_null_lift.py"
      - "tools/ou3_p4_directional_packet_rank.py"
      - "tools/ou3_implementation_word_language.py"
      - "tools/ou3_translational_uco_ucc.py"
      - "tools/ou3_source_domain_contract.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_interval_ad.py"
      - "tests/validation/test_ou3_p4_two_word_packet_null_lift.py"
      - ".github/workflows/ou3-p4-two-word-null-lift.yml"
  pull_request:
    paths:
      - "tools/ou3_interval_ad.py"
      - "tools/ou3_p4_h18_differential_operations.py"
      - "tools/ou3_p4_two_word_packet_null_lift.py"
      - "tools/ou3_p4_directional_packet_rank.py"
      - "tools/ou3_implementation_word_language.py"
      - "tools/ou3_translational_uco_ucc.py"
      - "tools/ou3_source_domain_contract.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_interval_ad.py"
      - "tests/validation/test_ou3_p4_two_word_packet_null_lift.py"
      - ".github/workflows/ou3-p4-two-word-null-lift.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p4-two-word-null-lift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  null-lift:
    name: H18 two-word packet-null structural lift
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Compile shared AD and null-lift producer
        run: |
          python3 -m py_compile \
            tools/ou3_interval_ad.py \
            tools/ou3_p4_h18_differential_operations.py \
            tools/ou3_p4_two_word_packet_null_lift.py \
            tests/validation/test_ou3_interval_ad.py \
            tests/validation/test_ou3_p4_two_word_packet_null_lift.py

      - name: Run shared AD and null-lift tests
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_interval_ad \
            test_ou3_p4_two_word_packet_null_lift

      - name: Emit source-uniform two-word null lift
        run: |
          python3 tools/ou3_p4_two_word_packet_null_lift.py \
            --output /tmp/ou3_p4_two_word_packet_null_lift.json

      - name: Enforce structural lift and fail-closed metric scope
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(Path('/tmp/ou3_p4_two_word_packet_null_lift.json').read_text())
          assert d['validation_pass'], d['validation_failures']
          assert d['packet_rank_exact'] == 5
          assert d['packet_H_active_nullity'] == 1
          assert d['packet_null_aw_per_theta_norm_lower_mps2_per_rad'] > 0.0
          assert d['aw_survival_factor_to_following_word_lower'] > 0.0
          assert d['following_word_aw_per_theta_norm_lower'] > 0.0
          assert d['following_word_four_S_information_gramian_lambda_min_lower'] > 0.0
          assert d['packet_null_following_word_raw_information_per_theta2_lower'] > 0.0
          assert d['packet_null_following_word_raw_information_bound_formula'] == 'lambda_min(G_S)*(a_w_next/theta)^2'
          assert d['following_word_four_S_firing_count'] == 4
          assert d['two_word_packet_null_is_structurally_observed'] is True
          assert d['shared_H18_differential_operations_used'] is True
          assert d['raw_coordinate_product_is_final_P4_metric_margin'] is False
          assert d['full_H18_metric_directional_credit_established_here'] is False
          assert d['P4_COMPLETE_WORD_DISSIPATION_ESTABLISHED_HERE'] is False
          assert d['P4_USABLE_CERTIFICATE_PROMOTED'] is False
          print('packet-null aw/theta lower:', d['packet_null_aw_per_theta_norm_lower_mps2_per_rad'])
          print('one-word gap upper:', d['one_word_gap_upper_s'])
          print('a_w survival lower:', d['aw_survival_factor_to_following_word_lower'])
          print('following-word aw/theta lower:', d['following_word_aw_per_theta_norm_lower'])
          print('four-S information lower:', d['following_word_four_S_information_gramian_lambda_min_lower'])
          print('raw information/theta^2 lower:', d['packet_null_following_word_raw_information_per_theta2_lower'])
          print('next:', d['next_obligation'])
          PY
