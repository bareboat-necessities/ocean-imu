name: ou3-p3-node-word-probe

on:
  push:
    paths:
      - "tools/ou3_p3_word_process_floor.py"
      - "tools/ou3_p3_source_node_word_probe.py"
      - "tools/ou3_p3_scaled_process.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_p4_source_node_cells.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p3_word_process_floor.py"
      - ".github/workflows/ou3-p3-node-word-probe.yml"
  pull_request:
    paths:
      - "tools/ou3_p3_word_process_floor.py"
      - "tools/ou3_p3_source_node_word_probe.py"
      - "tools/ou3_p3_scaled_process.py"
      - "tools/ou3_source_reachable_matrix_p3.py"
      - "tools/ou3_p4_source_node_cells.py"
      - "tools/ou3_proof_operating_domain.json"
      - "tests/validation/test_ou3_p3_word_process_floor.py"
      - ".github/workflows/ou3-p3-node-word-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-word:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile word-process tooling
        run: |
          python3 -m py_compile \
            tools/ou3_p3_word_process_floor.py \
            tools/ou3_p3_source_node_word_probe.py \
            tests/validation/test_ou3_p3_word_process_floor.py

      - name: Test word-process primitive
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p3_word_process_floor

      - name: Probe node zero
        run: |
          python3 tools/ou3_p3_source_node_word_probe.py \
            --source-node-index 0 \
            --output /tmp/ou3_p3_node_0.json

      - name: Probe old hard corner node 729
        run: |
          python3 tools/ou3_p3_source_node_word_probe.py \
            --source-node-index 729 \
            --output /tmp/ou3_p3_node_729.json

      - name: Print usefulness comparison
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for n in (0,729):
              p=Path(f'/tmp/ou3_p3_node_{n}.json')
              if not p.exists():
                  print(n, 'artifact missing')
                  continue
              d=json.loads(p.read_text())
              print('node', n, 'validation', d.get('validation_pass'))
              for mode in ('H','A'):
                  m=d.get('modes',{}).get(mode,{})
                  print(mode, 'delta', m.get('relative_word_process_margin_lower'),
                        'useful', m.get('useful_margin_pass'),
                        'worst', m.get('worst_subcell'))
          PY

      - name: Upload node word probes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ou3-p3-node-word-probes
          path: /tmp/ou3_p3_node_*.json
          if-no-files-found: warn
          retention-days: 7
