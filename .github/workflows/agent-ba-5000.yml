name: agent-ba-5000
on:
  push:
    branches: [agent/mean-reverting-accel-bias]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/mean-reverting-accel-bias
      - name: Apply 5000 s residual bias OU default
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              'src/kalman_ou_ii/Kalman3D_Wave_OU_II.h',
              'src/kalman_ou_iii/Kalman3D_Wave_OU_III.h',
              'doc/kalman_ou_iii/w3d-state.tex-part',
              'doc/kalman_ou_iii/w3d-proc-cont.tex-part',
              'doc/kalman_ou_iii/w3d-intro.tex-part',
              'doc/kalman_ou_iii/w3d-iss-stability.tex-part',
              'doc/kalman_ou_iii/w3d-conclusion-summary.tex-part',
              'doc/kalman_ou_iii/w3d-fus-methods.tex-part',
              'doc/kalman_ou_iii/w3d-sim-charts.tex-part',
          ]
          changed = 0
          for rel in files:
              p = Path(rel)
              s = p.read_text()
              t = s.replace('T tau_bacc_ = T(3000.0);', 'T tau_bacc_ = T(5000.0);')
              t = t.replace('\\tau_b=\\SI{3000}{s}', '\\tau_b=\\SI{5000}{s}')
              t = t.replace('$\\tau_b=\\SI{3000}{s}$', '$\\tau_b=\\SI{5000}{s}$')
              t = t.replace('approximately $\\SI{0.01936}{m\\,s^{-2}}$', 'approximately $\\SI{0.02500}{m\\,s^{-2}}$')
              t = t.replace('approximately \\SI{0.01936}{m\\,s^{-2}}', 'approximately \\SI{0.02500}{m\\,s^{-2}}')
              if t != s:
                  p.write_text(t)
                  changed += 1
          if changed == 0:
              raise SystemExit('no 3000 s anchors found')
          Path('.github/workflows/agent-ba-5000.yml').unlink()
          PY
      - name: Commit 5000 s default
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use 5000 s residual bias OU default"
          git push origin HEAD:refs/heads/agent/mean-reverting-accel-bias
