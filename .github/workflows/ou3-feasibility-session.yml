name: ou3-feasibility-session
on:
  push:
    branches: [codex/ou3-complete-sea3-shipping-feasibility]
    paths: [.github/workflows/ou3-feasibility-session.yml]
permissions:
  contents: write
  actions: write
jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: codex/ou3-complete-sea3-shipping-feasibility
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply the hash-verified reviewed patch
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7c99f68d76dc51185179d0b81b07d3aa710bf82e
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          patch = gzip.decompress(base64.b64decode(os.environ['PATCH_B64'], validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f3742cb865c6c3ca75eb99db18935838b2415dae4094fa4d440643878a31a031'
          pathlib.Path('/tmp/contract.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/contract.patch'], check=True)
          subprocess.run(['git', 'apply', '--index', '/tmp/contract.patch'], check=True)
          expected = {
            '.github/workflows/ou3-proof.yml': '7ed7d4eb7860bfefa82f2e96ddc03bf5032f95d8',
            'docs/ou3-proof-research-state.md': 'fa90aaffdb13f188d06c83db644ad9f241dda6e1',
            'tests/validation/Makefile': '79ee3e88ee2c33d78fa995b1dfa8aa725305bfee',
            'tests/validation/test_ou3_proof_cleanup.py': '19520228e8ec89452525d13ad2aba6611cf7f207',
            'tests/validation/test_ou3_sea3_full_word_source_identity.py': '845d7531d60170c15bbb41c64ef00bc458df776f',
            'tests/validation/test_ou3_sea3_p3_source_semantics.py': '6fbf724e8ac8ea152884b1d45e79d31b26215814',
            'tests/validation/test_ou3_sea3_riccati_metric_p4.py': '77077b54fd1086d1a53924e4057a86c0f4ab16b6',
            'tests/validation/test_ou3_sea3_source_family_fail_closed.py': '5a629d59c75da30850fc0daf51917170dca99730',
            'tools/stability/ou3_p4_complete_sea3_accelerometer_operation_coordinate.py': '9b1b134466f47c9a0b45597ac709f98da65cdeee',
            'tools/stability/ou3_p4_moving_metric_rebind.py': '436e97bd7aa73f1b9495fd17522f2e1398c4d5e3',
            'tools/stability/ou3_sea3_riccati_metric_p4.py': 'c928643044da89be142331745df03914ebc79481',
          }
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(changed) == set(expected), changed
          for path, digest in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == digest, path
          PY
          git rm .github/workflows/ou3-feasibility-session.yml
          git diff --cached --check
          test "$(git rev-parse HEAD:src)" = 53a10a7c02b1a0de4cef5ebab6e13e81909c4cdd
          git diff --exit-code 59ae933ad34f2412fcaddf8c7b804ed43932dd11 -- src tools/stability/ou3_sea3_riccati_metric_p3.py tools/stability/ou3_proof_operating_domain.json tools/stability/ou3_sea3_directional_response_domain.json tools/stability/ou3_sea3_spectral_moment_bridge.json
      - name: Validate the reviewed contracts before publication
        run: |
          set -euo pipefail
          make -C tests/validation build
          python3 -m unittest -v tests.validation.test_ou3_proof_cleanup tests.validation.test_ou3_stability_package_integrity tests.validation.test_ou3_p4_coordinate_transport_algebra tests.validation.test_ou3_p4_complete_sea3_correction_information_bound
          python3 -m unittest discover -s tests/validation -p 'test_ou3_p4_*.py' -v
          pipx install ruff
          tools/quality_gates.sh python
      - name: Publish the clean branch tree without merging
        id: publish
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Separate structural P4 covariance identities from nonlinear closure and repair CI ownership'
          test "$(git rev-parse HEAD:src)" = 53a10a7c02b1a0de4cef5ebab6e13e81909c4cdd
          git push origin HEAD:refs/heads/$BRANCH
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/ou3-receipt
          git rev-parse HEAD HEAD^{tree} HEAD:src > /tmp/ou3-receipt/source-identity.txt
          git diff --stat 59ae933ad34f2412fcaddf8c7b804ed43932dd11 HEAD > /tmp/ou3-receipt/changes.txt
          git archive --format=tar.gz HEAD > /tmp/ou3-receipt/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ou3-verified-contract-checkpoint
          path: /tmp/ou3-receipt
          retention-days: 2
      - name: Run the genuine full branch evidence workflow on the clean tree
        env:
          PREPARED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$PREPARED_SHA"
          gh workflow run ou-full-evidence-branch.yml --ref "$BRANCH"
          run_id=''
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow ou-full-evidence-branch.yml --branch "$BRANCH" --commit "$PREPARED_SHA" --event workflow_dispatch --json databaseId --jq '.[0].databaseId // empty')
            test -z "$run_id" || break
            sleep 2
          done
          test -n "$run_id"
          echo "FULL_EVIDENCE_RUN=$run_id"
          gh run watch "$run_id" --exit-status --interval 30
      - name: Dispatch final checks against the genuinely published evidence head
        env:
          PREPARED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          published=$(git rev-parse FETCH_HEAD)
          git merge-base --is-ancestor "$PREPARED_SHA" "$published"
          git diff --name-only "$PREPARED_SHA" "$published" > /tmp/evidence-paths.txt
          while IFS= read -r path; do
            case "$path" in reports/results/*|reports/ou_evidence_fingerprint.json|doc/kalman_ou_iii/*|'') ;; *) echo "Unexpected concurrent change: $path"; exit 1;; esac
          done < /tmp/evidence-paths.txt
          test "$(git rev-parse "$published":src)" = 53a10a7c02b1a0de4cef5ebab6e13e81909c4cdd
          for workflow in ou3-proof.yml quality-gates.yml build.yml; do
            test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$published"
            gh workflow run "$workflow" --ref "$BRANCH"
          done
          echo "FINAL_CI_HEAD=$published"
