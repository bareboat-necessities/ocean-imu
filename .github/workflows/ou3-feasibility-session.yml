name: ou3-feasibility-session
on:
  push:
    branches: [codex/ou3-complete-sea3-shipping-feasibility]
    paths: [.github/workflows/ou3-feasibility-session.yml]
permissions:
  contents: read
  actions: write
jobs:
  verify-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: codex/ou3-complete-sea3-shipping-feasibility
      VERIFIED_TREE: 6bfdd646a28f50b246f0440e7ad89dc4cdaa4454
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify the connector-published clean checkpoint
        id: checkpoint
        run: |
          set -euo pipefail
          prepared=''
          for attempt in $(seq 1 120); do
            git fetch --quiet origin "$BRANCH"
            candidate=$(git rev-parse FETCH_HEAD)
            if test "$(git rev-parse "$candidate^{tree}")" = "$VERIFIED_TREE"; then
              prepared=$candidate
              break
            fi
            sleep 5
          done
          test -n "$prepared"
          git merge-base --is-ancestor "$GITHUB_SHA" "$prepared"
          test "$(git rev-parse "$prepared:src")" = 53a10a7c02b1a0de4cef5ebab6e13e81909c4cdd
          ! git cat-file -e "$prepared:.github/workflows/ou3-feasibility-session.yml" 2>/dev/null
          git diff --exit-code 59ae933ad34f2412fcaddf8c7b804ed43932dd11 "$prepared" -- src tools/stability/ou3_sea3_riccati_metric_p3.py tools/stability/ou3_proof_operating_domain.json tools/stability/ou3_sea3_directional_response_domain.json tools/stability/ou3_sea3_spectral_moment_bridge.json
          echo "sha=$prepared" >> "$GITHUB_OUTPUT"
          echo "CLEAN_VERIFIED_HEAD=$prepared"
          mkdir -p /tmp/ou3-receipt
          git rev-parse "$prepared" "$prepared^{tree}" "$prepared:src" > /tmp/ou3-receipt/source-identity.txt
          git archive --format=tar.gz "$prepared" > /tmp/ou3-receipt/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ou3-verified-contract-checkpoint
          path: /tmp/ou3-receipt
          retention-days: 2
      - name: Run genuine full branch evidence on the clean checkpoint
        env:
          PREPARED_SHA: ${{ steps.checkpoint.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$PREPARED_SHA"
          gh workflow run ou-full-evidence-branch.yml --ref "$BRANCH"
          run_id=''
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow ou-full-evidence-branch.yml --branch "$BRANCH" --commit "$PREPARED_SHA" --event workflow_dispatch --json databaseId --jq '.[0].databaseId // empty')
            test -z "$run_id" || break
            sleep 2
          done
          test -n "$run_id"
          echo "FULL_EVIDENCE_RUN=$run_id"
          gh run watch "$run_id" --exit-status --interval 30
      - name: Dispatch final CI on the published evidence head
        env:
          PREPARED_SHA: ${{ steps.checkpoint.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BRANCH"
          published=$(git rev-parse FETCH_HEAD)
          git merge-base --is-ancestor "$PREPARED_SHA" "$published"
          git diff --name-only "$PREPARED_SHA" "$published" > /tmp/evidence-paths.txt
          while IFS= read -r path; do
            case "$path" in reports/results/*|reports/ou_evidence_fingerprint.json|doc/kalman_ou_iii/*|'') ;; *) echo "Unexpected concurrent change: $path"; exit 1;; esac
          done < /tmp/evidence-paths.txt
          test "$(git rev-parse "$published:src")" = 53a10a7c02b1a0de4cef5ebab6e13e81909c4cdd
          for workflow in ou3-proof.yml quality-gates.yml build.yml; do
            test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$published"
            gh workflow run "$workflow" --ref "$BRANCH"
          done
          echo "FINAL_CI_HEAD=$published"
