name: ou3-sea3-reset

on:
  pull_request:
    paths:
      - "tools/ou3_sea3_full_word_reset_congruence.py"
      - "tools/ou3_sea3_full_word_riccati_backend.py"
      - "src/kalman_ou_common/KalmanOUCoreMath.h"
      - "tests/validation/test_ou3_sea3_full_word_reset_congruence.py"
      - ".github/workflows/ou3-sea3-reset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-congruence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate shipping left-error reset congruence
        run: python3 tools/ou3_sea3_full_word_reset_congruence.py
      - name: Test reset congruence
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_sea3_full_word_reset_congruence
