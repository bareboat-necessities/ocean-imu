name: agent-predictable-ou-adaptation
on:
  push:
    branches:
      - agent/predictable-ou-adaptation
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/predictable-ou-adaptation
      - name: Apply predictable adaptation patch
        run: python3 .github/agent_predictable_adaptation_patch.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/kalman_ou_ii/SeaStateFusionFilter_OU_II.h src/kalman_ou_iii/SeaStateFusionFilter_OU_III.h
          git add doc/kalman_ou_ii/kalman_ou_ii-charts.tex doc/kalman_ou_iii/w3d-fus-methods.tex-part doc/kalman_ou_iii/w3d-iss-stability.tex-part
          git add tests/kalman_ou_ii tests/kalman_ou_iii
          git commit -m 'Stage OU adaptation by one IMU sample'
          git push origin HEAD:agent/predictable-ou-adaptation
