name: device-compass

on:
  pull_request:
    paths:
      - sensors/full_marine_ins/atomS3R_ins_tfg/**
      - sensors/full_marine_ins/atomS3R_ins_kalman_ou3/**
      - src/tuner/VerticalAccelComplementary.h
      - src/ahrs/Mahony_AHRS.h
      - tests/validation/test_device_compass_startup.py
      - .github/workflows/device-compass.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  first-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Eigen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev
      - name: Test actual sketch compass code before INS readiness
        run: python3 tests/validation/test_device_compass_startup.py -v
