name: ou3-sea3-candidate-angle-sweep
on:
  push:
    branches: [codex/ou3-complete-sea3-shipping-feasibility]
    paths:
      - tests/kalman_ou_iii/ou3-sea3-candidate-angle-sweep-test.cpp
      - tests/kalman_ou_iii/ou3-sea3-complete-word-feasibility-test.cpp
      - tools/stability/ou3_sea3_complete_word_feasibility_trace.py
      - .github/workflows/ou3-sea3-candidate-angle-sweep.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-angle-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Eigen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeigen3-dev
      - name: Generate validated complete SEA3 trace
        run: |
          python3 tools/stability/ou3_sea3_complete_word_feasibility_trace.py \
            --output /tmp/sea3-complete-word-float-trace.json \
            --shipping-input /tmp/sea3-complete-word-specific-force-z.txt
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/sea3-complete-word-float-trace.json'))
          assert d['validation_pass'], d['validation_failures']
          assert d['canonical_source']=='COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['same_continuum_member_across_startup_H_release_A'] is True
          assert d['trajectory_replay_used'] is False
          assert d['finite_harmonic_source_used'] is False
          assert d['independent_tuner_schedule_used'] is False
          assert d['independent_RS_schedule_used'] is False
          PY
      - name: Materialize corrected shipping-coordinate evaluator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('tests/kalman_ou_iii/ou3-sea3-complete-word-feasibility-test.cpp').read_text()
          old='Eigen::Quaternionf qn = nominal.mekf().quaternion_boat();\n    Eigen::Quaternionf qp = pert.mekf().quaternion_boat();'
          new='Eigen::Quaternionf qn = nominal.mekf().qref;\n    Eigen::Quaternionf qp = pert.mekf().qref;'
          oldi='Eigen::Quaternionf q = cayley_quaternion(c) * f.mekf().quaternion_boat();\n        q.normalize();\n        f.mekf().set_quaternion_boat(q);'
          newi='Eigen::Quaternionf q = cayley_quaternion(c) * f.mekf().qref;\n        q.normalize();\n        f.mekf().qref = q;\n        f.mekf().xext.template head<3>().setZero();'
          if text.count(old)!=1 or text.count(oldi)!=1:
              raise SystemExit('shipping coordinate patch anchors changed')
          if text.count('constexpr int MAG_STRIDE = 20;')!=1:
              raise SystemExit('magnetic point cadence anchor changed')
          text=text.replace(old,new,1).replace(oldi,newi,1)
          text=text.replace('constexpr int MAG_STRIDE = 20;', 'constexpr int MAG_STRIDE = 2;', 1)
          Path('/tmp/ou3-sea3-complete-word-feasibility-corrected.cpp').write_text(text)
          PY
      - name: Compile candidate-angle sweep
        run: |
          g++ -O3 -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-function \
            -DEIGEN_NON_ARDUINO -I/tmp -I./src -isystem /usr/include/eigen3 \
            tests/kalman_ou_iii/ou3-sea3-candidate-angle-sweep-test.cpp \
            -o /tmp/ou3-sea3-candidate-angle-sweep
      - name: Execute candidate-angle sweep
        run: |
          /tmp/ou3-sea3-candidate-angle-sweep /tmp/sea3-complete-word-specific-force-z.txt \
            | tee /tmp/ou3-sea3-candidate-angle-sweep.json
          python3 - <<'PY'
          import json,math
          d=json.load(open('/tmp/ou3-sea3-candidate-angle-sweep.json'))
          assert d['canonical_source']=='COMPLETE_SEA3_NORMAL_LIVE_WORD'
          assert d['shipping_qref_left_error_coordinate'] is True
          assert d['P3_changed'] is False and d['P4_promoted'] is False
          assert len(d['rows'])==8
          assert all(math.isfinite(r['worst_rho']) for r in d['rows'])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ou3-sea3-candidate-angle-sweep
          path: |
            /tmp/sea3-complete-word-float-trace.json
            /tmp/ou3-sea3-candidate-angle-sweep.json
          retention-days: 7
