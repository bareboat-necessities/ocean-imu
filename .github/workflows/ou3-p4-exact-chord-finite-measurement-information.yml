name: ou3-p4-exact-chord-finite-measurement-information
on:
  push:
    paths: &paths
      - "tools/stability/ou3_p4_exact_chord_finite_measurement_information.py"
      - "tools/stability/ou3_p4_complete_brmm_exact_chord_joint_coordinate.py"
      - "tools/stability/ou3_brmm_h18_information_composition.py"
      - "tools/stability/ou3_p4_finite_angle_h18_universal.py"
      - ".github/workflows/ou3-p4-exact-chord-finite-measurement-information.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-measurement-information:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - name: Prove exact finite residual information lower
        run: python3 tools/stability/ou3_p4_exact_chord_finite_measurement_information.py --output /tmp/finite-measurement-info.json
      - name: Enforce exact finite-state scope and non-promotion
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/finite-measurement-info.json'))
          assert d['validation_pass'],d['validation_failures']
          assert d['exact_finite_chord_sector_consumed']
          assert d['finite_residual_not_Jacobian_only']
          assert d['measurement_stack_only_scope']
          assert d['finite_H18_measurement_stack_information_lower'] > 0
          assert d['finite_vs_differential_relative_difference'] <= 5e-12
          assert not d['standalone_eta_Rinv_budget_used']
          assert not d['packet_count_multiplier_used']
          assert not d['independent_K_box_used']
          assert not d['prediction_transport_closed_here']
          assert not d['finite_reset_transport_closed_here']
          assert not d['P4_MOTION_PASS'] and not d['P4_PASS'] and not d['P5_MAY_START']
          print('FINITE_CHORD_MEASUREMENT_INFORMATION',d['finite_H18_measurement_stack_information_lower'])
          print('FINITE_DIFFERENTIAL_CROSSCHECK_REL',d['finite_vs_differential_relative_difference'])
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-p4-exact-chord-finite-measurement-information
          path: /tmp/finite-measurement-info.json
          retention-days: 7
