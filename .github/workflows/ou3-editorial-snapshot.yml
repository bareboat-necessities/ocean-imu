name: ou3-editorial-snapshot
on:
  push:
    branches: [editorial/ou3-taes-20260925]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Export source for the editorial build
        run: |
          git rev-parse HEAD > /tmp/editorial-source-commit.txt
          git archive --format=tar.gz --output=/tmp/editorial-source.tar.gz HEAD
          git ls-tree -r HEAD > /tmp/editorial-source-tree.txt
      - uses: actions/upload-artifact@v6
        with:
          name: ou3-editorial-source
          path: |
            /tmp/editorial-source.tar.gz
            /tmp/editorial-source-commit.txt
            /tmp/editorial-source-tree.txt
          retention-days: 7
          if-no-files-found: error
