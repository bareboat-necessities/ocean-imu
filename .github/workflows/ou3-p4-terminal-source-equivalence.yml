name: ou3-p4-terminal-source-equivalence

on:
  push:
    paths:
      - "tools/ou3_p2_clock_phase_tuner_graph.py"
      - "tools/ou3_p4_source_node_cells.py"
      - "tools/ou3_p4_terminal_cluster_p2_reduction.py"
      - "tools/ou3_p4_terminal_source_equivalence.py"
      - ".github/workflows/ou3-p4-terminal-source-equivalence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-source-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile
        run: python3 -m py_compile tools/ou3_p4_terminal_source_equivalence.py
      - name: Build exact quotient
        run: |
          python3 tools/ou3_p4_terminal_source_equivalence.py \
            --output /tmp/ou3_p4_terminal_source_equivalence.json
      - name: Contract
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ou3_p4_terminal_source_equivalence.json'))
          assert d['validation_pass'] is True, d['validation_failures']
          assert d['exact_bitwise_interval_equivalence_only'] is True
          assert d['source_cells_hulled'] is False
          assert d['cartesian_pair_completion_used'] is False
          assert d['reachable_pair_correlation_retained'] is True
          assert d['terminal_single_boundary_reduction_consumed'] is True
          assert d['P4_COMPLETE_WORD_DISSIPATION_ESTABLISHED_HERE'] is False
          print('filter_classes',d['filter_side_equivalence_classes'])
          print('reachable_pairs',d['reachable_stage_pairs'])
          print('quotient_pairs',d['reachable_filter_class_pairs'])
          print('raw_cases',d['raw_terminal_pair_phase_cases_upper'])
          print('quotient_cases',d['quotiented_terminal_pair_phase_cases_upper'])
          print('reduction_factor',d['quotient_reduction_factor'])
          PY
