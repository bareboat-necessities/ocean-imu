name: ou3-usable-certificates-fast

on:
  push:
    paths:
      - "tools/ou3_p4_source_path_reachability.py"
      - "tools/ou3_p4_operation_matched_sector_certificate.py"
      - "tools/ou3_p4_p5_entrance_search_domain.py"
      - "tools/ou3_p4_worst_translation_cell.py"
      - "tools/ou3_p4_translation_full_word_interval.py"
      - "tools/ou3_p4_translation_full_word_interval_fast.py"
      - "tools/ou3_p4_translation_full_word_rigorous.py"
      - "tools/ou3_p4_post_translation_bottleneck.py"
      - "tools/ou3_p4_p5_route_ceiling_certificate.py"
      - "tools/ou3_p5_outer_sector_capture_certificate.py"
      - "tools/ou3_p5_cayley_eta_geometry.py"
      - "tools/ou3_p5_effective_vector_input.py"
      - "tools/ou3_p5_exact_correction_transport.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_validated_transcendentals.py"
      - "tools/ou3_proof_operating_domain.json"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "src/kalman_common/**"
      - "src/tuner/SeaStateAdaptationLimits.h"
      - "tests/validation/test_ou3_p4_source_path_reachability.py"
      - "tests/validation/test_ou3_p4_operation_matched_sector_certificate.py"
      - "tests/validation/test_ou3_p4_translation_full_word_interval.py"
      - "tests/validation/test_ou3_p4_translation_full_word_rigorous.py"
      - "tests/validation/test_ou3_p4_post_translation_bottleneck.py"
      - "tests/validation/test_ou3_p4_p5_route_ceiling.py"
      - "tests/validation/test_ou3_p5_outer_sector_capture_certificate.py"
      - "tests/validation/test_ou3_certificate_dead_end_nonregression.py"
      - "docs/ou-iii-certificate-usability-envelope.md"
      - "docs/ou-iii-p5-sea-scaled-entrance.md"
      - ".github/workflows/ou3-usable-certificates-fast.yml"
  pull_request:
    paths:
      - "tools/ou3_p4_source_path_reachability.py"
      - "tools/ou3_p4_operation_matched_sector_certificate.py"
      - "tools/ou3_p4_p5_entrance_search_domain.py"
      - "tools/ou3_p4_worst_translation_cell.py"
      - "tools/ou3_p4_translation_full_word_interval.py"
      - "tools/ou3_p4_translation_full_word_interval_fast.py"
      - "tools/ou3_p4_translation_full_word_rigorous.py"
      - "tools/ou3_p4_post_translation_bottleneck.py"
      - "tools/ou3_p4_p5_route_ceiling_certificate.py"
      - "tools/ou3_p5_outer_sector_capture_certificate.py"
      - "tools/ou3_p5_cayley_eta_geometry.py"
      - "tools/ou3_p5_effective_vector_input.py"
      - "tools/ou3_p5_exact_correction_transport.py"
      - "tools/ou3_p5_heading_handoff_contract.py"
      - "tools/ou3_startup_stability_certificate.py"
      - "tools/ou3_validated_transcendentals.py"
      - "tools/ou3_proof_operating_domain.json"
      - "src/kalman_ou_iii/**"
      - "src/kalman_ou_common/**"
      - "src/kalman_common/**"
      - "src/tuner/SeaStateAdaptationLimits.h"
      - "tests/validation/test_ou3_p4_source_path_reachability.py"
      - "tests/validation/test_ou3_p4_operation_matched_sector_certificate.py"
      - "tests/validation/test_ou3_p4_translation_full_word_interval.py"
      - "tests/validation/test_ou3_p4_translation_full_word_rigorous.py"
      - "tests/validation/test_ou3_p4_post_translation_bottleneck.py"
      - "tests/validation/test_ou3_p4_p5_route_ceiling.py"
      - "tests/validation/test_ou3_p5_outer_sector_capture_certificate.py"
      - "tests/validation/test_ou3_certificate_dead_end_nonregression.py"
      - "docs/ou-iii-certificate-usability-envelope.md"
      - "docs/ou-iii-p5-sea-scaled-entrance.md"
      - ".github/workflows/ou3-usable-certificates-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-usable-certificates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  usable-certificates:
    name: P2/P4/P5 usable certificate contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Compile certificate producers and tests
        run: |
          python3 -m py_compile \
            tools/ou3_p4_source_path_reachability.py \
            tools/ou3_p4_operation_matched_sector_certificate.py \
            tools/ou3_p4_p5_entrance_search_domain.py \
            tools/ou3_p4_worst_translation_cell.py \
            tools/ou3_p4_translation_full_word_interval.py \
            tools/ou3_p4_translation_full_word_interval_fast.py \
            tools/ou3_p4_translation_full_word_rigorous.py \
            tools/ou3_p4_post_translation_bottleneck.py \
            tools/ou3_p4_p5_route_ceiling_certificate.py \
            tools/ou3_p5_outer_sector_capture_certificate.py \
            tests/validation/test_ou3_p4_source_path_reachability.py \
            tests/validation/test_ou3_p4_operation_matched_sector_certificate.py \
            tests/validation/test_ou3_p4_translation_full_word_interval.py \
            tests/validation/test_ou3_p4_translation_full_word_rigorous.py \
            tests/validation/test_ou3_p4_post_translation_bottleneck.py \
            tests/validation/test_ou3_p4_p5_route_ceiling.py \
            tests/validation/test_ou3_p5_outer_sector_capture_certificate.py \
            tests/validation/test_ou3_certificate_dead_end_nonregression.py

      - name: Run focused usability and dead-end regression tests
        working-directory: tests/validation
        run: |
          python3 -m unittest -v \
            test_ou3_p4_source_path_reachability \
            test_ou3_p4_operation_matched_sector_certificate \
            test_ou3_p4_translation_full_word_rigorous \
            test_ou3_p4_post_translation_bottleneck \
            test_ou3_p4_p5_route_ceiling \
            test_ou3_p5_outer_sector_capture_certificate \
            test_ou3_certificate_dead_end_nonregression

      - name: Emit P2 source-path certificate
        run: |
          python3 tools/ou3_p4_source_path_reachability.py \
            --output /tmp/ou3_p2_source_path.json

      - name: Emit P4/P5 entrance and search-domain certificate
        run: |
          python3 tools/ou3_p4_p5_entrance_search_domain.py \
            --output /tmp/ou3_p4_p5_entrance_search.json

      - name: Emit rigorous reused P4 translation certificate
        run: |
          python3 tools/ou3_p4_translation_full_word_rigorous.py \
            --output /tmp/ou3_p4_translation_full_word.json

      - name: Emit post-translation full-state target
        run: |
          python3 tools/ou3_p4_post_translation_bottleneck.py \
            --translation /tmp/ou3_p4_translation_full_word.json \
            --output /tmp/ou3_p4_post_translation.json

      - name: Emit P4 finite-angle sector certificate
        run: |
          python3 tools/ou3_p4_operation_matched_sector_certificate.py \
            --output /tmp/ou3_p4_operation_sector.json

      - name: Emit P5 outer capture certificate
        run: |
          python3 tools/ou3_p5_outer_sector_capture_certificate.py \
            --output /tmp/ou3_p5_outer_capture.json

      - name: Enforce material usability margins and fail-closed scope
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p2 = json.loads(Path('/tmp/ou3_p2_source_path.json').read_text())
          entrance = json.loads(Path('/tmp/ou3_p4_p5_entrance_search.json').read_text())
          tr = json.loads(Path('/tmp/ou3_p4_translation_full_word.json').read_text())
          post = json.loads(Path('/tmp/ou3_p4_post_translation.json').read_text())
          p4 = json.loads(Path('/tmp/ou3_p4_operation_sector.json').read_text())
          p5 = json.loads(Path('/tmp/ou3_p5_outer_capture.json').read_text())

          assert p2['P2_SOURCE_PATH_CERTIFICATE'] == 'PASS'
          assert p2['source_only'] is True
          assert p2['path_graph_ready'] is True
          assert p2['old_worst_corner_state_count'] > 0
          assert p2['usable_P4_promoted'] is False
          assert p2['raw_tuner_sigma_subfloor_states_included'] is True
          assert p2['raw_tuner_sigma_partition_lower'] < p2['filter_sigma_floor_mps2']
          assert p2['filter_sigma_floor_separate_from_tuner_state'] is True
          assert p2['validated_exponential_used_for_ema'] is True
          assert p2['arbitrary_late_commit_overapproximated'] is True
          assert p2['RS_discrepancy_slew_horizon_covered'] is True
          assert p2['RS_target_full_deployed_clamp_overapprox'] is True
          assert p2['RS_target_powf_tightening_used'] is False

          assert entrance['P4_P5_ENTRANCE_SEARCH_DOMAIN_CERTIFICATE'] == 'PASS'
          assert entrance['source_generated_not_trajectory_fit'] is True
          assert entrance['source_replay_used'] is False
          assert entrance['filter_changed'] is False
          assert entrance['P1_conservative_handoff_box_replaced'] is False
          assert entrance['startup_propagation_of_entrance_assumed_without_proof'] is False
          assert entrance['additional_sea_scaled_v_S_aw_hard_bounds_invented'] is False
          e5 = entrance['P5_entrance']
          assert e5['attitude_representation'] == 'SO3_GEODESIC'
          assert e5['componentwise_euler_box_interpretation'] is False
          assert e5['gauged_full_attitude_angle_upper_deg'] == 45.0
          assert e5['attitude_geometry']['cayley_norm_upper'] < 1.0
          assert e5['position_truth_error_bound'] is True
          assert e5['position_component_abs_error_upper_Hs_factor'] == 0.5
          assert 0.86 < e5['position_norm_upper_Hs_factor'] < 0.87
          rows = entrance['P4_complete_word_search']['candidate_rows']
          assert [r['angle_deg'] for r in rows] == [30.0, 25.0, 20.0, 15.0]
          assert all(r['inside_45deg_entrance'] for r in rows)
          assert entrance['P4_complete_word_search']['search_strategy_not_theorem_assumption'] is True

          assert tr['P4_COMPLETE_TRANSLATION_WORST_CELL_STATUS'] == 'PASS'
          assert tr['reused_from_PR_438'] is True
          assert tr['unsafe_438_pre_interval_scale_setup_used'] is False
          assert tr['P4_USABLE_CERTIFICATE_STATUS'] == 'NOT_ESTABLISHED'
          for mode in ('H', 'A'):
              row = tr['modes'][mode]
              assert row['complete_word_translation_margin_lower'] > 0.0
              assert row['margin_widening_factor_lower'] > 1.0
              assert row['source_float_literals_rounded_as_binary32'] is True
              assert row['conditioned_scale_products_outward_rounded_from_first_operation'] is True
              assert row['pre_interval_binary64_scale_products_used'] is False

              prow = post['modes'][mode]
              assert prow['diagnostic_blockwise_margin_lower'] > 0.0
              assert prow['normalized_full_state_cross_block_spectral_norm_budget_lower_open'] > 0.0
              assert prow['cross_block_budget_outward_lower_enclosed'] is True
              assert prow['full_state_cross_block_bound_validated'] is False
              assert prow['full_state_complete_word_cross_blocks_propagated'] is False
              assert prow['usable_P4_promoted'] is False
          assert post['P4_USABLE_CERTIFICATE_STATUS'] == 'NOT_ESTABLISHED'
          assert post['blockwise_min_is_final_certificate'] is False
          assert post['cross_block_budget_is_final_certificate'] is False

          assert p4['P4_OPERATION_MATCHED_FINITE_ANGLE_SECTOR_CERTIFICATE'] == 'PASS'
          assert p4['design_full_attitude_angle_rad'] >= 0.80
          assert p4['design_cayley_norm_upper'] < 1.0
          assert p4['design_full_attitude_cosine_lower'] <= p4['design_full_attitude_cosine_upper']
          assert p4['validated_half_angle_interval_used_for_design_boundary'] is True
          assert p4['exact_vector_strong_monotonicity_factor_lower'] > 0.80
          assert p4['exact_eta_to_rotational_residual_information_ratio_upper'] < 0.25
          assert p4['P1_overlap']['normal_gauged_inside_sector'] is True
          assert p4['P1_overlap']['timeout_gauged_inside_sector'] is True
          assert p4['global_packet_count_times_lipschitz_defect_used'] is False
          assert p4['whole_word_weakest_P3_delta_used_as_attitude_sector_margin'] is False
          assert p4['P4_COMPLETE_WORD_DISSIPATION_ESTABLISHED_HERE'] is False

          assert p5['P5_OUTER_SECTOR_CAPTURE_CERTIFICATE'] == 'PASS'
          assert p5['P5_entrance_is_distinct_from_P4_complete_word_sector'] is True
          assert p5['P5_entrance_set_inside_outer_geometry_sector'] is True
          assert p5['P1_conservative_handoff_box_replaced'] is False
          assert p5['startup_propagation_of_entrance_assumed_without_proof'] is False
          assert p5['declared_P5_entrance']['gauged_full_attitude_angle_upper_deg'] == 45.0
          assert p5['declared_P5_entrance']['position_component_abs_error_upper_Hs_factor'] == 0.5
          assert p5['all_source_handoff_branches_enter_outer_sector'] is True
          assert p5['N_outer_words'] == 0
          assert p5['upper_cosine_enclosure_used_for_ungauged_inclusion'] is True
          assert p5['branches']['timeout_ungauged']['boundary_cosine_direction_used'] == 'UPPER_ENCLOSURE'
          assert p5['branches']['timeout_ungauged']['full_heading_radius_assigned'] is False
          assert p5['legacy_microscopic_inner_seed_used_as_outer_capture_target'] is False
          assert p5['legacy_uniform_transport_route_used'] is False
          assert p5['P5_CAPTURE_TO_NARROWER_P4_COMPLETE_WORD_CANDIDATE_ESTABLISHED_HERE'] is False
          assert p5['P5_INNER_FUNNEL_FINITE_CAPTURE_ESTABLISHED_HERE'] is False

          print('P2 source states:', p2['partition']['states'])
          print('P2 source edges:', p2['transition_edges'])
          print('P5 entrance q45:', e5['attitude_geometry']['cayley_norm_upper'])
          print('P5 entrance position norm/Hs:', e5['position_norm_upper_Hs_factor'])
          print('P4 candidate angles deg:', [r['angle_deg'] for r in rows])
          print('P4 translation H delta:', tr['modes']['H']['complete_word_translation_margin_lower'])
          print('P4 translation A delta:', tr['modes']['A']['complete_word_translation_margin_lower'])
          print('P4 post H cross budget:', post['modes']['H']['normalized_full_state_cross_block_spectral_norm_budget_lower_open'])
          print('P4 post A cross budget:', post['modes']['A']['normalized_full_state_cross_block_spectral_norm_budget_lower_open'])
          print('P4 sector rad:', p4['design_full_attitude_angle_rad'])
          print('P4 sector q:', p4['design_cayley_norm_upper'])
          print('P4 monotonicity:', p4['exact_vector_strong_monotonicity_factor_lower'])
          print('P4 eta ratio:', p4['exact_eta_to_rotational_residual_information_ratio_upper'])
          print('P5 N_outer:', p5['N_outer_words'])
          PY
