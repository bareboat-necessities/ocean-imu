name: evidence-contract

# Check PRs independently of the simulation smoke classifier: deleted article
# inputs can break publication even in a proof-only change. On main, build.yml
# calls this gate after ou-evidence has validated/published the current replay.
# A parallel push trigger would check old rows against new source, then remain
# red because the evidence bot push does not trigger another workflow run.
on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "plots/**"
      - "doc/**"
      - "docs/**"
      - "reports/**"
      - "Makefile"
      - ".github/workflows/**"
  workflow_call:
    inputs:
      checkout_ref:
        description: Post-publication ref; empty keeps the triggering PR or manual ref
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || '' }}
          fetch-depth: 0
      - name: Install evidence-test dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            g++ make libeigen3-dev \
            python3-numpy python3-matplotlib python3-pandas python3-scipy
      - name: Validate complete committed evidence and publication contracts
        shell: bash
        run: |
          set -euo pipefail
          make -C tests/validation evidence-test 2>&1 | tee "$RUNNER_TEMP/evidence-test.log"
      - name: Save the tested source for failure reproduction
        if: failure()
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/evidence-source.tar.gz" HEAD
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: evidence-contract-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evidence-test.log
            ${{ runner.temp }}/evidence-source.tar.gz
          if-no-files-found: warn
          retention-days: 3
