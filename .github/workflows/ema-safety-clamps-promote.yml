name: Universal EMA safety-clamp promotion

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.head_ref == 'agent/universal-ema-safety-clamps'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/universal-ema-safety-clamps
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++ make libeigen3-dev

      - name: Apply production patch
        run: python3 tools/ema_safety_clamps_promote.py

      - name: Build targeted tests
        run: |
          make -C tests/kalman_ou_ii tuner_schedule-test pseudo_law-test
          make -C tests/kalman_ou_iii tuner_schedule-test tuner_coupling-test rs_law-test
          make -C tests/kalman_tfg tfg_orchestrator-test

      - name: Run targeted tests
        run: |
          tests/kalman_ou_ii/tuner_schedule-test
          tests/kalman_ou_ii/pseudo_law-test
          tests/kalman_ou_iii/tuner_schedule-test
          tests/kalman_ou_iii/tuner_coupling-test
          tests/kalman_ou_iii/rs_law-test
          tests/kalman_tfg/tfg_orchestrator-test

      - name: Inspect production diff
        run: |
          git diff --check
          git status --short
          git diff --stat -- \
            src/tuner/SeaStateAdaptationLimits.h \
            src/tuner/SeaStateAutoTuner.h \
            src/kalman_common/SeaStateFusionFilterCommon.h \
            src/kalman_ou_iii/SeaStateFusionFilter_OU_III.h \
            src/kalman_ou_ii/SeaStateFusionFilter_OU_II.h \
            src/kalman_tfg/SeaStateFusionFilter_TFG.h \
            tests/kalman_ou_ii/tuner_schedule-test.cpp \
            docs/adaptive-ema-safety-clamps.md

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/tuner/SeaStateAdaptationLimits.h \
            src/tuner/SeaStateAutoTuner.h \
            src/kalman_common/SeaStateFusionFilterCommon.h \
            src/kalman_ou_iii/SeaStateFusionFilter_OU_III.h \
            src/kalman_ou_ii/SeaStateFusionFilter_OU_II.h \
            src/kalman_tfg/SeaStateFusionFilter_TFG.h \
            tests/kalman_ou_ii/tuner_schedule-test.cpp \
            docs/adaptive-ema-safety-clamps.md
          git diff --cached --check
          git commit -m "Clamp dynamically estimated EMA horizons"
          git push origin HEAD:refs/heads/agent/universal-ema-safety-clamps
