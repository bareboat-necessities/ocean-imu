name: simulation-studies
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/sim_dataset.py"
      - "tools/sim_dataset_manifest.json"
      - "tools/simulation_studies.py"
      - "src/kalman_carma*/**"
      - "tests/common/**"
      - "tools/carma*.py"
      - "tools/tfg*.py"
      - 'tools/underway_reference.py'
      - 'src/util/UnderwayReference.h'
      - 'src/util/WaveFilesSupport.h'
      - 'src/util/W3dSimCommon.*'
      - 'tools/model_mismatch_ablation.py'
      - 'tools/startup_ablation.py'
      - 'tools/startup_publication_sync.py'
      - 'tools/ou3_reduced_mse_study.py'
      - 'tools/ou2_dual_mse_coefficients.py'
      - 'tools/direction_rao_ablation.py'
      - 'tools/direction_rao_report.py'
      - 'src/wave_dir/**'
      - 'src/kalman_ou_ii/**'
      - 'src/kalman_ou_iii/**'
      - 'src/kalman_tfg/**'
      - 'tests/kalman_ou_ii/kalman_ou_ii-sim.cpp'
      - 'tests/kalman_ou_iii/kalman_ou_iii-sim.cpp'
      - 'tests/kalman_tfg/kalman_tfg-sim.cpp'
      - 'tools/engine_noise_degradation.py'
      - 'tools/ou3_engine_noise_mitigation.py'
      - '.github/workflows/simulation-studies.yml'
permissions:
  contents: read
concurrency:
  group: simulation-studies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studies:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        case: [following, head]
        study: [ou_validation, ou_robustness, tfg_comparison, model_mismatch_ablation, engine_noise_degradation, ou3_engine_noise_mitigation, ou_roundtrip_transition, startup_ablation, startup_transient_study, direction_rao_ablation, ou3_lever_arm_study, carma_lever_arm_study, carma3_benchmark, tfg_carma3_benchmark, carma_excitation_study, carma_shared_modes_study, carma_shared_modes_validation, tfg_shared_modes_dataset]
    env:
      OCEAN_IMU_SIM_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libeigen3-dev python3-numpy python3-matplotlib python3-pandas python3-scipy
      - name: Run the complete case-specific study
        run: python3 -u tools/simulation_studies.py "${{ matrix.study }}" --jobs 2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: simulation-study-v1.4.0-${{ matrix.case }}-${{ matrix.study }}
          path: reports/results/sim_v1.4.0/${{ matrix.case }}/studies/${{ matrix.study }}/
          if-no-files-found: error
          retention-days: 14
