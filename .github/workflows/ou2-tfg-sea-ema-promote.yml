name: OU-II TFG sea-period EMA promotion

on:
  pull_request:
    branches: [main]
    paths:
      - tools/ou2_tfg_sea_ema_promote.py
      - .github/workflows/ou2-tfg-sea-ema-promote.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ou2-tfg-sea-ema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/ou2-tfg-sea-scaled-ema'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/ou2-tfg-sea-scaled-ema
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            g++ make libeigen3-dev

      - name: Apply production patch
        run: python3 tools/ou2_tfg_sea_ema_promote.py

      - name: Build targeted tests
        run: |
          make -C tests/kalman_ou_ii tuner_schedule-test pseudo_law-test
          make -C tests/kalman_tfg tfg_orchestrator-test

      - name: Run targeted tests
        run: |
          tests/kalman_ou_ii/tuner_schedule-test
          tests/kalman_ou_ii/pseudo_law-test
          tests/kalman_tfg/tfg_orchestrator-test

      - name: Inspect production diff
        run: |
          git diff --check
          git status --short
          git diff --stat -- \
            src/kalman_ou_ii/SeaStateFusionFilter_OU_II.h \
            src/kalman_tfg/SeaStateFusionFilter_TFG.h \
            tests/kalman_ou_ii/tuner_schedule-test.cpp \
            tests/kalman_tfg/tfg_orchestrator-test.cpp

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/kalman_ou_ii/SeaStateFusionFilter_OU_II.h \
            src/kalman_tfg/SeaStateFusionFilter_TFG.h \
            tests/kalman_ou_ii/tuner_schedule-test.cpp \
            tests/kalman_tfg/tfg_orchestrator-test.cpp
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Use sea-scaled adaptation EMAs in OU-II and TFG"
          git push origin HEAD:refs/heads/agent/ou2-tfg-sea-scaled-ema
