name: tfg-validated-patch
on:
  push:
    branches: [fix-tfg-device-heave-and-ci]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'bareboat-necessities/ocean-imu'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-tfg-device-heave-and-ci
      - name: Apply the hash-verified locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = ''''''
          # The payload is checked before touching the checkout.
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '5c79dcc3ab9047ae00069f250da52b20cf1b0b67e518ddb1c201379e995a6494'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'validated-device.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          git diff --cached --check
