name: tfg-device-regression
on:
  push:
    branches: [fix-tfg-device-heave-and-ci]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/kalman_tfg/**'
      - 'tests/detrend/**'
      - '.github/workflows/tfg-device-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tfg-device-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install C++ build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libeigen3-dev
      - name: Compile handoff, device and shared detrender regressions
        shell: bash
        run: |
          set -euo pipefail
          make -C tests/kalman_tfg tfg_handoff_heave-test tfg_device_tempcomp-test
          eigen=third_party/eigen
          if [[ ! -f "$eigen/Eigen/Dense" ]]; then eigen=/usr/include/eigen3; fi
          g++ -O3 -std=c++20 -Wall -Wextra -fno-finite-math-only -Isrc -isystem "$eigen" \
            tests/kalman_tfg/tfg_device_heave-test.cpp -o tests/kalman_tfg/tfg_device_heave-test
          g++ -O3 -std=c++20 -Wall -Wextra -fno-finite-math-only -Isrc -isystem "$eigen" \
            tests/detrend/detrend-log-frequency-test.cpp -o tests/detrend/detrend-log-frequency-test
      - name: Execute ten-minute handoff histories
        id: handoff
        continue-on-error: true
        run: |
          set -o pipefail
          ./tests/kalman_tfg/tfg_handoff_heave-test | tee tfg-handoff-results.txt
      - name: Reproduce calibrated-device temperature boundary\n        run: ./tests/kalman_tfg/tfg_device_tempcomp-test | tee tfg-device-tempcomp-results.txt\n      - name: Execute device startup and Live histories
        env:
          OCEAN_IMU_TRACE_DIR: .
        id: device
        continue-on-error: true
        run: |
          set -o pipefail
          ./tests/kalman_tfg/tfg_device_heave-test | tee tfg-device-results.txt
      - name: Execute shared log-frequency symmetry regression
        id: detrend
        continue-on-error: true
        run: |
          set -o pipefail
          ./tests/detrend/detrend-log-frequency-test | tee detrend-log-frequency-results.txt
      - name: Retain numerical results and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tfg-device-regression-results
          path: |
            tfg-*-results.txt
            tfg-device-*.csv
            detrend-log-frequency-results.txt
          if-no-files-found: warn
      - name: Preserve every regression gate
        if: always()
        run: |
          test '${{ steps.handoff.outcome }}' = success
          test '${{ steps.device.outcome }}' = success
          test '${{ steps.detrend.outcome }}' = success
