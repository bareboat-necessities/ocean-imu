name: ou3-p5-v44-split-signed-first-survivor-fast

on:
  push:
    paths:
      - "tools/ou3_p5_sample1_v40_split_signed_first_survivor_v44.py"
      - "tests/validation/test_ou3_p5_sample1_v40_split_signed_first_survivor_v44.py"
      - ".github/workflows/ou3-p5-v44-split-signed-first-survivor-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou3-p5-v44-split-signed-first-survivor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v44-first-survivor:
    name: P5 V44 split-signed first survivor
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile V44 producer and test
        run: |
          python3 -m py_compile \
            tools/ou3_p5_sample1_v40_split_signed_first_survivor_v44.py \
            tests/validation/test_ou3_p5_sample1_v40_split_signed_first_survivor_v44.py
      - name: Test V44 helpers
        working-directory: tests/validation
        run: python3 -m unittest -v test_ou3_p5_sample1_v40_split_signed_first_survivor_v44
      - name: Run V44 first-survivor audit
        id: audit
        shell: bash
        run: |
          python3 tools/ou3_p5_sample1_v40_split_signed_first_survivor_v44.py \
            --source-pieces 4 --source-cell-index 0 \
            --p-pieces 24 --tangent-pieces 24 --axial-pieces 24 \
            --residual-x-pieces 6 --parallel-pieces 6 \
            --output /tmp/p5_sample1_v44.json
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, math, sys
          with open('/tmp/p5_sample1_v44.json', encoding='utf-8') as fh:
              d = json.load(fh)
          first = d.get('first_parent_open_subcell') or {}
          after = d.get('first_parent_open_after_V44') or {}
          def fmt(x):
              try:
                  y=float(x)
              except (TypeError, ValueError):
                  return 'na'
              return f'{y:.12g}' if math.isfinite(y) else str(y)
          with open(sys.argv[1], 'a', encoding='utf-8') as gh:
              print(f"status={d.get('P5_SAMPLE1_V40_SPLIT_SIGNED_FIRST_SURVIVOR_V44')}", file=gh)
              print(f"parent_open={d.get('parent_open_witness_subcells')}", file=gh)
              print(f"refined={d.get('source_directionally_refined_parent_open_subcells')}", file=gh)
              print(f"incompatible={d.get('source_incompatible_parent_open_subcells')}", file=gh)
              print(f"closed={d.get('source_closed_parent_open_subcells')}", file=gh)
              print(f"first_q={fmt(first.get('best_q'))}", file=gh)
              print(f"refined_q={fmt(after.get('refined_best_q'))}", file=gh)
              print(f"first_closed={d.get('first_V41_survivor_closed_by_V44')}", file=gh)
              print(f"all_row_closed={d.get('all_parent_open_subcells_in_witness_row_closed_by_V44')}", file=gh)
              print(f"next={d.get('next_obligation')}", file=gh)
      - name: "V44 status=${{ steps.audit.outputs.status }} parent-open=${{ steps.audit.outputs.parent_open }} refined=${{ steps.audit.outputs.refined }} incompatible=${{ steps.audit.outputs.incompatible }} closed=${{ steps.audit.outputs.closed }} firstq=${{ steps.audit.outputs.first_q }} refinedq=${{ steps.audit.outputs.refined_q }}"
        run: |
          echo "first survivor closed=${{ steps.audit.outputs.first_closed }}"
          echo "all witness-row open cells closed=${{ steps.audit.outputs.all_row_closed }}"
          echo "next=${{ steps.audit.outputs.next }}"
