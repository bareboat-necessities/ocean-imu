# Python linting for tools/, tests/validation/ and plots/.
#
# Run it the way CI does:
#   tools/quality_gates.sh python
#
# The rule set is deliberately narrow: defects, not formatting. The Python here
# is numerical proof and plotting code written to read like the mathematics it
# implements, and a formatter would fight that. A formatting-only diff would
# bury the defects this gate is intended to catch.

target-version = "py311"
line-length = 120

exclude = [
    "third_party",
    ".git",
    "__pycache__",
]

[lint]
# F  — pyflakes: undefined names, unused imports, f-string mistakes.
# E9 — syntax and IO errors.
# B  — flake8-bugbear: legal constructs that are usually defects.
select = ["F", "E9", "B"]

ignore = [
    # I is the identity matrix and l is a level index in linear-algebra code.
    "E741",
    "E743",
    # Existing numerical code uses index-aligned zip inputs built together.
    "B905",
    # Established study drivers may re-export parameter blocks.
    "F405",
]

[lint.per-file-ignores]
"tools/ou_robustness.py" = ["F403"]

# This retained generic high-precision helper carries one compatibility import.
"tools/stability/ou3_decimal_interval.py" = ["F401"]
